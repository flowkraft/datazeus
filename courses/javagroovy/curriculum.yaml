      # MYBATIS SITS HERE, NOT IN SERIES 4 — added 2026-09-02. Put it through the same two
      # tests the comment directly above puts jOOQ through, because it is the same question:
      #   1. LIBRARY, NOT FRAMEWORK. You open a SqlSession and call it; it does not call you.
      #      The mybatis-spring-boot-starter makes @Mapper interfaces look like Spring Data
      #      repositories, and that resemblance is the trap — the starter is an integration,
      #      not the tool. It is a paragraph in Series 4 · 15, not an episode.
      #   2. IT IS THE SQL-FIRST POSITION. Every query is one you wrote. Filing it beside
      #      Spring Data and GORM would say it is the same KIND of answer, when it is the
      #      alternative to them.
      #
      # PAIRED WITH jOOQ ON PURPOSE. They are the two SQL-first bets and they bet OPPOSITE
      # WAYS on one question: should the compiler check the SQL? jOOQ says yes, and charges a
      # codegen step against a live schema. MyBatis says no, and charges nothing — the SQL is
      # a string in XML or an annotation, wrong at runtime or not at all. A reader who has
      # just finished 30 can judge 32 in one sentence, which is the whole reason for adjacency.
      #
      # WHY IT EARNS AN EPISODE. This track's selection rule is wrong numbers rather than
      # exceptions, and MyBatis has a clean one: a nested collection written with `select=`
      # runs one query per parent row; written with `resultMap=` it runs one query total. Same
      # feature, one attribute apart. The N+1 is back inside a tool the reader chose in order
      # to avoid ORMs — and unlike the JPA N+1 at Series 4 · 00, the SQL is fully visible in
      # both cases, so the counter and the cause are on the same screen.
      #
      # THE REST, none of it re-teaching: resultMap folding one join into a nested object
      # graph, dynamic SQL (<if>, <where>, and <foreach> for the variable-length IN list that
      # JDBC makes ugly), and one paragraph each on ExecutorType.BATCH and cursor/ResultHandler
      # streaming — the MyBatis spellings of 35 and 40.
