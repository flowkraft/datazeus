      # does the core path, Series 1 to 3, never meets it. That is the whole defect this
      # episode fixes, and it is why this one is CORE and 4 · 15 is not.
      #
      # IT IS NOT THE SAME EPISODE AS SERIES 4 · 15 OR 4 · 50, and all three comments say so:
      #     HERE       which SQL-first tool — inside the camp this track argues for
      #     4 · 15     SQL-first VERSUS framework — JdbcTemplate, Spring Data JDBC and
      #                Spring Data JPA against jOOQ and MyBatis. A deep two-way comparison
      #                for a reader already committed to a framework.
      #     4 · 50     the whole map, and the course's closing argument: whether to adopt a
      #                framework AT ALL, and at which layer. It is allowed to answer "none".
      # THIS AND 4 · 50 ARE THE COURSE'S DECISION SPINE — one inside the SQL-first camp, one
      # about whether to leave it. Different question, different reader, neither replaces the
      # other, and both are core.
      #
      # IT IS NOT THE PROJECT AT 70 EITHER, and repurposing that was considered and rejected.
      # Three reasons: the project was ADDED to fix a documented defect (a series with no
      # episode that assembles it), it is the only place in Series 2 that teaches the
      # reconciliation habit, and CHOOSING AND BUILDING ARE DIFFERENT ACTS. A project is
      # synthesis — put six things together and make one work. This is analysis — hold six
      # things apart and pick. One cannot stand in for the other, and every other series here
      # ends on a project.
      #
      # PLACED AT 47 because streaming (40) and DuckDB (45) are INPUTS to the decision — "does
      # the aggregation happen in the database or in DuckDB" and "might this not fit in heap"
      # are two of the questions. It has to come after both. Numbering follows 07 and 32.
