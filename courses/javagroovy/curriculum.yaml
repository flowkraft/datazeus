      # PDF — added 2026-09-02, and it is the OTHER HALF OF 05. Together they are the business
      # document pair: 05 reads the spreadsheet the business sends and writes the one it asks
      # for; 07 produces the document it sends to its own customers. Every track in the academy
      # teaches reading data. This is the only episode anywhere that produces the artifact a
      # person outside the company actually holds.
      #
      # IT IS ALSO THE MOST ON-BRAND EPISODE WE CAN WRITE. The house's entire product is
      # data -> PDF report -> burst per recipient -> email. A reader who finishes 07 has
      # written the first stage of ReportBurster.
      #
      # TWO LAYERS, TAUGHT IN THIS ORDER, and the order is the argument:
      #   1. RAW PDFBox. PDPageContentStream, beginText/showText/endText, and coordinates you
      #      compute yourself. No wrapping, no pagination, no table — a PDF has no such
      #      concepts, only glyphs at (x, y). Show this ONCE. Its job is to explain why nobody
      #      builds a report this way, and to make layer 2 legible rather than magical.
      #   2. openhtmltopdf ON PDFBox. HTML and CSS in, a paginated PDF out. This is what you
      #      actually do, and it is what WE do: openhtmltopdf-pdfbox is a dependency in
      #      bkend/reporting/pom.xml, and AbstractReporter.java:729 is the whole pattern —
      #      FreeMarker renders the template to HTML, then
      #          new PdfRendererBuilder().withHtmlContent(html, baseUri).toStream(os).run()
      #      Same shape as the Liquibase episode at Series 3 · 20: the reader is filling in a
      #      mechanism that already ships in a product they have.
      #
      # WHAT MAKES IT A DATA EPISODE AND NOT A LAYOUT TUTORIAL — this is the line to hold, and
      # the drafting risk is that it becomes a CSS lesson. Every trap below is a wrong number
      # or a wrong name on a document a customer receives, and none of them throws:
      #   - A NULL RENDERS AS THE WORD "null" on an invoice you already emailed. Series 1 · 30
      #     arriving somewhere it cannot be shrugged off.
      #   - FORMAT THE NUMBERS ONCE, IN ONE PLACE. Currency symbol, grouping separator,
      #     negatives, decimals, locale. Formatting scattered through a template is how one
      #     column ends up in a different convention from the column beside it.
      #   - FONTS ARE WHERE ENCODING COMES BACK. PDFBox's built-in fonts are WinAnsi, so a
      #     customer named Ștefan or Müller either throws "U+0218 is not available in this
      #      font" or is silently dropped. You embed a font or you mangle people's names —
      #     Series 1 · 20, with a customer's name on the line.
      #   - TOTALS COME FROM THE DATA, NOT FROM THE PAGE. A table that spills across pages
      #     needs repeated headers, and a subtotal computed per RENDERED PAGE instead of per
      #     group is a wrong number that survives every review because the document looks right.
      #   - THE baseUri IS LOAD-BEARING. Relative CSS, images and fonts resolve against it; get
      #     it wrong and you get an unstyled PDF and no error at all.
      #
      # THE READING HALF — added 2026-09-02 with the retitle, and it is NOT a footnote to the
      # writing half. It passes the same selection rule even more cleanly, because PDF's read
      # failures are the purest wrong-numbers-not-exceptions in the whole track:
      #
      #   THERE ARE NO ROWS AND NO COLUMNS IN A PDF. There are glyphs at (x, y). A "table" is
      #   something you RECONSTRUCT, and every extraction bug is a consequence of that one
      #   fact. This is the thesis of the half and the reader must leave with it — make it
      #   concrete by printing glyph positions before extracting anything.
      #
      #   READING ORDER IS NOT DRAWING ORDER. PDFTextStripper walks the content stream in the
      #   order things were painted, so a two-column layout interleaves — quietly, into text
      #   that still looks like text. setSortByPosition(true) fixes it.
      #
      #   A SCANNED PDF RETURNS AN EMPTY STRING. Not an error. Zero rows and a green job. A
      #   PDF whose fonts carry no ToUnicode CMap returns confident garbage instead.
      #
      # AND THE HOUSE ALREADY PROVES THE HEADLINE TRAP IS REAL — the strongest in-house
      # evidence anywhere in Series 2. DocumentBurster's PDF engine is PDFBox, and
      # PdfBurster.java:131 reads:
      #     stripper.setSortByPosition(ctx.settings.isSortByPosition())
      # We exposed setSortByPosition AS A USER-FACING SETTING, per report, because it matters
      # too often to hardcode. That is not a textbook trap — it is a switch our own customers
      # flip, some of them without ever being told what it does.
      #
      # TABULA IS A PARAGRAPH, NOT A SECTION. tabula-java is BUILT ON PDFBox and adds table
      # heuristics (lattice where there are ruling lines, stream where there is only
      # whitespace). Name it, say it is a layer above and not an alternative, and move on —
      # this episode already carries two halves and cannot also carry a third tool.
      #
      # THE ORACLE IS THE ROUND TRIP, and it is what makes ONE episode out of two halves
      # rather than two episodes stapled together: generate the PDF, read it back with
      # PDFTextStripper, assert on the text. The writing half's correctness is proved by the
      # reading half's API. Deterministic, no clock, no new machinery.
      #
      # WATCH THE SIZE. Raw PDFBox, openhtmltopdf, extraction, fonts, formatting and Tabula is
      # a lot for one slot. If it will not fit, SPLIT IT — 07 writing, 08 reading — rather than
      # letting either half become a footnote. That is the rule 05's own comment applies to
      # Excel ("reading and writing belong in ONE episode... a reader who can do one is two
      # paragraphs from the other"), and it holds here only while both halves stay honest.
      #
      # NUMBERED 07, on the same reasoning as 32: an insertion after 05 would otherwise
      # renumber thirteen episodes and the cross-references in this file that name Series 2 ·
