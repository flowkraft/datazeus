# The ordered episode list for Java & Groovy for Data. Field docs live in courses/learnsql/curriculum.yaml.
#
# The job this track teaches: do the data half of the job in the language your company
# already runs. Read a file nobody cleaned, pull a result set without melting the heap,
# reshape it, and leave behind something a colleague can run next month — in Java, with
# Groovy for the parts where Java makes you type too much.
#
# ============================================================================
# THE FRAMEWORK QUESTION — settled here so it is not re-argued per episode
# ============================================================================
# Do we teach Spring Data, JPA, GORM? PARTLY, LATE, AND WITH AN OPINION.
#
# The sibling track answers this. Python for Data is library-heavy — pandas, polars,
# DuckDB — but for databases it stops at the DRIVER (databases-from-python,
# parameterized-queries) and has no episode on the ORM layer. (Its episode is titled
# "psycopg & SQLAlchemy"; if that means SQLAlchemy Core rather than the ORM, that title
# should say Core — as written, this paragraph's evidence reads as contradicting it.)
# The reason is not
# squeamishness about libraries; it is that an ORM is an OBJECT-GRAPH tool and data work
# is SET-BASED. Loading rows into entities to aggregate them is the slow way to write a
# GROUP BY.
#
# So the spine of this track is: the language, JDBC, and SQL-first tools.
#   - JDK for shaping: streams, records, collections, java.time
#   - Groovy where Java is too verbose: GDK collection methods, groovy.sql.Sql,
#     JsonSlurper, @Grab. This is the scripting layer that makes the JVM feel like Python,
#     and it is what DataPallas report scripts are written in — so it is not decoration.
#   - JDBC and jOOQ for the database. jOOQ gets a full episode and JPA does not, which is
#     a deliberate inversion of what most Java developers reach for first.
#
# Frameworks then come LAST, in Series 4, on their own terms — after Series 3 has already
# shipped a working job without one. That order is the argument: a reader can only judge
# what a framework buys them once they have seen what it replaces.
#
# UPDATED 2026-08-24 — THIS USED TO SAY "ONE EPISODE, AT 3/40". The paragraph below set the
# condition for changing it ("series 3 should grow a framework series of its own"), and the
# condition was met — not by a reader survey, but by the product. DataPallas custom apps are
# Grails and DataPallas ships a Spring Boot playground, so anyone extending it meets GORM and
# Spring Boot whether or not they came here for frameworks. One episode naming Spring Data,
# GORM and JPA together was a list, not a skill. See the Series 4 header for the full reversal.
#
# The SPINE IS UNCHANGED, and that is the part worth defending: Series 1-3 are the language,
# JDBC, jOOQ and a job you can hand over, with no framework in sight. Series 4 is scoped to
# the DATA HALF only — no controllers, no DI tutorial, no web layer.
#
# WHAT WOULD CHANGE THIS AGAIN: if Series 4 starts needing episodes about the web layer,
# security or DI to make sense, it has stopped being a data series and belongs in a track of
# its own. Decide from the questions people actually ask, not up front.
#
# ============================================================================
# THE ORDER — follow the life of a row, not the shape of the JDK
# ============================================================================
# Reordered 2026-08-24. The rule: each episode should only need what came before it, and the
# sequence should read like the actual job. Four things moved, and each was a real bug:
#
#   S1: ENCODINGS, DATES AND NULLS moved UP, ahead of grouping and joining. You are reading
#       files from episode 00, so learning that text arrives corrupted at episode 30 was
#       backwards — and a wrong date or an unhandled null silently corrupts a total, so the
#       three parsing traps have to land BEFORE anything computes a total. The series now
#       runs: read it -> hold it -> transform it -> get it in correctly -> summarise ->
#       combine -> build the whole thing.
#
#   S2: TEXT BLOCKS now come before groovy.sql.Sql. Finish the Java story, then show the
#       Groovy shortcut — the same order Series 1 uses for streams and Groovy collections.
#       Showing the shortcut first makes the long way look like a punishment.
#
#   S2: jOOQ MOVED HERE FROM SERIES 3. Series 2 is "how you talk to a database from the JVM"
#       and jOOQ is one of the ways; Series 3 is about shipping, and jOOQ is not a shipping
#       topic. It sits last in the database block because it is the most machinery for the
#       most safety, after the reader has seen the five simpler options. (This does NOT
#       reopen the Series 4 question — see that episode's own comment: it is a library, not
#       a framework.)
#
#   S4: ORDERED BY VENDOR, FOUNDATIONS FIRST. Two things were wrong here, and the second
#       took a second look to see.
#
#       The dependency bug: "Spring Data Repositories — Declare an Interface, Get the Query" was
#       being taught BEFORE the reader had been told what JPA is.
#
#       Then a draft opened the series with Spring JdbcTemplate, on the grounds that it
#       depends on neither and is the gentlest step out of Series 3. True, but it made the
#       series zigzag between vendors — Spring, Jakarta, Hibernate, Spring, Grails — and the
#       reader crosses into Spring, leaves for Jakarta, and comes back. Nothing structural
#       required it: JdbcTemplate has no dependency in either direction, so the only real
#       constraints are JPA-before-Spring-Data-JPA and Hibernate-before-GORM.
#
#       So it runs foundations first, then one vendor at a time: the SPEC (JPA), then how it
#       actually behaves (Hibernate), then the SPRING pair that wraps them, then GRAILS
#       (GORM is Hibernate underneath, so it needs both), then migrations across both, then
#       the project. Opening on JPA's N+1 problem also serves the track's SQL-first thesis
#       better than a convenience wrapper does — the series starts by showing what goes
#       wrong, which is the argument Series 1-3 spent thirty episodes making.
#
# ============================================================================
# TITLES — plain English, about data, no cleverness
# ============================================================================
# Rewritten 2026-08-24, all 41. The old ones were trying to sound smart, which made them
# harder to grasp and pushed the actual subject out of the way. The worst offender read
# "Hibernate for Bulk Work — StatelessSession, flush/clear and the Heap You Just Ate":
# three fragments of jargon and a joke, and nowhere does it say what you will be able to do.
# It is now "Hibernate — The Library That Turns Your JPA Code Into SQL".
#
# The rules, so this does not creep back:
#   - the topic half NAMES THE THING, so someone scanning the roadmap can find it
#   - the hook half is a PLAIN STATEMENT of what the episode teaches. Not a slogan, not a
#     comparison, not a joke. If you would not say it out loud to a colleague who asked
#     "what is that episode about?", it is wrong.
#
#   - NO RHETORICAL DEVICES. This is the rule that kept getting broken, one title at a time,
#     because each individual case looked harmless. Banned, with the actual examples:
#         contrast/negation   "Not in the Jar, Not in Git"       -> "Keeping Passwords Out of Your Code"
#         number play         "Four Lines Instead of Twenty"     -> "Running Queries With Much Less Code"
#         repetition          "Typesafe SQL, Written as SQL"     -> "Writing SQL in Java That the Compiler Checks"
#         imperative pairs    "Declare an Interface, Get the Query" -> "Queries Generated From an Interface"
#         jokes               "the Heap You Just Ate"            -> deleted
#     A device makes the reader decode before they can understand. That is a cost, and it
#     buys nothing.
#
#   - THE HOOK SAYS WHAT THE THING IS, NOT WHAT IT IS MADE OF. "Hibernate — The Session,
#     the Cache, and the Cost on Big Loads" listed Hibernate's INTERNALS, which mean nothing
#     to a reader who does not already know Hibernate — and a title is read by exactly that
#     person. Same for "JPA — Entities, the Persistence Context" and "JDBC — Connection,
#     Statement, ResultSet". A reader should finish the title knowing what the thing IS and
#     roughly what it does with data. WHEN and HOW to use it is the article's job and the
#     video's job, not the title's.
#     The thing's own NAME in the topic half is fine and expected — JdbcTemplate, jOOQ,
#     DuckDB, Liquibase. Its parts and its annotations are not.
#
#   - NEVER DEFINE A TECHNOLOGY BY ITS MOST FAMOUS GOTCHA, above all when it is the only
#     episode about that technology. "Hibernate — Loading Millions of Rows Without Running
#     Out of Memory" described a SYMPTOM Hibernate causes; a reader scanning would conclude
#     Hibernate is a bulk-loading tool. "JPA — ... and the N+1 Problem" and "GORM — ... and
#     Where It Runs Too Many Queries" had the same shape. NAME THE MECHANISM IN THE TOPIC
#     HALF; let the cost or the consequence be the hook, not the definition. The gotcha still
#     gets taught — it just is not what the thing IS.
#
#   - NO VAGUE NOUNS OR DANGLING REFERENCES. "One Changelog, Both Apps" made the reader ask
#     "which two apps?"; "Fetching Many Things at Once" never says what the things are. If a
#     word in the hook sends the reader looking for its antecedent, the hook has cost them
#     attention instead of buying them any. Name it, or say what you can DO instead.
#
#   - if a hook could be swapped into another episode without anyone noticing, it says
#     nothing and needs rewriting
#
#   THE TEST, applied to all 41 at once rather than one at a time: read the title aloud. If
#   any part of it exists to sound good rather than to inform, delete that part.
#
# ============================================================================
# JAVA OR GROOVY, PER EPISODE
# ============================================================================
# Not alternating for variety. The rule: JAVA is the default, and Groovy appears when it
# removes real ceremony — a throwaway script, a SQL loop, JSON parsing, a test. Show both
# only where the comparison teaches something; otherwise pick the one a working engineer
# would actually use and say why in one line.
#
# Assume Java 21+ (records, sealed types, pattern matching, text blocks for SQL). Text
# blocks matter more than they look: they are what makes embedding real SQL in Java stop
# being painful, which is the whole premise of a SQL-first track.

# ============================================================================
# HOW THIS TRACK IS HANDS-ON — decided 2026-08-24
# ============================================================================
# ONE MECHANISM: THE KOAN. Only the assertion target changes. An earlier design had four
# named mechanisms for the episodes koans "could not" reach — budget / handover /
# failure-injection / mutation. That was over-engineering: four ordinary tests dressed up as
# a framework. Rejected. The implementation is one base class and three small helpers
# (tests/src/koans/groovy/datazeus/_internal/JvmKoanBase.groovy — read its header).
#
#   koan:predict | diagnose | choose | complete | author
#                            the same five rungs as the Data Modeling koans, because the
#                            reader's competence is assumed and JUDGEMENT is what is tested
#   koan:count:roundtrips    assert on how many times you went to the database
#   koan:count:rows-held     assert on the most rows held in memory at once
#   koan:capture             assert on what the code PRINTED — stdout, stderr, the log
#   koan:process:tool        call the tool's entry point in-process; assert exit code + output
#   koan:process:jar         build a real jar and run it; only where assembly IS the subject
#   eyes                     no automated check, ON PURPOSE. At most one per series, and it
#                            must say why. Anything else is a lecture wearing a label.
#
# NEVER ASSERT WALL-CLOCK TIME. This is the rule that makes the rest work, and the one a
# future addition is most likely to break. Timing assertions are machine-dependent, flaky,
# and eventually deleted by whoever the flake wakes up. Every performance lesson here has a
# countable proxy that is also the actual lesson: batching counts round trips, streaming
# counts rows held. If you think you need a stopwatch, you need a counter.
#
# THE BLANK IS A DATA DECISION, NEVER A LANGUAGE FACT. Every famous koan set — Ruby, Groovy,
# Scala — is a language tutorial (`assert 1 + 1 == ___`), and the format pulls hard that way.
# This track must not go there: the reader already knows the language, and the title says FOR
# DATA. A koan that teaches map() insults them; one that hands them a wrong number does not.
#
# ONE FILE HOLDS BOTH LANGUAGES — verified on Groovy 4.0.22, not assumed. Records, var,
# List.of, method references, Collectors, text blocks and java.time all run verbatim inside a
# Groovy Spock spec. So no src/koans/java and no second source root, and one koan can show
# the Java version beside the Groovy one-liner, both green — which demonstrates this track's
# thesis instead of asserting it. The one trap: Groovy's == is equals(), not identity.

course: learn-java-groovy
track: javagroovy
title: Java & Groovy for Data

# Assumes Learn SQL and NOT Data Modeling — the two are siblings after SQL, not a sequence.
# This track's own excludes already said "the SQL is assumed"; a stated dependency that is
# never declared is how a reader concludes they are not ready, rather than that we forgot to
# say so.
prerequisites:
  - course: learn-sql
    needs: "Series 1"
    why: >-
      Series 1 of Learn SQL is the whole prerequisite: SELECT, WHERE, JOIN and GROUP BY.
      Once you start running queries from Java here, you check the answers against the same
      Northwind numbers the SQL koans use. You are never asked to write clever SQL — but you
      do need to read a query and know what it should come back with, because that is how you
      tell a JVM bug from a SQL one.

excludes:
  # Re-scoped 2026-08-24. This used to exclude Spring Boot outright, which stopped being true
  # when Series 4 arrived — but the line that matters is unchanged, and it is the DATA HALF.
  - topic: "Controllers, dependency injection, security and the web layer"
    where: "not covered; Series 4 teaches Spring and Grails only where they read and write rows"
  - topic: "Hibernate internals and JPA entity mapping in depth"
    where: "not covered by design. In this course, Series 4 · 00 teaches JPA as the vocabulary and Series 4 · 05 the one Hibernate behaviour that costs you memory on a bulk load"
  # The three-way split on schema change, stated because one subject across three tracks is
  # exactly how a reader concludes we repeated ourselves.
  - topic: "Deciding what the schema change should be"
    where: "covered in Data Modeling, Series 2 · 50. In this course, Series 3 · 20 applies a change that has already been designed"
  - topic: "Running a migration against a live database under load — locks, zero downtime"
    where: "covered in Data Ops — here the question is only how the change gets versioned and shipped from your build"
  - topic: "Machine learning — features, training, model selection"
    where: "not covered; this track moves and shapes data. For LLM-era work see AI for Data"
  - topic: "Charts other people read, and dashboards"
    where: "covered in BI & Data Visualization — here you plot only to see the data yourself"
  - topic: "Scheduling, cron and running jobs in production"
    where: "covered in Data Ops — this track gets the job ready to be scheduled"
  - topic: "Writing the SQL itself"
    where: "covered in Learn SQL — here the SQL is assumed and the question is how to run it from the JVM"

series:
  - slug: series1-jvm-fundamentals
    title: Java & Groovy for Data Fundamentals
    tagline: write a Java or Groovy script that reads and reshapes data
    level: beginner
    episodes:
      # Groovy leads the track on purpose: a reader who has to create a Maven project
      # before printing a row will quit. One file, one command, real data — then earn the
      # build tooling in series 3 once there is something worth packaging.
      - n: "00"
        slug: your-first-script
        title: "Your First Script — Read a CSV File and Answer One Question About It"
        hands_on: ["koan:author"]
        short: "Your First Script — read a CSV, answer a question"
        core: true
        status: planned
        tags: ["foundational"]
      - n: "05"
        slug: records-and-collections
        title: "Records and Collections — Holding Rows and Tables in Memory"
        hands_on: ["koan:complete"]
        short: "Records & Collections — rows and tables in memory"
        core: true
        status: planned
      - n: "10"
        slug: streams
        title: "Streams — Transforming Rows With map, filter and collect"
        hands_on: ["koan:complete", "koan:predict"]
        short: "Streams — transforming rows with map and filter"
        core: true
        status: planned
        tags: ["foundational"]
      - n: "15"
        slug: groovy-collections
        title: "Groovy Collections — Filtering, Transforming and Grouping in Less Code"
        hands_on: ["koan:complete"]
        short: "Groovy Collections — the same work, less code"
        status: planned
      - n: "20"
        slug: files-and-encodings
        title: "Files and Encodings — Reading Text Files in the Right Character Set"
        hands_on: ["koan:predict"]
        short: "Files & Encodings — the right character set"
        core: true
        status: planned
      - n: "25"
        slug: dates-and-time
        title: "java.time — Working With Dates, Times and Time Zones Correctly"
        hands_on: ["koan:predict"]
        short: "java.time — dates, times and time zones"
        core: true
        status: planned
      - n: "30"
        slug: nulls-and-optional
        title: "Nulls and Optional — Handling Data That Is Missing"
        hands_on: ["koan:predict", "koan:diagnose"]
        short: "Nulls & Optional — handling missing data"
        core: true
        status: planned
      - n: "35"
        slug: grouping-and-aggregating
        title: "Grouping and Aggregating — Summarising Rows With groupingBy"
        hands_on: ["koan:diagnose", "koan:complete"]
        short: "Grouping & Aggregating — summarising rows"
        core: true
        status: planned
      - n: "40"
        slug: joining-datasets
        title: "Joining Two Datasets in Memory — Combining Rows Without Doubling Totals"
        hands_on: ["koan:predict", "koan:diagnose"]
        short: "Joining in Memory — without doubling totals"
        core: true
        status: planned
      - n: "45"
        slug: first-end-to-end-script
        title: "Your First End-to-End Script — From a File to a Finished Answer"
        hands_on: ["koan:author"]
        short: "First End-to-End Script — file to finished answer"
        core: true
        status: planned
        tags: ["project"]

  - slug: series2-real-data
    title: Working With Real Data
    tagline: files, databases and APIs — nothing pre-cleaned
    level: intermediate
    episodes:
      - n: "00"
        slug: csv-json-parquet
        title: "CSV, JSON and Parquet — Reading the Three Formats You Will Meet Most"
        hands_on: ["koan:complete"]
        short: "CSV, JSON & Parquet — the three you'll meet most"
        core: true
        status: planned
      # The format the modern trio leaves out, and the one a business actually sends you.
      # CSV/JSON/Parquet is the right list for a data platform; in a finance department the
      # real list is .xlsx, and a reporting company that cannot read one is not credible.
      #
      # POI earns a full episode rather than a paragraph because it is fiddly in ways that
      # produce WRONG NUMBERS rather than exceptions — which is this track's whole selection
      # rule for what deserves an episode:
      #   - dates are floating-point day counts, and the 1900 leap-year bug is still in there
      #   - a cell holds a FORMULA or its cached VALUE, and you get to pick wrong
      #   - merged cells report the value once and blank for the rest of the range
      #   - the streaming reader (SXSSF/event API) and the DOM one behave differently on
      #     exactly the files big enough to matter
      # Not core: whether you need it is decided by your employer, not by the craft.
      - n: "05"
        slug: excel
        title: "Excel with POI — Reading the Spreadsheets Your Business Sends You"
        short: "Excel with POI — reading the spreadsheets you get"
        hands_on: ["koan:predict", "koan:complete"]
        status: planned
      - n: "10"
        slug: jdbc-basics
        title: "JDBC — Talking to a Database From Java: Connection, Statement, ResultSet"
        hands_on: ["koan:complete"]
        short: "JDBC — talking to a database from Java"
        core: true
        status: planned
        tags: ["foundational"]
      - n: "15"
        slug: parameterized-queries
        title: "PreparedStatement — Passing Values Safely Into a Query"
        hands_on: ["koan:predict", "koan:complete"]
        short: "PreparedStatement — passing values safely"
        core: true
        status: planned
      - n: "20"
        slug: text-blocks-for-sql
        title: "Text Blocks — Writing Multi-Line SQL Inside Java Code"
        hands_on: ["koan:complete"]
        short: "Text Blocks — multi-line SQL inside Java"
        status: planned
      - n: "25"
        slug: groovy-sql
        title: "groovy.sql.Sql — Running Queries With Much Less Code"
        hands_on: ["koan:complete"]
        short: "groovy.sql.Sql — queries with less code"
        core: true
        status: planned
      # jOOQ STAYS IN SERIES 3. Asked directly whether it belongs in Frameworks — no, twice
      # over, and the reasons are worth keeping because it is a reasonable thing to wonder:
      #
      #   1. It is a LIBRARY, not a framework. You call it; it does not call you. No
      #      container, no lifecycle, no inversion of control. A jOOQ job is plain Java with
      #      a dependency, which is exactly what "Java That Ships" means.
      #   2. More importantly, it is the SQL-FIRST POSITION — the thing Series 4 is measured
      #      against. Filing it beside Spring Data, JPA and GORM would imply it is the same
      #      KIND of answer, when it is the alternative to them. This file's own header calls
      #      it part of the spine: "jOOQ gets a full episode and JPA does not, which is a
      #      deliberate inversion of what most Java developers reach for first."
      #
      # And the ORDER is the argument. A reader has to see what typesafe SQL actually looks
      # like before they can judge what an ORM is buying them. Series 4 · 15's choose-koan
      # then puts jOOQ back in the comparison, which is where the head-to-head belongs.
      #
      # (This comment has outlived two moves. It once described "the opinionated pair, 35 and
      # 40" in Series 3. Episode 40 became Series 4; this episode then moved to Series 2,
      # because talking to a database is what Series 2 is FOR and shipping is what Series 3
      # is for. It is the last of the six ways this course shows you to run a query.)
      - n: "30"
        slug: sql-first-with-jooq
        title: "jOOQ — Writing SQL in Java That the Compiler Checks"
        hands_on: ["koan:complete"]
        short: "jOOQ — SQL in Java the compiler checks"
        status: planned
      - n: "35"
        slug: batching-and-transactions
        title: "Batches and Transactions — Inserting Many Rows Quickly and Safely"
        hands_on: ["koan:predict", "koan:count:roundtrips"]
        short: "Batches & Transactions — many rows, safely"
        core: true
        status: planned
      - n: "40"
        slug: streaming-large-results
        title: "Streaming Large Results — Reading Millions of Rows Without Filling Memory"
        hands_on: ["koan:count:rows-held"]
        short: "Streaming Large Results — without running out of memory"
        core: true
        status: planned
      - n: "45"
        slug: duckdb-from-java
        title: "DuckDB from Java — An Analytics Engine Inside Your Process"
        hands_on: ["koan:complete", "koan:diagnose"]
        short: "DuckDB from Java — analytics in your process"
        status: planned
      - n: "50"
        slug: apis-and-json
        title: "HTTP and JSON — Reading Data From an API With HttpClient and Jackson"
        hands_on: ["koan:complete", "koan:predict"]
        short: "HTTP & JSON — reading data from an API"
        core: true
        status: planned
      # Episode 40 gets you a 200 response. This is every other response.
      # Splitting it out rather than swelling 40 is deliberate: the happy path is a page of
      # code and the failure path is the job, and an episode that teaches both teaches the
      # first one properly and the second one in a footnote.
      #
      # The oracle is a counter, reusing the machinery from 2/30 — count the ATTEMPTS.
      # "Retried forever" and "gave up immediately" are both wrong and both look identical
      # from the outside; the attempt count separates them, and a fixed-delay retry against a
      # rate limiter is countably worse than exponential backoff.
      # The stub server is the JDK's own com.sun.net.httpserver — no dependency, and it can
      # serve a 500, a 429 with Retry-After, and a paginated sequence on demand.
      - n: "55"
        slug: retries-and-pagination
        title: "Retry, Backoff and Pagination — Fetching From an API Reliably"
        short: "Retry, Backoff & Pagination — fetching reliably"
        hands_on: ["koan:complete", "koan:count:roundtrips"]
        status: planned
      # Placed in Series 2 rather than Series 3 because the motivating case is real-data work
      # — four hundred API calls, or fifty files — not performance tuning. It is also the
      # Java 21 feature this track assumes and never used: the header calls out records,
      # sealed types and text blocks, then leaves the headline out.
      #
      # The lesson is which KIND of work you have. Virtual threads are for I/O-bound waiting
      # (the whole of Series 2), parallel streams are for CPU-bound work, and using either on
      # the other's problem makes things worse. A parallel stream over blocking JDBC calls is
      # the mistake this episode exists to prevent.
      - n: "60"
        slug: concurrency-and-virtual-threads
        title: "Virtual Threads and Parallel Streams — Running Slow Calls in Parallel"
        short: "Virtual Threads & Parallel Streams — in parallel"
        hands_on: ["koan:predict", "koan:complete"]
        status: planned
      - n: "65"
        slug: cleaning-and-validation
        title: "Cleaning and Validating — Checking Data Before You Load It"
        hands_on: ["koan:diagnose", "koan:complete"]
        short: "Cleaning & Validating — check data before loading"
        core: true
        status: planned
      # SERIES 2 PROJECT — the series had none, and it is the heart of the track: ten
      # episodes of files, databases and APIs with no episode that assembles them.
      # One job, all three sources, and the reconciliation habit that makes it trustworthy:
      # the number you loaded must equal the number you read, and the job says so out loud.
      - n: "70"
        slug: project-three-sources
        title: "Project — One Answer From a CSV, a Database and an API"
        short: "Project — one answer from three sources"
        hands_on: ["koan:author", "koan:count:rows-held"]
        tags: ["project"]
        core: true
        status: planned

