      # THE EPISODE THAT CLOSES THE DATABASE BLOCK — added 2026-09-02, and it exists because
      # episodes 10 to 45 leave the reader with six true statements and no rule:
      #     jOOQ is compiler-checked. groovy.sql.Sql is less code. MyBatis maps rows to
      #     objects. DuckDB is fast for analytics. JDBC is what they all sit on. Streaming
      #     keeps 2M rows out of the heap.
      # Every one of those is correct and not one of them answers the question a reader has on
      # Monday morning: WHICH OF THESE DO I OPEN THE IDE AND TYPE? A reader who cannot answer
      # that does not have a knowledge gap — they have six tools and no way to pick, which in
      # practice means they use whichever one they read most recently.
      #
      # THE COURSE ALREADY HAS AN ANSWER AND IT IS PARKED WHERE THE CORE READER WILL NOT REACH
