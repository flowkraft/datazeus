      # MIGRATIONS, and deliberately FRAMEWORK-FREE here: the Maven/Gradle plugin, run from
      # your build, on plain JDBC. Series 4 then shows the same changelog wired into Spring
      # Boot and into Grails. Tool first, framework integration after — the same order this
      # whole track uses, and the reason it stays in "Java That Ships" rather than moving out.
      #
      # LIQUIBASE, DECIDED — 2026-08-24, on evidence rather than preference. An earlier draft
      # said Flyway. That was wrong twice over:
      #   1. DataPallas has already standardised on Liquibase WITH THE GROOVY DSL, in both
      #      playgrounds. bkend-boot-groovy-playground: spring-boot-starter-liquibase +
      #      liquibase-groovy-dsl 4.0.1, changelog at db/migration/changelog.groovy, gated on
      #      ENABLE_LIQUIBASE_GROOVY_MIGRATIONS. grails-playground:
      #      grails-data-hibernate5-dbmigration + liquibase-core 4.31.1 + the same Groovy DSL.
      #   2. Grails' official migration plugin IS Liquibase; there is no first-party Flyway
      #      plugin. And this house ships against Postgres, Oracle, SQL Server, MySQL AND Db2,
      #      which is precisely the shape Flyway has historically charged for — its Community
      #      edition has no undo/rollback, no dry run, and a tiered database matrix.
      #
      # AND THE EPISODE IS ALREADY WRITTEN FOR US: both changelog.groovy files exist and are
      # EMPTY. "Here is the file scaffolded in your own product, and nothing is in it. Fill it
      # in." Real, in-house, and the learner writes migrations in Groovy — the language this
      # track teaches, which makes the Groovy DSL a genuine fit rather than a novelty.
      #
      # Keep Flyway as an honest paragraph — simpler, plain-SQL-native, the common choice for
      # single-database greenfield — so this is a decision episode and not a tool tutorial.
      # (Verify Flyway's current licensing before publishing; Redgate has moved it more than
      # once.) Liquibase avoids XML three ways: formatted SQL changelogs, sqlFile/sql changes,
      # and the Groovy DSL.
      - n: "20"
        slug: schema-migrations
        title: "Liquibase — Database Changes Kept in Version Control, Written in Groovy"
        short: "Liquibase — database changes in version control"
        hands_on: ["koan:complete", "koan:process:tool"]
        core: true
        status: planned
      - n: "25"
        slug: logging-and-errors
        title: "Logging and Failure — What Someone Needs to See When the Job Breaks"
        hands_on: ["koan:capture"]
        short: "Logging & Failure — what to log when a job breaks"
        core: true
        status: planned
      # RETITLED AND RE-SPINED 2026-09-02. This was "Testing Data Code — JUnit and Spock, and
      # What Is Worth Testing", which put the least interesting part in the title: the reader
      # already writes Spock specs — every koan in this track is one — and JUnit is an
      # afternoon. THE HARD QUESTION IN TESTING DATA CODE IS WHAT YOU TEST AGAINST, and that is
      # now the episode.
      #
      # THE FAILURE, and it is exactly this track's selection rule: a suite that runs against H2
      # or another in-memory stand-in PASSES and the job fails in production — or, worse, both
      # pass and return different rows. Nothing throws at any point. What actually differs, all
      # of it load-bearing for episodes this course already teaches:
      #   - UPSERT. ON CONFLICT and the MERGE spellings are not the same statement on a
      #     stand-in engine, so the one write you most want covered is the one you cannot cover.
      #   - date and time functions, string functions and casting rules — the quiet ones,
      #     because they return a DIFFERENT ANSWER rather than an error.
      #   - JSON support, sequences and identity-column behaviour.
      #   - the entire dialect surface that Series 2 · 30 (jOOQ) and 2 · 32 (MyBatis) exist to
      #     let you write. jOOQ's codegen needs the real schema; testing it elsewhere tests
      #     something else.
      #
      # SO THE SPINE IS TESTCONTAINERS: the test starts a real Postgres in a container, runs
      # against it, throws it away. Same engine as production, no shared dev database, no
      # cleanup ritual between developers.
      #
      # AND THE COSTS, HONESTLY, or the episode is an advert. Containers are slow to start, so a
      # naive suite pays that per class — reuse and the singleton-container pattern are part of
      # the lesson, not an appendix. And DOCKER IS NOT ALWAYS THERE: locked-down CI, corporate
      # laptops, some build agents. That is the real reason teams choose H2, and an episode that
      # does not say so is not describing the world the reader works in.
      #
      # WHICH LEADS TO THE RULE THE EPISODE ACTUALLY TEACHES — A SPLIT, NOT A WINNER:
      #     AN IN-PROCESS ENGINE (DuckDB, SQLite) for tests about YOUR LOGIC — the transform,
      #       the parsing, the shaping. Fast, no Docker, and the engine is irrelevant because
      #       the SQL is trivial.
      #     THE REAL ENGINE, IN A CONTAINER, for tests about BEHAVIOUR — dialect, migrations,
      #       generated SQL, round-trip counts, anything where the engine IS the subject.
      # A reader who can say which of the two a given test belongs in has the skill.
      #
      # KEEP THE ORIGINAL EPISODE'S JUDGEMENT, which was good and is not replaced: a transform
      # and a parser are worth testing, a thin JDBC wrapper mostly is not, and saying which is
      # which is half the value.
      #
      # THIS TRACK'S OWN KOAN SUITE FACES THIS EXACT DECISION AND HAS NEVER RECORDED IT. The
      # header specifies the koan vocabulary in detail and says nothing about what a database
