      # SHEDLOCK — added 2026-09-02. https://github.com/lukas-krecan/shedlock
      #
      # IT COMES BEFORE QUARTZ, and that is a change from the first draft, which had them the
      # other way round. THE SMALLEST FIX FIRST, THEN THE CATEGORY CHANGE — the same order this
      # track uses everywhere else: JDBC before jOOQ, the Liquibase CLI at Series 3 · 20 before
      # the framework wiring at 4 · 25, @Scheduled at 30 before either of these. Episode 30
      # ends on "two app instances mean two runs and nobody told you". THIS is the one-
      # annotation answer to exactly that sentence; 45 is what you reach for when the answer
      # needs to be bigger. Showing the expensive one first would make the cheap one look like
      # a compromise instead of the default.
      #
      # THE DISTINCTION THE EPISODE IS FOR, and it must land in the first thirty seconds:
      # SHEDLOCK IS NOT A SCHEDULER. You keep @Scheduled exactly as episode 30 taught it, add
      # @SchedulerLock, and get one table. It adds MUTUAL EXCLUSION, not memory.
      #
      # OPEN ON THE README, because the project says it better than we can and a library that
      # states what it is NOT is rare enough to be worth quoting: "ShedLock is not and will
      # never be full-fledged scheduler, it's just a lock ... If you need a distributed
      # scheduler, please use another project (db-scheduler, JobRunr). ... the locks are
      # time-based and ShedLock assumes that clocks on the nodes are synchronized."
      # That sentence is also the handover to 45 — the reader is told by the library itself
      # that a bigger category exists, before we show it to them.
      #
      # THE TEST THAT MAKES THE CATEGORY OBVIOUS, and it is the beat that stops a reader
      # concluding this and Quartz are the same thing with different logos:
      #     TAKE EVERY NODE DOWN AT 2 A.M.
      #     ShedLock  -> the job never runs, and nothing anywhere remembers that it should have
      #     Quartz / db-scheduler -> the row still says "due at 2 a.m."; the first node back
      #                              picks it up
      # Here the schedule lives in YOUR CODE and every node fires its own copy; at 45 the
      # schedule IS a row and nodes claim what is due. Everything else follows from that —
      # including why lockAtMostFor is a guess you have to make and they do not, and why this
      # one cares about clock skew at all.
      #
      # THE TRAP, and it is this track's kind: lockAtMostFor is a GUESS ABOUT YOUR JOB'S
      # MAXIMUM RUNTIME, and both ways of guessing wrong are silent. Too short and the lock
      # expires while the job is still running, so the second instance starts anyway and you
      # have the duplicate you installed this to prevent — and this one WORSENS WITH TIME,
      # because jobs get slower as data grows, so the value that was safe in January is wrong
      # by September. Too long and a job that died holding the lock blocks every later run
      # until the window passes. Nothing throws either way. lockAtLeastFor is the other half —
      # it stops a job that finishes in milliseconds from being picked up again by a second
      # node whose clock is slightly ahead, which is the README's clock caveat arriving as a
      # real bug.
      #
      # NOT CORE.
      - n: "40"
        slug: shedlock
        title: "ShedLock — Locking a Scheduled Task So Only One Instance Runs It"
        short: "ShedLock — only one instance runs the task"
        hands_on: ["koan:predict", "koan:diagnose"]
        status: planned
      # QUARTZ — added 2026-09-02, and it is the CATEGORY CHANGE. Episode 30 says a Spring app
      # schedules itself in one JVM and closes on "the pointer to a database lock"; 40 pays
      # that with one annotation. This episode is for the reader whom one annotation does not
      # cover, and it must earn that — a schema and a new mental model is a real price.
      #
      # spring-boot-starter-quartz IS ALREADY A DEPENDENCY IN THE PLAYGROUND POM, together with
      # spring-boot-starter-quartz-test, and nothing uses either. Same hook as the empty
      # Liquibase changelog at Series 3 · 20: the scaffolding is in the reader's own product and
      # the file is blank.
      #
      # WHAT IT GIVES THAT @Scheduled AND A LOCK STRUCTURALLY CANNOT:
      #   - A JDBC JOB STORE, so the SCHEDULE ITSELF survives a restart. 40 protects the run;
      #     this remembers the appointment.
      #   - MISFIRE POLICY: the app was down at 2 a.m. Do you run late, skip, or run every
      #     missed occurrence at once? Choosing wrong here is a wrong number, not an error —
      #     a "catch-up" policy on an hourly job after a day's outage fires twenty-four times.
      #     With 40 the question cannot even be asked: the moment is simply gone.
      #   - SCHEDULES AS DATA. Jobs and Triggers are rows, added and changed at runtime. A
      #     product whose users configure their own report schedules cannot express that as an
      #     annotation, and that is the half of Quartz worth the most to this house.
      #
      # ORDER: after 40, not before — see that episode's comment for the argument.
      #
      # THE CATEGORY SPLIT, stated here from the other side of 40. An earlier draft called this
      # a four-point gradient; it is not. The separating question is WHO DECIDES THAT THE TASK
      # SHOULD RUN NOW:
      #   A. THE SCHEDULE LIVES IN YOUR CODE — @Scheduled (30), plus ShedLock (40). Every node
      #      fires its own trigger and the lock lets one through. Down at 2 a.m. means NOTHING
      #      RUNS AND NOTHING REMEMBERS.
      #   B. THE SCHEDULE IS A ROW — Quartz (here) and db-scheduler. Nodes poll and claim what
      #      is due. Only this category can be given work at RUNTIME.
      #
      # db-scheduler IS THE HONEST PARAGRAPH HERE — https://github.com/kagkarlsson/db-scheduler
      # — same discipline as keeping Flyway honest at Series 3 · 20, and it stops this episode
      # from reading as "Quartz or nothing". It is CATEGORY B like Quartz, but one table and a
      # small API instead of many tables, Jobs, Triggers, Calendars and Listeners. Its
      # distinctive move is a ONE-OFF TASK SCHEDULED AT RUNTIME WITH PAYLOAD DATA — "run this
      # for order 123 at 14:32" — awkward in Quartz, impossible with @Scheduled, and precisely
      # the shape of a product that schedules a report for a named recipient.
      #   QUARTZ AND db-scheduler ARE THE SAME KIND OF THING; the choice is weight. ShedLock is
      #   a different kind. Do not let the episode present all three as one gradient.
      #   VERIFY AGAINST THE READMEs BEFORE PUBLISHING. The comparison is from knowledge, not
      #   from docs open in front of us, and a table count is exactly the claim that ages. Same
      #   rule as the Flyway licensing line.
      #
      # (JobRunr is named in ShedLock's README beside db-scheduler and is deliberately NOT an
      # episode: background job processing with a dashboard is an application concern, not the
      # data half.)
      #
      # NOT CORE.
      - n: "45"
        slug: quartz
        title: "Quartz — Storing Schedules in a Database and Firing Them Once Across Instances"
        short: "Quartz — schedules in a database, fired once"
        hands_on: ["koan:predict", "koan:diagnose"]
        status: planned
      # THE DECISION EPISODE FOR THE WHOLE COURSE — added 2026-09-02 at the track owner's
      # request, and it is the closing argument rather than another framework.
      #
      # WHY IT HAS TO EXIST. This course's job is to present the Java tools and libraries that
      # matter for data work AND to help a reader decide between them. By the time they reach
      # here they have been shown, as working answers: plain JDBC, PreparedStatement,
      # groovy.sql.Sql, jOOQ, MyBatis, DuckDB, JPA, Hibernate, JdbcTemplate, Spring Data JDBC,
      # Spring Data JPA, GORM, Spring Batch, @Scheduled, Quartz and ShedLock. Sixteen true
      # statements. Without this episode the course ends by handing someone a toolbox and no
      # rule, which is the failure Series 2 · 47 was created to fix one series earlier.
      #
      # IT PAIRS WITH 2 · 47 AND DOES NOT REPEAT IT:
      #     2 · 47   which SQL-first tool, INSIDE the camp this track argues for
      #     HERE     whether to adopt a framework at all, and which layer to adopt it at
      # Together they are the course's decision spine. Say so in both.
      #
      # THE SHAPE IS A RULE, NOT A MATRIX — same discipline as 47 and Series 3 · 20. Sixteen
      # tools in a comparison table is a reference card, not a lesson. The questions that
      # actually decide it:
      #   - is your work SET-BASED (aggregate, join, load) or an OBJECT GRAPH you edit? That
      #     one question separates the ORM half of this series from everything else, and it is
      #     the thesis the first three series spent forty episodes earning.
      #   - are you already inside a framework, or would you be adding one? Adding Spring to
      #     get JdbcTemplate is a different decision from using the JdbcTemplate you have.
      #   - does the job need a STRUCTURE, and which one? Sequential and restartable is 27; a
      #     graph of transforms that a runner executes is 28; and neither is the honest answer
      #     for a script that finishes in ninety seconds.
      #   - does the schedule need to outlive the process, or be edited by someone who cannot
      #     deploy? That is 45. Does it only need to not run twice? That is 40.
      #   - who maintains this in two years, and can they read it?
      #
      # AND IT MUST BE WILLING TO SAY "NONE OF THESE". The honest answer for a large share of
      # data jobs is a Groovy script with groovy.sql.Sql and a cron entry — Series 1 and 2,
      # with none of Series 4. An episode at the end of the framework series that cannot reach
      # that conclusion is an advert for the series it closes.
      #
      # CORE, and it is the only episode in Series 4 that is core for a reader who never adopts
      # a framework — because this is the episode that tells them they do not need to. That is
      # also why it is not 4 · 15: 15 is a deep two-way comparison for someone already
      # committed, this is the map for someone deciding whether to commit.
