  # ============================================================================
  # WHY THIS SERIES EXISTS — added 2026-08-24, and it is a REVERSAL. Read this.
  # ============================================================================
  # The header of this file settled the framework question as "PARTLY, LATE, AND WITH AN
  # OPINION — one episode, at 3/40". It also wrote down the condition for changing that:
  # "if the track's readers turn out to be Spring application developers rather than people
  # doing data work on the JVM, series 3 should grow a framework series of its own."
  #
  # The condition is met, though not by the route it predicted. Not a survey of readers — the
  # PRODUCT. DataPallas custom apps are Grails, and DataPallas ships a Spring Boot playground
  # too. Anyone extending DataPallas meets GORM and Spring Boot whether or not they came here
  # for frameworks, and one episode covering Spring Data, GORM and JPA together was always
  # going to be a list of names rather than a skill.
  #
  # It was also becoming incoherent in practice: JdbcTemplate, migrations wiring and the ORM
  # question were all being drafted INTO Series 3, a series called "Java That Ships" whose
  # whole point is plain Java. Three framework episodes inside it would have quietly inverted
  # the track's thesis. Better to name the seam than to smuggle things across it.
  #
  # THE SCOPE IS THE DATA HALF ONLY. This is not "learn Spring Boot" and not "learn Grails" —
  # both remain excluded at the top of this file. No controllers, no DI tutorial, no web
  # layer. Only the part that reads and writes rows, which is what the track is about.
  #
  # JPA AND HIBERNATE GET AN EPISODE EACH — revised, having first written "one episode, not
  # two". That was wrong, and the reasoning that fixed it is worth keeping:
  #
  # They are not two names for one thing. JPA (jakarta.persistence) is a SPEC — entities, the
  # persistence context, JPQL, lazy loading, and the N+1 that hides inside it. It is the
  # vocabulary, and it is what transfers between jobs. Hibernate is the IMPLEMENTATION you
  # will actually be running (Spring Boot's default provider, and what GORM is built on), and
  # everything about it that matters for DATA work is absent from the spec:
  #   - StatelessSession — not in JPA at all, and the right answer for a load job
  #   - the first-level cache filling on a bulk load, and flush()/clear() to survive it
  #   - hibernate.jdbc.batch_size, and why it silently does nothing with IDENTITY ids
  #   - @BatchSize and fetch strategy, which is how you actually kill an N+1
  #
  # "One episode" was a decision about a track that does not teach frameworks. This one now
  # does, and squeezing the spec and the runtime into one slot would have taught the spec and
  # footnoted the part that OOMs your job at 500,000 entities — which is the half a DATA
  # reader is here for. Spec first, then what actually happens when you run it.
  #
  # STILL EXCLUDED: entity mapping in depth, inheritance strategies, the criteria API, second
  # level caching. Those are application-development topics and they stay out.
  #
  # EVERY TITLE IN THIS SERIES NAMES ITS FRAMEWORK, in the topic half, before the em dash.
  # "JdbcTemplate & @Transactional" is a Spring episode and its title said so nowhere — a
  # reader scanning the roadmap to find the Spring content could not. The convention costs a
  # word and it is the difference between a roadmap and a list of jargon.
  #
  # AND THE ORDER STILL HOLDS. Series 2 taught JDBC, Series 3 taught jOOQ and shipped a job
  # without a framework in sight. Only now, having seen what the alternatives actually look
  # like, is a reader equipped to judge what a framework is buying them. That was the reason
  # the original single episode sat at the very end, and it survives the reversal intact.

  # TAGLINE FIXED 2026-08-24. It read "Spring and Grails, the data half only", which was
  # true when the series opened with JdbcTemplate and stopped being true the moment JPA and
  # Hibernate moved to the front — neither is Spring and neither is Grails. The scope note
  # that matters is unchanged and now lives in the excludes: the DATA HALF only, no
  # controllers, no DI, no web layer.
  - slug: series4-frameworks
    title: Frameworks, Where They Earn It
    # TAGLINE WIDENED 2026-09-02, when scheduling arrived at 30. "Talk to a database" stopped
    # covering the series the moment two of its episodes were about a job running itself.
    tagline: use JPA, Hibernate and Spring for queries and the jobs that run them
    level: advanced
    episodes:
      # JPA THE SPEC, on its own, because it is not a Spring thing — jakarta.persistence runs
      # in plain Java SE with no framework at all, and a reader who only ever meets it through
      # Spring Data never learns what belongs to which.
      #
      # The data-relevant content: the persistence context and what "managed" actually means,
      # the entity lifecycle, JPQL versus SQL, and above all the N+1 that HIDES inside lazy
      # loading — a loop that looks like field access and is one query per iteration.
      # Diagnose-koan with the round-trip counter from Series 2 · 35: the code looks innocent, the
      # counter says 1,001. That is the whole lesson and it needs no new machinery.
      #
      # NOT core: this track's spine is SQL-first, and marking the ORM path core would
      # undercut the argument the first three series spend thirty episodes making.
      - n: "00"
        slug: jpa
        title: "JPA — Java's Standard Way to Turn Rows Into Objects"
        short: "JPA — Java's standard for rows into objects"
        hands_on: ["koan:diagnose", "koan:count:roundtrips"]
        status: planned
      # GET THE RELATIONSHIP RIGHT, IN THE FIRST SENTENCE. Hibernate is NOT an alternative to
      # JPA — it is an IMPLEMENTATION of it, and the one Spring Boot uses by default. JPA is
      # the specification (jakarta.persistence); Hibernate is the library that runs it and
      # turns what you wrote into SQL. Other providers exist (EclipseLink, OpenJPA); Hibernate
      # is simply the one you will meet.
      #
      # The nuance worth one paragraph, not a title: Hibernate predates JPA and keeps its own
      # NATIVE API — Session, StatelessSession, HQL — which is not in the spec. So it is "JPA,
      # plus more", never "instead of JPA". That extra surface is exactly why this episode
      # exists: StatelessSession, the single most useful thing here for a data job, is
      # Hibernate-only and a reader who thinks in pure JPA will never find it.
      #
      # HIBERNATE THE IMPLEMENTATION. The episode teaches WHAT HIBERNATE DOES first — the
      # session, dirty checking, the first-level cache, when it flushes — and only then what
      # those cost on data work. That order matters and the title had it backwards.
      #
      # The title used to read "Loading Millions of Rows Without Running Out of Memory". That
      # is a SYMPTOM Hibernate causes, not what Hibernate is, and it was the only Hibernate
      # episode in the course — so a reader scanning the roadmap would have concluded that
      # Hibernate is a bulk-loading tool, or that memory management is its job. Neither is
      # true. Name the mechanism; let the cost be the hook.
      #
      # This is also where the track's central claim stops being an assertion and becomes a
      # demonstration: an ORM is an OBJECT-GRAPH tool and data work is SET-BASED. The session
      # is built to track changes to a graph of objects you are editing. A data job is not
      # editing a graph — it is moving rows — so every service the session provides is
      # overhead it is charging you for something you did not ask for.
      #
      # THEN the escape hatches, all absent from the JPA spec and present in every real job:
      #   - StatelessSession: no persistence context, no dirty checking, no first-level cache.
      #     The right tool for a load job, and not in JPA at all.
      #   - the first-level cache filling on a bulk insert, and flush()/clear() to survive it
      #   - hibernate.jdbc.batch_size, and why it silently does nothing with IDENTITY ids —
      #     a batching setting that appears to work and does not is worse than none
      #   - @BatchSize and fetch strategy, which is how you actually kill the N+1 from 05
      # Counter-assertion again: the same load, with and without StatelessSession, and a
      # rows-held sink showing what the session was holding on your behalf.
      #
      # ONE EPISODE IS THE RIGHT AMOUNT. Asked whether Hibernate needs more: no. The session
      # model plus the escape hatches is what a data reader needs, and a second episode would
      # tip this into being a Hibernate course, which the top of this file refuses. Mapping,
      # inheritance strategies, the criteria API and second-level caching stay excluded.
      - n: "05"
        slug: hibernate
        title: "Hibernate — The Library That Turns Your JPA Code Into SQL"
        short: "Hibernate — turns your JPA code into SQL"
        hands_on: ["koan:count:rows-held", "koan:count:roundtrips"]
        status: planned
      # The framework layer most aligned with everything before it: you still write the SQL,
      # it removes the try/finally. It is the honest answer to "what should I use at work"
      # for a large share of JVM data jobs, and it is why this series is not an argument
      # against Spring — only against reaching for an ORM by reflex.
      #
      # It sits THIRD rather than first. An earlier draft opened the series here, because it
      # depends on neither JPA nor Hibernate and is the smallest step out of Series 3. That
      # made the series cross into Spring, leave for Jakarta, and come back — see the ORDER
      # note in this file's header. Foundations first, then one vendor at a time.
      #
      # It also closes the CONNECTION POOLING gap, which had no home anywhere in the track:
      # Series 2 · 10 teaches Connection -> Statement -> ResultSet -> close, and every real job uses a
      # pool. Opening a connection per query is the classic production bug, and Spring Boot
      # auto-configures HikariCP, so this is where the fix lands.
      #
      # It lands here for CONVENIENCE, not because pooling belongs to Spring. If Series 2 ever
      # grows a pooling episode of its own, move it there and leave a pointer — this episode
      # should not be the only place a reader can learn that connections are expensive.
      - n: "10"
        slug: spring-jdbc-template
        title: "Spring JdbcTemplate — Running Your Own SQL From a Spring Application"
        short: "Spring JdbcTemplate — your own SQL, from Spring"
        hands_on: ["koan:complete", "koan:count:roundtrips"]
        core: true
        status: planned
      # Spring Data is a REPOSITORY abstraction, and it comes in two flavours that are not
      # variations of each other: Spring Data JDBC maps rows and stops, Spring Data JPA hands
      # you an entity graph and a persistence context. Choosing between them IS the episode,
      # and it is a choice most teams make by accident.
      #
      # This is where the old 3/40's real question survives — when is an object graph the
      # right model for your data, and when are you loading rows into entities to do a
      # GROUP BY the slow way? Choose-koan: one requirement, FIVE implementations —
      # JdbcTemplate, Spring Data JDBC, Spring Data JPA, and the two SQL-first ones from
      # Series 2: jOOQ at 30 and MyBatis at 32. Both belong in the comparison even though they
      # live in another series; this is the one place the SQL-first position and the framework
      # positions meet head to head, and leaving them out would rig the answer.
      # (MyBatis joined the list 2026-09-02. It is also where mybatis-spring-boot-starter gets
      # its one paragraph — @Mapper interfaces LOOK like Spring Data repositories and are not,
      # and this is the only page where a reader can see both and tell them apart.)
      #
      # THIS IS NOT SERIES 2 · 47, and the two must not drift into each other:
      #     2 · 47   which SQL-first tool — inside the camp this track argues for. CORE.
      #     HERE     SQL-first VERSUS framework. Not core, because a reader who never adopts
      #              a framework does not need it.
      # 47 exists because this comparison used to be the ONLY one in the course and it sits in
      # a series most readers will not reach. A reader arriving here has already chosen within
      # the SQL-first camp; this episode asks whether to leave it.
      #
      # The winner genuinely changes with the requirement. That is the point, and a single
      # right answer would be a lie.
      - n: "15"
        slug: spring-data-repositories
        title: "Spring Data Repositories — Your Method Name Becomes the Query"
        short: "Spring Data Repositories — method name to query"
        hands_on: ["koan:choose", "koan:diagnose"]
        status: planned
      # GORM gets its own episode because DataPallas custom apps are Grails, so a reader WILL
      # meet it. Dynamic finders and `Book.findAllByAuthor(...)` are genuinely pleasant; the
      # episode earns its keep by also showing the extra queries it runs — and by pointing out
      # that GORM is Hibernate underneath, so every word of 05 and 10 applies here too. That
      # through-line is why GORM comes after them and not before.
      - n: "20"
        slug: gorm
        title: "GORM — Grails' Data Layer, and the Hibernate Underneath It"
        short: "GORM — Grails' data layer, on Hibernate"
        hands_on: ["koan:diagnose", "koan:count:roundtrips"]
        status: planned
      # The other half of Series 3 · 20. That episode ran Liquibase from the build, framework
      # free; this one wires the SAME changelog into the two runtimes DataPallas actually
      # ships — spring.liquibase.change-log for Boot, the dbmigration plugin for Grails.
      # Both playgrounds are already scaffolded and both changelogs are empty, so the exercise
      # is a real file in a real product rather than a toy.
      - n: "25"
        slug: migrations-in-spring-and-grails
        title: "Liquibase in Spring Boot and Grails — Migrations That Run at Startup"
        short: "Liquibase in Spring Boot & Grails — run at startup"
        hands_on: ["koan:process:jar", "koan:complete"]
        status: planned
      # SPRING BATCH — added 2026-09-02. This is the episode about what a JOB IS, and it comes
      # BEFORE the three scheduling episodes on purpose: 30, 35, 40 and 45 are all about WHEN
      # something runs, and none of them says anything about what happens INSIDE the run. A
      # reader who schedules a method that loads 500,000 rows has automated a job that cannot
      # survive being interrupted.
      #
      # WHAT IT ACTUALLY BUYS, and all three are things Series 1-3 left open:
      #   - CHUNKS. ItemReader -> ItemProcessor -> ItemWriter with a commit interval. This is
      #     Series 2 · 35 (batching, round trips) and 2 · 40 (streaming, rows held) expressed as
      #     a framework: the chunk size IS the batch size, and the counters from those episodes
      #     are the oracle here. No new machinery, and no stopwatch.
      #   - RESTART. The JobRepository keeps execution state in a database, so a job that died
      #     at chunk 400 resumes at chunk 400 instead of at zero.
      #   - RETRY AND SKIP, per item: faultTolerant().retryLimit(n).retry(...), skipLimit,
      #     skipPolicy. One poisoned row does not have to kill a 500,000-row load.
      #
      # AND THE THING WORTH THE EPISODE ON ITS OWN: a job instance is identified by its name
      # plus its JobParameters, and Spring Batch REFUSES TO RUN A COMPLETED ONE AGAIN —
      # JobInstanceAlreadyCompleteException. That is idempotency enforced by the framework
      # rather than by your SQL, which is a genuinely different answer from the one the
      # excludes hand to ETL & Data Pipelines.
      #
      # IT DOES NOT RE-OPEN THAT EXCLUDE, and the seam is worth writing down because it will be
      # re-argued otherwise:
      #     ETL 1 · 30 / 35   make the WRITE idempotent — MERGE, watermarks, load strategy
      #     HERE              remember WHERE YOU GOT TO and WHAT ALREADY RAN — execution state
      # Orthogonal. A perfect MERGE still needs restart state; Spring Batch still doubles your
      # rows if the writer does a plain INSERT. Say both in one sentence and move on.
      #
      # BE HONEST THAT IT IS HEAVY. Five interfaces, a schema of its own, and a job definition
      # longer than the load it replaces. For a two-hundred-line nightly script it is the wrong
      # answer, and the episode has to say when NOT to reach for it or it becomes an advert.
      # Episode 50 is where that judgement gets tested.
      #
      # THE ONE SERIES 4 EPISODE WITH NO PRODUCT ANCHOR, and that is recorded rather than
      # hidden: JPA, Hibernate, GORM, Liquibase, the crons and the project all point at
      # something DataPallas ships. Spring Batch is not in the product and not in the
      # playground pom. It earns its place on the gap it fills, not on a file we can open.
      #
      # NOT CORE: the spine is SQL-first plain Java, and this is for a reader already in Spring.
      - n: "27"
        slug: spring-batch
        title: "Spring Batch — Jobs That Process Rows in Chunks and Restart Where They Stopped"
        short: "Spring Batch — chunked jobs that restart"
        hands_on: ["koan:count:roundtrips", "koan:process:tool"]
        status: planned
      # APACHE BEAM — added 2026-09-02, PAIRED WITH 27, and it belongs in Series 4 rather than
      # in Series 2 or 3. A first draft put it in Series 2 on the grounds that the DirectRunner
      # needs no cluster. That was an argument about DEPLOYMENT, and this file's test is about
      # CONTROL FLOW — the same test the jOOQ comment at Series 2 · 30 applies:
      #     "It is a LIBRARY, not a framework. You call it; it does not call you. No container,
      #      no lifecycle, no inversion of control."
      # Beam fails every clause. You DECLARE a pipeline and hand it to a RUNNER, and the runner
      # decides when your code executes, on how many threads, in how many instances and in what
      # order. @Setup -> @StartBundle -> @ProcessElement -> @FinishBundle -> @Teardown is a
      # lifecycle, the runner is a container, and your DoFn is a callback. That is more
      # inversion of control than Spring Data has. It is also not the SQL-first position — it
      # is the do-the-work-in-the-JVM position, which is what the spine argues against for
      # set-based work. Series 4 on both tests.
      #
      # THE PAIR IS THE POINT. 27 and 28 are the two answers to "how do I STRUCTURE a data
      # job", and they answer differently:
      #     Spring Batch (27)   chunk-oriented and sequential; your JVM; batch only; restart
      #                         is the JobRepository's job
      #     Beam (28)           a graph of transforms; whichever runner you hand it to; batch
      #                         AND streaming in one model; restart is the runner's problem
      # Simple to machinery, so Spring Batch first. Adjacent numbers are deliberate and are
      # house style for a paired set — Learn SQL Series 2 runs 05, 06 and 08 for the same
      # reason.
      #
      # AND UNLIKE 27, IT HAS A PRODUCT ANCHOR, a strong one: the playground ships
      # src-examples/pipelines with batch and streaming pipelines, JdbcIO, reusable DoFn
      # transforms and a PipelineController that triggers them over HTTP, with three Beam JARs
      # in the pom and @Grab guidance for more connectors. The reader is filling in a folder
      # they already have.
      #
      # IT ALSO CLOSES A DANGLING REFERENCE. Episode 35's koan:author asks the reader to
      # schedule the Beam CustomerIngestionPipeline from that folder, and until now Beam was
      # named nowhere else in this file OR ANYWHERE IN THE ACADEMY. Teaching it here makes 35
      # legitimate instead of a pointer at a hole.
      #
      # TEACH THE MODEL, NOT THE CLUSTER. DirectRunner only. Pipeline, PCollection, PTransform,
      # ParDo and a DoFn, plus TextIO and JdbcIO because those are the two the playground uses.
      # Windowing gets named and deferred: event time, watermarks and late data are a streaming
      # subject and this track has no streaming series. If the episode starts needing runner
      # topology or shuffle to make sense, it has stopped being a Java episode — the same
      # trigger this series' own header sets for the web layer.
      #
      # THE koan:diagnose IS BEAM'S OWN BEST TRAP AND IT IS THIS TRACK'S KIND: a DoFn that
      # caches something in a field. The runner is free to instantiate it many times across
      # many threads and to reuse instances between bundles, so the cached value is stale or
      # shared and the output is quietly wrong. Nothing throws. A reader who writes Java as if
      # it runs once, in order, on one thread will produce exactly this.
      #
      # NOT CORE.
      - n: "28"
        slug: apache-beam
        title: "Apache Beam — Describing a Pipeline Once and Letting a Runner Execute It"
        short: "Apache Beam — a pipeline a runner executes"
        hands_on: ["koan:complete", "koan:diagnose"]
        status: planned
      # SCHEDULING ARRIVES HERE — added 2026-09-02, narrowing the exclude at the top of this
      # file, which used to send the whole subject to Data Ops. What that exclude got right is
      # unchanged: cron, systemd timers and choosing an orchestrator are Data Ops' job. What it
      # missed is that a Spring Boot app uses none of them. It schedules ITSELF, inside a JVM
      # that is already running, and every failure mode is different:
      #
      #   cron forks a fresh process per run.   Spring shares one heap, one pool, one context.
      #   cron overlaps runs by default.        Spring's default scheduler pool is ONE THREAD,
      #                                         so a slow dbt run silently delays everything
      #                                         else on the schedule.
      #   one crontab on one box, one run.      Two app instances, two runs, nobody told you.
      #   stdout and stderr, mailed to you.     A log line, and an exception the framework
      #                                         swallowed.
      #
      # Nothing in the right-hand column exists for cron. That is what makes this a skill and
      # not a second telling, and it is why the Data Ops exclude survives in narrowed form
      # rather than being deleted.
      #
      # IT DOES NOT TRIP THIS SERIES' OWN TRIGGER. The header above says Series 4 stops being a
      # data series if it needs the web layer, security or DI to make sense. Scheduling is none
      # of the three, and the thing being scheduled is the data job Series 1-3 spent forty
      # episodes building. Series 3 · 10 made a job that something ELSE could schedule —
      # arguments, exit codes, a readable log. This makes the app schedule its own.
      #
      # THE COLD OPEN IS A REAL BUG IN OUR OWN PRODUCT. bkend-boot-groovy-playground's
      # BkendApplication is a bare @SpringBootApplication, and @EnableScheduling appears
      # nowhere in the tree. Spring Boot does not turn scheduling on for you — its autoconfigured
      # task scheduler is itself conditional on the bean that @EnableScheduling registers. So
      # the documented ritual (copy crons.groovy, uncomment @Scheduled, rebuild) produces an app
      # that starts clean, logs nothing, and never runs your transform. No error. Both blog
      # posts promise a job that fails loudly; this one fails silently.
      #
      # AND THE KOAN CANNOT USE A CLOCK. This is the episode most likely to break the header's
      # NEVER ASSERT WALL-CLOCK TIME rule, because sleep(2000) then assert-it-ran is the obvious
      # test and exactly the flake that rule exists to forbid. Assert the TRIGGER instead —
      # three ways, all instant, all deterministic:
      #   - CronExpression.parse(expr).next(a fixed instant) is a pure function. It catches
      #     Spring's SIX fields against crontab's five (the same string means different times in
      #     the two), 0 0/15 against */15, and a DST spring-forward.
      #   - ScheduledAnnotationBeanPostProcessor.getScheduledTasks() is EMPTY when
      #     @EnableScheduling is missing. That is the bug above as one assertion, with no clock.
      #   - the one-thread trap is a core pool size, or a latch asserting the ORDER two jobs
      #     interleaved in. Never how long they took.
      #
      # THE REST: fixedRate against fixedDelay against cron, the zone attribute, and moving the
      # expression into application.properties behind ${...} so that changing a schedule is not
      # a rebuild. Closes on what "one JVM" costs — two instances, two runs, and the pointer to
      # a database lock. THAT POINTER IS NOW PAID: episode 40 is the lock, and 45 is the
      # scheduler that does not need one. Leave the cliffhanger in; it is what makes those two
      # episodes land.
      #
      # NOT CORE: the spine is SQL-first data work, and this is a Spring feature.
