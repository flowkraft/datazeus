      # Episode 50 gets you a 200 response. This is every other response.
      # Splitting it out rather than swelling 50 is deliberate: the happy path is a page of
      # code and the failure path is the job, and an episode that teaches both teaches the
      # first one properly and the second one in a footnote.
      # (Both numbers said 40 until 2026-09-02 — stale from an earlier renumbering.)
      #
      # RETRY SAFETY IS THE OTHER HALF, added 2026-09-02 — and REWRITTEN the same day, because
      # the first version of this paragraph was a write-side lesson bolted onto a read-side
      # episode. It talked about retrying a POST and "creating a second order". Nothing in this
      # track ever POSTs to an API: 50 reads, this fetches, and 70's project reads. The TITLE
      # is what caught it — an episode called "Fetching From an API Reliably" cannot have
      # duplicate order creation as its beat. Keep the title; the beat was wrong.
      #
      # THE READ-SIDE VERSION IS BETTER HERE, and it is the same failure class as join fan-out:
      # DUPLICATE AND MISSING ROWS, from a fetch, with nothing thrown.
      #   - retry page 3 of a paginated feed that changed underneath you and you get rows twice
      #     or lose them entirely — and the attempt counter this episode already builds shows
      #     two clean attempts and no error
      #   - OFFSET pagination does it with no retry at all: one row inserted ahead of your
      #     position shifts everything down, so page 2 re-serves a row you already read. A
      #     CURSOR keyed on something stable does not, which is the real reason to prefer it
      #     and a better one than "it is faster"
      # That is why "cursor vs offset paging" is in this episode's constructs, and until now it
      # was there without the reason.
      #
      # THE WRITE SIDE GETS ONE PARAGRAPH, marked as the aside it is, because a data job does
      # occasionally push a result somewhere: GET, PUT and DELETE are idempotent by definition
      # and free to retry; POST is not, and that is what an IDEMPOTENCY KEY is for. Do not let
      # it grow — this track has no episode where the reader writes to an API.
      #
      # EITHER WAY IT IS THE ONLY PART OF IDEMPOTENCY THIS TRACK OWNS, and the excludes say so.
      # The job-level question — does re-running the whole load double the rows — belongs to
      # ETL & Data Pipelines, which spends most of a series on it.
      #
      # The oracle is a counter, reusing the machinery from 2 · 35 — count the ATTEMPTS.
      # "Retried forever" and "gave up immediately" are both wrong and both look identical
      # from the outside; the attempt count separates them, and a fixed-delay retry against a
      # rate limiter is countably worse than exponential backoff.
      # The stub server is the JDK's own com.sun.net.httpserver — no dependency, and it can
      # serve a 500, a 429 with Retry-After, and a paginated sequence on demand.
      - n: "55"
