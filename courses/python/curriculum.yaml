      # ADDED 2026-08-24, to close the last gap against Java & Groovy, which has Series 2 · 60
      # "Virtual Threads and Parallel Streams — Running Slow Calls in Parallel". Python had no
      # answer to it, and the situation is completely ordinary: Series 2 · 20 fetches an API
      # page at a time, and 4,000 pages at 300ms each is twenty minutes of doing nothing.
      #
      # HALF THIS EPISODE IS THE PART THAT DOES NOT WORK, which is why it is worth an episode
      # rather than a paragraph. Threads help I/O and do nothing for a pandas groupby, and the
      # reason is the GIL. A reader who learns "threads make things faster" will reach for them
      # on the wrong problem; the honest version is: threads for waiting, and for CPU work
      # either vectorize it (30), hand it to polars (35), or push it back to SQL.
      #
      # KOAN: the counter already exists — assert on calls issued and on results being complete
      # and correctly attributed. Never on wall-clock time; see conftest.py.
      # NOT core, matching the Java side.
      - n: "32"
