# The ordered episode list for Python for Data. Field docs live in courses/learnsql/curriculum.yaml.
# `short` is omitted until an episode has a video.
#
# The job this track teaches: the half of the data job SQL can't do — read a file nobody
# cleaned, call an API, reshape it, and leave behind a script someone else can run.
# Same Northwind data as the SQL track, so the two reinforce each other instead of competing.

course: learn-python
track: python
title: Python for Data

# Assumes Learn SQL, and the track has always said so without declaring it: Series 1 · 25 is
# titled "The SQL Ideas You Know, in Python Syntax", Series 1 · 30 is "GROUP BY Without the
# Database", and Series 2 · 10 queries PostgreSQL. A dependency that is stated in episode
# titles and nowhere a reader can see is how someone concludes they are not ready.
#
# Sibling of Data Modeling and Java & Groovy, not a sequence: all three start after Learn SQL
# Series 1 and none of them needs the others.
prerequisites:
  - course: learn-sql
    needs: "Series 1"
    why: >-
      Half of this track is the same ideas in another syntax — filter, group, join — taught
      against the same Northwind data, so the two reinforce each other instead of competing.
      You are never asked to write clever SQL here, but from Series 2 onward you query a real
      database from Python and have to know what the answer should be.

# Reviewed 2026-08-24. The first three lines were accurate but this was the ONLY one of the
# four tracks with no cross-reference to its siblings — and Python is the track that needs
# them most, because "learn Python" is the vaguest phrase in the academy. Two readers arrive
# here wanting completely different things (a web developer and an analyst), and the sibling
# tracks share four subjects with this one under the same keyword.
excludes:
  - topic: "Machine learning — features, training, model selection"
    where: "not covered; this track is about moving and shaping data. For LLM-era work see AI for Data"
  - topic: "Charts other people read, and dashboards"
    where: "covered in BI & Data Visualization — here you plot only to see the data yourself"
  - topic: "Scheduling, cron and running jobs in production"
    where: "covered in Data Ops — this track gets the script ready to be scheduled"
  # The wrong expectation somebody arrives with. Django and FastAPI are what most of the
  # internet means by "learn Python", and a reader who wants them should find that out on
  # this page rather than in Series 2.
  - topic: "Web apps and web APIs — Django, Flask, FastAPI"
    where: "not covered anywhere in the academy; this is Python for people who move data, not people who serve it"
  # The question a reader in front of two sibling tracks actually asks. Saying nothing lets
  # them conclude one is a lesser version of the other — they are the same job twice.
  - topic: "Whether to learn this or Java & Groovy for Data"
    where: "neither is a prerequisite for the other — same job, two languages. Pick the one your team already runs; the projects in both tracks are deliberately identical so the second one is short"
  # Three reciprocal halves. Each shares a word with another track and is a different question,
  # which is exactly how a reader concludes we repeated ourselves.
  - topic: "Designing the schema you are loading into"
    where: "covered in Data Modeling — here the tables already exist and your job is to fill them correctly"
  - topic: "Writing the SQL itself — joins, window functions, tuning"
    where: "covered in Learn SQL. In this course you only send SQL you already know, and Series 2 · 05 and Series 3 · 30 are about deciding what runs in the database rather than in pandas"
  - topic: "Running the same job every night — watermarks, incremental loads, backfills, orchestration"
    where: "covered in ETL & Data Pipelines, which is what happens when a job has to run for a year. In this course, Series 3 gets one correct, tested, repeatable run"

series:
  - slug: series1-python-fundamentals
    title: Python for Data Fundamentals
    tagline: from zero to a script that moves data
    level: beginner
    episodes:
      - n: "00"
