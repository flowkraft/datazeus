      # SERIES 1 PROJECT. The series had none until 2026-08-24, which meant the core path
      # walked ten episodes and had nothing to show for them. Not a new exercise: everything
      # from this series, on one messy file, checked against a number you can verify by hand.
      - n: "45"
        slug: first-end-to-end-script
        title: "Project — From a Messy CSV to a Clean Table"
        hands_on: ["koan:author"]
        dataset: messy
        core: true
        tags: ["project"]
        status: planned

  - slug: series2-real-data
    title: Working With Real Data
    tagline: files, databases and APIs — nothing pre-cleaned
    level: intermediate
    episodes:
      - n: "00"
        slug: csv-json-parquet
        title: "CSV, JSON & Parquet — Choosing a File Format, and Why Parquet Usually Wins"
        hands_on: ["koan:choose", "jupyter"]
        dataset: generated
        core: true
        status: planned
      # ADDED 2026-08-24. Java & Groovy has had Series 2 · 05 "Excel with POI" since the start,
      # with the note "the real list is .xlsx, and a reporting company that cannot read one is
      # not credible" — and Python, the language where reading one is a single line, had
      # nothing. That asymmetry was indefensible in the track people will actually reach for
      # when a spreadsheet lands in their inbox.
      #
      # NOT core, matching the same call on the Java side: whether you need Excel is decided by
      # your employer, not by the craft. Numbered 02 rather than renumbering the series, the
      # same way Learn SQL carries 06 and 08.
      #
      # DATASET: generated, not messy — and this is the interesting part. Excel's characteristic
      # defects CANNOT be expressed in a CSV: merged header cells, a title row above the real
      # header, a date stored as the serial number 45123, and a number stored as text with a
      # leading apostrophe. So the defects are authored in a GENERATOR script (reviewable text,
      # tier 3) and the .xlsx is built from it. Committing a binary .xlsx would have broken
      # tier 2's whole rationale, which is that a reviewer can see the defect in a diff.
      - n: "02"
        slug: excel-files
        title: "Excel Files — Reading the Spreadsheets Your Business Sends You"
        hands_on: ["koan:predict", "koan:diagnose"]
        dataset: generated
        status: planned
      - n: "05"
        slug: duckdb-from-python
        title: "DuckDB from Python — Run SQL on Files and DataFrames, No Server"
        hands_on: ["koan:complete"]
        dataset: northwind
        core: true
        status: planned
      - n: "10"
        slug: databases-from-python
        title: "psycopg & SQLAlchemy Core — Querying PostgreSQL from Python"
        hands_on: ["koan:complete"]
        dataset: northwind
        core: true
        status: planned
      - n: "15"
        slug: parameterized-queries
        title: "Parameterized Queries — Passing Values Safely Into a Query"
        hands_on: ["koan:predict", "koan:complete"]
        dataset: northwind
        core: true
        status: planned
      - n: "20"
        slug: apis-and-json
        title: "HTTP APIs & JSON — Fetching Data With Pagination, Retries and Rate Limits"
        hands_on: ["koan:complete", "koan:count:queries"]
        dataset: api-stub
        core: true
        status: planned
      - n: "25"
        slug: dates-and-timezones
        title: "Dates, Times & Time Zones — Storing and Comparing Moments Correctly"
        hands_on: ["koan:predict"]
        dataset: messy
        core: true
        status: planned
      # ADDED 2026-08-24. The track had no episode on string work, which is a large and boring
      # fraction of every real data job: trailing spaces that break a join, "GmbH" vs "gmbh",
      # one column holding "Lastname, Firstname", an invoice number buried in a free-text note,
      # and "1.234,56" that has to become a number.
      #
      # NOT the same episode as 30. Two different questions that both get called "cleaning":
      #   here    the value is repairable — normalise it so it joins and sums correctly
      #   at 30   the value is NOT repairable — decide whether to reject the row or fail the job
      # Placed between parsing dates (25) and validation (30) so the series reads parse → repair
      # → decide, which is the order the work actually happens in.
      #
      # CORE, unlike Excel: nobody escapes string cleaning, whatever their employer sends them.
      - n: "27"
        slug: text-cleaning
        title: "Text Cleaning — Trimming, Splitting and Matching Messy Strings"
        hands_on: ["koan:complete", "koan:diagnose"]
        dataset: messy
        core: true
        status: planned
      - n: "30"
