# The ordered episode list for Python for Data. Field docs live in courses/learnsql/curriculum.yaml.
# `short` is omitted until an episode has a video.
#
# The job this track teaches: the half of the data job SQL can't do — read a file nobody
# cleaned, call an API, reshape it, and leave behind a script someone else can run.
# Same Northwind data as the SQL track, so the two reinforce each other instead of competing.

course: learn-python
track: python
title: Python for Data

excludes:
  - topic: "Machine learning — features, training, model selection"
    where: "not covered; this track is about moving and shaping data. For LLM-era work see AI for Data"
  - topic: "Charts other people read, and dashboards"
    where: "covered in BI & Data Visualization — here you plot only to see the data yourself"
  - topic: "Scheduling, cron and running jobs in production"
    where: "covered in Data Ops — this track gets the script ready to be scheduled"

