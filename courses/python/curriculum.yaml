        title: "Your First Script — Read a CSV File and Answer One Question About It"
        hands_on: ["koan:author", "jupyter"]
        dataset: messy
        core: true
        status: planned
      # "The Four Types Data Work Runs On" until 2026-08-24 — the last aphorism left in the
      # track's titles. `Runs On` is a metaphor; the rule is plain English about data.
      - n: "05"
        slug: types-and-collections
        title: "Strings, Numbers, Lists & Dicts — The Four Types You Use in Every Script"
        hands_on: ["koan:complete", "jupyter"]
        dataset: none
        core: true
        status: planned
      - n: "10"
        slug: loops-conditionals-functions
        title: "Loops, Conditionals & Functions — Doing the Same Work Over Many Rows"
        hands_on: ["koan:complete", "koan:predict"]
        dataset: none
        core: true
        status: planned
      - n: "15"
        slug: files-and-encodings
        title: "Files, Paths & Encodings — Reading and Writing Text in the Right Encoding"
        hands_on: ["koan:predict", "koan:diagnose"]
        dataset: messy
        core: true
        status: planned
      - n: "20"
        slug: dataframes
        title: "DataFrames — pandas and polars, and Which to Reach For"
        hands_on: ["koan:choose", "jupyter"]
        dataset: northwind
        core: true
        status: planned
      - n: "25"
        slug: select-filter-sort
        title: "Select, Filter & Sort — The SQL Ideas You Know, in Python Syntax"
        hands_on: ["koan:complete", "jupyter"]
        dataset: northwind
        core: true
        status: planned
      - n: "30"
        slug: groupby-and-aggregate
        title: "groupby & Aggregate — GROUP BY Without the Database"
        hands_on: ["koan:complete", "koan:diagnose"]
        dataset: northwind
        core: true
        status: planned
      - n: "35"
        slug: merge-and-join
        title: "merge & join — Combining Two DataFrames on a Key"
        hands_on: ["koan:predict", "koan:diagnose"]
        dataset: northwind
        core: true
