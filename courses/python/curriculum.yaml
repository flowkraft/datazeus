        title: "Cleaning & Validation — Types, Ranges and Rows You Should Reject"
        hands_on: ["koan:diagnose", "koan:complete"]
        dataset: messy
        core: true
        status: planned
      - n: "35"
        slug: reshaping
        title: "pivot, melt & Reshape — Moving Data Between Wide and Long"
        hands_on: ["koan:complete", "jupyter"]
        dataset: northwind
        status: planned
      - n: "40"
