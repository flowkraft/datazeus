        status: planned
      # SERIES 2 PROJECT, added with Series 1's. This series is the heart of the track —
      # files, a database and an API — and it had no episode that assembled them.
      # Deliberately the same shape as Java & Groovy Series 2's project: three sources, one
      # answer, reconciled. A reader who has done both tracks should recognise it, and that
      # recognition is the point — the job is the same, the language is not.
      - n: "50"
