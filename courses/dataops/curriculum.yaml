# The ordered episode list for Data Ops — the SINGLE source of truth for this roadmap.
# Field documentation lives in courses/learnsql/curriculum.yaml.
#
# `short` is omitted throughout: it's the label for a video's roadmap card, and none of
# these episodes has a video yet. Add it per episode when the video is produced.
#
# The job this track teaches: keep the thing running. Series 1 is the terminal a data
# person actually lives in, Series 2 is the database underneath everything, Series 3 is
# what happens when a nightly job dies at 3 a.m.

course: learn-data-ops
track: dataops
title: Data Ops

excludes:
  - topic: "Writing and tuning the queries themselves"
    where: "covered in Master SQL, Series 3 — EXPLAIN, indexes and the tuning capstone"
  - topic: "Row-level data quality, dedup & conformance"
    where: "covered in Learn ETL & Data Pipelines — here we watch whether the pipeline ran at all"
  - topic: "Schema design & normalization"
    where: "covered in Learn Data Modeling; this track only migrates a schema safely"

series:
  - slug: series1-linux-for-data
    title: Linux for Data
    tagline: the terminal, and why you end up living in it
    level: beginner
    episodes:
      - n: "00"
        slug: why-the-terminal
        title: "The Terminal — Why One Pipe Answers a Data Question Faster Than a GUI"
        status: planned
      - n: "05"
