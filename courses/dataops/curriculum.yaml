      # THE HONEST FRAME, said plainly: using it for data jobs is a CI server used as a job
      # runner. That is not a mistake. An existing, backed-up, access-controlled box beats a new
      # one you have to operate. But it is a trade, and the reader should be able to name both
      # halves out loud.
      # WHAT DATA TEAMS ACTUALLY USE IT FOR:
