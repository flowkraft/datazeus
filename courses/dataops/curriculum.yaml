      # SERIES 2 PROJECT, added 2026-08-24. The series had none: the core path
      # walked ten episodes with nothing built at the end of them.
      # The one exercise that needs everything in Series 2 at once: a transaction, a lock, an index
      # build, and a second session that must keep working throughout. Graded by that session.
      - n: "50"
        slug: project-migrate-without-blocking
        title: "Project — Migrate a Live Table Without Blocking Anyone"
        hands_on: ["koan:concurrent", "koan:author"]
        core: true
        tags: ["project"]
        status: planned
  - slug: series3-reliability
    title: Reliability
    tagline: what happens when the nightly job dies at 3 a.m.
    level: advanced
    episodes:
      - n: "00"
        slug: scheduling-at-scale
        title: "Scheduling at Scale — Choosing Between cron, systemd Timers and an Orchestrator"
        hands_on: ["koan:choose", "rundeck"]
        core: true
        status: planned
      - n: "05"
        slug: logging-and-structured-output
        title: "Logging & Structured Output — Make a Failure Readable at 3 a.m."
        hands_on: ["koan:capture"]
        core: true
        status: planned
      - n: "10"
        slug: monitoring-and-metrics
        title: "Monitoring & Metrics — Watch Postgres, Disk and Job Health"
        hands_on: ["koan:complete"]
        status: planned
      # SOURCE (google-sre): ERROR BUDGETS and alerting on symptoms rather than causes.
      - n: "15"
        slug: alerting-and-on-call
        title: "Alerting & On-Call — Page a Human Only When It Matters"
        tags: ["google-sre"]
        credits:
          - source: google-sre
            concept: "ERROR BUDGETS and alerting on symptoms rather than causes"
        hands_on: ["eyes"]
        status: planned
      - n: "20"
        slug: freshness-and-volume-checks
        title: "Freshness & Volume Checks — Catch a Pipeline That Silently Stopped"
        hands_on: ["koan:diagnose", "koan:complete"]
        core: true
        status: planned
      # SOURCE (google-sre): The BLAMELESS POSTMORTEM, and what a useful one contains.
      - n: "25"
        slug: incident-response
        title: "Incident Response & Postmortems — Diagnose, Fix, Write It Down"
        tags: ["google-sre"]
        credits:
          - source: google-sre
            concept: "The BLAMELESS POSTMORTEM, and what a useful one contains"
        hands_on: ["koan:capture"]
        status: planned
      - n: "30"
        slug: containers-for-data-jobs
        title: "Containers for Data Jobs — Compose, Images & Runs You Can Reproduce"
        hands_on: ["koan:process:tool", "koan:rerun"]
        core: true
        status: planned
      # ALSO OWNS THE DELETION REQUEST, which belongs beside retention because both are the
      # same subject: data that has to go away, on a deadline.
      #   RETENTION is the scheduled version — TTL, partition drops, "we keep 24 months".
      #   A DELETION REQUEST is the unscheduled one: a named person asks to be removed, and
      #   the clock is legal rather than operational.
      #   WHY IT IS HARD, and this is the teaching point: the row is never in one place. It is
      #   in the OLTP table, the staging copy, last night's extract, the warehouse fact, three
      #   materialized views, a backup, and somebody's CSV on a laptop. Deleting the first one
      #   and calling it done is the common failure.
      #   WHAT ACTUALLY WORKS: know where personal columns live before you are asked (Data
      #   Modeling, Series 2 - 27 classifies them), have a documented list of every copy, and
      #   prefer ONE deletion procedure you rehearse over a heroic search each time.
      #   BACKUPS ARE THE HONEST PROBLEM — you usually cannot surgically edit one. Say what
      #   real teams do instead: age them out, and record that you did.
      # NOT legal advice; name whoever owns compliance where the reader works.
      - n: "35"
        slug: capacity-and-retention
        title: "Capacity, Storage & Retention — Disk, Partitions and TTL"
        hands_on: ["koan:count:scanned"]
        status: planned
      - n: "40"
        slug: cost-control
        title: "Cost Control — Compute, Storage and Where the Money Goes"
        hands_on: ["koan:choose"]
        status: planned
