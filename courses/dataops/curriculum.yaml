      # ADDED 2026-09-03. RUNDECK WAS ALREADY A TOOL IN THIS TRACK — it is the hands_on tool on
      # Series 1 · 40, on 3 · 00 above, and on the Series 3 project — and no episode ever taught
      # it. The track demonstrated in a tool the reader had never been introduced to.
      # 3 · 00 is the CHOICE episode: cron, systemd timers, or an orchestrator. This is what the
      # word "orchestrator" actually is, once.
      #
      # THIS IS A TOOL PRESENTATION, NOT A MANUAL. The reader should finish able to say what
      # Rundeck is, whether their team wants one, and to have had it running for ten minutes.
      # They should NOT finish having been walked through every screen. Depth belongs to the
      # official docs and this episode should say so and link there.
      # WHAT IT IS, in one line worth memorising: a web front end that runs your existing
      # scripts on your existing machines, and keeps a record.
      # WHAT DATA TEAMS ACTUALLY USE IT FOR — this is the middle of the episode:
      #   THE OPERATOR BUTTON   someone who is not you reruns last night's failed load, without
      #                         an SSH key for production. This is the reason it is installed in
      #                         most shops that have it.
      #   A LOG PER RUN         output kept per execution and readable next week. Under cron it
      #                         went to mail nobody reads, which is why nobody looked.
      #   WHO MAY DO WHAT       an ACL over run, view and edit.
      #   THE FAN-OUT           the same job across a list of nodes over ssh, which cron on one
      #                         box cannot express at all.
      #   SCHEDULE + NOTIFY     the cron half you already have, plus retry and a failure alert.
      # TRY IT: docker run the official image, add one job that wraps a two-line script, run it
      # from the browser, look at the execution log. That is the whole exercise — Series 1 · 37
      # already taught the docker run, so this costs the reader nothing new.
      # THE PRINCIPLE THAT OUTLIVES THE TOOL, and it is what makes this an episode rather than
      # an advertisement: A SCHEDULER RUNS A JOB; AN ORCHESTRATOR MAKES IT OPERABLE. Those five
      # capabilities are the lesson and they are equally true of Airflow or Jenkins. Rundeck is
      # the demonstration, and a reader who ends up with a different tool has still learnt what
      # to look for in it.
      # ONE WARNING, kept short: credentials belong in Key Storage, not in the job definition,
      # because job definitions get exported to git.
      - n: "02"
        slug: rundeck
        title: "Rundeck — What It Is, What Data Teams Use It For, and Running One in Docker"
        hands_on: ["koan:process:tool", "rundeck"]
        core: true
        status: planned
      # ADDED 2026-09-03. Jenkins appeared NOWHERE in the academy before this, which is hard to
      # defend: it is the single most common thing a data job is actually scheduled on inside a
