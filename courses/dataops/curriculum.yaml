# The ordered episode list for Data Ops — the SINGLE source of truth for this roadmap.
# Field documentation lives in courses/learnsql/curriculum.yaml.
#
# `short` is omitted throughout: it's the label for a video's roadmap card, and none of
# these episodes has a video yet. Add it per episode when the video is produced.
#
# The job this track teaches: keep the thing running. Series 1 is the terminal a data
# person actually lives in, Series 2 is the database underneath everything, Series 3 is
# what happens when a nightly job dies at 3 a.m.

course: learn-data-ops
track: dataops
title: Data Ops

# Assumes Learn SQL, and nothing else. Deliberately the shallowest prerequisite in the academy:
# this is the track somebody reaches for when the nightly job is already broken, and a long
# prerequisite list at that moment is just a reason to give up and restart the server.
prerequisites:
  - course: learn-sql
    needs: "Series 1"
    why: >-
      Series 2 is PostgreSQL under load — transactions, locks, MVCC. You need to be able to
      write and read the queries you are watching block each other.

excludes:
  - topic: "Writing and tuning the queries themselves"
    where: "covered in Learn SQL, Series 3 — EXPLAIN, indexes and the query-tuning project"
  - topic: "Row-level data quality, dedup & conformance"
    where: "covered in Learn ETL & Data Pipelines — here we watch whether the pipeline ran at all"
  - topic: "Schema design & normalization"
    where: "covered in Learn Data Modeling; this track only migrates a schema safely"

  # The wrong expectation somebody arrives with. "DataOps" reads like "DevOps" and it is not.
  - topic: "Kubernetes, Terraform and cloud provisioning"
    where: "not covered; this track is the machine, the database and the job — the things a data person is actually handed"
  - topic: "Python as a language for writing the jobs"
    where: "covered in Python for Data. In this course, Series 1 is the shell tools you reach for when there is no Python on the box"
  - topic: "Building the pipeline's logic"
    where: "covered in ETL & Data Pipelines — here it already exists and has to keep running"

  - topic: "Expressing a pipeline as a DAG of dependent steps"
    where: "covered in ETL & Data Pipelines, Series 2 · 45, which is how a pipeline expresses its own dependencies. In this course, Series 3 · 00 is choosing what runs it and keeping that thing alive"

series:
  - slug: series1-linux-for-data
    title: Linux for Data
    tagline: the terminal, and why you end up living in it
    level: beginner
    episodes:
      - n: "00"
        slug: why-the-terminal
        title: "The Terminal — Why One Pipe Answers a Data Question Faster Than a GUI"
        hands_on: ["koan:capture", "terminal"]
        core: true
        status: planned
      - n: "05"
        slug: files-and-navigation
        title: "Files, Paths & Navigation — Where Your Data Actually Lives"
        hands_on: ["koan:complete", "terminal"]
        core: true
        status: planned
      - n: "10"
        slug: look-at-data-without-a-database
        title: "cat, less, head, tail & wc — Look at Data Without a Database"
        hands_on: ["koan:capture"]
        core: true
        status: planned
      - n: "15"
        slug: pipes-and-redirection
        title: "Pipes & Redirection — Compose Tiny Tools into a Pipeline"
        hands_on: ["koan:capture", "koan:author"]
        core: true
        status: planned
      - n: "20"
        slug: cut-grep-sort-uniq
        title: "cut, grep, sort & uniq — Slice Columns and Rows on the Command Line"
        hands_on: ["koan:capture", "koan:complete"]
        core: true
        status: planned
      - n: "25"
        slug: sed-and-awk
        title: "sed & awk — Reshape CSV and TSV Text Streams"
        hands_on: ["koan:capture", "koan:complete"]
        core: true
        status: planned
      - n: "30"
        slug: ssh-scp-rsync
        title: "ssh, scp & rsync — Move Data Between Machines"
        hands_on: ["koan:process:tool"]
        status: planned
      # ADDED 2026-08-24. THE most common thing a data person is actually blocked by, and Series 1
      # taught ssh and cron without ever teaching it. Teaching how to schedule a job before
      # teaching how to reach the database the job needs is backwards.
      # THE SKILL: five failures that look identical from the application and are not —
      # wrong host, closed port, firewall drop (hangs) vs refused (fails fast), bad
      # credentials, TLS required. Read the error, then narrow it: ping, then the port, then
      # psql, then the driver. Whoever can do this saves a team an afternoon a week.
      # KOAN: `diagnose` on real error text — each message maps to exactly one cause, and
      # `capture` because the skill IS reading what was printed.
      # Placed at 32, right after ssh/scp/rsync (30), because it is the same subject:
      # getting to a machine that is not yours.
      - n: "32"
        slug: when-you-cannot-connect
        title: "Connection Failures — Host, Port, Firewall, Credentials and TLS"
        hands_on: ["koan:diagnose", "koan:capture", "terminal"]
        core: true
        status: planned
      - n: "35"
        slug: permissions-and-environment
        title: "Permissions, Users & Environment Variables — Secrets a Job Can Read"
        hands_on: ["koan:capture", "koan:diagnose"]
        core: true
        status: planned
      - n: "40"
        slug: cron-and-systemd-timers
        title: "cron & systemd Timers — Turn a Script into a Nightly Job"
        hands_on: ["koan:process:tool", "rundeck"]
        core: true
        status: planned
      - n: "45"
        slug: bash-glue
        title: "Bash Glue — Variables, Loops, Exit Codes & Logging for ETL"
        hands_on: ["koan:author", "koan:capture"]
        core: true
        status: planned

      # SERIES 1 PROJECT, added 2026-08-24. The series had none: the core path
      # walked ten episodes with nothing built at the end of them.
      # cut/grep/sort/awk/cron, composed once. The point is not that you would ship this — it is that
      # you can read and fix the one already running on the server you inherited.
      - n: "50"
        slug: project-nightly-job-in-shell
        title: "Project — A Nightly Job Written Only With Shell Tools"
        hands_on: ["koan:author", "koan:capture"]
        core: true
        tags: ["project"]
        status: planned
