  - slug: series6-rook-and-choosing
    title: Rook, and Choosing Between the Three
    tagline: Ceph operated by Kubernetes, and the minimum that gets you what you need
    level: advanced
    episodes:
      # COVER: what Rook is, stated precisely because the name misleads. IT IS AN OPERATOR, NOT A
      # STORAGE SYSTEM. The storage is Ceph. Rook watches custom resources and runs cephadm's job
      # for you — placing monitors and OSDs, reconciling the cluster you declared.
      # SO THIS SERIES ASSUMES Storage for Data's Ceph series and re-teaches none of it: no CRUSH,
      # no min_size, no placement groups. If a reader does not know what an OSD is, they are in
      # the wrong series and should be told so in the first paragraph.
      # WHAT ROOK CHANGES: the cluster is now a Kubernetes object, so it is declarative,
      # version-controlled and reconciled — and its failures are now ALSO Kubernetes failures,
      # which means two sets of logs and two mental models when something breaks.
      - n: "00"
        slug: what-rook-is
        title: "Rook Is an Operator, Not a Storage System — the Storage Is Ceph"
        hands_on: ["koan:predict", "koan:capture"]
        core: true
        status: planned
      # COVER: the CephCluster resource as the declaration — which nodes, which devices, how many
      # monitors — and the reconciliation loop that makes it real. Reading the operator's logs,
      # which is where a cluster that never becomes ready explains itself.
      # THE PREREQUISITES THAT DECIDE SUCCESS: raw, unformatted devices. Rook will not take a
      # disk with a filesystem on it, and "the disk is right there" is the commonest reason a
      # first attempt produces no OSDs at all.
      # THE COMPARISON WORTH ONE LINE: Storage for Data, Series 4 · 15 bootstrapped the same
      # thing with cephadm. Same Ceph, different control plane.
      - n: "05"
        slug: the-cephcluster-crd
        title: "The CephCluster Resource — Declaring a Cluster, and Why It Found No Disks"
        hands_on: ["koan:complete", "koan:diagnose"]
        core: true
        status: planned
      # COVER: the three interfaces as Kubernetes objects — CephBlockPool behind a StorageClass
      # for RBD, CephFilesystem for ReadWriteMany, and CephObjectStore for an in-cluster S3
      # endpoint with a bucket claim.
      # THE PAYOFF FOR A DATA READER, and it closes a loop this course opened: Series 2 · 15 said
      # a data job usually wants object storage rather than a volume. CephObjectStore is that
      # object storage, inside your own cluster, speaking the API Storage for Data, Series 3
      # taught. The same client, unchanged, again.
      # AND THE HONEST NOTE: all three from one cluster is Ceph's argument. If you only wanted
      # one of them, 20 is the episode that says so.
      - n: "10"
        slug: three-interfaces-as-objects
        title: "CephBlockPool, CephFilesystem and CephObjectStore — Storage as Manifests"
        hands_on: ["koan:complete", "koan:choose"]
        core: true
        status: planned
      # COVER: running it. The toolbox pod as the way to reach `ceph status` and `ceph health
      # detail` from inside the cluster — everything Storage for Data, Series 4 · 40 and 4 · 50
      # taught, now one kubectl exec away.
      # THE TWO-MENTAL-MODELS PROBLEM, which is this series' real operational lesson: a problem is
      # either a Ceph problem or a Kubernetes problem, and the symptom rarely says which. A pod
      # stuck ContainerCreating on a volume can be a CSI issue, a scheduling issue, or a
      # HEALTH_ERR cluster. THE ORDER TO CHECK: ceph status first, then the operator log, then
      # the pod events — because the innermost failure explains the outer ones.
      # UPGRADES: TWO LADDERS, the Rook version and the Ceph version, upgraded separately and in
      # a supported order. Getting this wrong is the incident this episode prevents.
      - n: "15"
        slug: operating-rook
        title: "Operating Rook — Two Sets of Logs, and Two Version Ladders"
        hands_on: ["koan:diagnose", "koan:process:tool"]
        core: true
        status: planned
      # THE CLOSING DECISION EPISODE, and the one the whole storage block builds to. Nine other
      # courses in this academy end this way, before the project.
      # WALK THE LADDER DOWNWARDS and make the reader name their rung:
      #   YOU ARE ON A MANAGED CLOUD    use the provider's CSI driver. It is maintained by
      #                                 somebody else and it is almost always the right answer.
      #                                 None of these three should be installed to replace it.
      #   YOUR JOB WANTS OBJECT STORAGE a bucket, and no volume at all. Series 2 · 15 said this
      #                                 first and it is still true after three series of volumes.
      #   YOUR DATABASE REPLICATES ITSELF   OpenEBS Local PV. Fast disk, no double replication.
      #   YOU NEED A REPLICATED VOLUME AND SIMPLICITY   Longhorn. You can read the replicas.
      #   YOU NEED BLOCK AND FILE AND OBJECT, AT SCALE, AND SOMEBODY OWNS IT   Rook and Ceph.
      # THE QUESTION THAT DECIDES THE LAST ONE is the same one Storage for Data, Series 4 · 58
      # asks and it does not get easier inside Kubernetes: is there a named person whose job
      # includes this cluster? An operator automates the running, not the understanding.
      # THE RULE THE BLOCK CLOSES ON: USE THE MINIMUM THAT GETS YOU WHAT YOU ACTUALLY NEED.
      # Storage you did not need is not neutral — it is a rebuild during every node drain, a
      # second version ladder at every upgrade, and one more thing that can be the reason a pod
      # will not start.
      - n: "20"
        slug: choosing-between-them
        title: "Longhorn, OpenEBS or Rook — and the Case for None of Them"
        hands_on: ["koan:choose", "koan:capture"]
        core: true
        status: planned
