  # RENAMED TWICE ON 2026-09-02, and the second rename corrects the first. Both attempts are
  # recorded because the pair is more instructive than either.
  #
  # IT WAS "Production Data Flow". Wrong, because it promised OPERATIONS this series does not
  # have — no monitoring, no alerting, no on-call, no scheduling — and the course's own
  # excludes hand all of that to Data Ops ("cron internals, monitoring, alerting and on-call").
  # A title claiming a subject its own course has excluded is the worst kind of wrong: a reader
  # looking for production operations stops here and finds none.
  #
  # THEN IT WAS "Loading a Warehouse". Also wrong, in the opposite direction — too NARROW.
  # Only three of the ten episodes are actually about a warehouse (05 star schema, 10 SCD Type
  # 2, 45 the project). Backfills, idempotent MERGE at scale, contracts and lineage, and bulk
  # loading are not warehouse topics at all; they are what any load needs once it is real. The
  # fix threw out the accurate half of the old name along with the inaccurate half.
  #
  # AND IT MADE AN EPISODE LOOK MISPLACED THAT IS NOT. 20 ("Streaming vs Batch") reads as an
  # intruder in a series called "Loading a Warehouse" and reads as a natural consequence in one
  # about loading generally — 15 teaches a technique that raises the question, 20 answers it.
  # The episode never moved; the name shrank around it.
  #
  # SO: "Loading at Production Volume". "Loading" scopes it, which is what stops "production"
  # being misread as monitoring and on-call — that was the whole failure of the first name.
  # "Volume" is what actually unifies backfills, MERGE at scale, throughput and observability:
  # they are the things a load needs when it stops being a demo.
  #
  # THE TAGLINE NEVER CHANGED THROUGH ANY OF THIS, and that is the tell — it was accurate all
  # along, and only the titles were drifting.
  #
  # ── WHY 15 AND 20 ARE IN THIS SERIES AND NOT IN SERIES 4 ────────────────────────────────
  # Asked three separate times on 2026-09-02, which is enough evidence that it will be asked
  # again. Both episodes have "stream" in them and Series 4 is called Streaming Pipelines, so
  # the instinct to move them is reasonable. Do not act on it.
  #
  # THE AXIS IS NOT "IS A STREAM MENTIONED". IT IS "DOES YOUR PIPELINE END".
  #     Series 3   pipelines with RUNS. They start, they finish, and you count what went in
  #                and what came out.
  #     Series 4   pipelines with NO END. State must be kept, windows must close, and someone
  #                has to decide when an answer is final.
  #
  # 15 (CDC): the FEED is unbounded — log-based CDC reads the WAL, and that is a stream by
  # episode 20's own definition. But YOUR JOB IS NOT. Nothing in the episode needs state,
  # windows or watermarks: read from the last offset, apply, stop. That is a run. Moving it to
  # Series 4 would mean either teaching it with machinery it does not require, or leaving a
  # batch episode inside the streaming series — which is worse, because it breaks the only
  # rule that series has. It also has a job here: 10 is SCD Type 2, and CDC is how the changes
  # that Type 2 history stores are captured. Capture, then store.
  #
  # 20 (the decision): IT IS THE GATE, AND A GATE GOES BEFORE THE DOOR. Its entire value is
  # for the reader whose answer is NO — someone has asked them for "real-time" and they need
  # to work out that a fifteen-minute batch would do. Inside Series 4 it would only ever be
  # opened by people who had already decided yes, and the reader who most needed it would
  # never see it. It is also CORE and Series 4 is 0-core, so filing it there would put the one
  # core episode at the head of an optional series.
  #
  # THE DECISION EPISODE WAS MOVED FROM 20 TO 42 ON 2026-09-02, after first being rejected on
  # a cost estimate that turned out to be wrong. Both halves are recorded because the mistake
  # is the useful part.
  #
  # THE ESTIMATE WAS "thirty-seven careful edits across five courses". It is true that five
  # courses cite this episode by number, and true that "Series 3 · 20" is NOT a unique address
  # in this academy — it also names Java & Groovy's Liquibase episode, Learn SQL's EXPLAIN,
  # Data Warehousing's lakehouse and Data Modeling's own, so a blind find-and-replace corrupts
  # four other courses. All of that was right.
  #
  # WHAT WAS WRONG: about thirty of those references live in GENERATED briefs and all came
  # from ONE template string in the brief generator. They were a single edit and a
  # regeneration, not thirty hand-edits. The real cost was that one string, three prerequisite
  # blocks, and a handful of comments.
  #
  # WHAT ACTUALLY GUARDS THIS, and what does not:
  #   CurriculumSpec resolves a course-qualified reference against THAT course, and a bare one
  #   inside a prerequisite against the course being required — so a stale pointer in
  #   `excludes` or `prerequisites` FAILS THE BUILD. That is how the three prerequisite blocks
  #   in Beam, Flink and Kafka were caught.
  #   It does NOT read YAML comments or _todo briefs, which is where most references live.
  #   Those were re-read by eye, and the spec's own rule says exactly why: "Renumbering a
  #   series means re-reading every reference into it, by eye."
  #
  # IF ANYTHING IN THIS SERIES IS RENUMBERED AGAIN: rewrite only occurrences that explicitly
  # say "ETL" or "ETL & Data Pipelines", plus the prerequisite blocks in Apache Beam, Apache
  # Flink and Apache Kafka, plus the generator template. Everything else means another course.
  - slug: series3-loading-at-production-volume
    title: Loading at Production Volume
    tagline: load a star schema, track changes, and re-run a whole month
    level: advanced
    episodes:
      # THIS IS NOW WHERE THE ETL/ELT DECISION IS MADE — moved here 2026-09-02 from Series
      # 1 · 00, which asked for it before the reader had loaded anything. By this point they
      # have built a pipeline, staged it, transformed it, made it re-runnable and scheduled it,
      # and in a moment they will load a star schema. NOW the question means something:
      #     does the transform run on the way IN, or does raw land first and the warehouse do
      #     the work?
      # Teach the trade honestly — pushing down buys warehouse compute, set-based speed and
      # SQL a team can read; it costs you a warehouse bill and it moves raw data somewhere it
      # may not be allowed to sit. Series 1 · 00 only NAMES the two shapes; the decision is here.
      #
      # RETITLED to match. "ELT — Push the Transform Down into the Warehouse" described only
      # one of the two answers, which is a poor name for the episode that chooses between them.
      - n: "00"
