      # RETITLED 2026-09-02, and for two reasons rather than one. It was "Change Data Capture —
      # Stream the Deltas Instead of Reloading".
      #
      #   1. IT USED A WORD THE COURSE HAD NOT DEFINED. "Stream" appears here and is not
      #      explained until 20, the very next episode. It is the ONLY place in Series 1 to 3
      #      where that happens, so it was cheap to remove rather than to excuse.
      #
      #   2. WORSE, IT WELDED TOGETHER THREE THINGS THE NEXT EPISODE HAS TO PULL APART. Be
      #      precise here, because a first draft of this comment was not and claimed "CDC is
      #      not streaming", which is false:
      #
      #        THE CAPTURE      log-based CDC reads the WAL or binlog. That feed is UNBOUNDED
      #                         and ordered — by episode 20's own definition it IS a stream.
      #                         There is no honest way to call it bounded.
      #        THE CADENCE      you decide how often to consume it: continuously, hourly, or
      #                         nightly. An unbounded feed can be read in bounded chunks.
      #        THE MACHINERY    and therefore whether you need a stream PROCESSOR — state,
      #                         windows, watermarks — or just "read since last offset, apply,
      #                         stop".
      #
      #      EPISODE 20'S THESIS IS ONLY ABOUT THE THIRD ONE. Most "we need streaming" means
      #      "we need hourly instead of daily", and CDC delivers that without any streaming
      #      machinery at all — Debezium into Kafka, then an hourly load, which is the standard
      #      warehouse shape and the reason this episode sits in a batch series.
      #
      #      "Stream the Deltas" as a title collapsed capture into cadence, and left a reader
      #      concluding that adopting CDC commits them to a stream processor. It does not.
      #
      # THE NEW TITLE ALSO SEPARATES IT FROM SERIES 1 · 35 ("Incremental Loads & Watermarks —
      # Only What Changed"), which a reader could otherwise mistake it for. The difference is
      # exactly the two things now named:
      #     1 · 35   POLL a watermark column. Cheap, portable, and it CANNOT SEE DELETES —
      #              a row removed at source simply stays in your warehouse forever.
      #     3 · 15   read the database's own LOG. Every change, deletes included, without
      #              querying the table at all.
      # The episode should make that pair explicit; "deletes included" is the single clearest
      # reason anyone graduates from one to the other.
      - n: "15"
        slug: change-data-capture
        title: "Change Data Capture — Reading the Database's Own Log, Deletes Included"
        hands_on: ["koan:predict"]
        data:
          source: northwind_co_changes
          tables: ["events: orders", "events: order_details", "events: customers"]
          fit: MISSING
          reason: "The point is that a log sees deletes a watermark cannot, and D2 is not built. Build D2 as a log-shaped feed (op c/u/d, before and after images, event_time, arrival_time, offset) with hard deletes, an order line removed from an open order, and an order keyed in error and deleted the same day, among normal inserts and updates. Order Details has no UpdatedAt, so line deletes are exactly what polling Orders.UpdatedAt misses; the same feed serves dbt incremental models and Data Warehousing S3."
        status: planned
      # ADDED 2026-09-02, into a slot that was already EMPTY — this series ran 15 then 25 with
      # no comment explaining the gap. It fills it because TWO EPISODES ALREADY LEAN ON A
      # CONCEPT NOTHING IN THE ACADEMY DEFINES:
      #   15 (directly above) says "STREAM the deltas" and never says what a stream is.
      #   2 · 20 is "Late & Out-of-Order Data — Rows That Arrive After You Reported". Late
      #     RELATIVE TO WHAT? That episode needs event time versus processing time, and no
      #     episode anywhere defines the difference.
      # An absence two episodes work around is not theoretical.
      #
      # SPLIT INTO 20 AND 22 ON 2026-09-02. As first drafted this one episode carried
      # bounded-against-unbounded, event time against processing time, windows, watermarks,
      # three tools and the thesis — and its own brief already warned it was at risk of
      # becoming the Kafka and Flink courses. It was proposed instead to add a BATCH episode
      # and a STREAMING episode in front of it. That was rejected, and the reason is worth
      # keeping because it is a question anyone would ask again:
      #
      #   A DEDICATED BATCH EPISODE WOULD TEACH THE COURSE BACK TO ITSELF. Series 1 and 2 are
      #   twenty-three episodes and every one of them is batch — load a CSV, staging, transform
      #   with SQL, idempotency, watermarks, row counts, the scheduler, DAGs, load order. A
      #   reader arriving here has BUILT about two dozen batch pipelines. Explaining batch at
      #   episode thirty-four inverts the course.
      #   A DEDICATED STREAMING EPISODE WOULD DUPLICATE. It is either this episode's first half
      #   or it is Flink's course.
      #
      # SO THE SPLIT IS BY CONCEPT DEPTH, NOT BY PARADIGM:
      #     20 (here)  THE DECISION — is your data bounded, and do you actually need a stream
      #     22         THE MECHANICS — event time, windows and watermarks
      # 22 earns its own place independently: 2 · 20 "Late & Out-of-Order Data" leans on event
      # time and nothing in the academy defines it, which is the same evidence that created
      # this episode in the first place.
      #
      # WHAT THIS ONE TEACHES, engine-free:
      #   1. BOUNDED vs UNBOUNDED. A batch has an end; a stream does not. Everything else
      #      follows from that one difference, including why "just run it more often" is a
      #      different thing from streaming.
      #   2. WHEN IS A BATCH COMPLETE — the one genuinely batch-shaped question the course
      #      never asks. How do you know all of Monday's data arrived before Monday's load
      #      runs? Arrival signals, a sentinel file, wait-then-run. ONE PARAGRAPH: the
      #      machinery is Airflow's sensors and the late-data half is 2 · 20.
      #   3. THE DECISION ITSELF, which is what the koan:choose tests.
      # Event time, windows and watermarks are NAMED here and DEFINED at 22. Name them; do not
      # start explaining them, or the split has undone itself.
      #
      # THEN THE THREE TOOLS, ONE PARAGRAPH EACH, NAMED FOR WHAT THEY ARE and not taught:
      #   Kafka  a LOG — transport. Not a queue, and not a processor.
      #   Spark  a distributed BATCH engine, with streaming bolted on as micro-batches.
      #   Flink  an event-time STREAM processor; the model above is closest to its own.
      # The Tools catalogue owns teaching them. If this episode starts explaining partitions,
      # consumer groups or shuffle, it has become those courses and must be cut back.
      #
      # THE THESIS, AND IT IS ALREADY THE HOUSE LINE so it needs no inventing — Analytics
      # Engineering with dbt says it outright ("it is not Spark. The warehouse does 100% of the
      # work"), Data Warehousing pushes compute into DuckDB and ClickHouse, and this track is
      # SQL-first throughout:
      #     STREAMING IS A MODELLING DECISION BEFORE IT IS A TOOLING DECISION, and most
      #     "we need streaming" turns out to be "we need hourly instead of daily" — which CDC
      #     at 15 already gives you, with none of these three.
      # The koan:choose is where that gets tested rather than asserted: requirements where the
      # honest answer is a smaller batch window, and one where it genuinely is not.
      #
      # CORE, because 15 depends on it and because the decision it teaches is one every reader
      # will be asked to make.
      #
      # MOVED TO 42 ON 2026-09-02, to sit immediately before the project as the bridge into
      # Series 4 — a gate belongs next to the door it gates. See the entry there.
      #
      # (EVENT TIME, WINDOWS AND WATERMARKS used to sit at 22, between this and 25. It moved to
      # Series 4 · 00 on 2026-09-02 — see that episode for the argument. In short: once 2 · 20
      # was narrowed to its batch framing, the only thing depending on event time was Series 4,
      # and a core episode whose only dependents live in a 0-core series is misfiled. Episode 42
      # NAMES the three ideas and hands them over; it does not define them.)
      - n: "25"
        slug: backfills-and-reprocessing
        title: "Backfills & Reprocessing — Rewrite History Without Breaking Downstream"
        hands_on: ["koan:rerun", "koan:diagnose"]
        core: true
