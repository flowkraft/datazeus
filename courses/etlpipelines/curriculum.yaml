          reason: "A backfill is a volume lesson (a month at M is ~8,300 orders by design, against ~200 at S) and scale M is not built: extend the install to SCALE M with the same rules and rates. The reason to backfill already exists and must stay proportional at M: the Speedy Express outage (ShippedDate lost for 20% of its orders placed 2024-03-04..08-30) repaired from CourierConfirmations, after which six months of Invoices and every downstream total are rewritten without double-counting."
