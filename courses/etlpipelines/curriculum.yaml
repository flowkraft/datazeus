        slug: parameterized-and-reusable-jobs
        title: "Parameterized & Reusable Jobs — One Script, Many Tables"
        hands_on: ["koan:complete"]
        core: true
        status: planned
      - n: "10"
        slug: data-quality-gates
        title: "Data Quality Gates — Nulls, Ranges and Referential Gaps, Before They Land"
        hands_on: ["koan:diagnose", "koan:complete"]
        core: true
        status: planned
      - n: "15"
        slug: deduplication-and-conformance
        title: "Deduplication & Conformance — One Customer, One Row"
        hands_on: ["koan:predict", "koan:diagnose"]
        core: true
        status: planned
      # ALSO OWNS LATE-ARRIVING DIMENSIONS, a DIFFERENT problem from late-arriving facts with
      # a different fix. Both belong in this episode; do not split them.
      #   LATE FACT       yesterday's sale turns up today, after you already reported. Fix:
      #                   reprocess the affected period (Series 3 - 25 does the backfill).
      #   LATE DIMENSION  the fact arrives first and references a customer the dimension has
      #                   never seen. You cannot drop the fact and you must not NULL the key.
      #                   Fix: insert an INFERRED MEMBER — a placeholder row carrying only the
      #                   business key and flagged as inferred — then let the real attributes
      #                   overwrite it when they arrive.
      #   THE TRAP WORTH A KOAN: if the placeholder is created by a Type 2 process it gets an
      #   effective-date range, and when the real row lands you must UPDATE that row rather
      #   than open a second version — otherwise every fact loaded in between points at a
      #   version that never really existed.
      # SCOPE NARROWED 2026-09-02, to remove a forward dependency across a series boundary.
      # This episode's title asks what LATE is measured against, and the answer — event time
      # against processing time — is not defined until Series 3 · 22. A reader met the question
      # here and the vocabulary a whole series later.
      #
      # THE FIX IS TO KEEP THIS ONE IN BATCH TERMS, where it needs no formalism at all: late
      # means AFTER THE RUN THAT SHOULD HAVE INCLUDED IT. Monday's load ran at 02:00; the row
      # turned up at 02:30 carrying Monday's date. Everything in this episode — the
      # late-arriving fact, the late-arriving dimension, the inferred member — is expressible
      # that way and always was.
      # DO NOT introduce event time, windows or watermarks here. Series 3 · 22 does that, and
      # Series 4 · 15 is this same problem when you do not control the order at all. One line
      # pointing forward is enough.
      # SOURCE (kimball): LATE-ARRIVING FACTS and LATE-ARRIVING DIMENSIONS, and the INFERRED MEMBER that fixes the second. See the beat above.
      - n: "20"
        slug: late-and-out-of-order-data
        title: "Late & Out-of-Order Data — Rows That Arrive After the Run That Wanted Them"
        credits:
          - source: kimball
            concept: "LATE-ARRIVING FACTS and LATE-ARRIVING DIMENSIONS, and the INFERRED MEMBER that fixes the second"
        tags: ["kimball"]
        hands_on: ["koan:rerun", "koan:predict"]
        core: true
        status: planned
      - n: "25"
        slug: errors-retries-dead-letters
        title: "Errors, Retries & Dead Letters — Fail Without Losing Rows"
        hands_on: ["koan:capture", "koan:diagnose"]
        core: true
        status: planned
      # ADDED 2026-08-24, and it closes the one genuine mainstream gap a full sweep of all twelve
      # tracks found: NOTHING anywhere mentioned PII, masking, anonymisation, retention or
      # deletion. Access CONTROL is taught twice (Data Ops 2 - 40 and BI 3 - 40 both cover
      # row-level security) but the DATA ITSELF was never addressed.
      # THE DAILY QUESTION, and it has a wrong answer that ends careers: "can I copy production
      # onto my laptop to debug this?" Everyone asks it, most teams answer it badly, and the
      # honest answer is "not like that — here is how".
      # WHAT THE EPISODE OWES:
      #   FIND IT       which columns are personal is a decision, not a guess. Names, emails,
      #                 phone numbers, addresses — and the ones people miss: free-text notes,
      #                 IP addresses, and an ID that is a national insurance number.
      #                 Data Modeling, Series 2 - 27 is where they get CLASSIFIED; this is
      #                 where the classification gets used.
      #   THREE OPTIONS, and when each is right: MASK (same shape, fake value), SYNTHESISE
      #                 (generated rows, no real person involved), SUBSET (fewer real rows,
      #                 still real — usually the wrong answer, say so).
      #   THE HARD PART, and this is the koan: MASKING MUST BE CONSISTENT OR THE JOINS BREAK.
      #                 If ALFKI becomes X7QP2 in Customers it must become X7QP2 in Orders too.
      #                 A deterministic mask keyed on the value is how; a random one per row
      #                 quietly destroys every foreign key, and the data still LOOKS fine.
      #                 `rerun` is the assertion: mask twice, get the same output both times.
      #   THE HONEST WARNING: a masked copy of production is still a copy. Fewer rules apply,
      #                 not none. Say that plainly rather than implying masking makes it free.
      # NOT legal advice, and the episode must not pretend to be — name GDPR/CCPA as the reason
      # the question exists and point at whoever owns compliance where the reader works.
      #
      # MOVED 2026-09-02 from 22 to 27, so it sits AFTER the bad-data run rather than inside it.
      # Episodes 10, 15, 20 and 25 are one continuous argument — gate the bad rows, collapse the
      # duplicates, handle the ones that arrive late, and fail without losing the rest. Privacy
      # is a different axis, and dropping it into the middle of that run broke a sequence that
      # otherwise reads as a single idea.
      - n: "27"
        slug: personal-data-and-masking
        title: "Personal Data — Masking, Synthetic Rows and a Safe Copy of Production"
        hands_on: ["koan:diagnose", "koan:rerun", "koan:count:queries"]
        core: true
        status: planned
      # SOURCE (kimball): THE SURROGATE KEY PIPELINE — his name for swapping business keys to warehouse keys at load.
      # CORE, added 2026-08-24: Series 2 - 35 (load order) is core and depends on
      # this — you cannot load dimensions-before-facts without the key lookup that
      # makes the ordering necessary. A core episode resting on a non-core one is a
      # hole in the shortest path, and this is also just what anyone loading a
      # warehouse does every day.
      - n: "30"
        slug: surrogate-keys-and-lookups
        title: "Surrogate Keys & Dimension Lookups — Business Keys to Warehouse IDs"
        core: true
        credits:
          - source: kimball
            concept: "THE SURROGATE KEY PIPELINE — his name for swapping business keys to warehouse keys at load"
        tags: ["kimball"]
        hands_on: ["koan:complete"]
        status: planned
      # SOURCE (kimball): Dimensions before facts, and why. A direct consequence of the surrogate key pipeline.
      - n: "35"
        slug: load-order
        title: "Load Order — Dimensions First, Then Facts, and What Breaks Otherwise"
        credits:
          - source: kimball
            concept: "Dimensions before facts, and why"
        tags: ["kimball"]
        hands_on: ["koan:predict", "koan:diagnose"]
        core: true
        status: planned
      - n: "40"
        slug: cross-database-pipelines
        title: "Cross-Database Pipelines — Northwind PostgreSQL → ClickHouse"
        hands_on: ["koan:equivalent", "clickhouse"]
        status: planned
      - n: "45"
        slug: orchestration-and-dags
        title: "Orchestration & DAGs — Expressing Dependencies Instead of Chaining Cron Jobs"
        hands_on: ["koan:process:tool", "rundeck"]
        core: true
        status: planned

      # SERIES 2 PROJECT, added 2026-08-24. The series had none: the core path
      # walked ten episodes with nothing built at the end of them.
      # Series 2 is maintainability, and the thing that breaks first is order: dimensions before
      # facts, a quality gate before either, a dead-letter path for the rows that fail.
      - n: "50"
        slug: project-five-tables-in-order
        title: "Project — One Job That Loads Five Tables in the Right Order"
        hands_on: ["koan:author", "koan:rerun"]
        core: true
        tags: ["project"]
        status: planned
  # RENAMED TWICE ON 2026-09-02, and the second rename corrects the first. Both attempts are
  # recorded because the pair is more instructive than either.
  #
  # IT WAS "Production Data Flow". Wrong, because it promised OPERATIONS this series does not
  # have — no monitoring, no alerting, no on-call, no scheduling — and the course's own
  # excludes hand all of that to Data Ops ("cron internals, monitoring, alerting and on-call").
  # A title claiming a subject its own course has excluded is the worst kind of wrong: a reader
  # looking for production operations stops here and finds none.
  #
  # THEN IT WAS "Loading a Warehouse". Also wrong, in the opposite direction — too NARROW.
  # Only three of the ten episodes are actually about a warehouse (05 star schema, 10 SCD Type
  # 2, 45 the project). Backfills, idempotent MERGE at scale, contracts and lineage, and bulk
  # loading are not warehouse topics at all; they are what any load needs once it is real. The
  # fix threw out the accurate half of the old name along with the inaccurate half.
  #
  # AND IT MADE AN EPISODE LOOK MISPLACED THAT IS NOT. 20 ("Streaming vs Batch") reads as an
  # intruder in a series called "Loading a Warehouse" and reads as a natural consequence in one
  # about loading generally — 15 teaches a technique that raises the question, 20 answers it.
  # The episode never moved; the name shrank around it.
  #
  # SO: "Loading at Production Volume". "Loading" scopes it, which is what stops "production"
  # being misread as monitoring and on-call — that was the whole failure of the first name.
  # "Volume" is what actually unifies backfills, MERGE at scale, throughput and observability:
  # they are the things a load needs when it stops being a demo.
  #
  # THE TAGLINE NEVER CHANGED THROUGH ANY OF THIS, and that is the tell — it was accurate all
  # along, and only the titles were drifting.
  #
  # ── WHY 15 AND 20 ARE IN THIS SERIES AND NOT IN SERIES 4 ────────────────────────────────
  # Asked three separate times on 2026-09-02, which is enough evidence that it will be asked
  # again. Both episodes have "stream" in them and Series 4 is called Streaming Pipelines, so
  # the instinct to move them is reasonable. Do not act on it.
  #
  # THE AXIS IS NOT "IS A STREAM MENTIONED". IT IS "DOES YOUR PIPELINE END".
  #     Series 3   pipelines with RUNS. They start, they finish, and you count what went in
  #                and what came out.
  #     Series 4   pipelines with NO END. State must be kept, windows must close, and someone
  #                has to decide when an answer is final.
  #
  # 15 (CDC): the FEED is unbounded — log-based CDC reads the WAL, and that is a stream by
  # episode 20's own definition. But YOUR JOB IS NOT. Nothing in the episode needs state,
  # windows or watermarks: read from the last offset, apply, stop. That is a run. Moving it to
  # Series 4 would mean either teaching it with machinery it does not require, or leaving a
  # batch episode inside the streaming series — which is worse, because it breaks the only
  # rule that series has. It also has a job here: 10 is SCD Type 2, and CDC is how the changes
  # that Type 2 history stores are captured. Capture, then store.
  #
  # 20 (the decision): IT IS THE GATE, AND A GATE GOES BEFORE THE DOOR. Its entire value is
  # for the reader whose answer is NO — someone has asked them for "real-time" and they need
  # to work out that a fifteen-minute batch would do. Inside Series 4 it would only ever be
  # opened by people who had already decided yes, and the reader who most needed it would
  # never see it. It is also CORE and Series 4 is 0-core, so filing it there would put the one
  # core episode at the head of an optional series.
  #
  # MOVING 20 LATER IN THIS SERIES was considered on 2026-09-02 — to sit just before the
  # project, as the bridge into Series 4 — and REJECTED ON COST, not on principle. The
  # position at 42 is arguably slightly better; the price is renumbering an address that FIVE
  # OTHER COURSES cite. "Series 3 · 20" is not a unique address in this academy: it also names
  # Java & Groovy's Liquibase episode, Learn SQL's EXPLAIN, Data Warehousing's lakehouse and
  # Data Modeling's own. Forty-five files mention the string and only thirty-five qualify it
  # with a course name. That is a lot of exposure for a modest gain, and 20 reads well where
  # it is: 15 teaches a technique that raises the question and 20 answers it.
  #
  # IF THAT MOVE IS EVER MADE, disambiguate first: only rewrite occurrences that explicitly
  # say "ETL" or "ETL & Data Pipelines", plus the prerequisite blocks in Apache Beam, Apache
  # Flink and Apache Kafka. Everything else means another course.
  - slug: series3-loading-at-production-volume
    title: Loading at Production Volume
    tagline: load a star schema, track changes, and re-run a whole month
    level: advanced
    episodes:
      # THIS IS NOW WHERE THE ETL/ELT DECISION IS MADE — moved here 2026-09-02 from Series
      # 1 · 00, which asked for it before the reader had loaded anything. By this point they
      # have built a pipeline, staged it, transformed it, made it re-runnable and scheduled it,
      # and in a moment they will load a star schema. NOW the question means something:
      #     does the transform run on the way IN, or does raw land first and the warehouse do
      #     the work?
      # Teach the trade honestly — pushing down buys warehouse compute, set-based speed and
      # SQL a team can read; it costs you a warehouse bill and it moves raw data somewhere it
      # may not be allowed to sit. Series 1 · 00 only NAMES the two shapes; the decision is here.
      #
      # RETITLED to match. "ELT — Push the Transform Down into the Warehouse" described only
      # one of the two answers, which is a poor name for the episode that chooses between them.
      - n: "00"
        slug: elt-push-down
        title: "ETL vs ELT — Where the Transform Should Run, Now That You Have Done Both"
        hands_on: ["koan:choose", "koan:count:scanned"]
        core: true
        status: planned
      # SOURCE (kimball): Loading a star designed by Kimball's method — see Data Modeling, Series 3.
      - n: "05"
        slug: building-the-star-schema
        title: "Building the Star Schema — Loading One From SQLite Into DuckDB and ClickHouse"
        credits:
          - source: kimball
            concept: "Loading a star designed by Kimball's method — see Data Modeling, Series 3"
        tags: ["kimball"]
        hands_on: ["koan:author", "duckdb"]
        core: true
        status: planned
      # SOURCE (kimball): The TYPE 2 load: close the current row, open a new one, keep the durable key stable.
      - n: "10"
        slug: scd2-loads-in-practice
        title: "SCD Type 2 Loads — Keep History Without Duplicating It"
        credits:
          - source: kimball
            concept: "The TYPE 2 load: close the current row, open a new one, keep the durable key stable"
        tags: ["kimball"]
        hands_on: ["koan:rerun", "koan:predict"]
        core: true
        status: planned
      # RETITLED 2026-09-02, and for two reasons rather than one. It was "Change Data Capture —
      # Stream the Deltas Instead of Reloading".
      #
      #   1. IT USED A WORD THE COURSE HAD NOT DEFINED. "Stream" appears here and is not
      #      explained until 20, the very next episode. It is the ONLY place in Series 1 to 3
      #      where that happens, so it was cheap to remove rather than to excuse.
      #
      #   2. WORSE, IT WELDED TOGETHER THREE THINGS THE NEXT EPISODE HAS TO PULL APART. Be
      #      precise here, because a first draft of this comment was not and claimed "CDC is
      #      not streaming", which is false:
      #
      #        THE CAPTURE      log-based CDC reads the WAL or binlog. That feed is UNBOUNDED
      #                         and ordered — by episode 20's own definition it IS a stream.
      #                         There is no honest way to call it bounded.
      #        THE CADENCE      you decide how often to consume it: continuously, hourly, or
      #                         nightly. An unbounded feed can be read in bounded chunks.
      #        THE MACHINERY    and therefore whether you need a stream PROCESSOR — state,
      #                         windows, watermarks — or just "read since last offset, apply,
      #                         stop".
      #
      #      EPISODE 20'S THESIS IS ONLY ABOUT THE THIRD ONE. Most "we need streaming" means
      #      "we need hourly instead of daily", and CDC delivers that without any streaming
      #      machinery at all — Debezium into Kafka, then an hourly load, which is the standard
      #      warehouse shape and the reason this episode sits in a batch series.
      #
      #      "Stream the Deltas" as a title collapsed capture into cadence, and left a reader
      #      concluding that adopting CDC commits them to a stream processor. It does not.
      #
      # THE NEW TITLE ALSO SEPARATES IT FROM SERIES 1 · 35 ("Incremental Loads & Watermarks —
      # Only What Changed"), which a reader could otherwise mistake it for. The difference is
      # exactly the two things now named:
      #     1 · 35   POLL a watermark column. Cheap, portable, and it CANNOT SEE DELETES —
      #              a row removed at source simply stays in your warehouse forever.
