# The ordered episode list for ETL & Data Pipelines. Field docs live in courses/learnsql/curriculum.yaml.
# `short` is omitted until an episode has a video.
#
# The job this track teaches: get data from where it is to where it's useful, repeatedly,
# without losing or duplicating a row. Series 1 moves it safely, Series 2 keeps it
# maintainable, Series 3 loads at production volume, and Series 4 asks every one of those
# questions again for data that never ends.
#
# NOTE WHAT IS NOT HERE, because the series names used to imply it: RUNNING the pipeline in
# production — monitoring, alerting, on-call, choosing and operating a scheduler — is Data
# Ops', and the excludes below say so. This track hands a pipeline over; it does not sit
# with the pager.
#
# ── SERIES 1 TO 3 ARE BATCH, AND THAT IS A TEACHING CHOICE RATHER THAN THE SUBJECT ──────
# Say this out loud, because a reader who is not told finishes Series 2 believing they have
# learned how PIPELINES work rather than how BATCH pipelines work — and then Series 4 has to
# un-teach instead of extend.
#
# MOST OF WHAT SERIES 1 AND 2 TEACH IS GENERAL. Types and casting, quality gates,
# deduplication, dead letters, surrogate keys, personal data: none of that is batch-specific.
# A few more are general concerns in a batch SPELLING — staging as a landing table,
# idempotency as TRUNCATE+INSERT or MERGE, row counts at the end of a run — and Series 4
# restates each one for unbounded data, which is what its counterpart rule exists for.
#
# ONLY ABOUT FIVE ARE GENUINELY BATCH-ONLY: 1 · 35 (polling a watermark column), 1 · 45
# (handing discrete runs to a scheduler), 2 · 20 (late relative to THE RUN that wanted the
# row), 2 · 35 (a load order you control) and 2 · 45 (a DAG of discrete tasks).
#
# WHY BATCH FIRST: a batch has an end, so you can count what went in and what came out. Every
# correctness idea in this course is easier to see when the thing being checked has finished.
# Series 4 removes that ending and asks all the same questions again.
#
# ── WHAT `core` MEANS HERE, AND THE RULE THAT KEEPS IT HONEST ───────────────────────────
# Corrected 2026-09-02. Series 2 had drifted to 11 core out of 12, and a flag that excludes
# almost nothing tells a learner nothing — its ONE job is to let somebody skip. Learn SQL is
# the reference shape: 12/12, then 10/14, then 0/7, then 0/3. It decays.
#
# THE TEST, applied episode by episode: WOULD SOMEBODY BE BLOCKED WITHOUT IT? Not "is it
# valuable" — everything here is valuable, or it would not be an episode. Blocked.
#
# What came off the shortest path, and why:
#   2 · 00  a style DECISION (a script against a chain of SQL files). Useful, not blocking.
#   2 · 05  parameterisation is a refactoring improvement, not an unblocker.
#   2 · 27  personal data is SITUATIONAL — critical the day you touch PII, irrelevant if you
#           never do. Nothing downstream depends on it.
#   2 · 40  cross-database was already off, correctly.
#
# The curve is now 100% / 71% / 60% / 0%. IF A LATER EDIT PUSHES SERIES 2 BACK ABOVE ~75%,
# the flag has stopped discriminating again and something should come off.
#
# ONE HONEST EXCEPTION, AND IT IS 3 · 15. Log-based CDC reads the database's WAL or binlog,
# and that feed is unbounded — it IS a stream by episode 20's own definition. What keeps the
# episode in a batch series is the CADENCE, not the source: an unbounded feed can be consumed
# in bounded chunks, and the standard warehouse shape is Debezium into Kafka followed by an
# hourly load. Do not let anyone "simplify" this into "CDC is batch". It is a stream you are
# choosing to read a batch at a time, and that distinction is the whole of episode 20.

course: learn-etl-pipelines
track: etlpipelines
title: ETL & Data Pipelines

# DATASET DEPENDENCY NOTE (2026-09-17): This course already has a data block for every episode.
# Its complete dependency chain is:
#   D1 northwind_co_<scale>       operational Company source (S for Series 1-2, M/L for Series 3)
#   D2 northwind_co_changes       replayable JSONL changes/event log for incremental and streaming lessons
#   D3 crm_export                 separate 135-row messy CRM source for matching/conformance
#   D4 northwind_co_files         CSV/XLSX/Parquet files for first loads, drift, and file-based throughput
#   D5 northwind_co_dw_<scale>    derived star target for star/SCD2/backfill/warehouse loads
#   D6 northwind_co_raw_<scale>   learner-produced raw landed copy, especially the Series 1 project and dbt seam
#
# D1-D5 are source/target contracts, not all currently implemented generators. The D2/D3/D4 comment-only
# drafts are under C:\Projects\reportburster\asbl\src\main\external-resources\db-template\db\scripts\:
# academy-northwind-co-changes.groovy, academy-crm-export-install.groovy, and academy-files-export.groovy.
# D5's comment-only draft is academy-northwind-co-dw-install.groovy. D6 should be produced by the learner's
# ETL project, not pre-seeded, so checksums can prove that the pipeline made the raw copy correctly.
#
# REQUIRED EXTENSIONS BEFORE MARKING THE REMAINING MISSING/PARTIAL SOURCES GOOD:
# - D2 must include hard deletes, new-customer events, control totals, poison records, redeliveries, and
#   stable offsets/event_time/arrival_time. The planted day 45 remains the shared bad-load fixture.
# - D3 must preserve the documented 120 matches, 12 duplicate identities, 3 CRM-only prospects, and mixed
#   active/phone/date/credit-limit representations.
# - D4 must include clean daily CSVs, four schema drifts, the row-4 workbook header, sorted/unsorted Parquet,
#   and an API-shaped paginated JSON fixture if Series 1 · 10 remains explicitly hands-on with an API.
# - D1 needs a dated customer-entry extension (or equivalent D2 new-customer events) for inferred-member and
#   late-dimension lessons, plus the PII extension fields documented in Series 2 · 27.
# - D5 must be generated from D1, not substituted with the legacy disconnected fact_sales Java demo.
# - The Series 3 · 05 title says SQLite, but the Company installer supports PostgreSQL and DuckDB. Retitle it
#   to the actual source or add a deliberate SQLite export; do not imply a source engine that is absent.
#
# Keep fit: MISSING/PARTIAL until the relevant generator, manifest/checksum contract, and verifier exist.

# Assumes Learn SQL, and always has without saying so: Series 1 · 20 is "Transform with SQL",
# and every load in the track is checked by counting rows. Data Modeling is NOT required — you
# load into a schema somebody else designed, which is the normal case.
prerequisites:
  - course: learn-sql
    needs: "Series 1"
    why: >-
      Every transform here is a SELECT and every check is a COUNT. You do not need clever SQL,
      but you need to know what the right answer looks like before a pipeline tells you.

excludes:
  - topic: "The SQL inside the transforms"
    where: "covered in Learn SQL"
  - topic: "Designing the target schema"
    where: "covered in Data Modeling"
  - topic: "Doing the T as version-controlled, tested models"
    where: "covered in Analytics Engineering with dbt — this track owns Extract and Load"
  - topic: "cron internals, monitoring, alerting and on-call"
    where: "covered in Data Ops — here a pipeline just gets handed to the scheduler"
  # ADDED 2026-09-02 after a coverage audit found ZERO mentions of secrets anywhere in this
  # course and no exclude either. Every episode connects to something and nothing said where
  # the password lives, which reads as forgotten rather than decided. Data Ops has owned it all
  # along — Series 1 · 35 is "Permissions, Users & Environment Variables — Secrets a Job Can
  # Read", with Series 1 · 32 next door for the connection failure that turns out to be
  # credentials. The gap was the POINTER, not the teaching.
  - topic: "Where the credentials live — environment variables, secret stores, and file permissions"
    where: "covered in Data Ops, Series 1 · 35, with Data Ops, Series 1 · 32 for telling a credentials failure apart from a firewall one. In this course a connection is something you are handed, already configured"

  # The language the pipeline is written in. Series 2 · 00 uses Groovy, but the track is about
  # the SHAPE of a load, not the syntax — and a reader who wants the language should be sent.
  - topic: "Learning the language you write the pipeline in"
    where: "covered in Python for Data and Java & Groovy for Data — either one; the pipeline shape here is the same in both"
  - topic: "The warehouse the data lands in — engines, partitions, compression"
    where: "covered in Data Warehousing — here it is a destination you load into"
  # Three tracks build a star schema and each is a different question. Said out loud because
  # meeting the third one is how a reader concludes we repeated ourselves.
  - topic: "Deciding what the star schema should be — grain, SCD type, star vs snowflake"
    where: "covered in Data Modeling, Series 3. In this course, Series 3 · 05 loads a star that somebody has already designed"

  # ETL 2 · 45 and Data Ops 3 · 00 are both about orchestrators, and a reader who meets the
  # second one needs to be told these are two questions, not one subject twice.
  - topic: "Choosing and running the scheduler itself — cron vs systemd vs an orchestrator"
    where: "covered in Data Ops, Series 3 · 00, which is choosing and running the scheduler. In this course, Series 2 · 45 is expressing your pipeline as a DAG, whatever ends up running it"

series:
  - slug: series1-etl-fundamentals
    title: ETL Fundamentals
    tagline: build a pipeline that loads data and is safe to run twice
    level: beginner
    episodes:
      # REFRAMED 2026-09-02, FROM A DECISION INTO AN ORIENTATION. This used to be
      # "ETL vs ELT — What Moves, What Transforms, and Where", and it asked a reader on their
      # first episode to CHOOSE between two architectures. That choice needs things they cannot
      # have yet: what a transform costs, what a warehouse is for, what a load actually looks
      # like. The course also made the same decision TWICE — here, blind, and again at
      # Series 3 · 00 once the reader had loaded a warehouse and could judge it.
      #
      # So the decision moved to Series 3 · 00, where it belongs, and this episode keeps the
      # half that genuinely helps on day one: THE SHAPE OF THE THING. Extract, transform, load;
      # source and target; and the fact that the T can happen in three different places — on
      # the way out, in the middle, or after landing. Name ETL and ELT as the two common
      # shapes, show where each puts the T, and DO NOT ask the reader to pick.
      #
      # KEEP IT SHORT. Its job is to make episode 05 make sense, and both sibling courses
      # orient by DOING — Learn SQL opens on a first query, Java & Groovy on a first script.
      # If this grows past a brisk framing it has become the lecture those two avoid.
      - n: "00"
        slug: what-a-pipeline-is
        title: "What a Pipeline Is — Extract, Transform, Load, and Where Each One Happens"
        hands_on: ["koan:predict"]
        core: true
        data:
          source: northwind_co_s
          tables: ["WebOrders", "WebOrders.Payload", "Orders", "Order Details"]
          fit: good
          reason: "The whole shape fits in one company: the web shop's raw JSON (WebOrders.Payload) is extracted, reshaped into order rows, and loaded where Orders and Order Details already hold the cleaned truth to compare against. Enough to show where the T can sit without asking anyone to choose."
        status: planned
      - n: "05"
        slug: your-first-pipeline
        title: "Your First Pipeline — Load a CSV into a Table"
        hands_on: ["koan:author", "cloudbeaver"]
        core: true
        data:
          source: northwind_co_files
          tables: ["orders_YYYY-MM-DD.csv", "Orders", "Order Details"]
          fit: MISSING
          reason: "A first load needs a clean CSV that ARRIVES from somewhere, and D4 (northwind_co_files) is not built; messy/orders-export.csv is classic-Northwind rows with eight defects, wrong for a first pipeline and not the one company. Build D4's daily order CSVs cut from D1-S Orders (one file per day, header row, comma-delimited, UTF-8), days 1-10 clean before the planned drift starts on day 11, so the loaded rows reconcile to Orders by OrderID; the same files serve Data Warehousing S2 and dbt sources."
        status: planned
      # ALSO NAME THE SPREADSHEET, because a surprising share of real pipelines start with one
      # and this episode is the catalogue of what a source can be.
      #   Python for Data, Series 2 - 02 and Java & Groovy for Data, Series 2 - 05 both teach
      #   READING .xlsx properly — do not re-teach it. What is new here is that a spreadsheet
      #   is an unreliable INTERFACE, not just an awkward format: the columns move, someone
      #   inserts a row above the header, the file is open and locked at 09:00, and the
      #   "monthly" one arrives on the 3rd or the 9th.
      #   THE RULE WORTH LEAVING THEM WITH: validate the header row before trusting a single
      #   value, and fail loudly when it has changed rather than loading the wrong column.
      - n: "10"
        slug: sources-and-sinks
        title: "Sources & Sinks — Files, APIs and Databases as Connections"
        hands_on: ["koan:complete"]
        core: true
        data:
          source: [northwind_co_s, northwind_co_files]
          tables: ["Orders", "WebOrders.Payload", "order-summary.xlsx"]
          fit: partial
          reason: "The database source (Orders on PostgreSQL) and a JSON source (WebOrders.Payload) exist today. Missing: a spreadsheet and an API. Add to D4 the planned Excel workbook with its header on row 4 (plus a second month where a column has moved, for the validate-the-header rule), and serve WebOrders as paginated JSON pages with a next-page cursor, so an API extract is real; both are cut from D1-S so every source reconciles to the same orders."
        status: planned
      - n: "15"
        slug: staging
        title: "Staging — Land Raw Before You Transform Anything"
        # NAME THE OTHER NAME, one line: this layer is what a Databricks shop calls BRONZE.
        # Analytics Engineering with dbt, Series 2 · 40 owns the full bronze/silver/gold mapping.
        hands_on: ["koan:predict", "koan:diagnose"]
        core: true
        data:
          source: northwind_co_s
          tables: ["WebOrders", "WebOrders.Payload", "WebOrders.ReceivedAt", "Orders"]
          fit: good
          reason: "WebOrders.Payload is genuinely raw input with planted defects (quantity sent as text, decimal-comma prices, missing ship_to), so a transform-on-the-way-in load fails or mangles rows while landing it as text first loses nothing and can be re-read; Orders is the cleaned truth to diff the staged result against. The staging shape the learner builds is the planned raw copy (northwind_co_raw_s)."
        status: planned
      - n: "20"
        slug: types-and-casting-across-sources
        title: "Types & Casting Across Sources — When 'Y', 'yes' and 1 All Mean True"
        hands_on: ["koan:predict", "koan:diagnose"]
        core: true
        data:
          source: [northwind_co_s, crm_export]
          tables: ["WebOrders.Payload", "Order Details.Quantity", "Order Details.UnitPrice", "crm_customers.active"]
          fit: partial
          reason: "Across-source type clashes exist today: WebOrders.Payload sends qty as text and unit_price as '12,50' where Order Details holds SMALLINT and DECIMAL(19,4). Missing is the episode's own title case, a boolean spelled Y/yes/1/true: build D3 (crm_export) with its planned 'active' flag in those spellings, plus dates in two formats (dd/mm/yyyy and ISO) and a credit limit as text with thousands separators, keyed CRM-000001 and matching D1-S Customers, so the same file serves 2 · 15 dedup, Data Warehousing S3 federation and dbt sources."
        status: planned
      - n: "25"
        slug: transform-with-sql
        title: "Transform with SQL — Reshaping the Data on Its Way In"
        hands_on: ["koan:complete"]
        core: true
        data:
          source: northwind_co_s
          tables: ["WebOrders.Payload", "Orders", "Order Details", "Customers.City", "Customers.Phone"]
          fit: good
          reason: "Reshaping the web shop JSON into order and line rows is a real SELECT-driven transform, and Orders/Order Details are the answer it must reconcile to; Customers carries the planted stray spaces, capitalised cities and mixed phone formats a transform normalises on the way in."
        status: planned
      - n: "30"
        slug: idempotency
        title: "Idempotency — Re-Runnable Loads with TRUNCATE+INSERT and MERGE"
        hands_on: ["koan:rerun"]
        core: true
        data:
          source: northwind_co_s
          tables: ["Orders", "Order Details", "Orders.Status", "Orders.ShippedDate"]
          fit: good
          reason: "Loading Orders (key OrderID) and Order Details (composite key OrderID+ProductID) twice shows the doubled rows of plain INSERT against TRUNCATE+INSERT and MERGE, with row counts to prove it. A second extract with changed rows would sharpen MERGE; that comes with D2 (see 1 · 35), but the property is fully demonstrable on the S snapshot."
        status: planned
      - n: "35"
        slug: incremental-loads-and-watermarks
        title: "Incremental Loads & Watermarks — Only What Changed"
        hands_on: ["koan:rerun", "koan:diagnose"]
        core: true
        data:
          source: northwind_co_s
          tables: ["Orders.UpdatedAt", "Orders.CreatedAt", "Orders.OrderDate", "Order Details"]
          fit: partial
          reason: "The planted trap exists: ~1.5% of orders are keyed 1-10 days after their OrderDate (Orders.CreatedAt), so a watermark on OrderDate silently misses them, and Order Details has no change column of its own. Too weak: S is one snapshot holding only each order's FINAL UpdatedAt, so a second run never sees a row change after the first; needs D2 (northwind_co_changes) applied day by day (ship dates filled, statuses changed, UpdatedAt bumped), including cancellations that bump UpdatedAt and a few rows whose UpdatedAt equals the previous watermark to the minute (the > vs >= boundary)."
        status: planned
      - n: "40"
        slug: row-counts-and-logging
        title: "Row Counts & Logging — Proving the Load Did What You Think"
        hands_on: ["koan:capture"]
        core: true
        data:
          source: northwind_co_s
          tables: ["Orders", "Order Details", "WebOrders", "WebOrders.Payload"]
          fit: good
          reason: "Source and target counts reconcile exactly per table, and WebOrders gives a real in-is-not-out case: payloads with a missing ship_to or unparseable numbers are rejected or defaulted, and the log must say how many. Counts are asserted by the lesson's spec, not quoted here."
        status: planned
      - n: "45"
        slug: from-script-to-scheduled-job
        title: "From Script to Scheduled Job — Hand a Pipeline to the Scheduler"
        hands_on: ["koan:process:tool", "rundeck"]
        core: true
        data:
          source: northwind_co_s
          tables: ["Orders", "Orders.UpdatedAt"]
          fit: partial
          reason: "The S load can be handed to Rundeck as it is. Too weak for a nightly job: every run reads the same snapshot, so nothing shows the job picking up the new day; needs D2 (northwind_co_changes) delivered as 'apply day N', so each scheduled run has one more day of orders and updates to load and log."
        status: planned

      # SERIES 1 PROJECT, added 2026-08-24. The series had none: the core path
      # walked ten episodes with nothing built at the end of them.
      # Everything in Series 1 on one load: stage it, transform it, log the row counts, then run it
      # again and prove nothing changed. Idempotency (30) is the property the whole series was
      # building toward and the only one a single run cannot demonstrate.
      - n: "50"
        slug: project-safe-to-rerun
        title: "Project — A Load That Is Safe to Run Twice"
        hands_on: ["koan:author", "koan:rerun"]
        core: true
        tags: ["project"]
        data:
          source: [northwind_co_s, northwind_co_files, crm_export]
          tables: ["Orders", "Order Details", "Customers", "WebOrders", "orders_YYYY-MM-DD.csv", "crm_customers"]
          fit: partial
          reason: "The database half runs today: stage Orders, Order Details, Customers and WebOrders, transform, count, re-run, prove nothing moved. The series' artefact is designed as a nightly load from files, the CRM export and the database whose output IS the raw copy; missing are D4's daily CSVs, D3's CRM export and D6 (northwind_co_raw_s) as the checksummed reference the learner's output must match."
        status: planned
  - slug: series2-maintainable-pipelines
    title: Pipelines You Can Maintain
    tagline: handle bad rows, late data and failures without hand-fixing
    level: intermediate
    episodes:
      - n: "00"
        slug: scripted-pipelines
        title: "Scripting a Pipeline — When a Script Beats a Chain of SQL Files"
        hands_on: ["koan:author"]
        data:
          source: northwind_co_s
          tables: ["WebOrders.Payload", "Orders", "Order Details"]
          fit: good
          reason: "Parsing WebOrders.Payload item arrays with defensive casting (text quantities, decimal commas, a missing ship_to) is where a Groovy script clearly beats a chain of SQL files, and Orders/Order Details check the script's output."
        status: planned
      - n: "05"
        slug: parameterized-and-reusable-jobs
        title: "Parameterized & Reusable Jobs — One Script, Many Tables"
        hands_on: ["koan:complete"]
        data:
          source: northwind_co_s
          tables: ["Customers", "Products", "Suppliers", "Employees", "Shippers", "Orders", "Orders.UpdatedAt"]
          fit: good
          reason: "Eighteen tables with Northwind's names give one job many real targets, and they differ where a parameter must cope: only Orders has UpdatedAt/CreatedAt so the rest need a full reload, and 'Order Details' has a space in its name and a composite key."
        status: planned
      # ADDED 2026-09-02, and it closes the gap a working engineer hits most often. A coverage
      # audit found ZERO mentions of schema drift anywhere in the academy, and it was not in the
      # excludes either — the silence read as forgotten rather than decided.
      #
      # THE FAILURE IS THE MOST COMMON WAY A PIPELINE BREAKS OVERNIGHT, and none of it is the
      # data's fault: the source added a column, renamed one, changed a type, reordered the
      # CSV, or a vendor "improved" their export. Nothing in the rows is wrong. The SHAPE moved.
      #
      # IT SITS BEFORE 10 DELIBERATELY: shape, then values. This episode asks "does the source
      # still look like what I agreed to read?"; 10 then asks "are the values in it sane?".
      # Checking values first is how you get a green quality gate on a column that is no longer
      # the column you think it is.
      #
      # WHAT IT OWES:
      #   DETECT      compare the incoming header or catalog against the shape you expect, at
      #               the top of the run, and fail before a single row lands. Series 1 · 10
      #               already does the spreadsheet version of this in one line; here it becomes
      #               the discipline.
      #   CLASSIFY    not every drift is equal, and treating them alike is the mistake:
      #                 a NEW column        usually additive and safe to ignore — until it is
      #                                     the one carrying the money
      #                 a RENAMED column    silently becomes a missing column plus a new one
      #                 a RETYPED column    the worst, because it often still parses
      #                 a REORDERED column  harmless if you read by name, fatal by position
      #   RESPOND     fail loudly, quarantine, or absorb — and say which is right for each of
      #               the four. "Absorb everything" is how a pipeline rots quietly.
      #
      # THE TRAP WORTH THE EPISODE: reading by POSITION rather than by NAME. It works for years
      # and then a source inserts a column in the middle and every value shifts one to the left.
      # Every row loads. Nothing errors. Every number is wrong.
      #
      # SEAM: Series 3 · 35 (data contracts) is the same idea pointed DOWNSTREAM — what your
      # consumers may rely on. This is upstream: what you may rely on from your sources.
      - n: "07"
        slug: schema-drift
        title: "Schema Drift — When the Source Changes Shape and Every Row Still Loads"
        hands_on: ["koan:diagnose", "koan:predict"]
        core: true
        data:
          source: northwind_co_files
          tables: ["orders_YYYY-MM-DD.csv"]
          fit: MISSING
          reason: "Needs the four drifts on one feed, and D4 (northwind_co_files) is not built. Build its 30 daily order CSVs as designed: day 11 a column ADDED (Channel, from Orders.Channel), day 18 one RENAMED (ShipVia to ShipperID), day 24 one RETYPED (Freight with a decimal comma), day 27 one REORDERED (a column inserted mid-file, the read-by-position trap); noise: normal daily volume swings and a quoted field containing a comma on days that did not drift. Rows stay D1's, so a drifted load is caught by reconciling to Orders; Data Warehousing and dbt contract lessons can reuse the feed."
        status: planned
      - n: "10"
        slug: data-quality-gates
        title: "Data Quality Gates — Nulls, Ranges and Referential Gaps, Before They Land"
        hands_on: ["koan:diagnose", "koan:complete"]
        core: true
        data:
          source: northwind_co_s
          tables: ["Orders.ShippedDate", "Orders.Status", "Invoices", "CourierConfirmations", "Customers.Region"]
          fit: partial
          reason: "Nulls are real and planted: Speedy Express orders marked Shipped with no ShippedDate (the Learn SQL S2 outage, the cross-course 'check that would have caught it'), beside a legitimate NULL in Customers.Region. Missing: range and referential violations, since S has no negative quantities and no orphan keys; those arrive with D2 (northwind_co_changes) day 45 as designed (a duplicate OrderID, a negative Quantity, an order for a CustomerID that does not exist), surrounded by normal days."
        status: planned
      # ADDED 2026-09-02, and it is the gap a working engineer hits WEEKLY. A coverage audit
      # found no episode anywhere on testing a pipeline, and the excludes hand "tested models"
      # to Analytics Engineering with dbt — but that is dbt's T. THIS COURSE OWNS EXTRACT AND
      # LOAD AND TESTED NEITHER.
      #
      # THE DISTINCTION IS THE EPISODE, and 10 directly above is what makes it land:
      #     A QUALITY GATE checks THE DATA, at runtime, every night, in production.
      #     A TEST checks THE CODE, before it ever runs, on data you control.
      # A reader with gates and no tests finds out their change was wrong by breaking
      # production politely. That is the whole motivation and it needs no more.
      #
      # WHAT IT OWES, and the order matters because most people start at the wrong end:
      #   THE TRANSFORM IS A FUNCTION      rows in, rows out. Test it with a handful of rows
      #                                    written by hand, no database required. This is where
      #                                    05's parameterisation pays off — a parameterised job
      #                                    is a function, and functions are testable.
      #   FIXTURES, NOT PRODUCTION         a dozen rows that encode the cases you care about,
      #                                    including the nasty ones from 07 and 10. Series 2 · 27
      #                                    is where you get a safe copy if you need real shapes.
      #   THE ROUND TRIP                   load into a scratch table, assert on what came out.
      #                                    Slower, fewer of them, and the only way to catch a
      #                                    MERGE that is subtly wrong.
      #   THE DIFF                         run old and new against the same input and compare.
      #                                    The single most useful thing when changing a
      #                                    transform somebody else wrote.
      #
      # WHAT IS WORTH TESTING, said plainly, because the honest answer is "less than you fear":
      # the transform logic, the edge cases you have actually been burned by, and the shape
      # contract from 07. NOT the database, not the driver, and not that SELECT * returns rows.
      #
      # AND THE ONE THAT SAVES A CAREER: a test that proves the load is IDEMPOTENT — run it
      # twice against the fixture, assert the table is identical. Series 1 · 30 taught the
      # property; this is how you stop it regressing six months later.
      - n: "12"
        slug: testing-a-pipeline
        title: "Testing a Pipeline — Catching a Bad Change Before Tonight's Run Does"
        hands_on: ["koan:author", "koan:rerun"]
