      # and this episode is the catalogue of what a source can be.
      #   Python for Data, Series 2 - 02 and Java & Groovy for Data, Series 2 - 05 both teach
      #   READING .xlsx properly — do not re-teach it. What is new here is that a spreadsheet
      #   is an unreliable INTERFACE, not just an awkward format: the columns move, someone
      #   inserts a row above the header, the file is open and locked at 09:00, and the
      #   "monthly" one arrives on the 3rd or the 9th.
      #   THE RULE WORTH LEAVING THEM WITH: validate the header row before trusting a single
      #   value, and fail loudly when it has changed rather than loading the wrong column.
      - n: "10"
