        core: true
        data:
          source: [northwind_co_s, northwind_co_dw_s]
          tables: ["Orders", "Order Details", "Customers", "Products", "fact_order_line", "fact_order", "dim_customer", "dim_product", "dim_date"]
          fit: partial
          reason: "The source is built: D1-S's orders, lines, customers and products are what the star is loaded from. Missing is the star somebody else designed that this episode loads into and checks against: build D5-S (northwind_co_dw_s) as designed (fact_order_line keeping the order number, dim_date 2020-2025 with ISO week and a July fiscal year) as DDL plus a reference load, so the learner's load reconciles row for row. The title's SQLite source does not exist for Northwind Company (the install supports PostgreSQL and DuckDB only); retitle, or add SQLite to the install."
