      # ALSO OWNS THE AUDIT DIMENSION, folded in because the SKILL is daily even though
      # Kimball's particular implementation is only one way to get it.
      #   THE SKILL: every row can answer "where did you come from?". Which run loaded it,
      #   from which source file or extract window, under which version of the job, and
      #   whether any value in it was estimated, allocated or defaulted.
      #   KIMBALL'S SHAPE: a real dimension table of ETL runs, with the fact carrying an audit
      #   key — so you can filter a report to "rows loaded by last night's run" or slice a
      #   quality score exactly like any other dimension. That is the part people miss: it
      #   makes lineage QUERYABLE instead of only greppable in a log.
      #   THE MODERN EQUIVALENT, name it: _loaded_at / _batch_id / _source_file columns, and
      #   dbt's invocation_id. Same idea, cheaper, and usually enough.
      #   WHY IT EARNS ITS PLACE: "why is this number wrong?" is answered by finding which run
      #   produced the row. Without a stamp, the answer is a guess.
      # SOURCE (kimball): THE AUDIT DIMENSION — his answer to 'which run produced this row?'. See the beat above.
      - n: "35"
        slug: contracts-lineage-observability
        title: "Data Contracts, Lineage & Observability — Know What Broke, and Who Depends On It"
        credits:
