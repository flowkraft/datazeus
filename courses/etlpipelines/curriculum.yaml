  - slug: series2-maintainable-pipelines
    title: Pipelines You Can Maintain
    tagline: handle bad rows, late data and failures without hand-fixing
    level: intermediate
    episodes:
      - n: "00"
        slug: scripted-pipelines
        title: "Scripting a Pipeline — When a Script Beats a Chain of SQL Files"
        hands_on: ["koan:author"]
        core: true
        status: planned
