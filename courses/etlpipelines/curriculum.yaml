        title: "ETL vs ELT — Where the Transform Should Run, Now That You Have Done Both"
        hands_on: ["koan:choose", "koan:count:scanned"]
        core: true
        data:
          source: northwind_co_s
          tables: ["WebOrders.Payload", "Orders", "Order Details"]
          fit: good
          reason: "The same WebOrders-to-order-lines transform can run in the pipeline or be pushed down as SQL after landing raw, and rows scanned and moved differ visibly even at S; the decision needs no volume. The landed side is the learner's own raw copy from Series 1 (northwind_co_raw_s when built)."
