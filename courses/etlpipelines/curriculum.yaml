          fit: MISSING
          reason: "Needs volume for MERGE's scan cost to matter and a delta batch to merge, and neither M nor D2 is built. Build M (~1.25M order lines, composite key OrderID+ProductID) and D2 with its planned 0.5% of orders sent twice, so one batch holds two source rows for one target key: PostgreSQL MERGE errors, INSERT ... ON CONFLICT cannot touch a row twice in one statement, ClickHouse ReplacingMergeTree dedups only eventually. The design sheet names L for MERGE; M is the smallest scale that shows it."
