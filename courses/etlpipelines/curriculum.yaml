      # here and the vocabulary a whole series later.
      #
      # THE FIX IS TO KEEP THIS ONE IN BATCH TERMS, where it needs no formalism at all: late
      # means AFTER THE RUN THAT SHOULD HAVE INCLUDED IT. Monday's load ran at 02:00; the row
      # turned up at 02:30 carrying Monday's date. Everything in this episode — the
      # late-arriving fact, the late-arriving dimension, the inferred member — is expressible
      # that way and always was.
