        slug: parameterized-and-reusable-jobs
        title: "Parameterized & Reusable Jobs — One Script, Many Tables"
        hands_on: ["koan:complete"]
        core: true
        status: planned
      - n: "10"
        slug: data-quality-gates
        title: "Data Quality Gates — Nulls, Ranges and Referential Gaps, Before They Land"
        hands_on: ["koan:diagnose", "koan:complete"]
        core: true
        status: planned
      - n: "15"
        slug: deduplication-and-conformance
        title: "Deduplication & Conformance — One Customer, One Row"
        hands_on: ["koan:predict", "koan:diagnose"]
        core: true
        status: planned
      # ALSO OWNS LATE-ARRIVING DIMENSIONS, a DIFFERENT problem from late-arriving facts with
      # a different fix. Both belong in this episode; do not split them.
      #   LATE FACT       yesterday's sale turns up today, after you already reported. Fix:
      #                   reprocess the affected period (Series 3 - 25 does the backfill).
      #   LATE DIMENSION  the fact arrives first and references a customer the dimension has
      #                   never seen. You cannot drop the fact and you must not NULL the key.
      #                   Fix: insert an INFERRED MEMBER — a placeholder row carrying only the
      #                   business key and flagged as inferred — then let the real attributes
      #                   overwrite it when they arrive.
      #   THE TRAP WORTH A KOAN: if the placeholder is created by a Type 2 process it gets an
      #   effective-date range, and when the real row lands you must UPDATE that row rather
      #   than open a second version — otherwise every fact loaded in between points at a
      #   version that never really existed.
      # SOURCE (kimball): LATE-ARRIVING FACTS and LATE-ARRIVING DIMENSIONS, and the INFERRED MEMBER that fixes the second. See the beat above.
      - n: "20"
        slug: late-and-out-of-order-data
        title: "Late & Out-of-Order Data — Rows That Arrive After You Reported"
        credits:
          - source: kimball
            concept: "LATE-ARRIVING FACTS and LATE-ARRIVING DIMENSIONS, and the INFERRED MEMBER that fixes the second"
        tags: ["kimball"]
        hands_on: ["koan:rerun", "koan:predict"]
        core: true
        status: planned
      # ADDED 2026-08-24, and it closes the one genuine mainstream gap a full sweep of all twelve
      # tracks found: NOTHING anywhere mentioned PII, masking, anonymisation, retention or
      # deletion. Access CONTROL is taught twice (Data Ops 2 - 40 and BI 3 - 40 both cover
      # row-level security) but the DATA ITSELF was never addressed.
      # THE DAILY QUESTION, and it has a wrong answer that ends careers: "can I copy production
      # onto my laptop to debug this?" Everyone asks it, most teams answer it badly, and the
      # honest answer is "not like that — here is how".
      # WHAT THE EPISODE OWES:
      #   FIND IT       which columns are personal is a decision, not a guess. Names, emails,
      #                 phone numbers, addresses — and the ones people miss: free-text notes,
      #                 IP addresses, and an ID that is a national insurance number.
      #                 Data Modeling, Series 2 - 27 is where they get CLASSIFIED; this is
      #                 where the classification gets used.
      #   THREE OPTIONS, and when each is right: MASK (same shape, fake value), SYNTHESISE
      #                 (generated rows, no real person involved), SUBSET (fewer real rows,
      #                 still real — usually the wrong answer, say so).
      #   THE HARD PART, and this is the koan: MASKING MUST BE CONSISTENT OR THE JOINS BREAK.
      #                 If ALFKI becomes X7QP2 in Customers it must become X7QP2 in Orders too.
      #                 A deterministic mask keyed on the value is how; a random one per row
      #                 quietly destroys every foreign key, and the data still LOOKS fine.
      #                 `rerun` is the assertion: mask twice, get the same output both times.
      #   THE HONEST WARNING: a masked copy of production is still a copy. Fewer rules apply,
      #                 not none. Say that plainly rather than implying masking makes it free.
      # NOT legal advice, and the episode must not pretend to be — name GDPR/CCPA as the reason
      # the question exists and point at whoever owns compliance where the reader works.
      - n: "22"
        slug: personal-data-and-masking
        title: "Personal Data — Masking, Synthetic Rows and a Safe Copy of Production"
        hands_on: ["koan:diagnose", "koan:rerun", "koan:count:queries"]
        core: true
        status: planned
      - n: "25"
        slug: errors-retries-dead-letters
        title: "Errors, Retries & Dead Letters — Fail Without Losing Rows"
        hands_on: ["koan:capture", "koan:diagnose"]
        core: true
        status: planned
      # SOURCE (kimball): THE SURROGATE KEY PIPELINE — his name for swapping business keys to warehouse keys at load.
      # CORE, added 2026-08-24: Series 2 - 35 (load order) is core and depends on
      # this — you cannot load dimensions-before-facts without the key lookup that
      # makes the ordering necessary. A core episode resting on a non-core one is a
      # hole in the shortest path, and this is also just what anyone loading a
      # warehouse does every day.
      - n: "30"
        slug: surrogate-keys-and-lookups
        title: "Surrogate Keys & Dimension Lookups — Business Keys to Warehouse IDs"
        core: true
        credits:
          - source: kimball
            concept: "THE SURROGATE KEY PIPELINE — his name for swapping business keys to warehouse keys at load"
        tags: ["kimball"]
        hands_on: ["koan:complete"]
        status: planned
      # SOURCE (kimball): Dimensions before facts, and why. A direct consequence of the surrogate key pipeline.
      - n: "35"
        slug: load-order
        title: "Load Order — Dimensions First, Then Facts, and What Breaks Otherwise"
        credits:
          - source: kimball
            concept: "Dimensions before facts, and why"
        tags: ["kimball"]
        hands_on: ["koan:predict", "koan:diagnose"]
        core: true
        status: planned
      - n: "40"
        slug: cross-database-pipelines
        title: "Cross-Database Pipelines — Northwind PostgreSQL → ClickHouse"
        hands_on: ["koan:equivalent", "clickhouse"]
        status: planned
      - n: "45"
        slug: orchestration-and-dags
        title: "Orchestration & DAGs — Expressing Dependencies Instead of Chaining Cron Jobs"
        hands_on: ["koan:process:tool", "rundeck"]
        core: true
        status: planned

      # SERIES 2 PROJECT, added 2026-08-24. The series had none: the core path
      # walked ten episodes with nothing built at the end of them.
      # Series 2 is maintainability, and the thing that breaks first is order: dimensions before
      # facts, a quality gate before either, a dead-letter path for the rows that fail.
