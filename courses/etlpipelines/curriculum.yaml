      # MOVED 2026-09-02 from 22 to 27, so it sits AFTER the bad-data run rather than inside it.
      # Episodes 10, 15, 20 and 25 are one continuous argument — gate the bad rows, collapse the
      # duplicates, handle the ones that arrive late, and fail without losing the rest. Privacy
      # is a different axis, and dropping it into the middle of that run broke a sequence that
      # otherwise reads as a single idea.
