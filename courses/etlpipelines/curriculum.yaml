# The ordered episode list for ETL & Data Pipelines. Field docs live in courses/learnsql/curriculum.yaml.
# `short` is omitted until an episode has a video.
#
# The job this track teaches: get data from where it is to where it's useful, repeatedly,
# without losing or duplicating a row. Series 1 moves it safely, Series 2 keeps it
# maintainable, Series 3 is production flow at volume.

course: learn-etl-pipelines
track: etlpipelines
title: ETL & Data Pipelines

# Assumes Learn SQL, and always has without saying so: Series 1 · 20 is "Transform with SQL",
# and every load in the track is checked by counting rows. Data Modeling is NOT required — you
# load into a schema somebody else designed, which is the normal case.
prerequisites:
  - course: learn-sql
    needs: "Series 1"
    why: >-
      Every transform here is a SELECT and every check is a COUNT. You do not need clever SQL,
      but you need to know what the right answer looks like before a pipeline tells you.

excludes:
  - topic: "The SQL inside the transforms"
    where: "covered in Learn SQL"
  - topic: "Designing the target schema"
    where: "covered in Data Modeling"
  - topic: "Doing the T as version-controlled, tested models"
    where: "covered in Analytics Engineering (dbt) — this track owns Extract and Load"
  - topic: "cron internals, monitoring, alerting and on-call"
    where: "covered in Data Ops — here a pipeline just gets handed to the scheduler"

  # The language the pipeline is written in. Series 2 · 00 uses Groovy, but the track is about
  # the SHAPE of a load, not the syntax — and a reader who wants the language should be sent.
  - topic: "Learning the language you write the pipeline in"
    where: "covered in Python for Data and Java & Groovy for Data — either one; the pipeline shape here is the same in both"
  - topic: "The warehouse the data lands in — engines, partitions, compression"
    where: "covered in Data Warehousing — here it is a destination you load into"
  # Three tracks build a star schema and each is a different question. Said out loud because
  # meeting the third one is how a reader concludes we repeated ourselves.
  - topic: "Deciding what the star schema should be — grain, SCD type, star vs snowflake"
    where: "covered in Data Modeling, Series 3. In this course, Series 3 · 05 loads a star that somebody has already designed"

  # ETL 2 · 45 and Data Ops 3 · 00 are both about orchestrators, and a reader who meets the
  # second one needs to be told these are two questions, not one subject twice.
  - topic: "Choosing and running the scheduler itself — cron vs systemd vs an orchestrator"
    where: "covered in Data Ops, Series 3 · 00, which is choosing and running the scheduler. In this course, Series 2 · 45 is expressing your pipeline as a DAG, whatever ends up running it"

