        status: planned
      # The one modeling decision that is made once and is nearly impossible to reverse, which
      # is exactly why it belongs next to schema-evolution: episode 50 is about changes you
      # CAN make additively, and this is the change you cannot.
      #
      #   shared schema + tenant_id   cheapest, one migration for everyone, and every single
      #                               query is now one forgotten WHERE away from a data breach
      #   schema per tenant           real isolation, migrations multiply by tenant count
      #   database per tenant         strongest isolation and the biggest operational bill
