  # MOVEMENTS
  #   00-32  THE STANDARD METHOD  Kimball, in order, ending with the star actually built
  #   35-45  THE ALTERNATIVES     Data Vault, One Big Table, columnar — deliberately AFTER
  #                             the standard method, because you cannot judge Data Vault
  #                             without knowing star. Never reorder these two movements.
  #   50     BUILD IT           the OLTP -> star project, graded by reconciliation
  #
  # The only tagline that survived the 2026-08-24 pass unchanged: it already named a verb and
  # an artifact, and every episode already served it.
  # ╔══════════════════════════════════════════════════════════════════════════════════╗
  # ║  THIS SERIES TEACHES KIMBALL. WRITE IT IN HIS VOCABULARY.                        ║
  # ╚══════════════════════════════════════════════════════════════════════════════════╝
  # THE SOURCE: Ralph Kimball & Margy Ross, "The Data Warehouse Toolkit" (3rd ed., Wiley
  # 2013), with the loading material from Kimball & Caserta, "The Data Warehouse ETL Toolkit".
  # Nearly every episode from 00 to 32 presents one of his concepts. Each is tagged with a
  # one-line `# KIMBALL:` marker naming HIS term for it — `grep -rn "# KIMBALL:" courses/`
  # lists the full set across this track, Data Warehousing and ETL & Data Pipelines.
  #
  # THE RULE, and it is the whole reason for teaching the standard method rather than one
  # person's opinion: USE HIS WORDS. Grain, conformed dimension, degenerate dimension,
  # accumulating snapshot, factless fact table, bus matrix, drill-across. A reader who
  # finishes this series and then opens the book must recognise what they were taught on the
  # page in front of them. Explain each term in plain English on first use — never replace it
  # with a plainer invented one, because the invented one does not exist anywhere else.
  #
  # HOW TO CREDIT: the full rules — what is safe to teach and why, quoting, diagrams, book
  # covers, trademarks, the tag pages, and the disclaimer line to paste into the article —
  # live ONCE in courses/learnsql/curriculum.yaml under "HOW TO CREDIT, AND STAY OUT OF
  # TROUBLE". Read them before writing any episode in this series. The short version:
  #   the METHOD is an idea and ideas are free; his WORDS, DIAGRAMS and TABLES are not.
  #   Name him in the prose, Sources block with the ISBN, draw everything yourself, and
  #   never let the page read as though he wrote it or approved it.
  #
  # AND SAY WHERE HE IS NO LONGER THE ANSWER. 35-45 are the alternatives on purpose. Columnar
  # storage genuinely weakened some of his advice — that is honest, and an episode that
  # pretends 1996 rules still hold everywhere is worse than one that never cited him.

  - slug: series3-dimensional-modeling
    title: Dimensional Modeling
    tagline: design star schemas for reporting, not for transactions
    level: advanced
    episodes:
      # SOURCE (kimball): FACTS and DIMENSIONS — the core distinction the whole Toolkit is built on.
      - n: "00"
        slug: facts-and-dimensions
        title: "Facts & Dimensions — Why the Reporting Database Looks Nothing Like the App's"
        credits:
          - source: kimball
            concept: "FACTS and DIMENSIONS — the core distinction the whole Toolkit is built on"
        tags: ["kimball"]
        hands_on: ["koan:diagnose"]
        dataset: northwind:read
        core: true
        status: planned
      # The ER Diagram tab earns its keep here: SEEING the star is most of the lesson, and no
      # amount of prose substitutes for the shape.
      # KIMBALL'S PROCEDURE, and the single most transferable thing in the Toolkit: it is repeated
      # at the head of every chapter and it is what a person actually runs in a meeting.
      #   1. select the BUSINESS PROCESS   — orders, shipments, returns. Not a department, not
      #      a report. Picking a department is the classic first mistake and it produces a mart
      #      nobody else can join to.
      #   2. declare the GRAIN             — one row per WHAT. Series 1 · 10 taught this for
      #      OLTP; here it is the second step and everything downstream depends on it.
      #   3. identify the DIMENSIONS       — falls out of the grain, almost mechanically.
      #   4. identify the FACTS            — must be true at the declared grain, or you have
      #      the wrong grain.
      # WHY IT NEEDS ITS OWN EPISODE: 00 says WHY the reporting schema differs and 05 shows
      # WHAT a star looks like. Neither gives a repeatable METHOD, and without one every later
      # episode reads as a collection of tricks. Placed at 02 so it frames the whole series.
      # The koan is `choose`: same brief, two candidate grains, one of which cannot answer the
      # question that was asked.
      # SOURCE (kimball): THE FOUR-STEP DIMENSIONAL DESIGN PROCESS — repeated at the head of every chapter of the Toolkit. His numbering, his words.
      - n: "02"
        slug: four-step-design
        title: "The Four-Step Design — Pick the Process, Declare the Grain, Then Dimensions and Facts"
        credits:
          - source: kimball
            concept: "THE FOUR-STEP DIMENSIONAL DESIGN PROCESS — repeated at the head of every chapter of the Toolkit"
        tags: ["kimball"]
        hands_on: ["koan:choose", "brief"]
        dataset: library:brief
        core: true
        status: planned
      # SOURCE (kimball): THE STAR SCHEMA — his central artifact. Say 'dimensional model' and 'star schema' as he does.
      - n: "05"
        slug: the-star-schema
        title: "The Star Schema — fact_sales Plus Customer, Product and Date"
        credits:
          - source: kimball
            concept: "THE STAR SCHEMA — his central artifact"
        tags: ["kimball"]
        hands_on: ["tab:er-diagram"]
        dataset: northwind:read
        core: true
        status: planned
      # SOURCE (kimball): SNOWFLAKING — and his position, which is 'generally don't'. Give his reasoning, then the columnar-era caveat.
      - n: "10"
        slug: snowflake-vs-star
        title: "Snowflake vs Star — Normalizing Dimensions, and What It Costs You"
        credits:
          - source: kimball
            concept: "SNOWFLAKING — and his position, which is 'generally don't'"
        tags: ["kimball"]
        hands_on: ["koan:choose", "tab:er-diagram"]
        dataset: northwind:read
        status: planned
      # SOURCE (kimball): SLOWLY CHANGING DIMENSIONS, Types 1/2/3 — his numbering exactly. Name that 0 and 4-7 exist and where to read them.
      - n: "15"
        slug: slowly-changing-dimensions
        title: "Slowly Changing Dimensions — Type 1, 2 and 3, and Which to Pick"
        credits:
          - source: kimball
            concept: "SLOWLY CHANGING DIMENSIONS, Types 1/2/3 — his numbering exactly"
        tags: ["kimball"]
        hands_on: ["koan:choose", "koan:diagnose", "build:star"]
        dataset: northwind:star
        core: true
        status: planned
      # Retitled: grain itself moved to S1/10, where it belongs as a property of any table.
      # What is left here is the FACT-TABLE-specific half — additivity, and the semi-additive
      # measures that make SUM quietly wrong.
      # SOURCE (kimball): DECLARE THE GRAIN, and ADDITIVE / SEMI-ADDITIVE / NON-ADDITIVE facts — all three terms are his.
      - n: "20"
        slug: grain-and-additivity
        title: "Fact Grain & Additivity — The Measures You Must Not SUM"
        credits:
          - source: kimball
            concept: "DECLARE THE GRAIN, and ADDITIVE / SEMI-ADDITIVE / NON-ADDITIVE facts — all three terms are his"
        tags: ["kimball"]
        hands_on: ["koan:predict", "koan:diagnose", "build:star"]
        dataset: northwind:star
        core: true
        status: planned
      # THE BIGGEST GAP IN THE SERIES, and pure daily work. Kimball's three fact grains plus the
      # fourth kind, none of which was anywhere in the academy:
      #   TRANSACTION           one row per event. The default, and what Series 3 · 05 built.
      #   PERIODIC SNAPSHOT     one row per entity per period — daily balance, month-end stock.
      #                         This is where SEMI-ADDITIVE bites: you may SUM across product
      #                         but never across time. Series 3 · 20 named the rule; this is
      #                         the table shape that forces you to obey it.
      #   ACCUMULATING SNAPSHOT one row per pipeline instance, UPDATED as it progresses —
      #                         ordered, shipped, delivered, invoiced, paid, each with its own
      #                         date column and its own lag. The only fact table you update in
      #                         place, and the answer to "how long does an order take?".
      #   FACTLESS              rows for events with no measure, and the coverage table for
      #                         things that did NOT happen. "Which products had no sales in
      #                         March" cannot be answered from a transaction fact at all.
      # NORTHWIND HAS ALL FOUR sitting in it: Orders is transactional, order-to-ship-to-deliver
      # is an accumulating snapshot waiting to be built, month-end stock is a periodic one, and
      # the promotion-with-no-sales question is factless.
      # Placed at 22, immediately after grain and additivity (20), because the fact type FOLLOWS
      # from the grain — it is step 2 of the four-step method paying out.
      # ALSO OWNS THE NO-NULL-FOREIGN-KEY RULE, folded in here rather than given an episode
      # because it is one paragraph and one habit — but it is universal, and a fact table with
      # NULL keys silently drops rows from every report that joins them.
      #   THE RULE: a fact's dimension key is NEVER NULL. If the value is missing, point it at
      #   a real dimension row that MEANS missing.
      #   THE ROWS EVERY DIMENSION NEEDS: an "Unknown" member (we do not know yet) and a
      #   "Not Applicable" member (there will never be one). Different meanings; collapsing
      #   them loses something a business user will eventually ask about. Give them fixed
      #   surrogate keys (conventionally 0 and -1) so they survive a reload.
      #   WHY IT BELONGS WITH FACT TYPES: an accumulating snapshot spends most of its life
      #   half-populated — an order placed but not shipped has no ship date and no shipper.
      #   That is where a reader first meets the problem.
      # SOURCE (kimball): TRANSACTION, PERIODIC SNAPSHOT and ACCUMULATING SNAPSHOT fact tables, plus FACTLESS FACT TABLES. His four shapes, his names.
      - n: "22"
        slug: fact-table-types
        title: "Fact Table Types — One Row per Event, per Period, or per Pipeline"
        credits:
          - source: kimball
            concept: "TRANSACTION, PERIODIC SNAPSHOT and ACCUMULATING SNAPSHOT fact tables, plus FACTLESS FACT TABLES"
        tags: ["kimball"]
        hands_on: ["koan:choose", "koan:predict", "cloudbeaver"]
        dataset: northwind:star
        core: true
        status: planned
      # ALSO ANSWER "WHAT ABOUT THE TIME OF DAY", in a paragraph, because it is the first
      # question anyone asks about a date dimension and the wrong answer is expensive.
      #   DO NOT put hours and minutes in the date dimension. One row per day over twenty
      #   years is ~7,300 rows; one row per minute is ~10.5 million, and every join to it gets
      #   slower for a precision most reports never use.
      #   INSTEAD: either a SEPARATE time-of-day dimension (1,440 rows, one per minute, with
      #   attributes like shift, peak/off-peak, business hours) joined by its own key — or,
      #   for most cases, just keep the raw timestamp as a column ON the fact and use the date
      #   key for the day. Kimball allows both, and the timestamp is fine unless you need to
      #   GROUP BY something like "shift" that only a dimension can name.
      #   WHO ACTUALLY NEEDS THE DIMENSION: call centres, manufacturing, trading, web
      #   analytics, IoT — anywhere "which hour" is a real business question. Say that, so a
      #   reader in a monthly-reporting job knows they can skip it.
      # SOURCE (kimball): THE DATE DIMENSION, and the separate TIME-OF-DAY DIMENSION. He insists on an explicit table; say why.
      - n: "25"
        slug: the-date-dimension
        title: "The Date Dimension — Why a Calendar Table Beats date_trunc"
        credits:
          - source: kimball
            concept: "THE DATE DIMENSION, and the separate TIME-OF-DAY DIMENSION"
        tags: ["kimball"]
        hands_on: ["koan:diagnose", "build:star"]
        dataset: northwind:star
        status: planned
      # THREE SMALL PATTERNS, universal, and cheap to teach — which is why leaving them out was
      # indefensible rather than a judgement call.
      #   ROLE-PLAYING   one Date dimension joined three times under three names. NORTHWIND HAS
      #                  THE EXAMPLE BUILT IN: OrderDate, RequiredDate, ShippedDate. A reader
      #                  who has not met this builds three date tables, and then cannot compare
      #                  "ordered in March" with "shipped in March".
      #   DEGENERATE     the order number that lives IN the fact with no dimension table of its
      #                  own. Northwind's OrderID, exactly. People invent a dim_order for it.
      #   JUNK           a handful of low-cardinality flags collapsed into one small dimension
      #                  instead of five columns on a hundred-million-row fact.
