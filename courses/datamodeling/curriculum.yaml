# The ordered episode list for Data Modeling. Field docs live in courses/learnsql/curriculum.yaml.
# `short` is omitted until an episode has a video.
#
# The job this track teaches: turn what a business does into tables that tell the truth — and be
# able to prove that they do. Series 1 models a business the learner already knows, Series 2
# designs one from a blank page and keeps it alive through change, Series 3 reshapes a model
# for analytics.
#
# ============================================================================
# THE COURSE IN ONE PAGE — restructured with the owner, 2026-09-14
# ============================================================================
# Until 2026-09-14 Series 1 was "recover Northwind's missing integrity layer". That made the
# vehicle the goal: "do the real rows load?" can only grade PHYSICAL decisions (keys, NOT NULL,
# CHECK), so the build episodes drifted to the physical layer and the project had no modelling
# decision left in it. The rebuild survives as part of the proof; it is no longer the promise.
#
# THE MODELLING LOOP. Every episode runs it, the way Learn SQL runs its SQL thinking loop:
#
#   LISTEN   say the business in sentences          "a customer places orders"     conceptual
#   DRAW     entities, relationships, cardinality   Crow's Foot, authored as text  logical
#   SHAPE    grain, keys, normal forms, time        one row per what?              logical
#   BUILD    types, constraints, DDL                CREATE TABLE                   physical
#   PROVE    run the proofs below                   load, bounce, answer
#
# The three layers are the stations of the loop, not a slide to memorise.
#
# THE PROOFS. Machine-checked, and they GROW across the course — one or more per series:
#
#   FITS        the business's real rows load into the model               Series 1
#   REFUSES     impossible data bounces, and possible data still loads     Series 1
#   ANSWERS     the business's questions return the right numbers          Series 1
#   SURVIVES    a change lands as a migration; every earlier test passes   Series 2 (from 50)
#   RECONCILES  the analytics model's totals equal the source's            Series 3
#
# ONE DATASET, ONE VERB, ONE ARTIFACT PER SERIES. Apply this test before adding any episode:
#
#   Series 1   Northwind   MODEL it, with the method          -> the learner's Northwind model
#   Series 2   Library     DESIGN from a blank page, SURVIVE  -> the learner's library schema
#   Series 3   Northwind   RESHAPE for analytics              -> a star that reconciles
#
# Every concept is met more than once, deliberately: first on Northwind (Series 1), deeper on
# the learner's own library (Series 2), and for analytics (Series 3) — grain 1·15 -> 3·15, keys
# 1·15 -> 2·10, many-to-many 1·20 -> 2·15, time 1·30 -> 2·25/2·30, subtypes 1·35 -> 2·60,
# normal forms 1·25 -> 2·35/2·40, NULL 1·52 -> the "Unknown" dimension row. A Series 2 brief
# names the Series 1 episode it goes past; if it cannot go past it, it is a repeat.
#
# Within a series the episodes fall into MOVEMENTS, written out on each series below. An
# episode that belongs to none of its series' movements is in the wrong series.
#
# ============================================================================
# THE DATA — three schemas, one file
# ============================================================================
#   main.*       NORTHWIND AS SHIPPED. Real business data and NO declared keys or constraints.
#                It is the source of rows the learner loads, and the undeclared schema that
#                Series 1 · 57 reverse-engineers and judges. Nobody models IN it.
#   practice.*   THE LEARNER'S. Same database file, their own schema: their Northwind model in
#                Series 1 (grown as practice/schema.sql) and their library in Series 2.
#
# The mechanism is that main and practice sit in the same file, so the load IS the test:
#     INSERT INTO practice.<their table> SELECT ... FROM main."Order Details";
# A model that does not match the business cannot accept the business's own rows.
#
# Do not add keys to main.*: 57 needs a schema that declares nothing, and the learner's model is
# where constraints belong. schema.sql REBUILDS rather than ALTERs, because DuckDB (tested,
# v1.5.4) cannot ADD FOREIGN KEY, ADD UNIQUE or ADD CHECK; it is re-runnable, which is why
# `zeus practice reset` exists.
#
# MEASURED on the shipped northwind.duckdb (DuckDB v1.5.5, 2026-09-14) — use these, not memory:
#   25 customers, 79 orders, 193 order lines, 20 products, 6 suppliers, 3 shippers, 3 employees,
#   8 categories; order-line revenue 58153.31. Territories, EmployeeTerritories, Region and
#   CustomerDemographics hold 0 rows. Customers.Email is NULL on every row; Region on 21 of 25.
#   main.fact_sales / dim_* are a SEPARATE star ReportBurster generates for pivot-table volume
#   (NorthwindOlapDataGenerator, seed 42): 30 invented customers, 16 products, net revenue
#   4354846.73, no order number, a 28-day calendar. Decided 2026-09-14: it is never a reference
#   answer — Series 3 reconciles against the OLTP tables — and it IS the "star somebody else
#   built" that Series 3 · 25 and · 30 judge.
#   THE SERIES 3 SEED (PART 0 of practice-template/star.sql, schema `seed`) adds what Northwind
#   does not ship: stock movements, monthly sales targets, employee territories. main.* untouched.
#
# THE LIBRARY (Series 2) is the model the learner INVENTS: courses/datamodeling/brief/, handed
# over as the prose brief with its ambiguities left in, the messy lending-log.csv, and an
# acceptance suite that grades through views the learner writes, never through their table
# names. It is far from Northwind on purpose — pick e-commerce and they transcribe what they
# just read. ONE library schema across the whole series: design it at 05, get bitten at 10.
#
# ============================================================================
# HOW THIS TRACK IS PRACTISED — decided with the owner 2026-09-14
# ============================================================================
# VIDEO + ARTICLE + THE LEARNER'S WORKING FILE + ONE CHECK SUITE PER SERIES + ANKI CARDS.
# No per-episode koans. Learn SQL's koans fit SQL: blank a token, run it against real rows,
# compare — one right answer. A modelling decision has several right answers, and the
# predict / diagnose / choose "koans" this track used to plan were multiple-choice quizzes
# dressed as Groovy. They were dropped rather than forced.
#
#   THE WORKING FILE   where the practice happens, one per series: practice/schema.sql
#                      (Series 1), the learner's library schema (Series 2), practice/star.sql
#                      (Series 3). Every article ends with ONE "your turn" decision made in it.
#   THE CHECK SUITE    one file per series, growing episode by episode — the way a team's CI
#                      checks a schema. Each check is named after a BUSINESS RULE, never a
#                      constraint, and reads only views of fixed name and shape that the learner
#                      writes, never their table names: any model that passes is a correct
#                      answer, including ones we did not think of. Pair every "must refuse" with
#                      a "must still accept", or the learner bolts constraints onto everything.
#                        tests/src/koans/_todo/datamodeling/series1/NorthwindModelChecks.groovy
#                        tests/src/koans/_todo/datamodeling/series2/LibraryChecks.groovy
#                        tests/src/koans/_todo/datamodeling/series3/StarChecks.groovy
#   THE CARDS          an Anki deck per lesson (cards/cards.yaml, built by tools/build-anki.py,
#                      Learn SQL's format), written WITH the lesson. The judgement questions live
#                      here: rules, vocabulary, and "a customer moves city — which SCD type?"
#                      scenarios. Self-contained: no database, no Northwind recall.
#   THE TABS           a DataPallas connection tab, named in the prose: Database Schema
#                      (physical), ER Diagram (PlantUML — text, so it can be authored and diffed),
#                      Ubiquitous Language (the glossary). Tabs demonstrate the skill; they never
#                      are the skill.
#
# THE `hands_on` FIELD. Every episode carries `cards` AND at least one thing that is practised
# rather than reviewed (a check, a build, a tab or the brief) — cards alone would be a lecture.
#   check:fits        the business's real rows load into the learner's model
#   check:refuses     impossible rows bounce, each paired with a possible row that still loads
#   check:answers     the business's questions come back with the right numbers
#   check:survives    after a migration, every earlier check is still green
#   check:reconciles  the star's totals equal the source's totals
#   cards             this lesson's Anki deck
#   tab:er-diagram | tab:database-schema | tab:domain-grouped-schema | tab:ubiquitous-language
#   cloudbeaver       needs PostgreSQL — a feature DuckDB does not have
#   brief             works from the library brief in courses/datamodeling/brief/
#   build:schema.sql  Series 1 — the learner's Northwind model, practice/schema.sql
#   build:library     Series 2 — the learner's library schema
#   build:star        Series 3 — practice/star.sql
# Every series has at least one `build:` entry; a series without one produces nothing.
#
# THE `dataset` FIELD:
#   northwind:read   reads main.* only — the data, the diagram, the tabs. Builds nothing.
#   northwind:model  builds the learner's Northwind model in practice.*, loaded from main.*
#   northwind:star   builds the star (schema star) from the learner's Series 1 views, plus the seed
#   library:brief    the brief and the spreadsheet; no database yet
#   library          the learner's library schema in practice.*
#   (library+northwind and case-study are still valid values; nothing uses them since 2026-09-14)
#
# ============================================================================
# THE SHAPE OF AN EPISODE — four beats, every time
# ============================================================================
#   1. THE SITUATION  the concrete moment at work where this bites. Never "normalization is
#                     the process of…". The hook in the title is the one-line version.
#   2. THE DECISION   the modelling choice itself. Name the alternatives NOT picked, and why —
#                     the alternatives are the lesson.
#   3. THE PROOF      the learner sees it for themselves, via `hands_on`. Non-negotiable: if
#                     beat 3 cannot be written, the episode is not ready.
#   4. THE COST       what the decision buys and what it will cost later. An episode that
#                     presents a choice as free is teaching a rule instead of judgement.
#
# WHEN IS A PROJECT `core`? If the core path includes a series at all, it MUST include that
# series' project — otherwise the shortest path has no proof point for the series.

course: learn-data-modeling
track: datamodeling
title: Data Modeling

# ============================================================================
# PREREQUISITES — what you need before episode 1, and why
# ============================================================================
# Kept deliberately SHORT. A long prerequisite list is a wall; the honest answer here is
# "one series and one statement", so say exactly that.
prerequisites:
  - course: learn-sql
    needs: "Series 1 entire, plus INSERT from Series 2 · 55"
    why: >-
      Series 1 models Northwind, the business you queried all through Learn SQL: you decide what
      its tables should be, load its real rows into them, and run your first report again on
      your own model. You should already be comfortable with SELECT, WHERE, JOIN and GROUP BY,
      and able to INSERT rows selected from another table, so your attention goes on the
      modelling and not on the SQL.

excludes:
  - topic: "Writing queries against these schemas"
    where: "covered in Learn SQL"
  - topic: "Loading the model — pipelines, SCD-2 loads, backfills"
    where: "covered in ETL & Data Pipelines and Analytics Engineering with dbt"
  - topic: "Loading, querying and running a warehouse at scale, and columnar engine design"
    where: "covered in Data Warehousing — this course designs the star and proves it on small data"
  - topic: "Running, tuning and migrating the live database"
    where: "covered in Data Ops — this track designs the change, that one ships it safely"
  # Subjects that share a keyword with another track and are two different questions.
  - topic: "EXPLAIN, index internals and making a slow query fast"
    where: "covered in Learn SQL, Series 3. In this course, Series 2 · 40 makes only the design call, before the query exists"
  - topic: "NULL semantics — three-valued logic, and why `= NULL` never matches"
    where: "covered in Learn SQL, Series 1 · 45, which is what NULL does to a query. In this course, Series 1 · 52 is whether the column should allow NULL at all — a different question that happens to share the word"
  - topic: "Querying JSON once it is in a column"
    where: "covered in Learn SQL, Series 3, which queries JSON once it is there. In this course, Series 2 · 42 asks only whether it should be JSON in the first place"
  # NEAR-DUPLICATES with Data Model Patterns: we teach the TECHNIQUE and how to choose; that
  # track hands over the pattern the industry already settled on. Said out loud, both ways.
  - topic: "The Party model, order-to-cash, work effort — the patterns themselves"
    where: "covered in Data Model Patterns — here you learn to decide, there you inherit decisions already proven"
  - topic: "Contact mechanisms, effective dating, type and status tables and hierarchies as ready-made patterns"
    where: "covered in Data Model Patterns, which hands over the settled pattern. In this course, Series 1 · 05, Series 2 · 20, Series 2 · 25 and Series 2 · 32 teach how to choose"
  # MOVED OUT 2026-09-14, both to Schema Teardowns: each could only be taught from real systems
  # much larger than either of this course's datasets.
  - topic: "Subject areas and bounded contexts — finding your way around a 200-table schema"
    where: "covered in Schema Teardowns, Series 1 · 00, on real schemas of that size"
  - topic: "Multi-tenancy — how one product keeps its customers' data apart"
    where: "covered in Schema Teardowns, Series 2 · 25, from products that live the decision"
  - topic: "How real shipped applications actually modelled it"
    where: "covered in Schema Teardowns — that track is field evidence, this one is method"

series:
  # MOVEMENTS — the loop's layers in order, conceptual -> logical -> physical -> proof
  #   00-10  THE BUSINESS    sentences, entities, relationships. Nothing is built from a
  #                          table yet; everything is built from what the business SAYS.
  #   15-35  THE SHAPE       grain & keys, many-to-many, normal forms, copies that are really
  #                          history, subtypes. schema.sql is born at 15.
  #   40-55  THE BUILD       types, foreign keys, constraints, what NULL means, the DDL and
  #                          its names. Relationships drawn at 10/20 get declared at 45.
  #   57-60  JUDGE & PROVE   someone else's schema, then your own, graded by the proofs.
  #
  # NORTHWIND IS THE BUSINESS, NOT A SET OF TABLES TO RESTORE. The learner knows it from Learn
  # SQL, which frees their attention for the modelling. Its shipped schema is something to
  # JUDGE (57) and COMPARE against (60), never the answer being copied — and two requirements
  # the shipped tables cannot hold (several contacts per customer at 05, several suppliers
  # per product at 20) make sure the learner's model has to be designed, not transcribed.
  #
  # RESTRUCTURED 2026-09-14 with the owner. Before, the series was "RECOVER Northwind's
  # missing integrity layer": its build episodes were almost all physical (keys, types,
  # constraints) because "do the real rows load?" can only grade physical decisions, and its
  # project had no modelling decision left to make. Merged: layers into 00; entities split
  # from relationships; reverse-engineering + anti-patterns into 57; DDL + naming into 55.
  # New: 30 copy-or-reference, 35 supertypes-and-subtypes. Moved out: subject areas, to
  # Schema Teardowns, Series 1 · 00.
  - slug: series1-modeling-fundamentals
    title: Modeling Fundamentals
    tagline: model a business you already know, from its sentences to tables that prove themselves
    level: beginner
    episodes:
      # THE ORIENTATION EPISODE, the counterpart of Learn SQL's "SQL thinking loop". One full
      # turn of the MODELLING LOOP on something tiny — listen, draw, shape, build, prove — and
      # the toolchain: the practice schema, the ER Diagram tab, the checks and the cards.
      # The three layers (conceptual, logical, physical) are taught HERE, as the stations of the
      # loop, not as a lecture of their own. The hook: Leo has queried Northwind for twelve
      # lessons and cannot say what the company actually does.
      - n: "00"
        slug: start-here
        title: "Start Here: The Modeling Loop — From What a Business Does to Tables That Prove It"
        short: "Start Here: The Modeling Loop — business to tables"
        hands_on: ["check:fits", "check:refuses", "tab:er-diagram", "build:schema.sql", "cards"]
        dataset: northwind:model
        core: true
        status: planned
      # The first modelling DECISION, and the one every later episode depends on: is this a
      # thing the business keeps track of, or a fact about such a thing? Northwind's own schema
      # answers it three different ways, which is what makes it a good teacher here.
      - n: "05"
        slug: entities-and-attributes
        title: "Entities & Attributes — Is It a Thing, or a Fact About a Thing?"
        short: "Entities & Attributes — thing or fact?"
        tags: ["chen"]
        credits:
          - source: chen
            concept: "ENTITIES and ATTRIBUTES — the first half of his entity-relationship model"
        hands_on: ["tab:er-diagram", "build:schema.sql", "cards"]
        dataset: northwind:read
        core: true
        status: planned
      # Business rules are SENTENCES before they are lines: "every order is placed by exactly one
      # customer; a customer may have placed none". This episode is the translation in both
      # directions, and the diagram is AUTHORED (PlantUML text in the ER Diagram tab), not only
      # read — authoring it is what Series 2 then asks of a blank page.
      - n: "10"
        slug: relationships-cardinality-optionality
        title: "Relationships, Cardinality & Optionality — Business Rules as Lines on a Diagram"
        short: "Relationships & Cardinality — rules as lines"
        tags: ["chen"]
        credits:
          - source: chen
            concept: "RELATIONSHIPS and the ER diagram — the second half of his entity-relationship model"
        hands_on: ["tab:er-diagram", "cards"]
        dataset: northwind:read
        core: true
        status: planned
      # GRAIN, pulled forward from Series 3: "one row per WHAT?" is the first question of ANY
      # table, answered before a key can be chosen. schema.sql is born here.
      # The demonstration writes itself, and the data is the grader: declare PRIMARY KEY("OrderID")
      # on the order lines, load the real rows, and they refuse — the grain is (OrderID, ProductID).
      # Learn SQL, Series 2 · 15 collects on grain from the query side, as do Data Warehousing and dbt.
      - n: "15"
        slug: grain-and-keys
        title: "Grain & Keys — One Row per What, and What Makes It Unique"
        short: "Grain & Keys — one row per what?"
        tags: ["kimball"]
        credits:
          - source: kimball
            concept: "GRAIN is his word, and step 2 of the four-step design"
        hands_on: ["check:fits", "check:refuses", "build:schema.sql", "cards"]
        dataset: northwind:model
        core: true
        status: planned
      # 1:M is a foreign key; M:N needs a table of its own. The attributed junction is the COMMON
      # case, not the exotic one: Northwind's order line carries Quantity, Discount and UnitPrice.
      # The second requirement of the series lands here: a product can come from several
      # suppliers, each at its own price — which Products.SupplierID cannot hold.
      - n: "20"
        slug: many-to-many-and-junction-tables
        title: "Many-to-Many & Junction Tables — When the Link Is the Real Thing"
        short: "Many-to-Many & Junction Tables — the link is a thing"
        hands_on: ["check:fits", "check:answers", "build:schema.sql", "cards"]
        dataset: northwind:model
        core: true
        status: planned
      # Let the anomaly carry the argument, not the definitions. And the flat table needs NO new
      # dataset: it is Learn SQL, Series 1 · 50's own three-table report query, saved as one
      # table. Rename a customer in it, miss one row, and the report shows two companies.
      # The job is "3NF-ish, then denormalize where it hurts"; Series 2 · 35 and 40 finish that
      # sentence. Do not finish it here.
      - n: "25"
        slug: normalization-1nf-3nf
        title: "Normalization: 1NF, 2NF, 3NF — Functional Dependencies and the Update That Goes Half-Wrong"
        short: "Normalization: 1NF, 2NF, 3NF — updates that go wrong"
        tags: ["codd"]
        credits:
          - source: codd
            concept: "E. F. Codd's relational model — 1NF, 2NF and 3NF are his normal forms"
        hands_on: ["check:answers", "build:schema.sql", "cards"]
        dataset: northwind:model
        core: true
        status: planned
      # NEW 2026-09-14. The judgement that stops normalization from becoming dogma: some
      # duplication is redundancy, and some is HISTORY. Northwind has both cases built in:
      # "Order Details"."UnitPrice" copies Products."UnitPrice", and Orders.Ship* copies the
      # customer's address. Remove either "redundancy" and the past rewrites itself.
      # Series 2 · 25 takes business time further, on the learner's own library.
      - n: "30"
        slug: copy-or-reference
        title: "Copy or Reference — When Duplicated Data Is Really a Point-in-Time Fact"
        short: "Copy or Reference — copies that are history"
        hands_on: ["check:answers", "build:schema.sql", "cards"]
        dataset: northwind:model
        core: true
        status: planned
      # NEW 2026-09-14 — generalisation had no episode anywhere in the course. Four Northwind
      # tables repeat a company or person name, an address and a phone. Are they one kind of
      # thing in different roles, or four things? The three implementations are the choice:
      # one table with a type, a table per subtype, or a shared parent with subtype tables.
      # Series 2 · 60 (ebooks) forces the same choice onto the learner's own model.
      # Boundary: Data Model Patterns, Series 1 hands over the Party model as the settled answer;
      # here the learner learns to make the call.
      - n: "35"
        slug: supertypes-and-subtypes
        title: "Supertypes & Subtypes — Customers, Suppliers, Shippers, Employees: One Thing or Four?"
        short: "Supertypes & Subtypes — one thing or four?"
        hands_on: ["tab:er-diagram", "build:schema.sql", "cards"]
        dataset: northwind:read
        core: true
        status: planned
      # The first physical episode. Types were used as given since 15; now they are decisions.
      # DuckDB has no CREATE DOMAIN (tested) though ENUM covers much of it — the DOMAIN half is
      # done in CloudBeaver against PostgreSQL, and "this exists there and not here" is content.
      - n: "40"
        slug: data-types-and-domains
        title: "Data Types & Domains — The Physical Choice That Is Hardest to Undo"
        short: "Data Types & Domains — hardest to undo"
        hands_on: ["tab:database-schema", "cloudbeaver", "check:fits", "build:schema.sql", "cards"]
        dataset: northwind:model
        core: true
        status: planned
      # What 10 and 20 DREW, declared. Northwind's rows are referentially clean (verified: no
      # orphans), so every correct FK loads — the payoff is the NEXT bad insert, not an old row.
      # DuckDB has no ON DELETE CASCADE (tested): name it as a portability fact.
      - n: "45"
        slug: foreign-keys-and-referential-integrity
        title: "Foreign Keys & Referential Integrity — Relationships the Database Enforces, Not Just Draws"
        short: "Foreign Keys & Referential Integrity — enforced"
        hands_on: ["check:refuses", "build:schema.sql", "cards"]
        dataset: northwind:model
        core: true
        status: planned
      # The data grades the rules: NOT NULL on "Region" is REJECTED (21 of 25 customers have
      # none) and CHECK("UnitPrice" > 10) is REJECTED (a 4.50 product exists). A constraint
      # reality violates is a bug, not rigour. Pair every shouldReject with a shouldAccept, or
      # the learner learns to over-constrain.
      - n: "50"
        slug: constraints
        title: "NOT NULL, UNIQUE, CHECK & DEFAULT — Rules That Match Reality"
        short: "NOT NULL, UNIQUE, CHECK & DEFAULT — true rules"
        hands_on: ["check:fits", "check:refuses", "build:schema.sql", "cards"]
        dataset: northwind:model
        core: true
        status: planned
      # NULL as a DECISION, answered before NOT NULL is declared: is this value optional, is the
      # fact simply not there yet, or does its absence mean a different KIND of thing?
      # Boundary: Learn SQL, Series 1 · 45 owns NULL SEMANTICS (three-valued logic). This owns the
      # design call. Each lesson names the other.
      - n: "52"
        slug: null-as-a-design-decision
        title: "Nullable, Missing Row or Separate Table — What an Empty Cell Should Mean"
        short: "Nullable, Missing Row or Separate Table — empty cells"
        hands_on: ["check:fits", "build:schema.sql", "cards"]
        dataset: northwind:model
        core: true
        status: planned
      # The round trip, performed: diagram (logical) -> DDL (physical) -> load (proof). Late on
      # purpose — CREATE TABLE arrives as the OUTPUT of the decisions, not as the first lesson.
      # Naming is part of writing the DDL well, so it is here: "Order Details" has a space and
      # must be quoted forever; ShipVia vs ShipperID is a role name. The Ubiquitous Language tab
      # turns "pick good names" into a glossary kept against the database.
      - n: "55"
        slug: diagram-to-ddl-and-naming
        title: "From Diagram to DDL — CREATE TABLE, and Names a Colleague Can Read"
        short: "From Diagram to DDL — CREATE TABLE and names"
        hands_on: ["tab:er-diagram", "tab:ubiquitous-language", "build:schema.sql", "cards"]
        dataset: northwind:model
        core: true
        status: planned
      # Reverse-engineering and anti-patterns in one episode, because reading a schema and judging
      # it are one skill. Placed after the build because judging needs the whole toolkit: you
      # cannot see that EAV destroyed the grain until you know what grain is.
      # TEACH IT FAIRLY: every smell was a reasonable decision under some pressure. For each —
      # what it solved, what it costs, and what you do when you inherit one and cannot rewrite it.
      # Boundary: Data Model Patterns, Series 3 argues the fully generic model properly; point at it.
      - n: "57"
        slug: judge-a-schema
        title: "Reading a Schema You Didn't Design — Reverse-Engineer It, Then Judge It Fairly"
        short: "Reading a Schema You Didn't Design — judge it"
        tags: ["karwin"]
        credits:
          - source: karwin
            concept: "ENTITY-ATTRIBUTE-VALUE and JAYWALKING (a comma-separated list in a column) are his named antipatterns"
        hands_on: ["tab:er-diagram", "cards"]
        dataset: northwind:read
        core: true
        status: planned
      # THE SERIES 1 PROJECT. The whole loop, alone, on Northwind's business as it runs today plus
      # the two requirements its shipped tables cannot hold (several contacts per customer, from
      # 05; several suppliers per product, each at its own price, from 20).
      # Three artifacts, one per layer: the business in sentences, the ER diagram, schema.sql plus
      # the load from main.*. Graded by the three Series 1 proofs:
      #   FITS     every real row loads into the learner's model
      #   REFUSES  a hidden set of impossible inserts bounces, each paired with a possible one
      #   ANSWERS  Learn SQL, Series 1 · 50's report, run on the learner's model, still totals
      #            58153.31 with Cactus Comidas para llevar on top
      # The old "rebuild the integrity layer" is still inside it (FITS + REFUSES); what it adds is
      # that conceptual and logical decisions are graded too. Commit before reveal, as Series 2 · 05.
      - n: "60"
        slug: project-model-northwind
        title: "Project — Model Northwind's Business: A Schema That Fits, Refuses and Answers"
        short: "Project — Model Northwind's Business"
        tags: ["project"]
        hands_on: ["check:fits", "check:refuses", "check:answers", "tab:er-diagram", "build:schema.sql", "cards"]
        dataset: northwind:model
        core: true
        status: planned

  # MOVEMENTS
  #   00-05  ELICIT & DESIGN       brief -> questions -> the learner's first model, loaded from the
  #                                spreadsheet. Committed to BEFORE they see ours.
  #   10-32  THE BILL COMES DUE    every episode is a decision made in 05 coming back to be judged,
  #                                on the learner's own schema, while they still remember making it.
  #   35-42  HOW FAR TO GO         how normalized, how redundant, how much structure at all.
  #   50     GO LIVE               the library starts using the model. From here every change is a
  #                                migration and the whole existing suite must stay green.
  #   60     SURVIVE               three change requests against the learner's live schema.
  #
  # SERIES 1 TAUGHT THE LOOP ON A BUSINESS THE LEARNER KNEW; SERIES 2 TAKES THAT AWAY. It is not
  # Series 1 again on another dataset: every episode must go past the Series 1 episode it builds
  # on, and its brief names which.
  #
  # THE PROOFS: fits (lending-log.csv loads — rows breaking a CORRECT rule are set aside, never
  # allowed to weaken it), refuses (the acceptance suite), answers (the librarian's own
  # questions), and — new in this series — SURVIVES, from 50 on.
  #
  # RESTRUCTURED 2026-09-14 with the owner. 10 and 15 reframed (the spreadsheet shows ISBN is
  # an EDITION's key; the loan is a relationship whose pair repeats). 27 new: rules across rows.
  # 25 moved off Northwind (its price example is Series 1 · 30 now). 40 denormalization and 45
  # indexing merged into 40. Moved out: multi-tenancy, to Schema Teardowns, Series 2 · 25;
  # oltp-vs-olap-models, to Series 3 · 00.
  - slug: series2-modeling-for-the-real-world
    title: Modeling for the Real World
    tagline: design a schema from a brief nobody finished writing, then keep it alive as the business changes
    level: intermediate
    episodes:
      # The elicitation half of the job. Read the brief, find the nouns and the verbs — and NOTICE
      # THE AMBIGUITIES it deliberately leaves in. "Can a member borrow two copies of the same
      # title at once?" is unanswerable from the text; realising you must ASK is the skill.
      # The deliverable is three lists: entities, open questions, and the questions the model
      # must be able to answer (the ANSWERS proof for the rest of the series).
      - n: "00"
        slug: requirements-to-entities
        title: "From a Brief to a Table List — The Nouns, the Verbs and the Questions to Ask"
        tags: ["evans"]
        credits:
          - source: evans
            concept: "UBIQUITOUS LANGUAGE — the shared vocabulary between the business and the model, 'Domain-Driven Design' (2003)"
        hands_on: ["brief", "tab:ubiquitous-language", "cards"]
        dataset: library:brief
        core: true
        status: planned
      # The first cut, deliberately EARLY so the rest of the series attacks the learner's own model.
      # COMMIT BEFORE REVEAL: they publish it, THEN see ours and the three decisions we made
      # differently. Nearly everyone ships one `book` table here — do NOT rescue them; 10 is where
      # that bill comes due. The spreadsheet is LOADED here (the FITS proof), which is where the
      # reference-only book that was lent anyway forces the rule-vs-data decision.
      - n: "05"
        slug: design-the-library
        title: "Design the Library — Your First Schema, From Nothing"
        hands_on: ["tab:er-diagram", "check:fits", "check:refuses", "check:answers", "build:library", "cards"]
        dataset: library
        core: true
        status: planned
      # REFRAMED 2026-09-14. The spreadsheet shows three levels, not two: The Pragmatic Programmer
      # in two genuinely different editions (ISBN-10 020161622X, 2nd ed. 9780135957059) and Dune's
      # film tie-in, the SAME book under a different ISBN. So ISBN is not a bad key — it is the key
      # of an EDITION. The lesson: a natural key identifies SOMETHING; make sure it is the thing
      # your table is about. Surrogate vs natural follows from that, not the other way round.
      - n: "10"
        slug: title-edition-copy-and-keys
        title: "Title, Edition, Copy & Keys — Choosing What a Key Identifies"
        tags: ["kimball"]
        credits:
          - source: kimball
            concept: "SURROGATE KEYS — his argument for them, plus the DURABLE SUPERNATURAL KEY (the business key that survives a Type 2 change)"
        hands_on: ["check:answers", "build:library", "cards"]
        dataset: library
        core: true
        status: planned
      # REFRAMED 2026-09-14. Series 1 · 20 already teaches the junction that carries facts, and
      # there the pair of foreign keys WAS the key. A loan is different: the same member can
      # borrow the same copy again next month, so (member, copy) cannot be the key — the
      # relationship is an EVENT with an identity of its own. The old brief's "composite PK" is
      # exactly the bug this episode teaches.
      - n: "15"
        slug: relationships-that-are-events
        title: "Relationships That Are Events — Loans, Repeats and Their Own Identity"
        hands_on: ["check:refuses", "build:library", "cards"]
        dataset: library
        core: true
        status: planned
      # Three techniques, one decision: choose by the QUESTION asked most often (one level up?
      # the whole subtree? reparenting often?), never by elegance. The library adds a second axis
      # the category tree cannot hold: children's books are shelved by AGE BAND, the rest by
      # subject — a classification that is not one tree.
      # Boundary: Data Model Patterns, Series 3 hands over hierarchy patterns; this teaches the choice.
      - n: "20"
        slug: modeling-hierarchies
        title: "Hierarchies & Classification — Adjacency List, Path Enumeration, Nested Sets, and a Second Axis"
        tags: ["celko"]
        credits:
          - source: celko
            concept: "The NESTED SETS model specifically — adjacency list and path enumeration are older and unowned"
        hands_on: ["check:answers", "build:library", "cards"]
        dataset: library
        status: planned
      # BUSINESS time: when a fact was TRUE. Moved off Northwind 2026-09-14 — its price example is
      # Series 1 · 30 now, and this episode is library-only: memberships that lapse and restart,
      # a fee that changes, "was Danny a member on 1 June?". System time (when a ROW changed) is
      # 30; together they are bitemporal — name the pair once, here.
      # Boundary: Data Model Patterns, Series 1 owns effective dating as a pattern; this is the technique.
      - n: "25"
        slug: temporal-data
        title: "Temporal Data — Business Time, and What Was True on a Date in the Past"
        tags: ["snodgrass"]
        credits:
          - source: snodgrass
            concept: "VALID TIME vs TRANSACTION TIME, and bitemporal tables"
        hands_on: ["check:answers", "build:library", "cards"]
        dataset: library
        core: true
        status: planned
      # NEW 2026-09-14. The brief is full of rules no column constraint can hold: a copy can be out
      # only once at a time; renew once if nobody is waiting; reference-only books are never lent.
      # The choice is WHERE each rule lives — reshape the model so a plain constraint holds it, a
      # partial unique index (PostgreSQL only; DuckDB has none), a check across tables, or the
      # application, said out loud. Reservations in the project (60) bring this back.
      - n: "27"
        slug: rules-across-rows
        title: "Rules Across Rows — One Loan per Copy at a Time, and Where a Rule Should Live"
        hands_on: ["cloudbeaver", "check:refuses", "build:library", "cards"]
        dataset: library
        core: true
        status: planned
      # SYSTEM time, the other axis next to 25: when a ROW was written, changed or hidden.
      # Soft delete is not free: it breaks UNIQUE (the fix, a partial unique index, is PostgreSQL
      # only), it leaves children pointing at a "gone" parent, and it poisons every later query.
      # ALSO OWNS CLASSIFYING PERSONAL DATA, decided at design time and written down where a
      # pipeline can act on it: ETL & Data Pipelines, Series 2 · 22 masks those columns and Data
      # Ops, Series 3 · 35 deletes them on request.
      - n: "30"
        slug: soft-deletes-and-audit-columns
        title: "created_at, updated_by & deleted_at — System Time, and What Soft Deletes Cost"
        hands_on: ["cloudbeaver", "check:refuses", "build:library", "cards"]
        dataset: library
        status: planned
      # ENUM type vs lookup table vs CHECK — decided by who adds a value and how often. If a
      # business user must add one without a deploy, it is a table. That is the whole rule.
      # Boundary: Data Model Patterns, Series 1 owns type and status tables as a pattern.
      - n: "32"
        slug: lookups-and-reference-data
        title: "Lookups, Enums & Reference Data — Where Constants Should Live"
        hands_on: ["build:library", "cards"]
        dataset: library
        status: planned
      # A DECISION episode, not a proof episode: the learner leaves able to say "far enough" in a
      # review and defend it. It NEEDS a genuine BCNF case from the library itself — if none can
      # be found when the episode is written, merge it into 40 as "how far to normalize".
      - n: "35"
        slug: bcnf-and-when-to-stop
        title: "BCNF & When to Stop Normalizing — Saying Far Enough in Review"
        tags: ["codd"]
        credits:
          - source: codd
            concept: "BOYCE-CODD NORMAL FORM — Raymond Boyce and E. F. Codd"
        hands_on: ["build:library", "cards"]
        dataset: library
        status: planned
      # MERGED 2026-09-14 from 40 denormalization and 45 indexing. The decision is the ORDER of
      # escalation: the right index first, then a summary, then deliberate duplication — and
      # every copy names who keeps it in sync. Finishes the sentence Series 1 · 25 left open.
      # Needs a larger generated lending log to show a measurable plan difference; 26 rows cannot.
      # Boundary: Learn SQL, Series 3 owns EXPLAIN and index mechanics; this is the design call.
      - n: "40"
        slug: indexes-and-denormalization
        title: "Indexes & Denormalization — Designing for the Reads You Expect, in That Order"
        hands_on: ["cloudbeaver", "check:answers", "build:library", "cards"]
        dataset: library
        status: planned
      # The third answer to "how far do you model": stop, and store a document. Model it if you
      # will FILTER, JOIN or AGGREGATE on it, or it must be constrained; store JSON if it is
      # shapeless, varies per row, or is only read whole.
      # Boundary: Learn SQL, Series 3 queries JSON once it is there; this decides to have it.
      - n: "42"
        slug: json-as-a-modeling-choice
        title: "JSON Columns — When to Stop Modelling and Store the Document"
        hands_on: ["check:answers", "build:library", "cards"]
        dataset: library
        status: planned
      # THE LIBRARY GOES LIVE HERE. Until now the model was in design and rebuilt freely; from
      # this episode every change is a migration, and its check is the strongest in the track:
      # apply it, and the ENTIRE existing suite must still pass, plus the new tests.
      # Additive vs breaking is the frame: expand, backfill, switch reads, contract.
      - n: "50"
        slug: schema-evolution
        title: "Schema Evolution — The Library Goes Live: Add, Rename and Split Without Breaking Anyone"
        tags: ["ambler"]
        credits:
          - source: ambler
            concept: "Scott Ambler & Pramod Sadalage, 'Refactoring Databases' (2006) — the canonical source for these change patterns and their names"
        hands_on: ["tab:er-diagram", "check:survives", "build:library", "cards"]
        dataset: library
        core: true
        status: planned
      # THE SERIES 2 PROJECT: three change requests against the learner's live schema.
      #   EBOOKS           no physical copy, so the copy model breaks — the SUPERTYPE/SUBTYPE choice
      #                    from Series 1 · 35, now paid for on the learner's own model
      #   A SECOND BRANCH  copies gain a location — additive, if the model was right
      #   RESERVATIONS     a new entity competing with loans for the same copy — Series 2 · 27 again
      # The lesson is not "avoid the mistake" (no model survives every change); it is telling an
      # additive migration from a rewrite, and the old suite staying green is how they know.
      - n: "60"
        slug: project-survive-the-change
        title: "Project — Six Months Later: Ebooks, a Second Branch, and Reservations"
        tags: ["project"]
        hands_on: ["tab:er-diagram", "check:survives", "check:refuses", "check:answers", "build:library", "cards"]
        dataset: library
        core: true
        status: planned

  # MOVEMENTS
  #   00-10  THE STANDARD METHOD, BUILT AT ONCE   why a second shape, Kimball's four steps, and the
  #                                              star BUILT and RECONCILED at 10 — not at 30.
  #   15-40  THE DECISIONS INSIDE A STAR          grain & additivity, fact types, the date and its
  #                                              roles, small dimensions, snowflaking, history (SCD),
  #                                              multi-valued dimensions. Each one changes star.sql.
  #   45     MORE THAN ONE PROCESS                conformed dimensions, the bus matrix, drill-across,
  #                                              budget vs actual.
  #   50-55  THE ALTERNATIVES                     Data Vault, one big table — AFTER the standard method,
  #                                              because you cannot judge them without it.
  #   60     PROVE IT                             your Series 1 model becomes a star that reconciles.
  #
  # THE SOURCE IS THE LEARNER'S OWN SERIES 1 MODEL. The star is loaded through the fixed views the
  # Series 1 project ends with (customers, orders, order lines, contacts, product suppliers), so
  # this series genuinely reshapes what the learner built — and, because the views are fixed,
  # every learner's star can still be graded. RECONCILES: the star's totals equal the source's
  # (58153.31 for the order lines), checked from episode 10 onward, never only at the end.
  #
  # THE SHIPPED main.fact_sales / dim_* IS NOT THE ANSWER. ReportBurster generates it separately
  # (NorthwindOlapDataGenerator, seed 42) for pivot-table volume: 30 invented customers, 16
  # products, 2023-2024, no order number, one date per sale, a 28-day calendar. It does that job
  # well, and it cannot reconcile with Northwind. Here it is the star SOMEBODY ELSE BUILT, judged
  # at 25 (the calendar) and 30 (the missing order number) — which is a real work situation.
  #
  # THE SERIES 3 SEED. Northwind ships one process; three lessons need more. PART 0 of
  # practice-template/star.sql generates, from the Northwind rows, into schema `seed`: stock
  # movements (a second process, and a semi-additive month-end stock that reconciles with
  # Products.UnitsInStock), monthly sales targets per category (budget vs actual), and employee
  # territories with allocation weights (a multi-valued dimension). main.* is never touched.
  #
  # THE SPLIT WITH NEIGHBOURING COURSES. This series DESIGNS the star and proves it on small data.
  # Data Warehousing loads, queries and runs it at scale; its Series 2 owns columnar engines
  # (sort keys, partitions, star vs one big table measured). Analytics Engineering with dbt builds
  # it as code. Each episode below that meets one of those says so in one line.
  #
  # RESTRUCTURED 2026-09-14 with the owner. The star used to be built first at 30 and again in the
  # project; SCD came before grain and fact types; snowflake-vs-star came before any star existed;
  # six lesson briefs carried another episode's text. Merged: facts-and-dimensions + four-step
  # (05), the star + building it (10), the date dimension + role-playing (25). Removed:
  # modeling-for-columnar-engines (Data Warehousing, Series 2 owns it).
  # ╔══════════════════════════════════════════════════════════════════════════════════╗
  # ║  THIS SERIES TEACHES KIMBALL. WRITE IT IN HIS VOCABULARY.                        ║
  # ╚══════════════════════════════════════════════════════════════════════════════════╝
  # THE SOURCE: Ralph Kimball & Margy Ross, "The Data Warehouse Toolkit" (3rd ed., Wiley
  # 2013), with the loading material from Kimball & Caserta, "The Data Warehouse ETL Toolkit".
  # Nearly every episode from 00 to 32 presents one of his concepts. Each is tagged with a
  # one-line `# KIMBALL:` marker naming HIS term for it — `grep -rn "# KIMBALL:" courses/`
  # lists the full set across this track, Data Warehousing and ETL & Data Pipelines.
  #
  # THE RULE, and it is the whole reason for teaching the standard method rather than one
  # person's opinion: USE HIS WORDS. Grain, conformed dimension, degenerate dimension,
  # accumulating snapshot, factless fact table, bus matrix, drill-across. A reader who
  # finishes this series and then opens the book must recognise what they were taught on the
  # page in front of them. Explain each term in plain English on first use — never replace it
  # with a plainer invented one, because the invented one does not exist anywhere else.
  #
  # HOW TO CREDIT: the full rules — what is safe to teach and why, quoting, diagrams, book
  # covers, trademarks, the tag pages, and the disclaimer line to paste into the article —
  # live ONCE in courses/learnsql/curriculum.yaml under "HOW TO CREDIT, AND STAY OUT OF
  # TROUBLE". Read them before writing any episode in this series. The short version:
  #   the METHOD is an idea and ideas are free; his WORDS, DIAGRAMS and TABLES are not.
  #   Name him in the prose, Sources block with the ISBN, draw everything yourself, and
  #   never let the page read as though he wrote it or approved it.
  #
  # AND SAY WHERE HE IS NO LONGER THE ANSWER. 35-45 are the alternatives on purpose. Columnar
  # storage genuinely weakened some of his advice — that is honest, and an episode that
  # pretends 1996 rules still hold everywhere is worse than one that never cited him.
  - slug: series3-dimensional-modeling
    title: Dimensional Modeling
    tagline: reshape your own model into star schemas for reporting, and prove every total
    level: advanced
    episodes:
      # Moved here from Series 2 on 2026-09-14: it OPENS analytics modelling. The same business,
      # two shapes, side by side in the ER Diagram tab: the learner's normalised Series 1 model,
      # and a star. The learner's own Learn SQL · 50 report is the argument — count the joins it
      # needed, then count them against a star.
      # Boundary: Data Warehousing, Series 1 · 00 covers the same split from the WORKLOAD side.
      - n: "00"
        slug: oltp-vs-olap-models
        title: "OLTP vs OLAP Models — Why One Schema Can't Serve Both"
        hands_on: ["tab:er-diagram", "cards"]
        dataset: northwind:read
        core: true
        status: planned
      # Kimball's procedure, and the most transferable thing in the Toolkit: 1. select the BUSINESS
      # PROCESS (not a department, not a report), 2. declare the GRAIN, 3. identify the DIMENSIONS,
      # 4. identify the FACTS. Merged with facts-and-dimensions on 2026-09-14 — the vocabulary and
      # the method are one lesson, and on Northwind rather than the library brief, so the series
      # keeps one dataset.
      - n: "05"
        slug: facts-dimensions-and-the-four-step-design
        title: "Facts, Dimensions & the Four-Step Design — Process, Grain, Then Dimensions and Facts"
        tags: ["kimball"]
        credits:
          - source: kimball
            concept: "FACTS and DIMENSIONS, and THE FOUR-STEP DIMENSIONAL DESIGN PROCESS — his vocabulary and his numbering"
        hands_on: ["build:star", "cards"]
        dataset: northwind:read
        core: true
        status: planned
      # The star is BUILT here, the first time it is shown — not described for six episodes first.
      # Dimensions first, then the fact; loaded through the learner's Series 1 views; and the
      # reconciliation query is written in the same sitting and kept forever after.
      # Boundary: Data Warehousing, Series 1 reads the star from the query side and loads it at scale.
      - n: "10"
        slug: the-star-schema
        title: "The Star Schema — Build fact_sales From Your Own Model, and Reconcile It"
        tags: ["kimball"]
        credits:
          - source: kimball
            concept: "THE STAR SCHEMA — his central artifact"
        hands_on: ["tab:er-diagram", "check:reconciles", "build:star", "cards"]
        dataset: northwind:star
        core: true
        status: planned
      # The fact-table half of grain: which measures add up across which dimensions. A price or a
      # discount rate is non-additive; a month-end balance is semi-additive — SUM across products,
      # never across time. Both are silent: SUM runs and returns a plausible, wrong number.
      - n: "15"
        slug: grain-and-additivity
        title: "Fact Grain & Additivity — The Measures You Must Not SUM"
        tags: ["kimball"]
        credits:
          - source: kimball
            concept: "DECLARE THE GRAIN, and ADDITIVE / SEMI-ADDITIVE / NON-ADDITIVE facts — all three terms are his"
        hands_on: ["check:reconciles", "build:star", "cards"]
        dataset: northwind:star
        core: true
        status: planned
      # Kimball's shapes, all of them available here with measured data:
      #   TRANSACTION           the order-line fact from 10.
      #   PERIODIC SNAPSHOT     month-end stock per product, from seed.stock_movements — it must end
      #                         at Products.UnitsInStock, which is its reconciliation.
      #   ACCUMULATING SNAPSHOT one row per order, updated as it moves: ordered, required, shipped,
      #                         with lags. Northwind's lags are 3 to 9 days and exactly ONE order
      #                         shipped late — finding it is the exercise.
      #   FACTLESS              coverage: 190 of 380 product-months had no sales, which a
      #                         transaction fact cannot even list.
      # ALSO OWNS THE NO-NULL-FOREIGN-KEY RULE: an unshipped order has no ship date and no shipper,
      # so point it at "Unknown" / "Not Applicable" dimension rows (fixed keys 0 and -1).
      - n: "20"
        slug: fact-table-types
        title: "Fact Table Types — One Row per Event, per Period, or per Pipeline"
        tags: ["kimball"]
        credits:
          - source: kimball
            concept: "TRANSACTION, PERIODIC SNAPSHOT and ACCUMULATING SNAPSHOT fact tables, plus FACTLESS FACT TABLES"
        hands_on: ["check:reconciles", "check:answers", "build:star", "cards"]
        dataset: northwind:star
        core: true
        status: planned
      # A generated calendar table beats date_trunc: fiscal periods, week numbering, holidays, and
      # attributes a report can GROUP BY. Merged with role-playing on 2026-09-14 because
      # role-playing IS the date dimension used several ways: OrderDate, RequiredDate, ShippedDate.
      # The shipped main.dim_time has one row per day for days 1-28 only — a calendar with holes,
      # judged here as somebody else's work. Time of day: a separate dimension or a timestamp on
      # the fact, never minutes in dim_date.
      - n: "25"
        slug: the-date-dimension-and-role-playing
        title: "The Date Dimension & Role-Playing — One Calendar Table, Used Three Ways"
        tags: ["kimball"]
        credits:
          - source: kimball
            concept: "THE DATE DIMENSION, and ROLE-PLAYING DIMENSIONS"
        hands_on: ["check:answers", "build:star", "cards"]
        dataset: northwind:star
        core: true
        status: planned
      # DEGENERATE: the order number lives IN the fact with no table of its own — people invent a
      # dim_order for it. JUNK: a handful of low-cardinality flags (shipped?, discounted?,
      # discontinued product?) collapsed into one small dimension instead of columns on the fact.
      # The shipped main.fact_sales has NO order number at all: "how many orders?" is unanswerable
      # there. That is the missing degenerate dimension, found in somebody else's star.
      - n: "30"
        slug: degenerate-and-junk-dimensions
        title: "Degenerate & Junk Dimensions — The Order Number With No Table, and the Flags With No Home"
        tags: ["kimball"]
        credits:
          - source: kimball
            concept: "DEGENERATE and JUNK DIMENSIONS"
        hands_on: ["check:answers", "build:star", "cards"]
        dataset: northwind:star
        core: true
        status: planned
      # Moved AFTER the star exists (2026-09-14): you cannot weigh normalizing a dimension before
      # you have one. Product -> Category and Product -> Supplier are the natural snowflake.
      # Give Kimball's reasoning, then the columnar-era caveat. Boundary: Data Warehousing,
      # Series 2 measures what the extra joins cost on a columnar engine.
      - n: "32"
        slug: snowflake-vs-star
        title: "Snowflake vs Star — Normalizing Dimensions, and What It Costs You"
        tags: ["kimball"]
        credits:
          - source: kimball
            concept: "SNOWFLAKING — and his position, which is 'generally don't'"
        hands_on: ["tab:er-diagram", "cards"]
        dataset: northwind:star
        status: planned
      # Moved after grain, fact types and the date dimension (2026-09-14): SCD Type 2 needs all
      # three. Northwind has NO change history — every product has one price, no customer moves —
      # so the learner makes the change in their own copy (a customer moves city), exactly as in
      # Series 1 · 30, and watches last year's revenue-by-city stay put or rewrite itself.
      # Name that Types 0 and 4-7 exist. Boundary: Data Warehousing, Series 3 queries SCD history;
      # dbt snapshots load it.
      - n: "35"
        slug: slowly-changing-dimensions
        title: "Slowly Changing Dimensions — Type 1, 2 and 3, and Which to Pick"
        tags: ["kimball"]
        credits:
          - source: kimball
            concept: "SLOWLY CHANGING DIMENSIONS, Types 1/2/3 — his numbering exactly"
        hands_on: ["check:answers", "build:star", "cards"]
        dataset: northwind:star
        core: true
        status: planned
      # An employee covers several territories, so "revenue by territory" cannot come from a fact
      # keyed on employee. The data is the seed (seed.employee_territories) because Northwind's own
      # EmployeeTerritories ships empty: three employees, eight territories, New York shared.
      # The three moves: the bridge; joining through it and watching the total inflate (join
      # fan-out, deliberately this time); an ALLOCATION FACTOR so the total reconciles again.
      - n: "40"
        slug: bridge-tables
        title: "Bridge Tables — When One Fact Row Belongs to Several Dimension Rows"
        tags: ["kimball"]
        credits:
          - source: kimball
            concept: "BRIDGE TABLES for MULTI-VALUED DIMENSIONS, and the ALLOCATION FACTOR that keeps the total right"
        hands_on: ["check:reconciles", "build:star", "cards"]
        dataset: northwind:star
        status: planned
      # Kimball's enterprise argument, and the reason the method scales past one star. Northwind
      # now has three processes: orders, stock movements and sales targets (the last two from the
      # seed). Conformed product and date dimensions let them sit on one page.
      #   BUS MATRIX      processes down the side, conformed dimensions across the top.
      #   DRILL-ACROSS    query each fact at a common grain, then join the RESULTS — never two facts.
      #   CONSOLIDATED    budget vs actual: targets are one row per CATEGORY per MONTH, a different
      #                   grain from the order lines, so the consolidated fact needs a shrunken
      #                   (category-level) product dimension.
      # Months with a target and no sales exist, which is why the drill-across join is a full join.
