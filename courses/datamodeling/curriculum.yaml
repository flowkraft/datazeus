# The ordered episode list for Data Modeling. Field docs live in courses/learnsql/curriculum.yaml.
# `short` is omitted until an episode has a video.
#
# The job this track teaches: decide what the tables should be, before anyone writes a query
# against them. Series 1 recovers a model that already exists, Series 2 invents one and then
# survives the changes, Series 3 reshapes it for analytics.
#
# ============================================================================
# HOW THIS TRACK DELIVERS "HANDS ON" — decided 2026-08-24, do not re-litigate
# ============================================================================
# Learn SQL has a cheap correctness oracle: run the query, the database says yes or no.
# Modeling looks like it has none — a schema design has no green checkmark — and the gravity
# of that pulls a modeling course into LECTURING. This track had drifted that way: 31
# episodes, first hands-on build at episode 21, one project. That is what we are fixing.
#
# A schema DOES have an oracle, in fact two, and they carry the whole track:
#
#   1. THE INSERTS IT REFUSES. A good model makes bad data impossible; a test that says
#      "this INSERT must bounce" is therefore a direct test of the model. Pair every
#      shouldReject with a shouldAccept, or the learner just bolts constraints onto
#      everything and calls it rigour — the pincer IS the judgement being taught.
#
#   2. REAL DATA LOADING INTO IT. Verified on the shipped 79-row Northwind: declaring
#      PRIMARY KEY("OrderID") alone on Order Details is REJECTED on load (the grain is
#      (OrderID, ProductID)); NOT NULL on "Region" is REJECTED (it is genuinely optional);
#      CHECK("UnitPrice" > 10) is REJECTED (a 4.50 product exists). Every rejection names a
#      modeling concept, and no answer key is involved. The dataset IS the grader.
#
# WHY THE KOANS ARE PREDICT-AND-DECIDE, NOT TYPE-THE-DDL. If a koan says "write the schema",
# the learner spends their effort on CREATE TABLE syntax, which is not the subject. So the
# koans climb a ladder and only the top rung authors anything (see SchemaKoanBase):
#   rung 1 PREDICT   schema is given — will this INSERT bounce?     (types nothing)
#   rung 2 DIAGNOSE  what is the grain? can this model answer X?    (types nothing)
#   rung 3 CHOOSE    three finished models — which survives Y?      (types nothing)
#   rung 4 COMPLETE  boilerplate given, one blanked line: the decision itself
#   rung 5 AUTHOR    the whole schema — projects only, where syntax is earned
# This mirrors KoanBase's own split between a "fragment koan" and a "whole-query koan".
#
# WHAT IS *NOT* A KOAN. Anything whose answer needs eyes goes to the DataPallas database
# connection screen instead, and the episode should say which tab by name:
#   Database Schema tab        the physical layer, real types, what is actually there
#   ER Diagram tab             PlantUML/Crow's Foot — and it is TEXT, so the learner can
#                              AUTHOR a diagram, diff it, and compare it against ours
#   Domain-Grouped Schema tab  subject areas / bounded contexts (see S1 55)
#   Ubiquitous Language tab    the glossary behind naming conventions (see S1 45)
# Neither half is "watch a video". Eyes for the shape, the machine for the correctness.
#
# THE `hands_on` FIELD — a track-local convention, and the thing that keeps the promise
# honest. Every episode carries one, and it is NOT decoration: an episode with no hands_on
# is an episode that has quietly become a lecture, so the check is "does every episode have
# at least one entry", and it should stay that way. Values:
#   koan:predict | koan:diagnose | koan:choose | koan:complete | koan:author
#                              the rung from the ladder above
#   koan:migration             apply the change; the WHOLE existing suite must still pass
#   koan:reconcile             the star's totals must equal the OLTP totals
#   tab:er-diagram | tab:database-schema | tab:domain-grouped-schema | tab:ubiquitous-language
#                              a named tab on the DataPallas connection screen
#   cloudbeaver                needs Postgres — a feature DuckDB does not have
#   brief                      works from the library brief in courses/datamodeling/brief/
#
#   EVERY SERIES LEAVES ONE ARTIFACT BEHIND, and `build:` names which. This was uneven until
#   2026-08-24: Series 3 declared no build at all, so the only series producing nothing the
#   learner keeps was the one whose episodes are literally called "build the star schema".
#     build:schema.sql   Series 1 — the Northwind integrity rebuild, practice/schema.sql
#     build:library      Series 2 — the schema invented from the brief
#     build:star         Series 3 — practice/star.sql, grown the same way schema.sql is
#   If a series ever has no `build:` entries again, it has stopped producing anything.
#
# TABS ARE NOT A SERIES 1 FEATURE. They were, briefly, and it was wrong: `tab:` appeared 8
# times in Series 1 and 3 times in Series 2, when Series 2 is the series where the learner
# DESIGNS FROM NOTHING and authoring the PlantUML diagram IS the design act. Any Series 2
# episode that changes the SHAPE of the model should redraw it — the diff between two
# diagrams is the clearest possible view of what a decision did.
#
# ============================================================================
# THE SHAPE OF AN EPISODE — four beats, every time
# ============================================================================
# Data Model Patterns already proved a fixed episode shape keeps a modeling track honest.
# Ours is different because we teach METHOD rather than catalogue, but the discipline is the
# same: an episode missing beat 3 has become a lecture.
#
#   1. THE SITUATION  the concrete moment at work where this bites. Never "normalization is
#                     the process of…". Always "the report says 3x revenue and nobody knows
#                     why". The hook in the episode title is the one-line version of this.
#   2. THE DECISION   the modeling choice itself, shown on Northwind (Series 1) or on the
#                     learner's own library schema (Series 2). Name the alternatives you did
#                     NOT pick and why — the alternatives are the lesson.
#   3. THE PROOF      the learner sees it for themselves: the koan rung or the named tab from
#                     `hands_on`. This beat is non-negotiable. If you cannot write beat 3,
#                     the episode is not ready.
#   4. THE COST       what the decision buys and what it will cost later. Every modeling
#                     choice is a trade; an episode that presents one as free is teaching a
#                     rule instead of judgement.
#
# ============================================================================
# "HOW CAN YOU TEACH MODELING ON A SCHEMA WITH NO CONSTRAINTS?" — the answer
# ============================================================================
# Because the unconstrained Northwind is never the teaching SURFACE. It is the INPUT. There
# are three schemas in play and confusing them is the easiest way to misread this whole track:
#
#   main.*        THE ORIGINAL. Real business data, real relationships, and NOTHING declared.
#                 It is used for exactly two things: the diagram you READ, and the rows you
#                 LOAD. You never modify it and you never model *in* it.
#
#   practice.*    THE LEARNER'S. Same database file, their own schema. THIS is where the
#                 constraints live — the ones they decide on and declare. Series 1 grows it
#                 one episode at a time as practice/schema.sql.
#
#   the library   ALSO in practice.*, but invented from the brief rather than recovered.
#                 Series 2's schema. Nothing to copy from; the brief and the CSV are all
#                 they get.
#
# The mechanism is that main and practice sit in the SAME FILE, so:
#
#     INSERT INTO practice."Order Details" SELECT * FROM main."Order Details";
#
# The original supplies the DATA. The learner supplies the CONSTRAINTS. The load is the TEST.
# A model that does not match the business physically cannot accept the business's own rows —
# which is why no answer key is needed and why the missing constraints are the whole point.
# If main.* already declared its keys, there would be nothing left for the learner to decide.
#
# THE `dataset` FIELD records which of the three each episode uses, so this never has to be
# reconstructed from memory again:
#   northwind:read     reads main.* only — the tabs, the diagram, the data. Builds nothing.
#   northwind:rebuild  reads main.*, BUILDS practice.* — the Series 1 spine, schema.sql
#   library:brief      the brief and the spreadsheet; no database involved yet
#   library            the schema the learner invented, in practice.*
#   library+northwind  library is the subject; Northwind supplies one demonstration
#   northwind:star     builds the star in practice.* from main.*, reconciled against the
#                      shipped main.fact_sales / main.dim_* as the reference answer
#   case-study         a real system examined from the outside, because the decision is too
#                      big to exercise on a toy. Used once, for multi-tenancy: the library is
#                      ONE small independent branch with two staff, so asking a learner to
#                      make it multi-tenant is a contrived exercise, and a contrived exercise
#                      is the worst failure mode a hands-on track has. DataPallas and
#                      ReportBurster live that decision for real; teach it from there. The
#                      choose-koan still works — three GIVEN models, not the learner's own.
#
# ============================================================================
# WHEN IS A PROJECT `core`? — a rule, because this drifted once already
# ============================================================================
# A project is the one episode where everything in its series gets applied. So:
#
#   IF the core path includes a series at all, it MUST include that series' project.
#
# Otherwise the shortest-path-to-productive has no proof point for that series — a learner
# would have done the whole of Series 2 except the one episode that demonstrates its promise.
# That is what had happened here: project-survive-the-change was not core, so the core path
# went through "design for the change that's coming" and never survived a change.
#
# The rule is NOT "every project is core". Learn SQL is the counter-example and is correct
# as it stands: its Series 3 and Series 4 have no core episodes at all, so their projects
# are rightly non-core — a core project sitting in a non-core series would ask someone to
# apply eight things they were never told to learn.
#
# ============================================================================
# TWO DATASETS, TWO JOBS — the split that makes the above work
# ============================================================================
# NORTHWIND is the model you RECOVER (Series 1). The shipped northwind.duckdb declares NO
# constraints at all — no PKs, no FKs, nothing (the JPA entities upstream have them; the
# DuckDB export flattened them away). That absence is the COURSE, not a defect: Series 1 is
# the learner rebuilding Northwind's integrity layer into their own `practice` schema, one
# episode at a time, graded by whether the real rows still load. DO NOT "FIX" THE DATASET —
# see datasets/northwind/README.md, which says the same thing louder.
#
#   The script is a REBUILD, never an ALTER: DuckDB supports ALTER TABLE ADD PRIMARY KEY and
#   ALTER COLUMN SET NOT NULL, but NOT ADD FOREIGN KEY, ADD UNIQUE or ADD CHECK (tested,
#   v1.5.4). So schema.sql is CREATE TABLE ... with constraints inline, then
#   INSERT INTO practice.X SELECT ... FROM main.X. It is idempotent and re-runnable, which
#   is why `zeus practice reset` exists.
#
# THE LIBRARY is the model you INVENT (Series 2). You cannot ask someone to design a schema
# they have spent twelve episodes reading — the answer is already in their head — so the
# greenfield domain has to be a different one. Library lending was chosen deliberately:
#   - universally familiar as a business, unfamiliar as a schema
#   - FAR from Northwind. Pick e-commerce and they will transcribe what they just read.
#   - it owns the best "aha" in introductory modeling: TITLE vs COPY. Everyone builds one
#     `book` table, and then "how many copies of Dune do we own?" and "who has copy #3?"
#     break it at the same moment.
#   - it contains, without contriving them, every decision Series 2 teaches: 1:M, M:N
#     (book<->author), M:N-with-attributes (the loan itself), real optionality
#     (returned_on IS NULL means still out), a category hierarchy, and a natural key that
#     betrays you (ISBN: reissues get new ones, ISBN-10 vs -13, self-published have none).
#   - its change requests genuinely hurt: ebooks have no physical copy and detonate the
#     copy model. See courses/datamodeling/brief/.
# The brief is handed over as three artifacts, never as a finished schema: the prose brief
# WITH DELIBERATE AMBIGUITIES LEFT IN, the messy spreadsheet being replaced, and the
# executable acceptance suite. That last one is a definition of done that is not an answer key.
#
# ONE library schema across the whole of Series 2, not one per episode. Design it in episode
# 05 and get bitten by your own decision in episode 25 — that is the lesson nobody forgets,
# and it is the only way the series tagline is actually earned.

course: learn-data-modeling
track: datamodeling
title: Data Modeling

# ============================================================================
# PREREQUISITES — what you need before episode 1, and why
# ============================================================================
# `excludes` says what this track does NOT cover. This says what it ASSUMES, which is a
# different promise and was missing entirely: two well-bounded courses side by side are not
# the same thing as a path, and a learner who hits an unexplained statement concludes they
# are not ready rather than that we forgot to mention it.
#
# Kept deliberately SHORT. A long prerequisite list is a wall; the honest answer here is
# "one series and one statement", so say exactly that.
prerequisites:
  - course: learn-sql
    needs: "Series 1 entire, plus INSERT from Series 2 · 40"
    why: >-
      In Series 1 you build one file, a few lines at a time, that puts back the keys and
      rules the shipped Northwind is missing. Each episode adds a table and a line that
      copies the real rows into it. You should already be comfortable with SELECT, WHERE,
      JOIN and GROUP BY, so your attention goes on the modelling and not on the SQL.

excludes:
  - topic: "Writing queries against these schemas"
    where: "covered in Learn SQL"
  - topic: "Loading the model — pipelines, SCD-2 loads, backfills"
    where: "covered in ETL & Data Pipelines and Analytics Engineering with dbt"
  - topic: "Running, tuning and migrating the live database"
    where: "covered in Data Ops — this track designs the change, that one ships it safely"
  # These three were only ever recorded in lesson comments, which is the wrong file: the
  # excludes block is what the READER sees, and the reader is exactly who needs to know that
  # a keyword appearing in two tracks is two different subjects rather than a repeat.
  - topic: "EXPLAIN, index internals and making a slow query fast"
    where: "covered in Learn SQL, Series 3 — here indexing is only the design call, made before the query exists"
  - topic: "NULL semantics — three-valued logic, and why `= NULL` never matches"
    where: "covered in Learn SQL, Series 1 · 45, which is what NULL does to a query. In this course, Series 1 · 37 is whether the column should allow NULL at all — a different question that happens to share the word"
  - topic: "Querying JSON once it is in a column"
    where: "covered in Learn SQL, Series 3, which queries JSON once it is there. In this course, Series 2 · 42 asks only whether it should be JSON in the first place"
  # The three below are NEAR-DUPLICATES with Data Model Patterns, and both tracks used to
  # stay silent about it — a learner met the same subject twice and could not tell which one
  # they had needed. The split is real (we teach the TECHNIQUE and how to choose; that track
  # hands over the pattern the industry already settled on) but it has to be said out loud.
  - topic: "The Party model, order-to-cash, work effort — the patterns themselves"
    where: "covered in Data Model Patterns — here you learn to decide, there you inherit decisions already proven"
  - topic: "How real shipped applications actually modelled it"
    where: "covered in Schema Teardowns — that track is field evidence, this one is method"

# ============================================================================
# IS EACH SERIES COHERENT? — the test, and the answer
# ============================================================================
# A series is coherent when it has ONE dataset, ONE verb and ONE artifact, and when every
# episode in it serves that verb. Apply that test before adding any episode anywhere.
#
#   Series 1   Northwind   RECOVER   -> practice/schema.sql
#   Series 2   Library     INVENT    -> the learner's own library schema
#   Series 3   Northwind   RESHAPE   -> fact_sales and its dimensions
#
# The old taglines failed that test. "Read and understand a schema" is a COMPREHENSION verb
# and produced no artifact — it was accurately describing a series that ended with someone
# who could recognise a model and had never made one. "Design for the change that's coming"
# named an artifact the series never actually built, because nothing in it designed anything;
# every episode was a refinement of a model handed over ready-made. Series 3's tagline was
# the only one already true, and it is unchanged.
#
# Within a series the episodes fall into MOVEMENTS. They are written out on each series
# below. If a new episode does not belong to one of its series' movements, it is in the
# wrong series — that check is the whole point of writing them down.

series:
  # MOVEMENTS
  #   00-05  READ THE BASICS   the vocabulary, and Northwind's diagram
  #   10-45  REBUILD IT        schema.sql grows one decision at a time; real rows grade it.
  #                            Naming (45) belongs in THIS movement, not the next one: by then
  #                            the learner has a schema of their own to name, so it is applied
  #                            to their file rather than observed on ours. Its `dataset` says
  #                            northwind:rebuild for exactly that reason.
  #   50-57  READ ANY SCHEMA   reverse-engineering, subject areas, anti-patterns — advanced
  #                            READING, which genuinely needs the rebuild behind it: you
  #                            cannot usefully reverse-engineer before you know what a foreign
  #                            key is, and you cannot see that EAV destroyed the grain until
  #                            you know what grain is. That dependency is why this movement
  #                            sits after the build and not next to episode 05.
  #   60     PROVE IT          the project runs the whole script against the full dataset
  #
  # It is still read -> build -> read, and that is the honest shape rather than an elegant
  # one. The alternative (all reading up front) was rejected because it front-loads twelve
  # episodes of looking at things before the learner writes a line, which is the exact failure
  # this whole redesign exists to undo.
  #
  # Tagline changed from "read and understand a schema": it now names both the reading and the
  # artifact, so the series can be checked against its own promise.
  - slug: series1-modeling-fundamentals
    title: Modeling Fundamentals
    tagline: read a schema, then design and create tables yourself
    level: beginner
    episodes:
      - n: "00"
        slug: conceptual-logical-physical
        title: "Conceptual, Logical & Physical — Which Layer You Are Designing At"
        hands_on: ["tab:er-diagram", "tab:database-schema"]
        dataset: northwind:read
        core: true
        status: planned
      # The DataPallas ER Diagram tab is the logical layer and the Database Schema tab is the
      # physical one — two tabs, side by side, are the previous episode's three layers made
      # concrete instead of explained on a slide. Say the tab names out loud.
      # SOURCE (chen): ENTITIES, ATTRIBUTES and RELATIONSHIPS, and the ER diagram itself.
      - n: "05"
        slug: entities-and-relationships
        title: "Entities, Attributes & Relationships — Reading an ER Diagram"
        tags: ["chen"]
        credits:
          - source: chen
            concept: "ENTITIES, ATTRIBUTES and RELATIONSHIPS, and the ER diagram itself"
        hands_on: ["tab:er-diagram", "koan:diagnose"]
        dataset: northwind:read
        core: true
        status: planned
      # GRAIN, pulled forward from Series 3 where it used to live at 20 as a fact-table
      # concern only. "One row per WHAT?" is the first question of ANY table and the thing you
      # answer before you can choose a key, so it cannot wait twenty episodes. Split out of the
      # old combined keys episode, which was carrying four topics.
      #
      # This is where schema.sql starts. The demonstration writes itself: declare
      # PRIMARY KEY("OrderID") on Order Details, watch the real rows refuse to load, and let
      # the data tell them the grain is (OrderID, ProductID). Learn SQL collects on grain too
      # (S2/06 join fan-out), as do Data Warehousing and dbt.
      # SOURCE (kimball): GRAIN is his word, and step 2 of the four-step design. Here it is OLTP; Series 3 - 02 and 3 - 20 collect on it.
      - n: "10"
        slug: grain-and-primary-keys
        title: "Grain & Primary Keys — What Is One Row, and What Makes It Unique"
        credits:
          - source: kimball
            concept: "GRAIN is his word, and step 2 of the four-step design"
        tags: ["kimball"]
        hands_on: ["koan:diagnose", "koan:predict", "build:schema.sql"]
        dataset: northwind:rebuild
        core: true
        status: planned
      - n: "15"
        slug: foreign-keys-and-referential-integrity
        title: "Foreign Keys & Referential Integrity — Stopping Rows That Point at Nothing"
        hands_on: ["koan:predict", "build:schema.sql"]
        dataset: northwind:rebuild
        core: true
        status: planned
      - n: "20"
        slug: one-to-many-and-junction-tables
        title: "One-to-Many & Many-to-Many — Why You Can't Just Put a List in a Column"
        hands_on: ["koan:complete", "build:schema.sql"]
        dataset: northwind:rebuild
        core: true
        status: planned
      # Normalization now comes BEFORE data types. Episode 00 sets up conceptual -> logical ->
      # physical and the series used to zigzag straight back across it (logical, logical,
      # physical, logical, physical). Normalization is logical, types are physical; in this
      # order Series 1 walks the layering it just taught.
      #
      # Let the koans carry the argument rather than the definitions: a suite where the
      # un-normalized version cannot answer question 4 without lying teaches 3NF better than
      # 1NF/2NF/3NF stated as rules. "3NF-ish, then denormalize where it hurts" is the job.
      # SOURCE (codd): E. F. Codd's relational model — 1NF, 2NF and 3NF are his normal forms. "A Relational Model of Data for Large Shared Data Banks" (1970).
      - n: "25"
        slug: normalization-1nf-3nf
        title: "Normalization: 1NF, 2NF, 3NF — Removing the Redundancy That Breaks Updates"
        credits:
          - source: codd
            concept: "E. F. Codd's relational model — 1NF, 2NF and 3NF are his normal forms"
        tags: ["codd"]
        hands_on: ["koan:diagnose", "koan:choose"]
        dataset: northwind:rebuild
        core: true
        status: planned
      # DuckDB has no CREATE DOMAIN (tested) though ENUM works and covers much of the ground.
      # This is one of the five places the track has to step out to CloudBeaver/Postgres —
      # which is worth naming as a portability lesson rather than hiding.
      - n: "30"
        slug: data-types-and-domains
        title: "Data Types & Domains — Choosing the Right Column, and What It Costs Later"
        hands_on: ["tab:database-schema", "cloudbeaver", "build:schema.sql"]
        dataset: northwind:rebuild
        core: true
        status: planned
      # NOT NULL on "Region" is REJECTED by the real Northwind rows — the learner discovers
      # optionality from the data instead of being told. Same move for CHECK: a bound that
      # looks sensible and that reality violates.
      - n: "35"
        slug: constraints
        title: "NOT NULL, UNIQUE, CHECK & DEFAULT — Rules the Database Enforces for You"
        hands_on: ["koan:predict", "koan:complete", "build:schema.sql"]
        dataset: northwind:rebuild
        core: true
        status: planned
      # NULL as a DECISION, not as a constraint. Episode 35 covers NOT NULL as something you
      # declare; this covers the question you answer before declaring it, and every table asks
      # it a dozen times — is this attribute optional, or does its absence mean this row is a
      # different KIND of thing?
      #
      #   nullable column   the value may legitimately be missing     Customers."Region"
      #   missing row       the fact is not there yet                 a loan with no return date
      #   separate table    absence means a different kind of thing   the ebook with no copy
      #
      # Placed straight after constraints because the learner has JUST been rejected by the
      # real rows for putting NOT NULL on "Region" — they arrive already holding the question.
      #
      # BOUNDARY, and an easy one to get wrong: Learn SQL S1/45 owns NULL SEMANTICS — three
      # valued logic, why `= NULL` never matches. This owns the DESIGN call. Two different
      # subjects that share a keyword, which is precisely how they end up conflated. Each
      # lesson should name the other.
      #
      # COST beat: every nullable column is a branch in every query that ever touches it.
      # "Just make it nullable" is a cost paid by other people, later, forever.
      - n: "37"
        slug: null-as-a-design-decision
        title: "Nullable, Missing Row or Separate Table — What an Empty Cell Should Mean"
        hands_on: ["koan:choose", "koan:predict", "build:schema.sql"]
        dataset: northwind:rebuild
        core: true
        status: planned
      # Late on purpose. Every database course opens with CREATE TABLE, which teaches typing,
      # not modeling; here the syntax arrives as the OUTPUT of nine episodes of decisions.
      # The round trip is the episode: author the diagram as PlantUML text in the ER Diagram
      # tab, then write the DDL, then load the rows.
      - n: "40"
        slug: diagram-to-ddl
        title: "CREATE TABLE — From Diagram to DDL, the Standard Way"
        hands_on: ["tab:er-diagram", "build:schema.sql"]
        dataset: northwind:rebuild
        core: true
        status: planned
      # Pairs with the Ubiquitous Language tab, which turns "pick good names" from advice into
      # a persistent glossary built against a real database.
      - n: "45"
        slug: naming-conventions
        title: "Naming Conventions — Names a Colleague Can Read Without You"
        hands_on: ["tab:ubiquitous-language"]
        dataset: northwind:rebuild
        status: planned
      - n: "50"
        slug: reverse-engineering-a-schema
        title: "Reverse-Engineering — Getting an ER Diagram From a Database You Have Never Seen"
        hands_on: ["tab:er-diagram", "tab:database-schema"]
        dataset: northwind:read
        status: planned
      # NEW. DataPallas ships the Domain-Grouped Schema tab and the curriculum taught nothing
      # against it. The skill is real and has a name — subject-area modeling (Hoberman);
      # bounded contexts (DDD) — and it is the actual answer to "I have been handed a
      # 200-table database, where do I start?". Not core: it only bites on large schemas.
      # SOURCE (evans): BOUNDED CONTEXT is Eric Evans' term, exactly — "Domain-Driven Design" (2003). Also UBIQUITOUS LANGUAGE, which this track's tab is named after.
      - n: "55"
        slug: subject-area-modeling
        title: "Subject Areas & Bounded Contexts — Finding Your Way Around 200 Tables"
        credits:
          - source: evans
            concept: "BOUNDED CONTEXT is Eric Evans' term, exactly — 'Domain-Driven Design' (2003)"
        tags: ["evans"]
        hands_on: ["tab:domain-grouped-schema"]
        dataset: northwind:read
        status: planned
      # The catalogue of things that are WRONG, assembled in one place — the track spends
      # fifty-seven episodes on what to do and never once names the shapes you will actually
      # inherit. EAV, the God table, comma-separated values in a column, the polymorphic
      # foreign key, the boolean that should have been a status, the "misc" column.
      #
      # Placed last in the reading movement because recognising a smell needs the whole S1
      # toolkit: you cannot see that EAV has destroyed the grain until you know what grain is.
      #
      # TEACH IT FAIRLY OR NOT AT ALL. Every one of these was a REASONABLE decision under some
      # pressure — a deadline, an unknown requirement, a vendor schema. An episode that sneers
      # at them teaches contempt, which is useless, instead of diagnosis, which is the job.
      # For each: what it was solving, what it costs, and what you do when you inherit one and
      # cannot rewrite it. That last part is the most valuable and the most often omitted.
      #
      # Boundary: Data Model Patterns S3/15 ("The Fully Generic Model — Why Everything-Is-a-
      # Thing Fails") argues the abstraction end of this properly. Point at it, do not re-run
      # the argument here — here it is one entry in a catalogue.
      # SOURCE (karwin): ENTITY-ATTRIBUTE-VALUE and JAYWALKING (a comma-separated list in a column) are his named antipatterns.
      - n: "57"
        slug: schema-anti-patterns
        title: "EAV, God Tables & CSV-in-a-Column — Reading a Schema That Went Wrong"
