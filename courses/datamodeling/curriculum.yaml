      # ADDED 2026-08-24 to close the last real Kimball gap in this series. Bridge tables are
      # the answer to the one case a star schema cannot express directly: a fact row that
      # belongs to SEVERAL rows of one dimension.
      # NOT core, deliberately — common enough to meet, not common enough to block anyone.
      # SCD types 4-7, outriggers and audit dimensions were left out on the same test.
      #
      # THE PROBLEM: a star assumes one fact row -> one dimension row. Real domains break that
      # constantly. A book with three authors. A patient with four diagnoses. A sale credited
      # to two salespeople. Put the dimension key straight in the fact and you can record only
      # one of them; duplicate the fact row per member and every measure double-counts.
      #
      # NORTHWIND HAS THE EXAMPLE: EmployeeTerritories. An employee covers MANY territories,
      # so "revenue by territory" cannot be answered from a fact keyed on employee — the
      # revenue has to be spread across the territories that employee covers.
      #
      # THE THREE MOVES, and the third IS the lesson:
      #   1. a BRIDGE table between fact and dimension (fact -> bridge -> dimension)
      #   2. joining through it, and watching the row count multiply exactly as Learn SQL
      #      Series 2 - 06 warned — this is join fan-out, deliberately this time
      #   3. an ALLOCATION FACTOR on the bridge (weights summing to 1.0) so the multiplied rows
      #      still sum to the true total. Without it the numbers are wrong; with it they
      #      reconcile. Hence the koan: `predict` the inflated total, then `diagnose` which
      #      column fixes it.
      #
      # ALSO NAME IN ONE LINE: the same technique carries RAGGED / VARIABLE-DEPTH HIERARCHIES
      # (a hierarchy bridge with a depth column) — the dimensional cousin of Series 2 - 20's
      # adjacency list and nested sets.
      # SOURCE (kimball): BRIDGE TABLES for MULTI-VALUED DIMENSIONS, and the ALLOCATION FACTOR that keeps the total right.
      - n: "28"
        slug: bridge-tables
        title: "Bridge Tables — When One Fact Row Belongs to Several Dimension Rows"
        credits:
