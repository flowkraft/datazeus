        hands_on: ["koan:diagnose", "tab:er-diagram", "build:library"]
        dataset: library+northwind
        core: true
        status: planned
      # SYSTEM time, the other axis — and deliberately adjacent to episode 25 so the pair is
      # obvious. Business time is when the FACT was true; system time is when the ROW was
      # written, changed or hidden. Both together is bitemporal, and naming that once here
      # saves a reader a lot of confusion later.
      #
      # Every production table ends up with created_at, updated_at, created_by and some form
      # of deleted_at, and nearly every course leaves the learner to discover the consequences
      # in production. They are not free:
      #   - a soft delete breaks UNIQUE: the "deleted" row still occupies the email address.
      #     The fix is a partial unique index, which DuckDB does not have (tested) - so this
      #     is a CloudBeaver/Postgres episode, and that is worth saying out loud.
      #   - it breaks foreign keys: children still point at a parent that is "gone".
      #   - it poisons every query written afterwards, forever, by everyone.
      # The honest conclusion is that soft delete is a real technique with a real price, and
      # "we might need it back" is not by itself a reason to pay it.
      # ALSO OWNS CLASSIFYING PERSONAL DATA, folded in here because it is the same act as the
      # other columns every production table gets: a decision made once, at design time, and
      # written down where the next person finds it.
      #   THE POINT: "which columns are personal data" is a MODELLING decision, not something
      #   discovered later by grepping. Record it — a comment on the column, a naming
      #   convention, or a tag in the catalogue — so a pipeline can act on it mechanically.
      #   THE ONES PEOPLE MISS: free-text notes fields (someone always pastes an email in
      #   there), IP addresses, and an "ID" column that is really a national identifier.
      #   WHERE IT GETS USED: ETL & Data Pipelines, Series 2 - 22 masks these columns to make a
      #   safe copy of production, and Data Ops, Series 3 - 35 deletes them on request. Neither
      #   can act without this classification existing first.
      - n: "27"
        slug: soft-deletes-and-audit-columns
