      # Business time, not system time — the two are different axes and both are needed.
      # Northwind carries the demonstration: "Order Details"."UnitPrice" is duplicated from
      # "Products"."UnitPrice", which reads as sloppy denormalization until you see it is
      # price history. The shipped rows do not show it (0 of 193 differ), so DO NOT seed a
      # difference — have the learner UPDATE a price in their practice schema and watch the
      # historical line hold. Better lesson, and it needs no dataset change.
      # SOURCE (snodgrass): VALID TIME vs TRANSACTION TIME, and bitemporal tables.
      - n: "25"
        slug: temporal-data
