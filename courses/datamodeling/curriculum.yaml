      # SOURCE (ambler): Scott Ambler & Pramod Sadalage, "Refactoring Databases" (2006) — the canonical source for these change patterns and their names.
      - n: "50"
        slug: schema-evolution
        title: "Schema Evolution — Add, Rename and Split Without Breaking Downstream"
