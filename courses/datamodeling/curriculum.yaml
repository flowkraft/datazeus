# The ordered episode list for Data Modeling. Field docs live in courses/learnsql/curriculum.yaml.
# `short` is omitted until an episode has a video.
#
# The job this track teaches: decide what the tables should be, before anyone writes a query
# against them. Series 1 reads a schema, Series 2 designs one that survives change, Series 3
# reshapes it for analytics. Northwind is the OLTP case study; its star schema is the OLAP one.

course: learn-data-modeling
track: datamodeling
title: Data Modeling

excludes:
  - topic: "Writing queries against these schemas"
    where: "covered in Master SQL"
  - topic: "Loading the model — pipelines, SCD-2 loads, backfills"
    where: "covered in ETL & Data Pipelines and Analytics Engineering (dbt)"
  - topic: "Running, tuning and migrating the live database"
    where: "covered in Data Ops — this track designs the change, that one ships it safely"

