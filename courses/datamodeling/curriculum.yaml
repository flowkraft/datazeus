      # KIMBALL'S ENTERPRISE ARGUMENT, and the reason his method scales past one mart. Without it
      # a team builds a sales star and an inventory star, each correct, and then discovers that
      # nobody can put the two numbers on one page because "Product" means something slightly
      # different in each.
      #   CONFORMED DIMENSION   the same Product/Customer/Date table shared by several facts —
      #                         or a strict subset of one (a "shrunken" dimension).
      #   THE BUS MATRIX        business processes down the side, conformed dimensions across
      #                         the top. One page that shows what can be compared with what,
      #                         and it doubles as the build order for the whole warehouse.
      #   DRILL-ACROSS          the payoff: query two facts separately at a common grain, then
      #                         join the RESULTS. Never join two fact tables directly.
      # Placed at 32, AFTER the star is actually built at 30 — you cannot argue about two marts
      # agreeing until you have made one. The koan is `reconcile`, because drill-across either
      # produces two columns that line up or it does not, and that is the whole assertion.
      # ALSO OWNS CONSOLIDATED FACT TABLES, and this is the natural next question after
      # drill-across rather than a separate subject: if two processes share a grain AND you
      # compare them constantly, stop drilling across and merge them into one fact table.
      #   THE EVERYDAY CASE is budget vs actual — or forecast vs actual, plan vs actual. One
      #   row per month per product carrying BOTH measures makes variance a subtraction
      #   instead of a two-query join, and it makes "variance" a column the whole business
      #   agrees on rather than something each report recomputes.
      #   THE RULE FOR WHICH: drill-across when the grains differ or the comparison is
      #   occasional; consolidate when the grains already match and the comparison is the
      #   point. Consolidating mismatched grains is just fan-out with extra steps.
      #   THE COST, say it: the consolidated table can only be loaded when BOTH sources have
      #   arrived, so it inherits the slower one's schedule.
      # ALSO NAME THE VALUE CHAIN here, in one line — Kimball's term for the sequence of
      # business processes (order -> shipment -> invoice -> payment) that the bus matrix is
      # drawn from. Data Model Patterns, Series 2 - 10 walks that chain as a model; here it is
      # just the reason the matrix has the rows it has.
      # SOURCE (kimball): CONFORMED DIMENSIONS, the ENTERPRISE DATA WAREHOUSE BUS MATRIX, DRILL-ACROSS, CONSOLIDATED FACT TABLES and the VALUE CHAIN.
      - n: "32"
