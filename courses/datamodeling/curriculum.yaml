        dataset: library
        status: planned
      # "How far do you model?" has a third answer the previous two episodes do not cover:
      # you stop, and store a document. Sits after denormalization because it is the same
      # question — how much structure is worth its cost — one step further along.
      #
      # The decision rule, and the episode exists to make it sayable in a review: model it if
      # you will FILTER, JOIN or AGGREGATE on it, or if it must be constrained. Store it as
      # JSON if it is genuinely shapeless, varies per row, or is only ever read whole.
