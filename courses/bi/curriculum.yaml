# The ordered episode list for BI & Data Visualization. Field docs live in
# courses/learnsql/curriculum.yaml. `short` is omitted until an episode has a video.
#
# One track, not two: choosing a chart and defining a metric are the same job — getting a
# decision made. Series 1 is charts that tell the truth, Series 2 is richer analysis and the
# metric definitions behind it, Series 3 is dashboards, delivery and getting it adopted.
#
# ╔════════════════════════════════════════════════════════════════════════════════════╗
# ║  THIS IS A BI COURSE. DATAPALLAS IS THE TOOL WE DEMONSTRATE IN.                     ║
# ╚════════════════════════════════════════════════════════════════════════════════════╝
# The subject is BI and visualization — general principles a reader takes to Looker, Power BI,
# Tableau or a hand-rolled page. What changes is only WHERE we demonstrate: for all BI and
# visualization needs we use DataPallas itself, never Metabase or any other bundled
# third-party app when DataPallas can do it.
#
# NEVER PRETEND THIS IS A DATAPALLAS COURSE. Same rule as everywhere in the academy: Learn SQL
# is not a CloudBeaver course, Python for Data is not a Jupyter course. Concretely:
#   TITLES name the SKILL, never the product's UI. "Building a Chart Without SQL", not "The
#     Data Canvas". "When Point-and-Click Runs Out", not "Finetune". Library names that are
#     industry-standard anywhere (pandas, dbt, pgvector) are fine; proprietary UI names are not.
#   PROSE teaches the principle first, then shows it — "here is how you do that in DataPallas".
#   EVERY EPISODE must leave the reader something true of BI generally. If an episode is only
#     true of DataPallas, it is product documentation and belongs in content/docs, not here.
#
# THE FOUR SURFACES we demonstrate on, all documented in
# content/docs/bi-analytics/dashboards.mdx. Read that before editing this file.
#   canvas          the Data Canvas. Drop a cube, tick fields, "Visualize as" SUGGESTS the
#                   shape from the data (one value -> Number, a time series -> Line, grouped
#                   values -> Bar), Finetune when ticking cannot express it, Display for the
#                   label and format, Publish Dashboard for a page with its own address.
#   cube            the cube designer. Shared with Data Warehousing on purpose: that track
#                   BUILDS cubes, this one CONSUMES them. Same object, two ends, and the
#                   reciprocal excludes say so.
#   report-config   the data script, HTML template and per-component config on disk.
#   web-components  rb-value, rb-chart, rb-tabulator, rb-pivot-table, rb-parameters, rb-report.
#
# A DASHBOARD IS CODE — the general principle behind Series 3 · 12, and true of every serious
# BI tool: Looker has LookML, Power BI has PBIP, Tableau has its XML, dbt has exposures. A
# dashboard clicked into existence and never written down cannot be reviewed, diffed, rolled
# back or rebuilt. DataPallas happens to make the point unusually cleanly, because its two
# ways of building — visual and hand-configured — produce the SAME files on disk, so they are
# two doors into one room rather than beginner mode and expert mode. That gives the reader the
# working habit to take anywhere: prototype visually in minutes, then open what it wrote and
# finish the job in files you can commit.
#
# THREE EPISODES ADDED 2026-08-24 so the track is built, not just read:
#   1 · 12   building a chart without SQL, right after "choosing the chart", so everything
#            after it is something the reader makes.
#   2 · 47   what to do when point-and-click runs out — and the best koan in the track.
#   3 · 12   dashboards as files, i.e. the principle above.
#
# AND THE SUGGESTED CHART IS A TEACHING POINT, not a convenience. A good tool reads the shape
# of the data and proposes an encoding — one value as a number, a time series as a line,
# grouped values as bars — which is Series 1 · 10's whole subject, demonstrated instead of
# asserted. Say out loud, every time, that the suggestion is a head start and never a rule: a
# reader who believes the tool decided will not overrule it, and overruling it is the skill.

course: learn-bi
track: bi
title: BI & Data Visualization

# Assumes Learn SQL, because every widget is a query and the most expensive mistake in this
# track is a chart that is beautiful and wrong. Series 2 · 06 (join fan-out) is the specific
# episode: a dashboard that double-counts is the same bug, drawn.
prerequisites:
  - course: learn-sql
    needs: "Series 2"
    why: >-
      A chart is a GROUP BY you can see. Series 2 · 06 in particular — a widget built on a
      fanned-out join shows a number that is confidently, plausibly too big.

excludes:
  - topic: "Writing the queries behind the widgets"
    where: "covered in Learn SQL"
  - topic: "Building the warehouse and designing the cubes themselves"
    where: "covered in Data Warehousing, which is where a cube gets designed and built. In this course, Series 1 · 12 uses one that already exists"
  - topic: "Natural-language questions and AI-assisted analysis"
    where: "covered in AI for Data"
  - topic: "Plotting for your own exploration in Python"
    where: "covered in Python for Data — this track is about charts other people read"

  # The reciprocal half of the near-collision, stated on both sides on purpose.
  - topic: "Implementing the metric as version-controlled, tested code"
    where: "covered in Analytics Engineering with dbt, Series 3 · 30, which writes the agreed definition as code. In this course, Series 2 · 40 is the earlier job of agreeing what it should mean"
  - topic: "Getting the dashboard's data there on time"
    where: "covered in ETL & Data Pipelines and Data Ops — here the numbers are assumed to have arrived"

