# The ordered episode list for BI & Data Visualization. Field docs live in
# courses/learnsql/curriculum.yaml. `short` is omitted until an episode has a video.
#
# One track, not two: choosing a chart and defining a metric are the same job — getting a
# decision made. Series 1 is charts that tell the truth, Series 2 is richer analysis and the
# metric definitions behind it, Series 3 is dashboards, delivery and getting it adopted.

course: learn-bi
track: bi
title: BI & Data Visualization

excludes:
  - topic: "Writing the queries behind the widgets"
    where: "covered in Master SQL"
  - topic: "Building the warehouse and the cubes themselves"
    where: "covered in Data Warehousing; here you consume them"
  - topic: "Natural-language questions and AI-assisted analysis"
    where: "covered in AI for Data"
  - topic: "Plotting for your own exploration in Python"
    where: "covered in Python for Data — this track is about charts other people read"

