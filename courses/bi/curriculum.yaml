      # ADDED 2026-08-24, and the gap it fills is the commonest reason a correct dashboard stops
      # being used. Series 3 is adoption; nothing is adopted that takes forty seconds to load.
      # THE SKILL: find which widget is slow, and know the four fixes in order of what they
      # cost you — narrow the query, pre-aggregate, cache the result, or push it to a
      # columnar engine. The order matters: people reach for caching first and then cannot
      # explain why a number is stale.
      # KOAN: `count:scanned`, never a stopwatch — the same page, an order of magnitude less
