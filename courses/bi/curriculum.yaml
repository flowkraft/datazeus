        title: "Choosing the Right Chart — Match the Chart to the Question"
        hands_on: ["koan:choose"]
        core: true
        status: planned
      # ADDED 2026-08-24, and it belongs HERE — right after "choosing the right chart" — so every
      # episode after it (bar, line, part-to-whole, KPI) is something the reader BUILDS rather
      # than reads about.
      # THE SKILL: pick the data, then pick the shape — the loop every modern BI tool gives you.
      # DEMONSTRATED IN DataPallas: drop a cube on the Canvas, tick fields, let "Visualize as"
      # suggest the encoding, set the label in Display. Teach the loop, name the buttons once,
