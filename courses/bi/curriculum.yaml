      # SERIES 2 PROJECT, added 2026-08-24. The series had none: the core path
      # walked ten episodes with nothing built at the end of them.
      # Series 2 ends on the semantic layer, and the failure it prevents is three widgets disagreeing
      # about revenue. Graded by equivalence: every surface returns the same number.
      # ADDED 2026-08-24. THE SKILL: every BI tool has a ceiling, and knowing where it is — and
      # how to drop below it for one widget without abandoning the tool — is what separates
      # someone who can finish a dashboard from someone who gives up on it. Ticking fields
      # covers most widgets; it cannot express a ratio across ranked rows — "what share of
      # revenue comes from the top twenty percent of customers".
      # DEMONSTRATED IN DataPallas: the widget's Finetune tab takes a query or a Groovy script
