        core: true
        status: planned
      # SOURCE (cleveland-mcgill): The PERCEPTION RANKING — position beats length beats angle beats area beats colour — is Cleveland & McGill's 1984 experiment, not an opinion. Cite the evidence; it is what makes this episode more than taste.
      - n: "05"
        slug: visual-encoding
        title: "Visual Encoding — Position, Length, Colour and What the Eye Reads First"
        credits:
          - source: cleveland-mcgill
