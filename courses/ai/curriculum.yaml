    tagline: embeddings, vector search and RAG on your own data
    level: intermediate
    episodes:
      - n: "00"
        slug: what-is-an-embedding
        title: "Embeddings — Turning Rows and Text into Vectors"
        hands_on: ["koan:predict"]
        core: true
        status: planned
      - n: "05"
        slug: similarity-and-distance
        title: "Similarity & Distance — Cosine, Euclidean and Approximate Nearest Neighbours"
        hands_on: ["koan:predict", "koan:complete"]
        status: planned
      # THE EPISODE THAT CARRIES THE HEADER DECISION. It must do three things, in this order:
      #   1. Switch pgvector on in the Northwind the reader already has — CREATE EXTENSION,
      #      a vector column, an hnsw index. Verified present: pgvector 0.8.0 in the shipped
      #      supabase/postgres image, so this is one SQL statement and no install.
      #   2. Show the same thing in DuckDB (`INSTALL vss`) for the reader with no server up.
      #   3. NAME THE CASE WHERE A DEDICATED VECTOR DATABASE IS RIGHT — billions of vectors,
      #      or an index that has to scale separately from the database — and say plainly that
      #      this is not that. An episode that pretends the specialist tools have no purpose
      #      is as useless as one that installs Qdrant to embed 77 products.
      # The koan is filtered search: nearest neighbours WHERE category = 4. That is the real
      # workload, it is one query here, and it is the argument for this design in one line.
      - n: "10"
        slug: vector-storage
        title: "Vector Storage Where Your Data Already Lives — pgvector and DuckDB vss"
        hands_on: ["koan:complete", "supabase"]
        core: true
        status: planned
