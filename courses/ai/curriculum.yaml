# The ordered episode list for AI for Data. Field docs live in courses/learnsql/curriculum.yaml.
# `short` is omitted until an episode has a video.
#
# The job this track teaches: use AI on data you're responsible for, and be able to prove
# the answer is right. Series 1 is AI as a copilot (what most people need first), Series 2
# teaches it about your data, Series 3 ships a feature you'd defend in an audit.
#
# ╔════════════════════════════════════════════════════════════════════════════════════╗
# ║  THE VECTOR STORE: NOTHING NEW GETS SHIPPED. Decided 2026-08-24, on evidence.       ║
# ╚════════════════════════════════════════════════════════════════════════════════════╝
# The question was whether Series 2 needs a dedicated vector database — a Qdrant, a Weaviate,
# a Milvus, shipped as a ninth app next to CloudBeaver and Jupyter. The answer is no, and it
# is not a close call.
#
# WHAT IS ALREADY ON THE MACHINE, verified by inspecting the image rather than assuming:
#   pgvector 0.8.0, with BOTH ivfflat and hnsw index types, inside supabase/postgres:15.8.1.085
#     — the container DataPallas already ships as `rb-northwind-supabase`, whose database is
#     already called Northwind. Same rows, same numbers, same database as everything else.
#   pg_trgm, unaccent, fuzzystrmatch, rum — the keyword half of Series 2 · 35 (hybrid search),
#     in the same engine, so hybrid retrieval is one query and not a join across two systems.
#   DuckDB's `vss` extension — `INSTALL vss` on the DuckDB the academy already uses, which is
#     what makes Series 2 · 10's title honest for the reader who has no server running.
#
# WHY A DEDICATED VECTOR DB WOULD BE THE WRONG CALL HERE, and this is the teaching point as
# much as the infrastructure one:
#   1. IT WOULD BREAK THE ONE PROPERTY THE ACADEMY IS BUILT ON. Every track uses the same
#      Northwind. Embeddings in a second system means the products you search are not joined
#      to the orders you report on, and "semantic search found it" stops being checkable
#      against a number the reader already knows.
#   2. FILTERED SEARCH IS THE REAL WORKLOAD. Nobody asks for "the nearest vectors". They ask
#      for the nearest vectors WHERE category = 4 AND discontinued = false. In pgvector that
#      is one query with one plan. Across two systems it is over-fetch, ship, filter, and hope.
#   3. IT IS THE HONEST PROFESSIONAL ADVICE. At Northwind's scale — and at most companies'
#      scale — "put the vectors next to the rows" is what a good engineer actually does. A
#      course that installs a distributed vector database to embed 77 products is teaching the
#      wrong instinct in the first week.
#   4. ONE MORE 3GB IMAGE, for a capability already present, is a cost with no benefit.
#
# WHAT SERIES 2 THEREFORE OWES THE READER: the episode where a dedicated store IS the right
# answer — billions of vectors, or a team that needs the index to scale separately from the
# database. Name it, size it honestly, and say that this is not that. See Series 2 · 10.

course: learn-ai
track: ai
title: AI for Data

# Assumes Learn SQL, and this is the least optional prerequisite in the academy. The entire
# premise of Series 1 is that you READ what the model wrote before you trust it, and someone
# who cannot read a join cannot do that. Without it this track teaches you to believe a
# confident stranger.
prerequisites:
  - course: learn-sql
    needs: "Series 2"
    why: >-
      Every episode in Series 1 ends with you checking a generated query. A model that invents
      a column or writes the wrong join produces a plausible number, and multi-table joins are
      exactly where it goes wrong — so Series 2, not Series 1.

excludes:
  - topic: "Classical machine learning — features, training, model selection"
    where: "not covered; this track is LLM-era work on data you already have"
  - topic: "Reading and fixing the SQL a model writes"
    where: "covered in Learn SQL — you still have to be able to check its work"
  - topic: "Dashboards and metric governance"
    where: "covered in BI & Data Visualization"

  # Named because "AI" is the vaguest word on the roadmap and two readers arrive wanting
  # completely different things.
  - topic: "Training or fine-tuning a model of your own"
    where: "not covered; Series 3 · 30 tells you why RAG is almost always the cheaper answer, and stops there"
  - topic: "Chatbots, agents and prompt engineering in general"
    where: "not covered as a subject in itself — everything here is pointed at data you are responsible for"
  - topic: "Running the vector store — sizing, backups, index rebuilds"
    where: "covered in Data Ops; here pgvector is switched on inside the PostgreSQL DataPallas already ships"

