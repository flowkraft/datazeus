  # SERIES 2 IS THE FIRST PRODUCT, AND IT IS DELIBERATELY THE ONE FURTHEST FROM SERIES 1.
  # XCP-ng is Xen, not KVM: a different hypervisor, a different control domain, a different
  # vocabulary. That is exactly why it comes before Proxmox — a reader who meets Proxmox second
  # sees it as "Series 1 with a UI", which is the correct and useful way to see it, and they can
  # only see that if they have already met a platform that is NOT that.
  - slug: series2-xcp-ng
    title: XCP-ng and Xen Orchestra
    tagline: a type-1 hypervisor, a pool, and the backup story that sells it
    level: intermediate
    episodes:
      # COVER: what it is and where it came from, because the lineage explains the product.
      #   IT IS XEN, and Xen is a TYPE-1 hypervisor — it boots before Linux does, and what you
      #   log into is dom0, a privileged VM that manages the others. That is a genuinely
      #   different architecture from Series 1, where Linux is the host and KVM is a module in
      #   it, and the difference shows up everywhere: in what dom0 is for, in how you patch, and
      #   in why you do not install things on it.
      #   IT IS A FORK OF CITRIX XENSERVER, open source, driven by Vates. Say this plainly — a
      #   reader will meet XenServer documentation and needs to know why it looks familiar.
      # XEN AGAINST KVM, IN ONE HONEST PARAGRAPH AND NOT A HOLY WAR: both are mature, both are
      # in production at enormous scale, performance differences are workload-specific and
      # smaller than the internet suggests. THE REAL DECISION IS THE MANAGEMENT PLANE AND THE
      # ECOSYSTEM AROUND IT, not the hypervisor, and this course says so once here so it never
      # has to be argued again.
      # THE WORKPLACE MOMENT THAT PUTS THIS PRODUCT ON THE TABLE, and it is the same one every
      # time: the per-socket licence renewal arrived and it has a new number on it. VMware and
      # Hyper-V are named here as context — this is what a team is usually migrating FROM — and
      # not taught, per this course's excludes.
      # AND WHO IT IS FOR: an organisation that wants a hypervisor PLATFORM with a support
      # contract available, rather than a Linux box it also runs VMs on. If that distinction
      # does not describe you, Series 3 probably does.
      # ⚠ SAY HERE THAT THE WHOLE SERIES RUNS NESTED, in a single VM with 8–16 GB, with the
      # nested-virtualization flag named.
      - n: "00"
        slug: what-xcp-ng-is
        title: "XCP-ng — Xen, a Fork of XenServer, and the Licence Renewal That Sells It"
        hands_on: ["koan:choose", "eyes"]
        core: true
        status: planned
      # COVER: the install, as a runbook, and the concept that install forces you to meet.
      # THE INSTALLER: it takes the whole disk, it is not Debian, and the local storage
      # repository is created for you on what is left. Say what it asks and what to answer.
      # THEN DOM0, AND THE RULE THAT IS THE MOST USEFUL SENTENCE IN THIS SERIES: DOM0 IS NOT
      # YOUR SERVER. It is a control domain with a deliberately small memory allocation and a
      # small root filesystem, and it gets REPLACED on major upgrades. So:
      #   DO NOT install your monitoring stack, your scripts, your Python, or your data tools in
      #   it. Do not fill /var. Every one of those is lost or in the way at upgrade time.
      #   ANYTHING YOU WANT TO RUN GOES IN A VM — including, and especially, the management
      #   plane in Series 2 · 05.
      # This is the mistake everybody makes once, it is invisible for a year, and it surfaces on
      # the day of an upgrade, which is the worst possible day.
      # ALSO COVER: xsconsole, the local console menu you will use before networking works, and
      # the first `xe host-list` — the CLI that this series treats as the runbook.
      - n: "02"
        slug: installing-and-dom0
        title: "Installing a Host — and Why dom0 Is Not Somewhere You Put Things"
        hands_on: ["koan:process:tool", "koan:capture"]
        core: true
        status: planned
