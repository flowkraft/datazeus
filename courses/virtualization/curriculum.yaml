      # AND THE ACADEMY'S SENTENCE, RESTATED FOR THE THIRD TIME IN THIS COURSE BECAUSE IT IS THE
      # ONE THAT COSTS PEOPLE THEIR JOBS: REPLICATION IS NOT A BACKUP. A deletion replicates. A
      # ransomware encryption replicates, promptly and reliably.
      #   WHAT ACTUALLY DEFENDS YOU IS RETENTION PLUS IMMUTABILITY: snapshots the compromised
