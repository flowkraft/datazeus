      # THE COURSE-WIDE CHOOSER, and it is the last teaching episode for a reason: only now can
      # a reader compare these honestly, because only now have they run all four.
      # THE FIRST THING TO SAY, AND IT UNDOES THE FRAMING PEOPLE ARRIVE WITH: THESE ARE NOT FOUR
      # COMPETITORS. Series 1 is the layer, Series 2 and Series 3 are two answers to the same
      # question, and Series 4 is usually underneath whichever you pick. The common real-world
      # shapes are worth drawing:
      #   ONE BOX                    Proxmox with local ZFS, or plain Debian with libvirt and
      #                              Incus. Most data teams, most of the time.
      #   TWO OR THREE BOXES         Proxmox with a QDevice and ZFS replication — cheap, and the
      #                              recovery point objective is stated rather than hidden.
      #   A NAS PLUS TWO HYPERVISORS TrueNAS exporting NFS, with XCP-ng or Proxmox on top. The
      #                              classic small-estate shape, and its single point of failure
      #                              is the NAS.
      #   AN ESTATE WITH AN OWNER    XCP-ng pools, Xen Orchestra, and its backup story.
      #   RENTED                     Data Ops, Series 1 · 46, and it is not a failure.
      # THEN THE COMPARISON DIMENSIONS THAT ACTUALLY DIFFER, and only those: containers as first
      # class or not; whether the vendor's backup tool is part of the platform; how far you can
      # get with no subscription; how much of it survives when the UI is down; and how much
      # Linux knowledge the product assumes.
      # AND THE DECISION THAT IS NOT ABOUT FEATURES AT ALL: WHO OPERATES THIS, WHAT ELSE IS ON
      # THEIR PLATE, AND WHAT HAPPENS IN EIGHTEEN MONTHS WHEN THEY LEAVE. Every platform in this
      # course is free to download. None of them is free to own, and the hours are the price.
