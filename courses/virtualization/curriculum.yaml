  # SERIES 4 IS LAST BECAUSE IT IS THE LAYER UNDERNEATH THE OTHER TWO, and that only makes sense
  # once a reader has met a pool that needs shared storage (Series 2 · 07) and a cluster that
  # would rather not (Series 3 · 12). TrueNAS is not a fourth hypervisor to choose between; in
  # most real deployments it is the box the hypervisors keep their disks on.
  - slug: series4-truenas
    title: TrueNAS
    tagline: the storage box under the hypervisors — and the appliance rule
    level: intermediate
    episodes:
      # COVER: what it is, and the rule that makes it different from everything else in this
      # course and in this academy.
      #   WHAT IT IS: ZFS, plus a management API and web interface, plus the sharing protocols,
      #   packaged as an appliance. The modern line is Linux-based (formerly branded SCALE) and
      #   the older one was FreeBSD-based; ⚠ THE EDITION NAMES HAVE CHANGED RECENTLY — check the
      #   current naming and the release you are writing against, and say it in the lesson.
      #   WHY IT IS IN A VIRTUALIZATION COURSE: because Series 2 · 07 said a pool needs shared
      #   storage and Series 3 · 12 said the alternative is replication with a real recovery
      #   point objective. This is the box that answers the first, and it is the commonest
      #   answer in a small estate.
      # AND THE APPLIANCE RULE, WHICH IS THE OPPOSITE INSTINCT TO THE REST OF THIS ACADEMY AND
      # MUST BE STATED IN THE FIRST EPISODE: YOU CONFIGURE IT THROUGH THE UI OR THE API, NOT BY
      # EDITING FILES OVER SSH. The configuration lives in a database that generates the config
      # files, so hand edits are overwritten on the next change and lost on upgrade. The root
      # filesystem is treated as replaceable.
      #   THE COROLLARY THAT MAKES IT BEARABLE: `midclt` gives you the same API from the shell,
      #   so scripting is fully supported — through the API, which is the point.
      #   AND WHEN THE RULE MEANS "USE SOMETHING ELSE": if what you want requires apt and a
      #   config file, you did not want an appliance. Debian and Storage for Data, Series 2 is
      #   that path, and Series 4 · 25 is where the reader decides.
      # ⚠ SAY THE WHOLE SERIES RUNS NESTED with a handful of small virtual disks.
      - n: "00"
        slug: what-truenas-is
        title: "TrueNAS — ZFS as an Appliance, and Why You Do Not Edit the Config Files"
        hands_on: ["koan:choose", "koan:capture"]
        core: true
        status: planned
      # COVER: the install, and the hardware decisions that are genuinely expensive to get
      # wrong — which is worth an episode because unlike the rest of this course, this one is
      # usually bought as a physical box.
      #   THE BOOT DEVICE IS SEPARATE FROM THE DATA POOLS, and it should be mirrored, and it
      #   should not be a USB stick. Losing it costs a reinstall plus a configuration restore
      #   rather than data — which is why EXPORTING THE CONFIGURATION FILE after every change is
      #   the habit this episode installs.
      #   NO HARDWARE RAID UNDER ZFS. An HBA in IT mode, passing the disks through raw. A RAID
      #   controller hides the disks, lies about flushes, and takes away exactly the information
      #   ZFS needs to repair anything — Storage for Data, Series 2 · 10 is why this matters and
      #   Storage for Data, Series 1 · 15 is what the controller is doing instead. This is a
      #   classic, expensive, extremely common mistake and it deserves to be blunt.
      #   ECC MEMORY: the honest version. It is genuinely better and it is not a hard
      #   requirement; the internet argument on this is worse than the facts. State what it
      #   protects against and let the reader decide.
      #   DISK COUNT AND LAYOUT are Storage for Data, Series 2 · 07's episode and are not
      #   repeated here — but say plainly that the vdev layout is chosen now and is the decision
      #   with the least room to change your mind.
      #   AND VIRTUALIZING TRUENAS ITSELF: fine for a lab, and for production it requires
      #   passing the HBA through to the guest, which is Series 1 · 25's passthrough paragraph
