    title: Proxmox VE
    tagline: Series 1's tools, with a cluster, a web UI and a backup server
    level: intermediate
    episodes:
      # COVER: what it is, stated in a way that makes the whole series easier — PROXMOX VE IS
      # DEBIAN, WITH KVM AND LXC, A WEB UI, A CLUSTER FILESYSTEM AND A BACKUP TOOL. Every
      # primitive in Series 1 is still there and still works. `qm` is libvirt's job done
      # differently; `pct` drives LXC; you can apt install things; you can ssh in and everything
      # you know is true.
      # WHY THAT MATTERS AND IS NOT TRIVIA: it means the UI is a convenience rather than a
      # boundary, and when something is inexplicable the answer is one layer down in a place you
      # have already been. This is the opposite of Series 2 · 02's dom0 rule and the contrast is
      # worth drawing explicitly.
      # THE ONE COMBINATION NOTHING ELSE HERE OFFERS: VMs AND SYSTEM CONTAINERS SIDE BY SIDE,
      # managed identically. For a data team that is exactly right — the database in a VM, and
      # a dozen containers for tools, runners and per-developer environments, at container
      # density.
      # ⚠ THE SUBSCRIPTION QUESTION, ANSWERED HONESTLY AND WITHOUT SNEERING: there is an
      # enterprise repository and a no-subscription repository, the software is the same, the
      # no-subscription one is less conservatively tested, and there is a dialog on login. It is
      # a real company that does real work and if you depend on this in production you should
      # pay them. Say the current state, with a date, checked rather than remembered.
      # ⚠ AND SAY THAT THE WHOLE SERIES RUNS NESTED IN ONE VM, naming the flag.
      - n: "00"
        slug: what-proxmox-is
        title: "Proxmox VE — Debian, KVM and LXC, With a Cluster Around Them"
        hands_on: ["koan:choose", "koan:capture"]
        core: true
        status: planned
      # COVER: the installation, and the ONE DECISION IN IT THAT YOU CANNOT COMFORTABLY TAKE
      # BACK — the root filesystem and storage layout, chosen in the installer before you know
      # anything about the product.
      #   ext4 ON LVM        the default. LVM-thin for guest disks, which gives snapshots and
      #                      overcommit. Simple, fine, and Storage for Data, Series 1 · 18 is
      #                      the background.
      #   ZFS (RAID1, RAIDZ) chosen at install, gives you checksums, cheap snapshots, replication
      #                      between nodes, and compression. Storage for Data, Series 2 · 07 is
      #                      the layout argument and it applies here EXACTLY — including that
      #                      the vdev choice is permanent.
      #   BTRFS              offered, and Storage for Data, Series 2 · 21 is the honest account.
      # THE RECOMMENDATION AND THE REASON: for a data team's single node, ZFS with a mirrored
      # boot pair is the layout that survives a disk dying at 2 a.m. without anybody being
      # awake, and it enables the replication in Series 3 · 12. It costs RAM. Say both.
      # AND THE HARDWARE PARAGRAPH: the boot device is written to constantly by the cluster
      # filesystem, so a cheap USB stick or a low-endurance consumer SSD is a device that WILL
      # fail — this is a known, specific, repeatedly-reported failure and it belongs in the
      # lesson.
      # THEN THE POST-INSTALL RUNBOOK: repositories, updates, the network bridge (vmbr0, which
      # is Series 1 · 15 pre-built for you), and a non-root user with a real login.
      - n: "02"
        slug: installing-proxmox
        title: "Installing It — the Disk Layout You Choose Before You Know Anything"
        hands_on: ["koan:choose", "koan:process:tool"]
        core: true
        status: planned
      # COVER: the CLI, treated as the real interface, and the file layout that explains the
      # whole product.
      #   qm   for VMs — create, start, stop, clone, migrate, set, config, snapshot. Every one
      #        of these is Series 1 · 07's virsh with different spelling.
      #   pct  for containers — the same verbs, over LXC.
      #   pvesm for storage, pvecm for the cluster.
      # AND THE THING WORTH THE WHOLE EPISODE: /etc/pve IS NOT A NORMAL DIRECTORY. It is pmxcfs,
      # a FUSE filesystem backed by a database that is REPLICATED ACROSS THE CLUSTER by corosync.
      # Your VM configuration files live there, which is why editing one on any node changes it
      # everywhere and why it is the same on every node.
      # THE CONSEQUENCE THAT WILL ONE DAY BE YOUR AFTERNOON: WHEN A NODE LOSES QUORUM,
      # /etc/pve GOES READ-ONLY. The VMs keep running, but you cannot start one, cannot change
      # one, and the UI throws errors that mention permissions rather than quorum. A reader who
      # has met this sentence once diagnoses it in thirty seconds; a reader who has not spends
      # an hour on file permissions. Series 3 · 12 is where quorum is taught; this is where its
      # symptom is named.
      # ALSO: where a VM's config actually is, how to read it, and the fact that a disk is a
      # line in that file pointing at a storage identifier — which makes Series 3 · 10 legible.
      - n: "05"
        slug: qm-and-pct
        title: "qm, pct and /etc/pve — the CLI, and the Directory That Goes Read-Only"
        hands_on: ["koan:process:tool", "koan:diagnose"]
        core: true
        status: planned
      # COVER: the workflow that makes this product pay for itself in a data team, and it is
      # Series 1 · 22 with the sharp edges removed.
      #   BUILD A TEMPLATE from a cloud image: `qm create`, import the disk, attach a cloud-init
      #   drive, set the ssh key and the user, then `qm template`. This is a runbook and it is
      #   the most-copied set of commands in the whole product.
      #   FULL CLONE against LINKED CLONE: independent and slow against instant and dependent.
      #   Linked clones need the storage to support it — which is Series 3 · 10's table arriving
      #   with consequences.
      #   CLOUD-INIT fields in the UI and via `qm set --ipconfig0`, and how to check what
      #   happened when a clone comes up with the wrong hostname.
      # THE WORKPLACE MOMENT, AND IT IS THE BUSINESS CASE: every developer needs a database with
      # last month's data. Build one container or VM, restore into it once, template it, and
      # hand out clones that take four seconds and almost no disk. The alternative — everybody
      # restoring a dump for themselves — costs hours a week and a lot of storage, and this is
      # the episode that ends it.
      # AND THE SAME PATTERN FOR CONTAINERS: `pct` templates and the distribution templates
      # Proxmox ships, which is the fastest way to get a throwaway Debian on the network.
      - n: "07"
        slug: templates-and-clones
        title: "Templates, Linked Clones and cloud-init — a Database per Developer in Seconds"
        hands_on: ["koan:process:tool", "koan:complete"]
        core: true
        status: planned
      # COVER: storage, which in this product means two ideas people conflate — WHERE the bytes
      # go, and WHAT KIND of thing is allowed to go there.
      #   THE TYPES: dir, LVM, LVM-thin, ZFS, NFS, CIFS, iSCSI, Ceph RBD, and Proxmox Backup
      #   Server as a storage target in its own right.
      #   CONTENT TYPES, which is the concept the UI forces on you and nobody explains: a
      #   storage is marked as holding disk images, container rootfs, ISO files, container
      #   templates, backups, or snippets. A storage that will not appear in a dropdown is
      #   almost always a content type you did not tick.
      #   AND THE FEATURE MATRIX THAT ACTUALLY DECIDES THINGS: which storages support SNAPSHOTS,
      #   which support THIN provisioning, and which support LINKED CLONES. A directory holding
      #   qcow2 does; plain LVM does not; LVM-thin and ZFS do. Choosing the wrong one means
      #   discovering on migration day that you cannot snapshot before an upgrade.
      # THE SHARED-STORAGE POINT, which Series 3 · 12 depends on: NFS or iSCSI from the box in
      # Series 4, or Ceph, is what lets a VM run on any node. Local ZFS plus replication is the
      # cheaper approximation and Series 3 · 12 covers the difference honestly.
      # AND THE CLIFF: thin provisioning plus snapshots plus backups on the same pool, and
      # Storage for Data, Series 1 · 25's 80 per cent rule as the operational answer. On ZFS a
      # full pool is not a warning, it is guests with I/O errors.
      - n: "10"
        slug: storage-and-content-types
        title: "Storage Types and Content Types — the Dropdown Your Storage Is Missing From"
        hands_on: ["koan:choose", "koan:diagnose"]
        core: true
        status: planned
      # COVER: clustering, and the concept that decides whether it helps or hurts.
      #   pvecm create / pvecm add, what actually joins, and the fact that JOINING A CLUSTER
      #   REPLACES A NODE'S /etc/pve — so you join an empty node, and joining one with VMs on it
      #   is a documented pain rather than a normal operation.
      #   COROSYNC AND QUORUM: a cluster needs more than half its votes to act. Which is why
      #   TWO NODES IS THE WORST NUMBER — either node failing leaves one vote out of two, no
      #   quorum, and Series 3 · 05's read-only /etc/pve on the survivor. The fixes: a third
      #   node, or a QDEVICE, which is a tiny vote-only daemon on any third machine — a NAS, a
      #   Raspberry Pi, the box in Series 4. This is the single most useful practical fact in
      #   the series for a small team.
      #   COROSYNC WANTS A LOW-LATENCY, RELIABLE NETWORK, ideally its own, and a redundant ring.
      #   A cluster whose heartbeat shares a link with a backup job will fence itself.
      #   REMOVING A NODE PROPERLY — a documented procedure, and one you cannot improvise.
      # AND THE ALTERNATIVE FOR PEOPLE WITHOUT SHARED STORAGE: ZFS REPLICATION between nodes on
      # a schedule. It is asynchronous, so a failover LOSES whatever changed since the last
      # replication — one minute, five minutes, whatever you set. For many data workloads that
      # is an acceptable and very cheap answer, and stating the RPO out loud is the whole skill.
      - n: "12"
        slug: clustering-and-quorum
        title: "Corosync, Quorum and the QDevice — Why Two Nodes Is the Worst Number"
        hands_on: ["koan:predict", "koan:choose"]
        core: true
        status: planned
      # COVER: HA, and then the sentence this course exists partly to deliver.
      # WHAT IT DOES: the HA manager watches resources; when a node stops answering, its VMs are
      # started on another node. FENCING is what stops the old node writing to the same disks —
      # a hardware watchdog reboots a node that has lost quorum. Without fencing you get split
      # brain, which on shared storage means two machines writing to one filesystem, which means
      # the data is gone.
      # THE REQUIREMENTS: three nodes or a QDevice, shared storage or replication, and a
      # watchdog that actually works. HA on two nodes with no QDevice is a way to lose data.
      # ⚠ AND THE MISUNDERSTANDING, STATED AS PLAINLY AS THIS COURSE CAN MANAGE:
      #   HA OF A VM IS NOT HA OF A DATABASE. What HA gives you is: the machine comes back
      #   somewhere else, in a few minutes, having been powered off without warning. Your
      #   database then does crash recovery, replays its write-ahead log, and comes up. Every
      #   connection was dropped. Every in-flight transaction was rolled back. Anything that was
      #   only in memory is gone.
      #   THAT IS GENUINELY USEFUL AND IT IS NOT WHAT A DATABASE PERSON MEANS BY THE WORDS.
      #   Real database availability is streaming replication and a failover decision, which is
      #   Data Ops, Series 2 · 45 — a DIFFERENT MECHANISM AT A DIFFERENT LAYER, and the two are
      #   complementary rather than alternatives.
      # THE HONEST QUESTION TO CLOSE ON: what is your actual recovery time objective, and would
      # a documented ten-minute manual restart have met it? Very often it would, and HA's
      # complexity is then a cost with no matching benefit.
      - n: "15"
        slug: ha-and-fencing
        title: "HA and Fencing — the VM Comes Back, and the Database Still Crashed"
        hands_on: ["koan:predict", "koan:choose"]
        core: true
        status: planned
      # COVER: Ceph in Proxmox, in ONE episode, deliberately, and the episode is mostly a
      # warning rather than a tutorial.
      # WHAT THE PRODUCT DOES: it will install and configure a Ceph cluster from the web UI in
      # about ten minutes — monitors, managers, OSDs, pools — and then offer you RBD as a
      # storage. It genuinely works. THAT IS EXACTLY THE PROBLEM: it makes a decision that
      # deserves a quarter of planning look like four clicks.
      # WHAT YOU HAVE ACTUALLY TAKEN ON, listed so a reader can price it: a distributed storage
      # system with its own failure modes, its own upgrade order, its own network requirements,
      # and its own vocabulary — and it is now underneath every VM you run, so its bad day is
      # everybody's bad day.
      # THE MINIMUM THAT IS NOT A TOY: three nodes at the very least, a separate and fast
      # storage network, enough RAM per OSD, and real disks rather than consumer SSDs without
      # power-loss protection.
      # AND THEN POINT, RATHER THAN TEACH: Storage for Data, Series 4 is fourteen episodes on
      # what this is and how to operate it, and Storage for Data, Series 4 · 58 is the decision
      # episode. This course's job is to make sure nobody arrives at a Ceph cluster by accident.
      # THE ALTERNATIVES FOR A THREE-NODE DATA TEAM, said plainly: ZFS replication from
      # Series 3 · 12 for most people, or NFS from the box in Series 4 · 10.
      - n: "17"
        slug: ceph-in-proxmox
        title: "The Ceph Button — Ten Minutes to Install, and What You Just Agreed To"
        hands_on: ["koan:choose", "eyes"]
        status: planned
      # COVER: vzdump, and THE MOST IMPORTANT EPISODE IN THIS COURSE FOR A DATA READER.
      #   THE THREE MODES: STOP (shut the guest down — perfectly consistent, and an outage),
      #   SUSPEND (freeze it — shorter outage, older mechanism), SNAPSHOT (no outage, and the
      #   whole of the rest of this episode).
      #   COMPRESSION, bandwidth limits, and where the backup goes.
      # AND NOW THE PART THAT MATTERS. A SNAPSHOT-MODE BACKUP OF A RUNNING DATABASE IS
      # CRASH-CONSISTENT: it is exactly what you would have if you pulled the power cable at
      # that instant. Restore it and Postgres replays its write-ahead log and comes up. Usually.
      #   "USUALLY" IS NOT A BACKUP POLICY, and the failure is not theoretical: with the disk
      #   cache mode from Series 1 · 25 set wrong, or with a device that lies about flushes, the
      #   snapshot can be missing writes the database believed were durable.
      #   THE QEMU GUEST AGENT is the partial answer: with it installed, Proxmox can ask the
      #   guest to FREEZE ITS FILESYSTEMS for the instant of the snapshot, which makes the image
      #   filesystem-consistent. INSTALL IT IN EVERY GUEST. It is also what gives you clean
      #   shutdowns and the guest's IP in the UI.
      #   AND THE REAL ANSWER, WHICH IS THE SENTENCE THE EPISODE EXISTS FOR: A VM BACKUP
      #   PROTECTS THE MACHINE. IT DOES NOT REPLACE A DATABASE BACKUP. You want both, and the
      #   database one — pg_dump, or PITR with a base backup and WAL archiving from Data Ops,
      #   Series 2 · 30 — is the one that gives you point-in-time recovery, that you can restore
      #   a single table from, and that you can restore onto a different machine entirely.
      # THE POLICY TO LEAVE THEM WITH: VM backups nightly for the machine, database backups on
      # the database's own schedule for the data, both off the host, and both restored on a
      # schedule rather than on the day you need them.
      - n: "20"
        slug: vzdump-and-consistency
        title: "vzdump — Crash-Consistent Is Not Consistent, and the Agent That Helps"
        hands_on: ["koan:process:tool", "koan:predict"]
        core: true
        status: planned
      # COVER: Proxmox Backup Server, which is a separate product and is genuinely the reason
      # many teams choose this ecosystem.
      #   WHAT IT CHANGES: content-addressed, deduplicated, INCREMENTAL FOREVER backups. After
      #   the first one, a nightly backup of a 200 GB VM transfers and stores the changed chunks
      #   only. Deduplication is across all backups and all VMs, so fifty clones of one template
      #   cost close to one template. The arithmetic is worth showing, because it is the
      #   difference between keeping four weeks and keeping four days.
      #   VERIFY JOBS: it re-reads and checksums stored chunks on a schedule and tells you when
      #   a backup has rotted. That is the "prove it" half, automated, and it is rare.
      #   PRUNE AND GARBAGE COLLECTION: retention as keep-daily / keep-weekly / keep-monthly,
      #   and the fact that pruning marks and GC frees — so space does not come back until GC
      #   runs, which surprises everybody once.
      #   SINGLE-FILE RESTORE: browse into a backup and pull one file out without restoring the
      #   whole VM. THE WORKPLACE MOMENT: somebody deleted one configuration file, or one CSV,
      #   and you are not restoring 200 GB to get it back.
      #   ENCRYPTION client-side, and where the key lives — because a key stored only on the
      #   machine being backed up is not a key.
      # WHERE TO PUT IT: NOT ON THE HOST IT BACKS UP. A separate machine, and ideally a copy of
      # the datastore off-site — sync jobs to a second PBS or to the S3-compatible storage in
      # Data Ops, Series 1 · 47.
      - n: "22"
        slug: proxmox-backup-server
        title: "Proxmox Backup Server — Deduplication, Verify Jobs, and One File Back"
        hands_on: ["koan:process:tool", "koan:capture"]
        core: true
        status: planned
      # COVER: the access-control half, kept short and practical.
      #   USERS, GROUPS, ROLES AND THE PERMISSION PATH — permissions are granted on a path like
      #   /vms/101 or /storage/nas, which is unusual and is the concept to teach.
      #   REALMS: the local one, PAM, and an existing directory. Two-factor, briefly.
      #   API TOKENS: a token with a narrow role, used by a script, that can be revoked without
      #   changing anybody's password. THE WORKPLACE USE: the backup-checking script, the
      #   monitoring probe, and the Terraform provider — which is where Terraform & Pulumi picks
      #   this up and this course stops.
      #   THE FIREWALL at datacenter, node and guest level, with the rule that catches everybody:
      #   IT MUST BE ENABLED AT BOTH THE DATACENTER AND THE OBJECT LEVEL to take effect, and the
      #   default-deny that follows will lock you out if you have not allowed your own SSH.
      # AND THE PRACTICAL POSTURE FOR A SMALL TEAM: the management interface is not on the
      # public internet, ever. It is behind a VPN or an ssh tunnel. Say it once and firmly.
      - n: "25"
        slug: users-firewall-and-api
        title: "Roles, API Tokens and the Firewall — Least Privilege for the Script That Checks Backups"
        hands_on: ["koan:process:tool", "koan:choose"]
        status: planned
      # COVER: upgrades, which for this product means a Debian major upgrade underneath a
      # cluster, and it is more survivable than it sounds if the order is respected.
      #   THE CHECKLIST TOOL: Proxmox ships a `pveXtoY` script that inspects your system and
      #   reports what will break. RUN IT, FIX EVERYTHING IT SAYS, RUN IT AGAIN. Skipping it is
      #   how upgrades go wrong.
      #   THE ORDER IN A CLUSTER: one node at a time, VMs migrated off, cluster healthy between
      #   each. Never two at once.
      #   WHAT ELSE MOVES: the kernel, and with it the ZFS module and any out-of-tree driver;
      #   the container templates; and occasionally a storage plugin.
      #   ROLLBACK: honestly, there mostly is not one for a major version — which is why the
      #   answer is a tested backup of the host configuration and a node you can rebuild.
      # AND THE ANNUAL REALITY THIS EPISODE SHOULD LEAVE THEM WITH: this platform will need a
      # planned maintenance day roughly once a year, plus patches in between. Put it in the
      # calendar when you adopt it, not when it is overdue.
      - n: "27"
        slug: upgrades
        title: "Major Upgrades — the Checklist Script, the Node Order, and the Missing Rollback"
        hands_on: ["koan:process:tool", "eyes"]
        status: planned
      # THE CLOSING GATE FOR THIS SERIES, and it asks a different question from Series 2 · 40
      # because the honest competitor to Proxmox is usually not another platform — it is doing
      # less.
      # BY NOW THE READER KNOWS THE COST: a cluster filesystem that needs quorum, a storage
      # layout chosen early, a backup product to run as well, an upgrade day a year, and a
      # management interface that must never face the internet.
      # WALK THE LADDER DOWNWARDS:
      #   ONE MACHINE, A FEW WORKLOADS, ONE PERSON   Series 1. libvirt and Incus, no web UI, no
      #                             cluster, nothing to upgrade but Debian. This is the right
      #                             answer far more often than the internet suggests.
      #   ONE MACHINE, SEVERAL PEOPLE WHO NEED A UI AND SNAPSHOTS   Proxmox on a single node,
      #                             and be clear that a single node has no HA, no migration, and
      #                             downtime for every patch — and that this is completely fine
      #                             for most data teams.
      #   THREE MACHINES AND A REASON TO SURVIVE ONE DYING   Proxmox as a cluster, with a
      #                             QDevice if you only have two, and Series 3 · 12's replication
      #                             before you reach for Series 3 · 17's Ceph button.
      #   WORKLOADS THAT ARE ALL CONTAINERS AND ALREADY DECLARATIVE   Kubernetes for Data
      #                             Workloads is a different answer to a different question, and
      #                             running it ON Proxmox VMs is a very common and sensible
      #                             combination worth naming here.
      #   NO HARDWARE AND NO APPETITE   rent it, per Data Ops, Series 1 · 46.
      # AND THE COST COMPARISON DONE PROPERLY, because it is the argument that gets made badly:
      # a bought server against a rented one is not a like-for-like price. Add the hours, the
      # power, the network, the second box for backups, and the fact that somebody is on the
      # hook at 3 a.m. Then compare. It often still wins, especially for large storage and
      # steady load — but it must win on the real number.
      - n: "30"
        slug: do-you-need-proxmox
        title: "Do You Need Proxmox — One Box, Three Boxes, or Somebody Else's"
        hands_on: ["koan:choose", "koan:capture"]
        core: true
        status: planned
      # THE ARTEFACT: the environment a small data team actually runs, built and proven.
      # BUILD, nested and on one node: Proxmox with ZFS; a Debian template with cloud-init and
      # the guest agent; a VM cloned from it running PostgreSQL; two containers — one for a
      # pipeline, one for a scheduler; a firewall that allows only what is needed; and an API
      # token for a script.
      # THEN THE BACKUP STORY, END TO END: Proxmox Backup Server on a second machine, nightly
