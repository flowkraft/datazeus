      #   JOINING a host: the requirements that actually bite — matching CPU vendors and
      #   compatible feature sets, matching patch levels, and a network the hosts agree about.
      #   WHAT HAPPENS WHEN THE MASTER DIES: not what people assume. Designate a new master, and
      #   know the procedure BEFORE you need it. HA changes this and brings its own quorum
      #   requirements and its own ways to go wrong.
