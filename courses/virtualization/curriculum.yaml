      # CLUSTER. They are two servers. Everything people want from a pool — migrating a VM off a
      # host to patch it, restarting a VM elsewhere when a host dies — requires storage that
      # both hosts can see. THAT IS WHY SERIES 4 EXISTS, and this is the episode that explains
      # why a shared storage box is not an optional extra but the thing that makes the second
      # host worth buying.
      # NAME XOSTOR / hyperconverged storage as the alternative to a separate storage box, say
      # what it is in two sentences, and ⚠ check its current status and licensing before writing
