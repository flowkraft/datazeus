# The ordered episode list for Virtualization for Data. Field docs live in
# courses/learnsql/curriculum.yaml. `short` is omitted until an episode has a video.
#
# The job this track teaches: turn hardware you control into the machines your data work needs —
# a lab, a staging environment, a database host you can snapshot before a migration, and the
# storage underneath all of them.
#
# ============================================================================
# WHY THIS TRACK EXISTS
# ============================================================================
# EVERY OTHER TRACK ASSUMES THE MACHINE ALREADY EXISTS. Data Ops rents one by clicking, in
# Series 1 · 46, and then teaches you to live on it. Kubernetes for Data Workloads starts with a
# cluster somebody else built. Storage for Data hands you disks. Terraform & Pulumi describes
# infrastructure that some API is willing to create for you.
#
# NOBODY OWNS THE STEP WHERE THE MACHINES COME FROM WHEN THERE IS NO API TO CALL. A second-hand
# server, a rack in an office, a colocated box, the workstation under a desk — and the question
# "how do I get eight machines out of this one?"
#
# THE READER THIS IS FOR: the data person who has been handed hardware, or who has decided that
# the monthly bill for a dev environment is absurd, or whose data legally cannot go to somebody
# else's cloud. Not a systems administrator building a datacentre — this track never becomes a
# vSphere manual — but somebody who has to stand up, run and answer for the boxes their
# pipelines live on.
#
# ============================================================================
# THE FOUR THINGS THIS COURSE TEACHES, AND WHY THESE FOUR
# ============================================================================
#   SERIES 1  THE PRIMITIVES, on one Debian box. KVM, QEMU and libvirt; namespaces, cgroups,
#             LXC and Incus. This is what all three products in the rest of the course are
#             standing on, and a reader who knows it can debug them instead of clicking around.
#   SERIES 2  XCP-NG AND XEN ORCHESTRA. A type-1 hypervisor with a management plane, free, and
#             the usual answer when a team is walking away from a per-socket licence bill.
#   SERIES 3  PROXMOX VE. Series 1's exact tools — KVM and LXC — with a cluster, a web UI and a
#             backup server around them. The most common answer for a data team's own hardware.
#   SERIES 4  TRUENAS. The storage appliance, which in most real deployments is not a fourth
#             option but THE THING UNDER THE OTHER TWO: the box that exports the NFS share or
#             the iSCSI target that the hypervisors keep their disks on.
#
# THEY ARE NOT FOUR COMPETITORS AND THE COURSE MUST NOT PRESENT THEM AS ONE. Series 4 · 10 is
# where they join up, and Series 4 · 27 is where a reader chooses.
#
# ============================================================================
# FOLLOW EACH PROJECT'S OWN DOCUMENTATION — FOR COVERAGE AND VOCABULARY
# ============================================================================
# Series 1 is the kernel and the Linux Containers project. Series 2 to 4 each have one manual:
#   XCP-NG    the XCP-ng documentation (xcp-ng.org/docs) and the Xen Orchestra documentation —
#             pool, host, dom0, SR, VDI, PIF, VIF, and the `xe` CLI.
#   PROXMOX   the Proxmox VE Administration Guide (pve.proxmox.com/pve-docs) — node, cluster,
#             pmxcfs, qm, pct, vzdump, storage type, content type.
#   TRUENAS   the TrueNAS documentation — pool, vdev, dataset, zvol, share, periodic snapshot
#             task, replication task, app, instance.
#
# ── BUT FOLLOW IT FOR COVERAGE AND VOCABULARY, NOT FOR SHAPE ────────────────
# THE DOCS ARE A REFERENCE. THIS IS A COURSE. An administration guide is written to be complete
# and to be looked things up in; we are written to take somebody from bare hardware to a system
# they can defend on Monday. Copying a reference's running order produces a reference nobody
# finishes.
#
# SO THE RULE IS: THE DOCUMENTATION SETS WHAT MUST BE COVERED AND WHAT THINGS ARE CALLED. THE
# ORDER IS OURS, AND IT FOLLOWS THE ORDER OF A REAL JOB.
#   WHAT WE TAKE      every topic the manual treats as essential, so nothing is missed; and its
#                     exact nouns, so a reader who finishes can live in those docs afterwards.
#   WHAT WE REORDER   the sequence. Every one of these manuals opens with installation and
#                     architecture. A course opens with WHY YOU WOULD, then gets something
#                     running, then explains what just happened.
#   WHAT WE LEAVE     the exhaustive option lists, the configuration reference, and the features
#                     that exist for somebody else's deployment. Name them, point at the page,
#                     move on.
#
# ============================================================================
# AND THE THING THAT MAKES THIS COURSE WORTH READING INSTEAD OF THE MANUAL
# ============================================================================
# EVERY EPISODE ANSWERS "HOW IS THIS ACTUALLY USED AT WORK?" — and the answer is a scene, not a
# category. This is the requirement the course was commissioned on and it is not decoration.
#
# THE MANUAL CANNOT TELL YOU THIS, and it is not the manual's job. A manual documents live
# migration. It cannot tell you that the reason a data team buys a second host is so that
# somebody can patch a kernel at eleven in the morning without stopping the warehouse load, and
# that this single fact is what turns "one server" into "a pool" and doubles the budget.
#
# SO EVERY EPISODE OPENS ON A MOMENT SOMEBODY HAS ACTUALLY HAD:
#   "The migration is on Thursday and I want to be able to put it back."
#   "Every developer needs their own Postgres with last month's data in it."
#   "Finance asked what the dev environment costs and the answer was embarrassing."
#   "The auditor asked where the data physically is."
#   "The disk in the NAS is making a noise."
#   "The upgrade is scheduled for Saturday and I need to know how to undo it."
# THE TEST FOR ANY EPISODE: IS THIS SOMETHING SOMEBODY DOES ON A REAL PROJECT? If it is in the
# docs and nobody does it in the first year, it is a pointer and not an episode. If somebody
# does it constantly and the docs bury it on page forty — reverting a snapshot, finding out why
# an SR will not coalesce, discovering that a backup of a running database is not a backup of a
# consistent database — IT IS AN EPISODE, and its prominence here should be nothing like its
# prominence there.
#
# AND SAY WHAT IT COSTS IN TIME, not only in money. Every platform here is free to download and
# none of them is free to run. The hours are the price, and a course that hides them is selling
# something.
#
# ============================================================================
# THE THREE MISUNDERSTANDINGS THIS TRACK EXISTS TO PREVENT
# ============================================================================
#   A SNAPSHOT IS NOT A BACKUP. It lives on the same storage as the thing it protects, it is a
#   dependency of that thing rather than a copy of it, and a chain of them left running is one
#   of the commonest ways to fill a datastore and take the whole host down. Series 2 · 10 and
#   Series 3 · 20 both collect on this. Storage for Data says the sibling sentence — replication
#   is not a backup — and this course must not let a reader believe either mechanism is one.
#
#   HIGH AVAILABILITY OF A VM IS NOT HIGH AVAILABILITY OF A DATABASE. Every platform here will
#   restart a virtual machine on another host when a host dies. What comes back is a database
#   that was killed without warning: it recovers from its write-ahead log, it takes as long as
#   it takes, and connections were dropped. That is a real and useful thing. It is not what the
#   word means when a database person says it, and the gap between the two is where a data team
#   gets hurt. Series 3 · 15 owns saying this out loud.
#
#   A CRASH-CONSISTENT SNAPSHOT OF A DATABASE IS A DATABASE THAT CRASHED. Usually it recovers.
#   "Usually" is not a backup policy. Series 3 · 20 is the episode; every backup episode in the
#   course points at it.
#
# ============================================================================
# THE PLATFORM IS DEBIAN, AND THE VERSIONS ARE NAMED
# ============================================================================
# Series 1 is Debian stable, with the version stated and the real package names. Series 2 to 4
# are appliances that ship their own operating system — XCP-ng is its own distribution, Proxmox
# VE is Debian with Proxmox's kernel and repositories, TrueNAS is its own image — and each
# episode says which release it was written against.
#
# ⚠ THIS SUBJECT MOVES, AND TWO OF THESE PRODUCTS HAVE CHANGED SOMETHING STRUCTURAL RECENTLY.
# The container runtime under TrueNAS's apps and the technology under its virtual machines have
# both been replaced within the last few releases; LXD was forked into Incus and the
# distributions have picked sides; Proxmox and XCP-ng both have moving stories around their
# subscription tiers and their clustered-storage options.
# THE RULE: NEVER WRITE A VERSION-DEPENDENT CLAIM FROM MEMORY. Open the release notes for the
# version you are writing against, state that version in the lesson, and if a thing changed
# recently SAY SO AND SAY WHEN — a reader on the older release is not wrong, they are on the
# older release. Every episode that touches one of these carries a ⚠ below.
#
# ============================================================================
# EVERY OPERATIONAL EPISODE CARRIES A RUNBOOK, NOT A DESCRIPTION
# ============================================================================
# THE ACCEPTANCE TEST: A READER FINISHES AN EPISODE AND CAN DO THE THING. Not recognise it, not
# discuss it — do it. So every episode that installs, configures or operates something contains
# THE ACTUAL SEQUENCE, in order, run by the author before it ships, with the expected output
# shown so a reader knows whether it worked.
#
# FOR THE WEB-UI PRODUCTS, THE RUNBOOK IS THE CLI, and this is a deliberate decision rather than
# a stylistic one. `xe`, `qm`, `pct`, `midclt` and each product's REST API are what survives a
# version change, what can be scripted, what can be pasted into a ticket, and what still works
# when the UI is the thing that is broken. THE UI IS SHOWN FOR THE FIRST TIME YOU DO SOMETHING
# AND THE CLI FOR EVERY TIME AFTER — which is also how people actually work.
# A SCREENSHOT IS NOT A RUNBOOK. Screenshots go stale in one release and cannot be diffed.
#
# ── AND THE KOAN IS THE RUNBOOK, IN THREE HONEST TIERS ──────────────────────
# Same mechanism as everywhere else in the academy — a koan asserting on a process's output —
# with no second framework invented. What varies is what can honestly be tested:
#   TIER 1  RUNS IN CI. Everything in Series 1 that does not need nested virtualization:
#           namespaces and cgroups with `unshare` and cgroup files, an Incus container in a
#           privileged runner, `virsh` against a tiny guest, cloud-init rendering.
#   TIER 2  NEEDS A CAPABLE RUNNER — nested virtualization, or a single-node appliance in a VM.
#           The koan header must say what it needs and SKIP CLEANLY with a message naming the
#           missing capability, rather than failing and looking broken.
#   TIER 3  CANNOT HONESTLY BE TESTED, so the episode is marked `eyes` and the brief says why.
#           Live migration between two physical hosts, HA fencing, a pool master failure, an SR
#           coalescing under load, hardware sizing. A three-container imitation proves the
#           commands parse and proves nothing about the thing being taught.
# THE RULE THAT KEEPS IT HONEST: AN EPISODE IS TIER 3 BECAUSE THE SUBJECT CANNOT BE TESTED,
# NEVER BECAUSE THE TEST WOULD BE INCONVENIENT.
# AND NEVER ASSERT WALL-CLOCK TIME. "The VM came back" is an assertion; "it came back in four
# seconds" is a flake.
#
# ============================================================================
# WHAT A LEARNER CAN ACTUALLY RUN
# ============================================================================
# ALL OF SERIES 1 RUNS ON ANY LINUX LAPTOP WITH VIRTUALIZATION ENABLED IN THE FIRMWARE, and the
# course must say so at 1 · 00 so nobody believes they need hardware to start.
# SERIES 2, 3 AND 4 INSTALL INSIDE A VM — every one of these products will run nested, with a
# single node, on eight or sixteen gigabytes, and that is enough for every episode except the
# ones marked `eyes`. SAY THIS EXPLICITLY AND EARLY IN EACH SERIES, with the nested-virtualization
# flag a reader has to turn on, because "you need three servers to learn Proxmox" is false and
# it stops people before they begin.
# BE EQUALLY CLEAR WHERE THE PRETENCE ENDS: a single-node cluster teaches the commands and
# teaches nothing about quorum; one host cannot migrate a VM anywhere. Those episodes say so.
#
# EVERY _todo BRIEF IN THIS COURSE MUST REPEAT THE DOCS RULE, WITH THE DOCS SECTION NAMED.

course: learn-virtualization
track: virtualization
title: Virtualization for Data

prerequisites:
  - course: learn-data-ops
    needs: "Series 1"
    why: >-
      You need the terminal, ssh and a text editor on a remote box, and you need to have already
      met containers once — Series 1 · 37 is Docker as a tool, and this course explains what it
      was standing on. Series 1 · 46 rents a machine by clicking; this course is the other
      answer to the same question.
  - course: learn-storage
    needs: "Series 1"
    why: >-
      Every platform here makes you choose a disk layout on the day you install it, and that
      choice is the hardest one to take back. Series 1 · 15 is RAID and Series 1 · 18 is LVM,
      both of which appear in the installer of every product in this course. Series 2 is ZFS,
      which Series 4 of this course assumes completely.

excludes:
  - topic: "Building and running application containers, and writing a Dockerfile"
    where: "covered in Data Ops, Series 1 · 37, which is Docker as a tool a data person uses. In this course, Series 1 · 02 explains the kernel features underneath it and Series 1 · 10 covers the different thing a system container is"
  - topic: "Orchestrating containers across a cluster"
    where: "covered in Kubernetes for Data Workloads. This course stops at the machines; what schedules pods onto them is that track's subject"
  - topic: "ZFS itself — pools, vdevs, RAIDZ, scrub, resilver, send and receive"
    where: "covered in Storage for Data, Series 2, in ten episodes. In this course, Series 4 · 05 covers only what the TrueNAS interface calls those things and which decisions it makes for you"
  - topic: "Ceph as a storage system"
    where: "covered in Storage for Data, Series 4. In this course, Series 3 · 17 covers only the fact that Proxmox will build one for you from a web form, and what you have taken on when it does"
  - topic: "Renting a virtual machine or a bucket from a provider"
    where: "covered in Data Ops, Series 1 · 46 and Data Ops, Series 1 · 47. This course is the alternative, and it is honest about when renting is the better answer"
  - topic: "Creating virtual machines from code, with a provider and a state file"
    where: "covered in Terraform & Pulumi. In this course, Series 3 · 25 covers the API and the token that such a provider would authenticate with, and stops there"
  - topic: "Operating PostgreSQL — backups, replication, upgrades and tuning"
    where: "covered in Data Ops, Series 2. This course puts a database on a virtual disk and protects the machine; what happens inside the database is that course's subject and the two must not be confused"
  - topic: "VMware vSphere, Hyper-V and the commercial platforms"
    where: "not covered. This track is virtualization a data team can obtain and run without a purchase order, and the two products a reader is most often migrating away from are named as context in Series 2 · 00 rather than taught"
  - topic: "Desktop virtualization — VirtualBox, VMware Workstation and running a VM on your laptop"
    where: "not covered as a subject, though Series 1 · 00 says plainly where it fits. This course is about machines that other people depend on"

series:
  # SERIES 1 IS NOT AN INTRODUCTION TO THE THREE PRODUCTS. It is the layer they are all built
  # on, taught on one Debian box, and it is here for a reason that the rest of the course keeps
  # collecting on: PROXMOX IS KVM AND LXC WITH A UI, and XCP-ng is Xen with a different one. A
  # reader who has created a VM with `virt-install` and a container with `incus launch` will
  # recognise every screen in Series 3, and — far more usefully — will know what to do when the
  # screen is not enough.
  - slug: series1-linux-virtualization
    title: Containers and Virtual Machines on One Linux Box
    tagline: namespaces, KVM and LXC — what a "machine" is when there is only one machine
    level: intermediate
    episodes:
      # THE TAXONOMY EPISODE, and everything else in the course hangs off it.
      # COVER: the two mechanisms, as two different answers to one question.
      #   A VIRTUAL MACHINE   its own kernel, its own boot, virtual hardware. The CPU itself
      #                       helps — Intel VT-x or AMD-V — so this is not emulation and not
      #                       slow. Strong boundary, whole operating system, gigabytes and a
      #                       boot time.
      #   A CONTAINER         processes on the HOST'S kernel, fenced off by namespaces and
      #                       limited by cgroups. No boot, no second kernel, megabytes, starts
      #                       in the time it takes to fork.
      # THE TEST TO LEAVE THEM WITH, and it settles most arguments: run `uname -r` inside. If it
      # is the host's kernel, it is a container, and everything that follows from that is true —
      # you cannot load a kernel module, you cannot run a different kernel version, you cannot
      # run a Windows guest, and a kernel bug is a shared problem.
      # WHERE A DATA TEAM MEETS EACH: containers for the pipeline and the tool, VMs for the
      # database, for anything belonging to another team, and for anything an auditor asks about.
      # SAY WHAT THIS COSTS: virtualization overhead on modern hardware is small for CPU and
      # memory and is NOT small for storage latency, which Series 1 · 25 measures rather than
      # asserts.
      # AND SAY WHERE VIRTUALBOX FITS, in one paragraph, because most readers have used it: the
      # same idea, packaged for a desktop, and a fine way to run the rest of this course's
      # appliances on a laptop. It is not what anybody runs a shared environment on.
      # ⚠ SAY AT THE TOP THAT ALL OF SERIES 1 RUNS ON A LAPTOP with virtualization enabled in
      # the firmware. Nobody needs to buy a server to start.
      - n: "00"
        slug: vms-against-containers
        title: "Two Ways to Get More Machines — a Second Kernel, or a Fence Around Processes"
        hands_on: ["koan:choose", "koan:predict"]
        core: true
        status: planned
      # COVER: the kernel features Docker made famous and did not invent, run BY HAND so they
      # stop being magic.
      #   NAMESPACES  what a process can SEE. `unshare --pid --fork --mount-proc` and watch the
      #               shell become PID 1; the mount, net, uts, ipc and user namespaces in the
      #               same shape. `lsns` to list them, and /proc/<pid>/ns to see them as files.
      #   CGROUPS v2  what a process can USE. Write to memory.max and cpu.max under
      #               /sys/fs/cgroup, then watch a process get killed for exceeding it.
      # THE PAYOFF, AND IT IS IMMEDIATE: a container that "died with no error in the logs" was
      # killed by the kernel for exceeding memory.max, and the evidence is in dmesg and the
      # cgroup's memory.events. THAT IS EXACTLY WHAT Kubernetes for Data Workloads, Series 1 · 20
      # CALLS OOMKilled — a reader who has written the limit by hand never has to guess at that
      # again, in any of the four platforms in this course.
      # AND THE OTHER PAYOFF: this is why a container's `free` and `nproc` LIE, reporting the
      # host's memory and CPU count rather than the limit — which is how a JVM or a pandas job
      # inside a container sizes itself catastrophically wrong.
      - n: "02"
        slug: namespaces-and-cgroups
        title: "Namespaces and cgroups — Building a Container by Hand, and Why free Lies"
        hands_on: ["koan:process:tool", "koan:diagnose"]
        core: true
        status: planned
      # COVER: three words people use as one, separated once and for good, because every
      # confusing error message in Linux virtualization comes from not knowing which layer spoke.
      #   KVM      a KERNEL MODULE that turns Linux itself into a hypervisor. It is not a
      #            product you install; /dev/kvm either exists or your firmware has
      #            virtualization switched off. `grep -E 'vmx|svm' /proc/cpuinfo`, and
      #            `kvm-ok` on Debian.
      #   QEMU     the USERSPACE process that provides the virtual hardware — the disk
      #            controller, the network card, the display. One QEMU process per running VM,
      #            visible in `ps`, which surprises people the first time they see it.
      #   LIBVIRT  the MANAGEMENT LAYER — a daemon, an XML definition per domain, and `virsh`.
      #            It is what every tool in this course is really talking to, directly or by
      #            having reimplemented it.
      # THE WORKPLACE POINT, and it justifies the episode: THIS IS WHAT PROXMOX IS. And what
      # OpenStack is, and what most cloud providers are. Learning the three layers once means
      # every KVM-based product afterwards is a UI over something you already understand.
      # ALSO COVER: `virsh` as the vocabulary — domain, network, pool, volume — and where the
      # XML lives, because reading a domain's XML is how you answer "what is this VM actually
      # configured with" in every one of these products.
      - n: "05"
        slug: kvm-qemu-libvirt
        title: "KVM, QEMU and libvirt — Three Layers People Say as One Word"
        hands_on: ["koan:process:tool", "koan:capture"]
        core: true
        status: planned
      # COVER: the first VM, end to end, as a runbook on Debian.
      # THE MODERN WAY AND NOT THE ISO WAY: download the distribution's CLOUD IMAGE, resize it,
      # and boot it with cloud-init supplying the user, the key and the hostname. `virt-install`
      # with --import. A machine in under a minute, with no installer and no clicking.
      # DO NOT TEACH THE INSTALLER AS THE DEFAULT — an installer is what you use once, to build
      # the template, and Series 1 · 22 is where that becomes a habit.
      # THEN THE LIFECYCLE: virsh list --all, start, shutdown against destroy (and the fact that
      # `destroy` means "pull the power cable", which is a genuinely bad name that has surprised
      # everybody once), console, and autostart.
      # AND THE OPERATION THIS WHOLE COURSE IS SECRETLY ABOUT: `virsh snapshot-create-as`, then
      # break something on purpose, then revert. THE WORKPLACE MOMENT: the schema migration is
      # on Thursday, it is the kind that cannot be rolled back with SQL, and you want to be able
      # to put the machine back exactly as it was in twenty seconds.
      # ⚠ AND THE WARNING THAT MUST TRAVEL WITH IT, stated the first time snapshots appear and
      # restated in Series 2 · 10 and Series 3 · 20: A SNAPSHOT IS NOT A BACKUP. It sits on the
      # same disks, it grows for as long as it exists, and a forgotten one is how a datastore
      # fills up. It is an undo button with a short life, and it is superb at being that.
      - n: "07"
        slug: first-vm-with-virsh
        title: "virt-install and virsh — a Cloud Image, a Machine, and an Undo Button"
        hands_on: ["koan:process:tool", "koan:complete"]
        core: true
        status: planned
      # COVER: the distinction almost nobody is taught, and it is the reason this episode exists
      # in a course whose readers all already know Docker.
      #   AN APPLICATION CONTAINER  one process, no init, no ssh, no cron, immutable, thrown
      #                             away and rebuilt. Docker. Data Ops, Series 1 · 37 owns it.
      #   A SYSTEM CONTAINER        a full userspace with its own init, its own systemd, its own
      #                             package manager, its own logs and users. It behaves like a
      #                             small VM and you keep it for a year. LXC and Incus.
      # WHY A DATA TEAM WANTS THE SECOND KIND: a per-developer Postgres they can ssh into, a
      # build box, a legacy tool that expects to be a machine, an environment somebody needs to
      # poke at. Density is the reason it is not just a VM — forty system containers on one host
      # is unremarkable and forty VMs is not.
      # ⚠ AND THE NAMING, WHICH IS GENUINELY CONFUSING AND MUST BE STATED PLAINLY WITH DATES:
      # LXC is the low-level tooling. LXD was the friendly manager built on it; in 2023 it moved
      # under Canonical and the original maintainers forked it as INCUS under the Linux
      # Containers project. Debian ships Incus. Say which one the lesson uses, say which one the
      # reader's distribution ships, and check both before writing — this is a live situation
      # and a lesson that names the wrong one is useless at the command line.
      - n: "10"
        slug: lxc-and-incus
        title: "System Containers — LXC, Incus, and Why This Is Not Docker"
        hands_on: ["koan:choose", "koan:process:tool"]
        core: true
        status: planned
      # COVER: running one, as a runbook. `incus launch images:debian/12 pg`, exec, file push and
      # pull, `incus list`, and where the filesystem actually is on the host.
      # PROFILES as the thing worth learning early: a named set of devices and configuration
      # applied to many containers. THE WORKPLACE USE: one profile called `dev-db` with the
      # right limits, the right network and the right mount, and every developer's container
      # gets it without anybody remembering four flags.
      # SNAPSHOTS AND COPIES: `incus snapshot`, `incus copy` — and the pattern that makes this
      # worth the effort. Build ONE container with a restored copy of last month's production
      # data, snapshot it, and give every developer a copy. They break it, they reset it in two
      # seconds, and nobody has been waiting three hours for a restore.
      # LIMITS: limits.memory and limits.cpu, which are Series 1 · 02's cgroup files with a
      # nicer name, and are what stops one developer's runaway query taking the host down.
      - n: "12"
        slug: running-system-containers
        title: "incus launch — Profiles, Snapshots, and One Database per Developer"
        hands_on: ["koan:process:tool", "koan:complete"]
        core: true
        status: planned
      # COVER: the thing that breaks first and is explained last in most tutorials. NETWORKING.
      #   NAT / THE DEFAULT BRIDGE   the guest gets an address on a private network and reaches
      #                              the world through the host. Nothing on the LAN can reach
      #                              the guest. Fine for a laptop, wrong for a server.
      #   A REAL BRIDGE              the guest gets an address on YOUR network from YOUR DHCP,
      #                              and is a peer of every other machine. This is what you want
      #                              on a host that other people connect to, and it is the
      #                              configuration every product in this course defaults to.
      # THE RUNBOOK: a bridge on Debian with systemd-networkd or /etc/network/interfaces, the
      # physical interface enslaved to it, and the host's own address moved onto the bridge —
      # including the warning that GETTING THIS WRONG OVER SSH LOCKS YOU OUT OF THE MACHINE, so
      # have console access before you start. That sentence has saved more afternoons than any
      # other in this series.
      # THEN: VLANs in one paragraph, port forwarding for the laptop case, and the diagnostic
      # ladder — `ip a` inside, `bridge link`, `ip route`, and can you ping the gateway.
      # THE WORKPLACE MOMENT: "the VM works but nobody can reach the database on it" is
      # ninety per cent of the time this episode, and ten per cent of the time it is
      # Data Ops, Series 1 · 32.
      - n: "15"
        slug: bridges-and-networking
        title: "Bridges and NAT — the Address Your VM Did Not Get"
        hands_on: ["koan:diagnose", "koan:process:tool"]
        core: true
        status: planned
      # COVER: where a guest's disk actually lives, and the choice that decides how fast
      # snapshots are and whether the host survives running out of space.
      #   A FILE ON A FILESYSTEM   qcow2 or raw in /var/lib/libvirt/images. Simple, portable,
      #                            snapshots are a qcow2 feature. The default, and fine.
      #   AN LVM LOGICAL VOLUME    Storage for Data, Series 1 · 18. Thin pools give you cheap
      #                            snapshots and the ability to overcommit.
      #   A ZFS ZVOL OR DATASET    Storage for Data, Series 2. Snapshots, compression and
      #                            checksums belong to the storage layer instead of the image
      #                            format, which is why every appliance in this course that can
      #                            use ZFS does.
      # THE FORMAT DECISION: qcow2 against raw — thin provisioning and snapshots against a few
      # per cent of performance and no surprises. Say which matters when.
      # THIN PROVISIONING AND THE CLIFF: ten guests each promised a hundred gigabytes on a
      # four-hundred-gigabyte pool is a normal and reasonable thing to do, right up until they
      # all fill. Storage for Data, Series 1 · 25 is the arithmetic; here it is the specific
      # failure — the guests do not get a friendly error, they get I/O errors, and filesystems
      # go read-only.
      # AND BIND MOUNTS / VIRTIOFS for containers, with THE TRAP: an unprivileged container maps
      # its root to a high host UID, so a directory you bind-mount from the host is owned by
      # somebody else as far as the container is concerned. This is the single most common
      # "permission denied" in Incus and in every Proxmox container that touches a NAS share.
      - n: "17"
        slug: storage-backends
        title: "Where the Virtual Disk Lives — qcow2, LVM, zvols, and the Bind-Mount Trap"
        hands_on: ["koan:choose", "koan:diagnose"]
        status: planned
      # COVER: the security question, answered honestly rather than reassuringly, because a data
      # team's real question is "whose data can end up in the same place as whose".
      #   UNPRIVILEGED CONTAINERS   root inside is an unprivileged UID outside, via the user
      #                             namespace. This is the default in Incus and it should never
      #                             be turned off casually. Show the mapping in /etc/subuid.
      #   THE HONEST BOUNDARY       a container shares the host kernel. A kernel vulnerability
      #                             is a shared vulnerability. A VM's boundary is enforced by
      #                             the CPU and is meaningfully stronger — not perfect, and
      #                             side-channel history says so, but a different class.
      # THE DECISION PROCEDURE A DATA TEAM ACTUALLY NEEDS:
      #   YOUR OWN WORKLOADS, YOUR OWN TEAM        containers are fine, and the density is worth
      #                                            real money.
      #   ANOTHER TEAM'S CODE, OR A CUSTOMER'S     a VM. The boundary is the product.
      #   ANYTHING WITH A COMPLIANCE ANSWER        a VM, because "shared kernel" is a sentence
      #                                            you do not want to have to defend.
      #   A DIFFERENT KERNEL OR A KERNEL MODULE    a VM. There is no argument, it simply cannot
      #                                            be done in a container.
      # AND THE DATA-SPECIFIC ONE: multi-tenant data — one customer per what? If the answer has
      # to survive an audit, it is one customer per VM, and the density argument loses.
      - n: "20"
        slug: the-isolation-boundary
        title: "Unprivileged Containers — the Boundary You Are Actually Trusting"
        hands_on: ["koan:choose", "koan:diagnose"]
        status: planned
