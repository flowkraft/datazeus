      # THE CAPSTONE, AND IT IS THE ONE THAT JOINS THE WHOLE COURSE: the small-estate shape,
      # built nested on one machine, with the failure exercised on purpose.
      # BUILD: TrueNAS with a mirrored pool, a dataset per purpose, an NFS export tuned for
      # hypervisor storage, and periodic snapshots with retention. Then Proxmox or XCP-ng
      # mounting that export, and a PostgreSQL VM whose disk lives on it.
      # THEN BREAK IT, DELIBERATELY, THREE TIMES:
      #   PULL A DISK from the NAS pool. Watch the alert arrive — the one you configured and
      #   TESTED in Series 4 · 20 — and resilver it while the VM keeps running.
      #   SNAPSHOT THE DATASET while the database is writing, roll it back, and read the
      #   Postgres log recovering. That is Series 3 · 20's argument, felt.
      #   STOP THE NAS while the VM is running, and watch what a hypervisor does when its
      #   storage disappears. This is the single point of failure from Series 4 · 25, and every
      #   reader should meet it in a lab rather than in production.
      # HAND IN: the build as commands, the three failure logs, your measured recovery point and
      # recovery time, and one paragraph naming the risk you have chosen to accept — because
      # every architecture accepts one, and the professional difference is whether you can say
      # which.
