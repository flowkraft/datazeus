      # which release it describes, and do not imply that the free path is a trick — it is a
      # legitimate, widely used path, and so is paying for support.
      # THE DESIGN RULE, AND IT IS THE POINT OF THE EPISODE: THE MANAGEMENT PLANE MUST NOT LIVE
      # ON THE THING IT MANAGES. If XO runs as a VM inside the pool it backs up, then the day
      # the pool is down is the day you cannot reach your backups or your restore interface.
      # Put it elsewhere — a small separate box, or a VM on a different host — and back up XO's
      # own configuration. People learn this the expensive way.
      - n: "05"
