      # which a reader must understand before they design anything.
      #   XO LITE          built into the host, browser-based, per-host. Enough to start a VM.
      #                    Not enough to run an estate.
      #   XO FROM SOURCES  the full Xen Orchestra, built and run by you on a Debian VM. Free.
