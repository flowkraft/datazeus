        core: true
        status: planned
      # COVER: storage repositories, the vocabulary, and the failure mode that this platform is
      # genuinely known for.
      #   THE NOUNS: SR (storage repository), VDI (a virtual disk), VBD (the attachment of one
      #   to a VM), PBD (the host's connection to the SR). Learn these four — every error
      #   message in the logs uses them.
      #   THE TYPES: local LVM, local ext, NFS, iSCSI, and hardware HBA. And THE PROVISIONING
      #   DIFFERENCE THAT SURPRISES PEOPLE: block-based SRs (LVM, iSCSI) are traditionally THICK
      #   — a 100 GB disk takes 100 GB immediately — while file-based SRs (ext, NFS) are thin.
      #   ⚠ Verify this against the release you are writing about; it has been an area of active
      #   change. Whichever is true, it decides how much hardware you buy.
      # AND THEN THE 3 A.M. EPISODE, WHICH IS WHY THIS ONE IS `core`: SNAPSHOTS CREATE VDI
      # CHAINS, and a chain must be COALESCED back into its parent by a garbage collector after
      # the snapshot is deleted. If coalescing cannot keep up or gets stuck — because a backup
      # job runs every hour, because the SR is nearly full, because a snapshot was left behind —
      # THE CHAIN GROWS AND THE SR FILLS, and a full SR means VMs that pause or refuse to write.
