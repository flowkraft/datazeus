# ═══════════════════════════════════════════════════════════════════════════════════════
#  THE SOURCE REGISTRY — every author this academy credits, in one place
# ═══════════════════════════════════════════════════════════════════════════════════════
#
# WHY THIS FILE EXISTS. Attribution used to live in a `# SOURCE (kimball):` COMMENT, and a
# comment cannot be enforced. Nothing stopped someone adding a Kimball episode and forgetting
# it, which is the same honour system that had already failed three times in this repo. So
# attribution is now a FIELD:
#
#     credits:
#       - source: kimball        # -> the registry below: author, work, edition, ISBN, trademark
#         concept: "Transaction, periodic snapshot and accumulating snapshot fact tables"
#         where: "ch. 4"         # OPTIONAL — where in the work, so the writer can find it fast
#
# ONE FIELD, and everything needed to credit properly is reachable from it. The split is on
# what REPEATS: the book details are identical for all thirty Kimball episodes and live once
# in the registry, so verifying an ISBN is one edit and not thirty. `concept` and `where` vary
# per episode and live on the episode. A fat `source:` object copied onto every episode would
# put Kimball's ISBN in thirty places, and this repo has already been burned three times by
# exactly that — a title in six places, hands_on in forty-two files, koan titles in nineteen.
#
# `credits` is EMPTY BY DEFAULT — most episodes teach textbook material with no owner and must
# not be attributed to anyone. It is populated only where an episode teaches a named person's
# named framework, and CurriculumSpec then enforces three things nobody has to remember:
#   1. every `credits[].source` resolves to a key in this file
#   2. an episode with credits carries the matching TAG, and an episode with an author tag
#      carries the matching credit — the badge and the bibliography cannot drift apart
#   3. `concept` is filled in, because "credited to Kimball" without saying WHAT is useless
#      to the person who eventually writes the episode
#
# WHEN TO ADD A SOURCE — the test, and it is the whole discipline:
#     WOULD A READER BENEFIT FROM BEING HANDED THAT AUTHOR'S BOOK?
#   yes  a named thing with one canonical source — Kimball's accumulating snapshot, Evans'
#        bounded context, Tufte's lie factor, Linstedt's hubs and links
#   no   textbook material with no owner — joins, indexing, CDC, "choosing the right chart".
#        Picking one author for those is arbitrary AND it dilutes the credits that are real
#
# ⚠ EDITIONS AND ISBNs BELOW ARE RECORDED FROM MEMORY AND MUST BE VERIFIED against the
#   publisher before any article citing them is published. They are here so the article
#   template has a slot to fill, not because they have been checked. Verify, then delete this
#   warning for the entry you checked.
#
# The full rules on what may be reproduced, quoting, diagrams, book covers, trademarks and the
# disclaimer line live in courses/learnsql/curriculum.yaml under "HOW TO CREDIT, AND STAY OUT
# OF TROUBLE". Read them before writing an attributed episode.

sources:
  kimball:
    author: "Ralph Kimball & Margy Ross"
    work: "The Data Warehouse Toolkit"
    edition: "3rd"
    publisher: "Wiley"
    year: 2013
    isbn: "978-1118530801"
    also: >-
      Kimball & Caserta, "The Data Warehouse ETL Toolkit" (Wiley, 2004) for the loading
      material used in ETL & Data Pipelines.
    note: >-
      "Kimball Group" is a business name, not a generic term. Say "Kimball's method", never
      anything implying we are affiliated with or certified by the Kimball Group.

  inmon:
    author: "Bill Inmon"
    work: "Building the Data Warehouse"
    edition: "4th"
    publisher: "Wiley"
    year: 2005
    isbn: "978-0764599446"
    note: >-
      Paired with Kimball in Data Warehousing Series 1 · 05. The academy takes no side; present
      both positions and say what most teams actually run today.

  linstedt:
    author: "Dan Linstedt & Michael Olschimke"
    work: "Building a Scalable Data Warehouse with Data Vault 2.0"
    publisher: "Morgan Kaufmann"
    year: 2015
    isbn: "978-0128025109"
    trademark: >-
      Linstedt asserts a mark on "Data Vault 2.0" and runs a certification programme around it.
      The episode must read as "here is Linstedt's Data Vault 2.0 method" and NEVER as anything
      we are licensed, certified or partnered to deliver. Check the current position before
      publishing; marks change. This is the one episode in the academy where this genuinely
      bites.

  codd:
    author: "E. F. Codd"
    work: "A Relational Model of Data for Large Shared Data Banks"
    publisher: "Communications of the ACM 13(6)"
    year: 1970
    note: >-
      A paper, not a book — cite it as one, with a DOI rather than an ISBN. Boyce-Codd Normal
      Form is Raymond Boyce and Codd jointly; use the full name so a reader understands why
      BCNF is not simply "3.5NF".

  evans:
    author: "Eric Evans"
    work: "Domain-Driven Design: Tackling Complexity in the Heart of Software"
    publisher: "Addison-Wesley"
    year: 2003
    isbn: "978-0321125217"
    note: >-
      BOUNDED CONTEXT and UBIQUITOUS LANGUAGE are his exact terms — the Data Modeling track has
      a DataPallas tab named after the second one, so get the first use right.

  ambler:
    author: "Scott Ambler & Pramod Sadalage"
    work: "Refactoring Databases: Evolutionary Database Design"
    publisher: "Addison-Wesley"
    year: 2006
    isbn: "978-0321293534"
    note: >-
      The canonical source for schema-change patterns and, importantly, their NAMES. Use them.

  tufte:
    author: "Edward R. Tufte"
    work: "The Visual Display of Quantitative Information"
    edition: "2nd"
    publisher: "Graphics Press"
    year: 2001
    isbn: "978-0961392147"
    note: >-
      LIE FACTOR, DATA-INK RATIO and CHARTJUNK are his. The lie factor is a number you can
      actually compute, which is what makes the episode more than taste. Tufte self-publishes
      and is protective of his images — draw every example yourself.

  cleveland-mcgill:
    author: "William S. Cleveland & Robert McGill"
    work: "Graphical Perception: Theory, Experimentation, and Application to the Development of Graphical Methods"
    publisher: "Journal of the American Statistical Association 79(387)"
    year: 1984
    note: >-
      A paper, not a book. The perception ranking — position beats length beats angle beats
      area beats colour — is their EXPERIMENT, not an opinion, and citing the evidence is what
      lifts BI Series 1 · 05 above personal preference.

  few:
    author: "Stephen Few"
    work: "Information Dashboard Design"
    edition: "2nd"
    publisher: "Analytics Press"
    year: 2013
    isbn: "978-1938377006"
    note: >-
      The one-screen argument, and what belongs top-left. His position, worth naming as his.

  knaflic:
    author: "Cole Nussbaumer Knaflic"
    work: "Storytelling with Data"
    publisher: "Wiley"
    year: 2015
    isbn: "978-1119002253"
    note: >-
      Annotation, narrative order and pre-attentive attention.

  chen:
    author: "Peter Chen"
    work: "The Entity-Relationship Model — Toward a Unified View of Data"
    publisher: "ACM Transactions on Database Systems 1(1)"
    year: 1976
    note: >-
      The paper that gave us entities, attributes and relationships as a modelling language.
      Every ER diagram a reader will ever open descends from it — worth one sentence saying so.

  karwin:
    author: "Bill Karwin"
    work: "SQL Antipatterns: Avoiding the Pitfalls of Database Programming"
    publisher: "Pragmatic Bookshelf"
    year: 2010
    isbn: "978-1934356555"
    note: >-
      The canonical catalogue of schema mistakes, and it NAMES them — Entity-Attribute-Value,
      Jaywalking (the comma-separated list in a column), Naive Trees. Use his names; a reader
      who has them can say "that is EAV" in a review instead of "that looks wrong".

  celko:
    author: "Joe Celko"
    work: "Joe Celko's Trees and Hierarchies in SQL for Smarties"
    edition: "2nd"
    publisher: "Morgan Kaufmann"
    year: 2012
    isbn: "978-0123877338"
    note: >-
      The NESTED SETS model is the one people associate with him. Adjacency list and path
      enumeration are older and unowned; credit him for nested sets specifically, not for the
      whole episode.

  snodgrass:
    author: "Richard T. Snodgrass"
    work: "Developing Time-Oriented Database Applications in SQL"
    publisher: "Morgan Kaufmann"
    year: 1999
    isbn: "978-1558604360"
    note: >-
      VALID TIME vs TRANSACTION TIME, and bitemporal tables. The vocabulary for temporal data
      is his, and it is the difference between "when was it true" and "when did we record it".
      Free as a PDF from the author's site — say so, it is a genuinely useful pointer.

  stonebraker:
    author: "Mike Stonebraker et al."
    work: "C-Store: A Column-oriented DBMS"
    publisher: "VLDB 2005"
    year: 2005
    note: >-
      The paper that made the case for column stores and started the line that runs through
      Vertica, DuckDB and ClickHouse. A paper, not a book — cite it as one.

  dean-mapreduce:
    author: "Jeffrey Dean & Sanjay Ghemawat"
    work: "MapReduce: Simplified Data Processing on Large Clusters"
    publisher: "OSDI 2004"
    year: 2004
    note: >-
      THE PROGRAMMING MODEL, not the product. Map transforms each record independently, a
      shuffle groups by key, reduce combines per key — and because you accepted that shape, a
      framework can parallelise, distribute and retry it for you. Apache Hadoop was this paper
      as a product; Spark is its descendant with the intermediate results kept in memory.
      CREDIT THE MODEL AND NOT HADOOP. The framework is largely historical; the shape is what
      every distributed engine still does, and "shuffle" is still the word.

  oneil-lsm:
    author: "Patrick O'Neil, Edward Cheng, Dieter Gawlick & Elizabeth O'Neil"
    work: "The Log-Structured Merge-Tree (LSM-Tree)"
    publisher: "Acta Informatica 33"
    year: 1996
    note: >-
      Writes go to memory and then to immutable sorted files that are merged in the background,
      so writes are near-sequential and nothing is modified in place. It is why Cassandra,
      RocksDB, HBase and ClickHouse's MergeTree write as fast as they do — and why deletes cost
      what they cost, which is the tombstone problem their courses have to teach.

  decandia-dynamo:
    author: "Giuseppe DeCandia et al."
    work: "Dynamo: Amazon's Highly Available Key-value Store"
    publisher: "SOSP 2007"
    year: 2007
    note: >-
      CONSISTENT HASHING, TUNABLE QUORUMS (the N, R and W that make R + W > N a decision rather
      than a property), HINTED HANDOFF and ANTI-ENTROPY REPAIR. Cassandra descends from it
      directly — one of its authors co-wrote Cassandra, and Cassandra's own documentation still
      calls that section "dynamo".
      CREDIT THE PAPER, NOT THE PRODUCT. This academy does not teach cloud-vendor proprietary
      services and DynamoDB is deliberately excluded (see NoSQL Concepts). A 2007 research paper
      that every open-source engine in this catalogue borrowed from is a different thing, and
      the distinction is worth keeping straight.

  melnik-dremel:
    author: "Sergey Melnik et al."
    work: "Dremel: Interactive Analysis of Web-Scale Datasets"
    publisher: "VLDB 2010"
    year: 2010
    note: >-
      TWO CONTRIBUTIONS, and the first is the one this academy needs: a COLUMNAR ENCODING FOR
      NESTED DATA, using repetition and definition levels, which is how a column-oriented file
      can hold a record containing arrays and structs without losing its shape. PARQUET'S NESTED
      ENCODING COMES DIRECTLY FROM THIS PAPER. The second is the multi-level serving tree, which
      is the ancestor of BigQuery.
      Credit it where Parquet's internals are taught, not wherever Parquet is merely used.

  tukey:
    author: "John W. Tukey"
    work: "Exploratory Data Analysis"
    publisher: "Addison-Wesley"
    year: 1977
    isbn: "978-0201076165"
    note: >-
      The BOX PLOT is his, and so is the phrase "exploratory data analysis". Credit him for the
      box plot specifically; histograms are much older and unowned.

  google-sre:
    author: "Betsy Beyer, Chris Jones, Jennifer Petoff & Niall Richard Murphy (eds.)"
    work: "Site Reliability Engineering: How Google Runs Production Systems"
    publisher: "O'Reilly"
    year: 2016
    isbn: "978-1491929124"
    note: >-
      ERROR BUDGETS, TOIL, and the BLAMELESS POSTMORTEM. Free to read online at sre.google —
      point there, it costs the reader nothing. "Site Reliability Engineering" and "SRE" are
      Google-associated terms; describe the practices, never imply endorsement.

  armbrust-lakehouse:
    author: "Michael Armbrust, Ali Ghodsi, Reynold Xin & Matei Zaharia"
    work: "Lakehouse: A New Generation of Open Platforms that Unify Data Warehousing and Advanced Analytics"
    publisher: "CIDR"
    year: 2021
    note: >-
      THE WORD "LAKEHOUSE" IS THEIRS. Databricks popularised it in a 2020 post and then argued
      it properly in this CIDR paper, which is why it is creditable at all rather than being
      pure marketing — there is a stated architecture and a stated claim to disagree with.
      CREDIT THE NAME AND THE ARCHITECTURE, NOT THE COMPONENTS. Object storage, SQL over a lake
      and columnar files all predate it, and the technical enabler — the open table format —
      came from three places at once: Delta Lake from Databricks, Iceberg from Netflix, Hudi
      from Uber. Two of those three are not theirs, which is the fact that keeps this an
      architecture rather than a product.
      ⚠ The authors are also the vendor. Read the paper as an argument by interested parties,
      state its claim fairly, and let the counter-argument stand beside it.

  marick:
    author: "Brian Marick"
    work: "Agile Testing Directions — the test quadrants"
    publisher: "exampler.com (blog series)"
    year: 2003
    note: >-
      THE TEST QUADRANTS — business-facing against technology-facing, supporting the team
      against critiquing the product. Humble and Farley use them in chapter 4 and credit him;
      so should we. There is no book: the canonical source is his own posts, which is why this
      entry has no ISBN.

  humble-farley:
    author: "Jez Humble & David Farley"
    work: "Continuous Delivery: Reliable Software Releases through Build, Test, and Deployment Automation"
    publisher: "Addison-Wesley"
    year: 2010
    isbn: "978-0321601919"
    note: >-
      THE DEPLOYMENT PIPELINE is theirs — the named pattern, its stages, and the rules that make
      it work: BUILD YOUR BINARIES ONCE, DEPLOY THE SAME WAY TO EVERY ENVIRONMENT, and the
      separation of DEPLOYMENT from RELEASE. So are "if it hurts, do it more often" and "done
      means released". The Continuous Delivery track follows this book's own order, chapter by
      chapter, and every episode there names the chapter it came from.
      TWO CAUTIONS FOR WHOEVER WRITES FROM IT. First, it is a 2010 book: the principles aged
      extremely well and the TOOLING did not, so credit the ideas and never the tool examples.
      Second, the TEST QUADRANTS in chapter 4 are Brian Marick's and the book says so — credit
      him there, not these authors.

  lopez-de-prado:
    author: "Marcos López de Prado"
    work: "Advances in Financial Machine Learning"
    publisher: "Wiley"
    year: 2018
    isbn: "978-1119482086"
    note: >-
      BACKTEST OVERFITTING AS A MULTIPLE-TESTING PROBLEM is the contribution being credited, and
      it is the intellectual core of Build Your Own: Algotrading System, Series 2 · 25. The
      argument: run enough backtests on one dataset and the best one looks excellent BY CHANCE,
      so a Sharpe ratio means nothing without knowing how many trials produced it — hence the
      deflated Sharpe ratio, which adjusts for exactly that. He has made the same case in
      several papers with co-authors; the book is the accessible single source and is what a
      reader should be handed.
      WHAT WE CREDIT AND WHAT WE DO NOT: the overfitting and multiple-testing argument, which is
      his and is named. NOT the machine-learning methods that fill most of the book — that track
      deliberately treats the model as a black box, and crediting him for the parts we do not
      teach would be padding.
      ⚠ AND THE TONE RULE FOR THAT EPISODE: he is making a SCEPTICAL argument. Any writing that
      turns it into a technique for producing better-looking results has inverted it.

  lewis-rag:
    author: "Patrick Lewis et al."
    work: "Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks"
    publisher: "NeurIPS 2020"
    year: 2020
    note: >-
      The paper that NAMED RAG. Worth thirty seconds in the episode: the term everyone now uses
      loosely started as a specific architecture, and knowing the original shape helps a reader
      tell "RAG" from "we put some text in the prompt".
