# Flashcards for Learn SQL · Series 2 · 20 — CTEs (WITH), breaking a long query into named steps
#
# OUR OWN minimal authoring format (NOT CrowdAnki); tools/build-anki.py turns it into a .apkg with
# genanki. The .apkg is a BUILD ARTIFACT — gitignored, built in CI. Only this YAML is source.
#
# deck:  Anki deck name ("::" = sub-deck; keeps everything under DataZeus).
# guid:  STABLE per-deck id so rebuilds UPDATE the same deck. Set once, from the slug, never changed.
# cards: a list of either { basic: {front, back} } or { cloze: "… {{c1::…}} …" }.
# tags:  applied to every card in the file.
#
# ── WHAT ANKI IS FOR ────────────────────────────────────────────────────────────────────────
# Reviewed on a phone, weeks later, with no database open. EVERY CARD CARRIES ITS OWN PREMISE: where
# a card needs a number (a report of 20 rows, a total of 40) the FRONT states it, and the card tests
# the REASONING. No card names a Northwind table as something to remember.
#
# FILE ORDER IS THE CURRICULUM, in the lesson's order: what a CTE is and its scope, using a step twice,
# steps that read steps, checking a rewrite, one step one grain, looking inside a step, readability,
# and last the production card.
# 16 basic, 4 cloze — a shade above the 3:1 the existing decks run.
#
# WHAT THIS DECK OWNS, AND WHAT IT LEAVES ALONE:
#   - Series 2 · 00 owns subqueries; the cards here are about naming one.
#   - Series 1 · 40 / Series 2 · 15 own the WHERE-on-a-LEFT-JOIN problem, and the fan-out that
#     multiplies a parent-row measure over its children. Section 5 is NOT a third telling of either:
#     it is the same fan-out arriving through a NAMED STEP, which is the thing this lesson adds —
#     the reader merges two steps because both group by the same column, and the name makes it feel
#     safe. Keep the cards on "what is one row of this step", not on the join.
#   - Recursive CTEs belong to Series 3 · 10, views to Series 2 · 22, performance to Series 3.

deck: "DataZeus::Learn SQL::Series 2::20 CTEs (WITH)"
guid: "datazeus-learn-sql-series2-20-ctes"
tags: ["datazeus", "learn-sql", "series-2", "sql"]

cards:
  # ── 1. WHAT A CTE IS ──
  - cloze: "<code>{{c1::WITH}} customer_totals {{c2::AS}} (SELECT …)</code> gives a subquery a name before the query that uses it."

  - basic:
      front: "What is a CTE?"
      back: "A common table expression: a subquery with a name, written after WITH and before the query that uses it. The query below reads the name as if it were a table."

  - basic:
      front: "You wrote <code>WITH customer_totals AS (…) SELECT … FROM customer_totals;</code>. Can a query you run tomorrow read from customer_totals?"
      back: "No. Nothing is stored. The name exists only inside that one statement, up to its semicolon. (A named query that outlives the statement is a view.)"

  - basic:
      front: "Rewrite this as a CTE: <code>SELECT AVG(t.total) FROM (SELECT customer_id, SUM(amount) AS total FROM sales GROUP BY customer_id) AS t;</code>"
      back: "<code>WITH totals AS (<br>&nbsp;&nbsp;SELECT customer_id, SUM(amount) AS total<br>&nbsp;&nbsp;FROM sales GROUP BY customer_id<br>)<br>SELECT AVG(total) FROM totals;</code>"

  # ── 2. USING A STEP TWICE ──
  - basic:
      front: "A query lists the customers whose total is above the average customer total. Nested, it builds the per-customer totals twice. How does a CTE avoid that?"
      back: "Define the totals once as a named step, then use the name twice: <code>FROM customer_totals</code> for the list, and <code>(SELECT AVG(total) FROM customer_totals)</code> for the comparison."

  # ── 2b. ONE FILTER, EVERY USE SEES IT (the case file: the nine re-run on delivered sales; moved from
  #     Series 2 · 00 on 2026-09-16 with the re-run itself) ──
  - basic:
      front: "A report keeps only shipped orders with <code>WHERE shipped_date IS NOT NULL</code>, and its HAVING compares each customer's total with <code>(SELECT AVG(t.total) FROM (SELECT customer_id, SUM(amount) AS total FROM … GROUP BY customer_id) AS t)</code>. The shipped filter is written only in the outer query. What goes wrong?"
      back: "The subquery is a query of its own and does not see the outer query's WHERE, so it still averages every order, shipped or not. Shipped totals get compared with an all-orders average: a plausible, wrong list with no error. Nested, the filter must be written twice."

  - basic:
      front: "The same report as a CTE: <code>WITH shipped_totals AS (… WHERE shipped_date IS NOT NULL GROUP BY customer_id)</code>, then the list <code>FROM shipped_totals</code> and the average <code>(SELECT AVG(total) FROM shipped_totals)</code>. How many times is the filter written, and why is that safer?"
      back: "Once, inside the step. Both the list and the average read the step, so both see the filter, and there is no second copy to forget."

  # ── 3. STEPS THAT READ STEPS ──
  - cloze: "Several CTEs in one WITH are separated by {{c1::commas}}, and each step can read the steps {{c2::above}} it."

  - basic:
      front: "In <code>WITH a AS (…), b AS (SELECT … FROM a) SELECT … FROM b</code>, which parts can read <code>a</code>?"
      back: "Step b and the final query. A step can read any step defined above it in the same WITH."

  # ── 4. CHECKING A REWRITE ──
  - basic:
      front: "You rewrite a working query with CTEs. What is the quickest check that the rewrite is correct?"
      back: "Run both and compare the row count and the totals (for example count(*), and the sum of the main measure). A rewrite is only correct if it returns exactly what the original returned."

  - cloze: "Check a rewrite against the original: the same number of {{c1::rows}}, and the same {{c2::totals}}."

  - basic:
      front: "After a rewrite, the row count matches the original (47) and the sales total matches to the cent — but the freight total went from 11,819 to 37,750. Is the rewrite correct?"
      back: "No, and this is the shape that gets shipped: the two things that are quick to check both passed. A rewrite has to match on EVERY total, and the one to check hardest is a measure that belongs to the parent row (an order's freight), because a join to its children can multiply it while everything else stays right."

  # ── 5. ONE STEP, ONE GRAIN ──
  - basic:
      front: "Two steps both end in <code>GROUP BY customer_id</code>, so you merge them into one: <code>SELECT o.customer_id, SUM(l.amount) AS sales, SUM(o.freight) AS freight FROM month_orders o JOIN order_lines l ON l.order_id = o.order_id GROUP BY o.customer_id</code>. The sales are still right to the cent and the freight is three times too big. Why?"
      back: "month_orders holds one row per ORDER. Joining it to the order lines makes one row per LINE, so SUM(l.amount) is right — a sale IS a line — while SUM(o.freight) adds each order's freight once for every line that order has. Freight needs its own step over month_orders, before the join."

  - cloze: "One step, one {{c1::grain}}: a measure that belongs to the order has to be added up {{c2::before}} the join to the order lines, or the join multiplies it."

  - basic:
      front: "Does giving a step a name make it safe to add up whatever is in it?"
      back: "No. A CTE is a subquery with a name, and a name is not a guarantee — two steps can look alike and hold rows of completely different things. What the name is good for is saying the grain out loud: if you cannot finish the sentence \"one row of this step is one …\", a SUM over it is a guess."

  # ── 6. LOOKING INSIDE A STEP ──
  - basic:
      front: "A query with three named steps returns a wrong answer. How do you find the step that is wrong?"
      back: "Keep the WITH and point the final SELECT at one step at a time: <code>SELECT * FROM first_step</code>, then the next. Check what each step holds."

  # ── 7. READABILITY ──
  - basic:
      front: "Does rewriting a subquery as a CTE make the query faster?"
      back: "Do not count on it. The database may treat the CTE exactly like the subquery it replaced. A CTE is for readability: steps with names, read top to bottom."

  - basic:
      front: "What does a CTE change about a query: what it returns, or how it reads?"
      back: "Only how it reads. A correct rewrite returns exactly the same rows as the original — which is why you check the rows and totals after rewriting."

  - basic:
      front: "When is a query a good candidate for a CTE?"
      back: "When it nests subqueries inside subqueries, repeats the same subquery, or does several steps (narrow, add up, join) that are hard to follow in one block."

  # ── 8. PRODUCTION — hardest, and last. The schema it needs is ON THE CARD. ──
  - basic:
      front: "Write the query with CTEs. <code>orders</code> has <code>order_id</code>, <code>rep</code>, <code>shipped_at</code> (NULL until the order ships); <code>order_lines</code> has <code>order_id</code> and <code>amount</code>, several lines per order. Step 1: the orders with no shipped_at. Step 2: the value of each of those orders, reading step 1. Return each rep with how many such orders they have and their total value, largest first."
      back: "<code>WITH open_orders AS (<br>&nbsp;&nbsp;SELECT order_id, rep<br>&nbsp;&nbsp;FROM orders<br>&nbsp;&nbsp;WHERE shipped_at IS NULL<br>),<br>order_value AS (<br>&nbsp;&nbsp;SELECT o.order_id, SUM(l.amount) AS order_value<br>&nbsp;&nbsp;FROM open_orders o<br>&nbsp;&nbsp;JOIN order_lines l ON l.order_id = o.order_id<br>&nbsp;&nbsp;GROUP BY o.order_id<br>)<br>SELECT o.rep, COUNT(*) AS orders, SUM(v.order_value) AS total<br>FROM open_orders o<br>JOIN order_value v ON v.order_id = o.order_id<br>GROUP BY o.rep<br>ORDER BY total DESC;</code><br><br>Step 2 reads step 1, and the final query uses step 1 a second time. Each order's value is added up in its own step, one row per order, so COUNT(*) counts orders, not order lines."
