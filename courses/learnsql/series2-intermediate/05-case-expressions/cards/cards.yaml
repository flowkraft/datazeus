# Flashcards for Learn SQL · Series 2 · 05 — CASE, SQL's if/then for labels and buckets
#
# OUR OWN minimal authoring format (NOT CrowdAnki); tools/build-anki.py turns it into a .apkg with
# genanki. The .apkg is a BUILD ARTIFACT — gitignored, built in CI. Only this YAML is source.
#
# deck:  Anki deck name ("::" = sub-deck; keeps everything under DataZeus).
# guid:  STABLE per-deck id so rebuilds UPDATE the same deck. Set once, from the slug, never changed.
# cards: a list of either { basic: {front, back} } or { cloze: "… {{c1::…}} …" }.
# tags:  applied to every card in the file.
#
# ── WHAT ANKI IS FOR ────────────────────────────────────────────────────────────────────────
# Reviewed on a phone, weeks later, with no database open. EVERY CARD CARRIES ITS OWN PREMISE:
# where a card needs a value (a freight of 38.4, 5617 unlabelled rows, 61 matching rows of 3749) the
# FRONT states it, and the card tests the REASONING. No card names a Northwind table as something
# to remember, and none asks for a figure from the dataset. The koans are where the SQL is written;
# this deck is where the rules have to hold without rows in reach.
#
# FILE ORDER IS THE CURRICULUM, in the lesson's order: what CASE is and how it reads, grouping by
# the label, the first-true-WHEN trap, the missing-ELSE trap and its NULL, the short form and when a
# join is better, COALESCE, CASE inside an aggregate, the share and its integer division, and last
# the production card. 15 basic, 5 cloze — about the 3:1 the existing decks run.
#
# THE SHARE CARDS CARRY A RULE THAT HAS NO KOAN. DuckDB, which the koans run on, keeps the fraction
# of an integer division that PostgreSQL throws away, so a koan would pass the query CloudBeaver
# shows as a column of zeros. The lesson says so; this deck is where the rule is drilled instead.
#
# WHAT THIS DECK OWNS, AND WHAT IT LEAVES ALONE:
#   - Series 1 · 45 owns NULL, three-valued logic and COALESCE itself. The cards here state the
#     rule a missing ELSE runs into ("a comparison with NULL is unknown") without re-teaching it,
#     and COALESCE appears only as the CASE it abbreviates.
#   - Series 1 · 20 owns expressions, aliases and ROUND in the SELECT. The alias-in-WHERE card here
#     is about why the label had to go into a subquery, in one line.
#   - Series 2 · 00 owns subqueries. Series 3 · 00 owns the pivot as a pattern; the SUM(CASE …)
#     cards here are about one column per status.

deck: "DataZeus::Learn SQL::Series 2::05 CASE"
guid: "datazeus-learn-sql-series2-05-case-expressions"
tags: ["datazeus", "learn-sql", "series-2", "sql"]

cards:
  # ── 1. WHAT CASE IS ──
  - cloze: "<code>CASE WHEN freight &lt; 25 THEN 'light' ELSE 'heavy' {{c1::END}}</code> — every CASE is closed by {{c1::END}}, and the value for rows no WHEN matched comes after {{c2::ELSE}}."

  - basic:
      front: "In what order does CASE check its WHEN lines, and when does it stop?"
      back: "From the top down, one row at a time. It stops at the first WHEN whose test is true and returns that THEN value; the WHENs below it are never checked for that row. If none is true, it returns the ELSE value."

  - basic:
      front: "<code>CASE WHEN freight &lt; 25 THEN 'light' WHEN freight &lt; 60 THEN 'medium' ELSE 'heavy' END</code>. An order has a freight of 38.4. Walk through what CASE does."
      back: "The first WHEN asks \"under 25?\": no. The second asks \"under 60?\": yes, so CASE stops and returns 'medium'. The ELSE is never reached."

  - basic:
      front: "How is CASE different from a calculated column such as <code>price * quantity</code>?"
      back: "Both are expressions that produce a value for every row. A calculation computes its value; CASE chooses one of several values depending on which test the row passes."

  # ── 2. GROUPING BY THE LABEL ──
  - basic:
      front: "You have given each order a band with CASE, <code>AS band</code>. How do you count the orders in each band in the same query?"
      back: "Group by the label: <code>GROUP BY band</code> with <code>count(*)</code>. PostgreSQL and DuckDB accept the alias in GROUP BY; in databases that do not, repeat the whole CASE there."

  # ── 3. THE FIRST TRUE WHEN WINS ──
  - basic:
      front: "<code>CASE WHEN freight &lt; 60 THEN 'medium' WHEN freight &lt; 25 THEN 'light' ELSE 'heavy' END</code> runs with no error, but no order is ever labelled light. Why?"
      back: "Every freight under 25 is also under 60, so the first WHEN catches it and CASE stops. The light test is never reached. Put the narrow test first: <code>&lt; 25</code> above <code>&lt; 60</code>."

  - cloze: "When two WHEN tests can both be true for the same row, write the {{c1::narrow}} test first, or the {{c2::wide}} one catches its rows before it is checked."

  # ── 4. NO ELSE MEANS NULL ──
  - basic:
      front: "A CASE has one WHEN, <code>WHEN freight &gt; 50 THEN 'heavy'</code>, and no ELSE. What label does an order with a freight of 20 get?"
      back: "NULL. A CASE with no ELSE returns NULL for every row that no WHEN matched."

  - basic:
      front: "5617 orders have a label of NULL because the CASE had no ELSE. You filter <code>WHERE label &lt;&gt; 'heavy'</code>. How many of the 5617 come back, and why?"
      back: "None. <code>NULL &lt;&gt; 'heavy'</code> is unknown, not true, and WHERE keeps only rows where the test is true. Add an ELSE so those rows get a real label, and the filter finds all 5617."

  - basic:
      front: "You want to filter on a label made by CASE in the SELECT. Why can't <code>WHERE band = 'heavy'</code> in the same query see it, and what do you do?"
      back: "WHERE runs before the SELECT has named its columns, so the alias does not exist there yet. Make the label in a subquery in FROM and filter it in the outer query (or repeat the CASE in the WHERE)."

  # ── 5. THE SHORT FORM, AND WHEN NOT TO USE CASE ──
  - basic:
      front: "<code>CASE ship_via WHEN 1 THEN 'Speedy Express' WHEN 2 THEN 'United Package' WHEN 3 THEN 'Federal Shipping' END</code> runs with no error, but one group comes back with a NULL shipper. The names are stored in a <code>shippers</code> table, which has four rows. What happened, and what should the query do instead?"
      back: "The fourth shipper (ship_via 4) matches no WHEN, and there is no ELSE, so its rows get NULL. JOIN to <code>shippers</code> and read the name: when a shipper is added or renamed, the table changes and the query does not have to. CASE is for labels nobody stored, such as light, medium and heavy."

  - basic:
      front: "When can you use the short form <code>CASE column WHEN value THEN …</code> instead of <code>CASE WHEN column = value THEN …</code>?"
      back: "When every WHEN compares the same column with a value using equals. For ranges (<code>&lt; 25</code>) or tests on different columns, use the full form."

  # ── 6. COALESCE ──
  - cloze: "<code>COALESCE(region, '(none)')</code> is a short way of writing <code>CASE WHEN region {{c1::IS NULL}} THEN '(none)' ELSE {{c2::region}} END</code>."

  # ── 7. CASE INSIDE AN AGGREGATE ──
  - basic:
      front: "For each sales channel you need the number of orders AND the number in each status (shipped, cancelled, open), on one row. One query has only one WHERE. How do you get them all?"
      back: "Move each condition into its own column: <code>count(*) AS orders, SUM(CASE WHEN status = 'Cancelled' THEN 1 ELSE 0 END) AS cancelled</code>, and one more SUM(CASE …) per status, grouped by channel. Each CASE turns an order in its status into a 1 and every other order into a 0, and SUM adds the ones. The status columns add back up to the orders."

  - cloze: "<code>SUM(CASE WHEN status = 'returned' THEN {{c1::1}} ELSE {{c2::0}} END)</code> counts the returned rows in each group, without a WHERE."

  - basic:
      front: "<code>count(CASE WHEN status = 'Cancelled' THEN 1 END)</code> has no ELSE. Is that a bug?"
      back: "No, it is on purpose. Rows that do not match get NULL, and count of an expression skips NULLs, so it counts exactly the matching rows, the same as SUM(CASE … THEN 1 ELSE 0 END). A missing ELSE is a bug when you filter on the label, not when you count it."

  # ── 8. THE SHARE, AND THE DIVISION THAT THROWS THE FRACTION AWAY ──
  - basic:
      front: "A group has 3749 rows and 61 of them match. <code>SUM(CASE WHEN … THEN 1 ELSE 0 END) / count(*)</code> returns 0 on PostgreSQL, and 0.01627… on DuckDB. Why the 0, and how do you write the share so every database agrees?"
      back: "Both sides are whole numbers, and on PostgreSQL (and SQL Server, and SQLite) a whole number divided by a whole number is a whole number: the fraction is thrown away. DuckDB keeps it. Put a decimal number in first: <code>ROUND(100.0 * SUM(CASE … END) / count(*), 1)</code> gives 1.6 on both. There is no error either way — the zeros simply look like an answer."

  - cloze: "<code>ROUND({{c1::100.0}} * SUM(CASE … END) / count(*), 1)</code> — the decimal point makes the division keep its fraction, and the multiplication comes {{c2::before}} the division."

  - basic:
      front: "One sales channel has the most cancelled orders and the lowest cancellation share (1.6%); another has the fewest and the highest (2.2%); the whole company is at 1.8%. Before anyone calls the 2.2% channel the problem, what has to be on the report beside each share, and what is the overall 1.8% for?"
      back: "Its count. 2.2% can be 22 orders of 1001, where four fewer cancellations would make it 1.8%. A share always travels with its count, and the overall share is what tells you whether any group is really high rather than a few orders away from everyone else."

  # ── 9. PRODUCTION — hardest, and last. The schema it needs is ON THE CARD. ──
  - basic:
      front: "Write the query. <code>products</code> has <code>category</code> and <code>price</code>. For each category, return three counts: <code>budget</code> (price under 15), <code>standard</code> (15 up to but not including 30) and <code>premium</code> (30 and above), ordered by category."
      back: "<code>SELECT category,<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;SUM(CASE WHEN price &lt; 15 THEN 1 ELSE 0 END) AS budget,<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;SUM(CASE WHEN price &gt;= 15 AND price &lt; 30 THEN 1 ELSE 0 END) AS standard,<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;SUM(CASE WHEN price &gt;= 30 THEN 1 ELSE 0 END) AS premium<br>FROM products<br>GROUP BY category<br>ORDER BY category;</code><br><br>One SUM(CASE …) per column. A product priced exactly 30 is premium."
