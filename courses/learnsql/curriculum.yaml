    #
    # ── A COMPLETE CURRICULUM, AND THE STORY WHERE IT TEACHES BEST (owner, 2026-09-15) ─────────
    # THE JOB OF THIS SERIES IS THE INTERMEDIATE SQL PEOPLE ACTUALLY USE AT WORK — all of it, not the
    # parts a story happens to need. The story does not compete with that; it appears where it is the
    # best way to show a skill on real data and make it stick. Each episode has two possible parts:
