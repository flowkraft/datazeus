      # says FULL OUTER JOIN earns its place in RECONCILIATION, comparing two lists that should agree —
      # and EXCEPT and INTERSECT are the set-based way to do exactly that.
      # THE QUERIES (run on northwind_co_s, 2026-09-22). Two lists that should agree and do not: OUR 177
      # un-invoiced Speedy Express orders from 15, and THE COURIER'S confirmations. Everything below is that
      # one comparison, written four ways.
      # 1. THE COLUMN RULES FIRST, because they are what actually stops people: both branches need the same
      #    number of columns, in the same order, with compatible types -- and the column NAMES come from the
      #    first branch, so a mis-labelled report is a set operation written back to front. ORDER BY belongs
      #    to the whole statement, once, at the very end. Three sentences, then the business question.
      # 2. INTERSECT -- DELIVERED, SO INVOICE THEM: our 177 against the courier's list gives 164 orders,
      #    242,383.04.
      # 3. EXCEPT -- NEVER CONFIRMED, SO CLAIM THEM: 13 orders, 14,511.63. And the check said out loud,
      #    164 + 13 = 177, which is the number 15 produced. A reconciliation that does not reconcile is not
      #    finished.
      # 4. UNION vs UNION ALL, AND THE DATASET ARGUES IT FOR YOU: "CourierConfirmations" is 189 rows over 172
      #    orders -- a clean file of 172 received 2024-12-16, one row per order, and a RE-SEND of 17 rows
      #    covering 14 orders received 2024-12-18, THREE OF WHICH ARE DUPLICATED INSIDE THE RE-SEND. Stack
      #    the two files with UNION ALL and you report 189 confirmations for 172 orders; UNION gives 172.
      #    Nobody invented that: it is what happens when an ops team re-sends a file, and it is why UNION ALL
      #    is the faster one and the wrong default. (The brief used to say "the duplicate confirmation",
      #    singular. There are 17 excess rows.)
      # 5. THE NOISE, AND IT MUST BE NAMED: 8 of the 172 confirmed orders ALREADY had a "ShippedDate" -- the
      #    courier confirming something we already knew. Turn the EXCEPT around (their list EXCEPT ours) to
      #    surface them. They are not evidence of anything and saying so is the honest move; a reconciliation
      #    that quietly drops its own leftovers teaches the opposite of what this episode is for.
      # 6. ONE LINE EACH, no more: INTERSECT and EXCEPT are DISTINCT by default -- that is why 189 rows
      #    answer for 172 orders without anyone asking -- and INTERSECT ALL / EXCEPT ALL exist when you mean
      #    to keep the copies. PostgreSQL and DuckDB both have them.
