      #    cannot make for you.
      # 6. THE TRANSACTION, which is what makes all of the above safe to try: BEGIN, both writes, the two
      #    counts, then ROLLBACK and watch the counts go back. Run it a second time ending in COMMIT. A
      #    reader who has rolled back a real change once stops being frightened of the keyword.
      # 7. DELETE gets the smallest beat and an honest reason: NOTHING IN THIS CASE IS DELETED. Practise it
      #    on the copy 22 made with CREATE TABLE AS, and point at 56 for the re-runnable version.
