      # THE QUERIES (run on northwind_co_s, 2026-09-22). The case has been diagnosed by now; this episode is
      # where the reader touches the data, so every statement below is paired with the count that proves it.
      # 1. THE WHERE AS A SELECT FIRST, and it is the habit the episode exists to install: write the SELECT,
      #    read the count, and only then swap SELECT for UPDATE. The count to expect is 164 -- the orders the
      #    courier confirmed (48) that still have no "ShippedDate". If the SELECT does not return 164, the
      #    UPDATE is not ready.
      # 2. THE FIX, part one: record the confirmed ship dates. UPDATE "Orders" from the courier's
      #    "DeliveredDate" WHERE "ShippedDate" IS NULL and the order is confirmed -> 164 rows.
      # 3. THE TRAP, WITH ITS PRICE ON SCREEN: drop `AND "ShippedDate" IS NULL` and the same statement also
      #    touches the 8 orders that ALREADY had a ship date -- and in ALL EIGHT the courier's date is
      #    EXACTLY TWO DAYS LATER than ours. No error, no warning, eight good ship dates quietly moved
      #    forward by two days, some of them across a week boundary. Show the before and after of one row.
      #    This is the beat; "be careful" is not.
      # 4. THE SECOND TRAP, and it is the one nobody expects: the SOURCE has duplicates. UPDATE ... FROM
      #    "CourierConfirmations" joins 189 source rows to 172 target orders (48). On this data every
      #    duplicate agrees on "DeliveredDate" -- 0 orders with conflicting dates -- SO THE CARELESS VERSION
      #    HAPPENS TO BE RIGHT, which is exactly why it survives to production. Deduplicate the source first
      #    (35's ROW_NUMBER, rn = 1) and say out loud that an UPDATE with more source rows than targets is
