    # to an answer does not feel they found it. So Mnemosyne WITHDRAWS across the series: she starts as the one
    # who says what to look at and ends as the one asking whether he is sure.
    # TWO SIGNALS, BOTH CHECKABLE IN THE SCRIPT — who OPENS the segment, and who STATES THE LIMIT (the thing the
    # data cannot prove). At 00 both are hers. By 25 both must be his, or the project does not land.
    #   00  handed the question; he does not know what a subquery is       opens: her    limit: her
    #   05  names the method before she describes it                       opens: her    limit: her
    #   10  ASKS THE NEXT QUESTION HIMSELF — first rung of agency          opens: LEO    limit: her
    #   15  states his own limit before she can; she confirms              opens: Leo    limit: LEO
    #   25  designs the test; she checks it and makes him tighten it       opens: Leo    limit: Leo
    #   48  calls his own evidence soft while it runs in his favour        opens: Leo    limit: Leo
    #   55  refuses to run it without a back-out; she need not ask         opens: Leo    limit: Leo
    #   60  presents it; SHE asks "are you sure?" and he answers           opens: Leo    limit: Leo
    # HER FOUR MOVES, IN ORDER: 00–05 she TELLS · 10–15 she ASKS · 25–48 she CHECKS · 55–60 she DOUBTS.
    # THE LADDER RUNS THROUGH THE NINE STORY-FREE EPISODES TOO, on their own examples: it is about who drives,
    # not about the case. If Leo is back to "what do I do next?" at 35, the case cannot return at 48 as his.
    # FOUR RULES so it costs the lesson nothing and does not turn sentimental: (1) growth is SHOWN, never
    # announced — no praise for its own sake; her one backward-looking line in the whole series is at 60 and it
