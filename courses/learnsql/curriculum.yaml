      #
      # THE QUESTION CARRIES A TRAP THAT MAKES THE TOOL NECESSARY, NOT DECORATIVE. avg() over the
      # joined rows of Series 1 · 50's query is the average ORDER LINE, 595.13, so 118 of the 119
      # customers who ever ordered are "above average" (the one below has bought two lines in five
      # years, 465.75 — the proof). The average CUSTOMER needs the per-customer totals first — a
      # subquery in FROM — and it is 126193.54, which 30 customers beat. It is Series 1 · 50's grain
      # arriving through a HAVING, and it is answered with a query inside a query.
      #
      # THE UNCORRELATED HALF ONLY, three shapes by what the brackets hand back:
      #   a VALUE   scalar subquery      products dearer than the average price (30 of 80; avg 24.01)
