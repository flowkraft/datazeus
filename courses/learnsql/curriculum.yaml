    #
    # THE HANDOVER LADDER — WHO DRIVES THE CASE (owner, 2026-09-21; stories plan §3.2.1a).
    # The map above says WHERE the story appears. This says WHO DRIVES IT, and it is what Series 2 adds to
    # Series 1's model. Series 1 ran an ACCUMULATION arc: Leo asked "who is our biggest customer?" at 10, every
