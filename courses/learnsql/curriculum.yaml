    #
    # OLD → NEW, for anyone holding a pointer from before 2026-09-14:
    #   00 multi-table-joins + 06 join-fan-out → 15 multi-table-joins-duplicate-rows
    #   05 subqueries → 00 subqueries (uncorrelated) + 25 exists-and-correlated-subqueries
