      #
      #   4. DEEP PAGINATION, and it is the one every reader will use.
      #      OFFSET 100000 LIMIT 20 must PRODUCE AND DISCARD one hundred thousand rows to reach
      #      page 5001. The cost grows with the page number, so the last page of a report is the
      #      slowest — which is exactly backwards from what everyone expects, and it is why "the
      #      report is slow" is sometimes only true for one user.
      #      THE KEYSET (or seek) ALTERNATIVE: remember the last row's sort key and ask for what
      #      comes after it — WHERE (order_date, order_id) < (:last_date, :last_id) — with the
