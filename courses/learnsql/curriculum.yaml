      # NEW 2026-09-19, split from 55. MUST COVER `INSERT … ON CONFLICT`, the one real hole a competitor
      # audit found (Amigoscode's 60-episode PostgreSQL course, 2026-09-02 — it spends TWO of its sixty on
      # this: "On Conflict Do Nothing" and "Upsert"). Before this, UPSERT appeared only at Series 4 · 05,
      # which is cross-vendor and advanced, so a learner on the core path never met the most common write
      # in production.
      #   ON CONFLICT DO NOTHING  — the idempotent load: re-run the same INSERT and get no duplicates and
      #                             no error, which is what a re-run of any import script needs.
      #   ON CONFLICT … DO UPDATE — insert-or-update in one statement, without the SELECT-then-branch race
      #                             a beginner writes instead. EXCLUDED is the incoming row.
      #   MERGE                   — the standard spelling (SQL:2003; PostgreSQL 15+, DuckDB 1.4+, and the
      #                             only one on SQL Server and Oracle). One beat: the same upsert written
      #                             as MERGE. Its koan needs DuckDB 1.4+; the koan runner has
      #                             been on 1.4.5.0 since 2026-09-21 (the Series 2 header's upgrade note).
      # THE FAILURE THAT EARNS IT: an import run twice — the second run duplicates every row or dies on the
      # key. The example is a supplier's price list: some products already exist (update the price), some
      # are new (insert them). Practice on a copy made with 22's CREATE TABLE AS, with its key added.
      # Series 4 · 05 stays what it is: how the SAME idea is spelled on the five engines (MySQL's ON
      # DUPLICATE KEY UPDATE and the rest).
      # DO NOT LET IT GROW INTO A PIPELINE LESSON. ETL & Data Pipelines, Series 1 · 25 is "Idempotency —
      # Re-Runnable Loads with TRUNCATE+INSERT and MERGE", the same problem at the scale of a scheduled job,
      # with the staging table and the row-count check around it. THIS episode owes only the statement and
      # what it does to one table.
      # BUILDS ON: 55 (INSERT … SELECT, transactions), 22 (CREATE TABLE AS). Standalone after 55.
      # THE QUERIES (run on northwind_co_s and on a writable copy of it, 2026-09-22). The price list the
      # brief describes is already in the dataset: "PriceChanges" is 255 rows covering all 80 products,
      # 2020-03-05 to 2024-11-04 -- SEVERAL ROWS PER PRODUCT, which is what a supplier feed actually is.
      # 0. THE TARGET, built with 22: CREATE TABLE AS over the 7 products of SupplierID 3, then add the
      #    primary key -- ON CONFLICT needs a unique constraint to conflict WITH, and the error you get
      #    without one is the first thing to show, not the last.
      # 1. THE FAILURE THAT EARNS THE EPISODE: run the plain INSERT of the feed twice. The second run dies on
      #    the key (or, without a key, duplicates every row). Every import script in the world is this script.
      # 2. ON CONFLICT DO NOTHING -- the re-runnable load: same INSERT, run it three times, the table does not
      #    move and nothing errors. That is idempotency in one keyword, and ETL Series 1 25 is where it grows
      #    into a job. Do not let it grow here.
      # 3. ON CONFLICT ... DO UPDATE -- insert-or-update in one statement, EXCLUDED being the incoming row.
      #    Against a 9-row list (the 7 existing products plus 2 invented new ones) it updates 7 and inserts 2,
      #    and the reader watches one statement do both. Say what it replaces: the SELECT-then-branch a
      #    beginner writes, which is two statements and a race.
      # 4. THE TRAP, AND IT IS THE MOST-ASKED QUESTION ABOUT THIS STATEMENT: THE FEED HAS THE SAME KEY TWICE.
      #    Supplier 3's 7 products carry 26 price changes between them (2 to 5 each), so feeding
      #    "PriceChanges" in unfiltered means 26 rows for 7 keys. PostgreSQL REFUSES it -- "ON CONFLICT DO
      #    UPDATE command cannot affect row a second time". DUCKDB DOES NOT: it accepts the batch and lands
      #    THE EARLIEST PRICE FOR ALL SEVEN -- 14.65 where the catalogue says 18.37, 39.33 where it says
      #    48.01, 8.00 where it says 9.69. 2020 prices written over 2024 prices, no error, no warning. Show
      #    BOTH engines on this one; it is the clearest place in the series where "it ran" and "it worked"
      #    come apart.
      # 5. THE CURE, AND IT IS 35 ARRIVING WHERE NOBODY EXPECTED IT: ROW_NUMBER() OVER (PARTITION BY
      #    "ProductID" ORDER BY "ChangedDate" DESC), rn = 1 -- 26 rows become 7, and all 7 land EXACTLY the
      #    catalogue's current prices (18.37, 10.05, 48.01, 9.69, 27.03, 53.04, 26.93). The dedupe is not a
      #    precaution, it is verifiable on screen. DEDUPLICATE THE SOURCE TO ONE ROW PER KEY, ALWAYS -- the
      #    same sentence 55 says about UPDATE ... FROM, met a second time so it sticks.
      # 6. MERGE, one beat: the same upsert in the standard spelling, and the note that it is the only one on
      #    SQL Server and Oracle. Syntax, not a second lesson.
      # NO KOAN ON THE DUPLICATE-KEY RULE (2026-09-22): the koans run on DuckDB, and DuckDB is the LAXER
      # engine here -- a koan asserting the PostgreSQL error could never go green. The koans take 2, 3 and 5,
      # where both engines agree; the trap stays in the video and the article, with both behaviours named.
      # WORKPLACE: insert-or-update in one statement; re-runnable loads; MERGE when the engine has no ON CONFLICT.
      # STORY (map 2026-09-19) — NONE.
      - n: "56"
        slug: upsert-and-merge
        title: "UPSERT & MERGE — Insert or Update in One Statement, and Loads You Can Run Twice"
        short: "UPSERT & MERGE — insert or update, safely re-run"
        hands_on: ["koan:predict", "koan:complete"]
        core: true
        status: planned
        data:
          source: northwind_co_s
          tables: ["Products", "Suppliers", "PriceChanges"]
          fit: good
          reason: "Products has a primary key and prices a supplier's list can change, so a list with some existing and some new products shows DO NOTHING, DO UPDATE and MERGE on one table. Measured 2026-09-22: \"PriceChanges\" is the feed the episode needs -- 255 rows over all 80 products, and SupplierID 3's 7 products carry 26 changes between them, so the unfiltered feed has the same key up to 5 times. PostgreSQL refuses that batch; DuckDB accepts it and lands the EARLIEST price for all 7 (14.65 against a catalogue 18.37, 39.33 against 48.01), while a ROW_NUMBER dedupe to rn = 1 lands all 7 catalogue prices exactly. Minimum: 10 products, a list of 5 rows with 3 existing and 2 new, and a source that repeats at least one key."
      # NEW 2026-09-07. An audit for performance coverage found something more basic: the words
      # median and percentile appear NOWHERE in any curriculum in this academy — checked by
      # grep across all twenty-eight, not assumed. That is a strange silence for a course whose
      # whole promise is answering business questions, because "what is typical" is one of the
      # questions people ask most and AVG is the wrong answer to it.
      #
      # PLACED AT 58, AFTER BOTH WINDOW-FUNCTION EPISODES, and it has to be: a percentile is
      # defined by ORDERING, the ANSI spelling is literally an ORDER BY inside the aggregate,
      # the neighbouring functions (NTILE, PERCENT_RANK, CUME_DIST) are window functions, and
      # the MySQL workaround below needs ROW_NUMBER from 35. Before the Series 2 project, so
      # the project can ask for a median.
      #
      # THE FRAMING, and it is a business point before it is a syntax point: the average is
      # pulled upwards by the top of the distribution and the median is not. When somebody asks
      # for "the typical order", they mean the median and they say average, and the difference
      # has changed real decisions.
      # MEASURED, AND IT IS RIGHT SKEW RATHER THAN AN OUTLIER STORY (Northwind Company S, DuckDB,
      # re-checked 2026-09-21): the average order value is 1,501.70 and the median is 1,320.88 —
      # the average sits 14% above the typical order. THAT GAP IS NOT ONE BIG ORDER. The five
      # largest orders are 6,030.80 / 5,440.72 / 5,336.51 / 5,299.17 / 5,276.56 — a smooth tail
      # whose top is only 4.6x the median — and DROPPING THE LARGEST ORDER ALTOGETHER MOVES THE
      # AVERAGE BY 45 PENCE (1,501.70 to 1,501.25) and the median by two (1,320.88 to 1,320.86).
      # SO DO NOT PROMISE AN OUTLIER ON SCREEN. The honest sentence, and the one the data will
      # survive being queried live, is "half the orders are below 1,320.88, yet the average is
      # 1,501.70, because the orders above the middle sit further from it than the orders below."
      # That is many small orders and a long thin tail: the ORDINARY case, which is the better
      # lesson anyway, because it is the shape the reader's own data almost always has. The
      # enterprise-whale version is said, not queried — beat 4 owns it and labels it as such.
      # Freight is not a calm contrast here either. RE-MEASURED 2026-09-21: average 69.31, median
      # 46.77 — the 52.74 / 44.86 recorded here earlier was a frozen-Northwind figure and is wrong
      # for Northwind Company S. The correction helps: freight's average sits 48% above its median
      # where order value's sits 14% above, so freight is the louder of the two, not the calmer.
      # AND THE WHALE DOES NOT HAVE TO BE SAID — IT CAN BE QUERIED, ONE LEVEL UP (2026-09-21).
      # No single ORDER is a whale, which is why the paragraph above is right about order value.
      # CUSTOMER lifetime value is a different distribution: average 126,193.54 against a median of
      # 22,978.10, ONLY 30 OF THE 119 CUSTOMERS ABOVE THAT AVERAGE, and the top five holding 25.5%
      # of all revenue (Fjord Foods 797,164.00). That average is not a customer — the nearest real
      # ones sit either side of it. THE READER HAS ALREADY RUN BOTH QUERIES: 126,193.54 is exactly
      # what 20-ctes/scripts/average-customer-with.sql returns, and
      # customers-above-the-average-customer-with.sql returns exactly those 30 rows. So beat 4 opens
      # by handing back a result from episode 20 rather than by inventing a 2,000,000 order: they
      # have seen an average nobody is standing near, and this episode gives them the word for it.
      #
      # COVER:
      #   THE ORDERED-SET AGGREGATES, which look unlike anything else in SQL and should be
      #   presented as their own shape rather than as a function call:
      #     PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY amount)
      #   PERCENTILE_CONT INTERPOLATES between the two middle rows; PERCENTILE_DISC RETURNS AN
      #   ACTUAL VALUE FROM THE DATA. That distinction is the episode's one real decision:
      #     DISC  when the answer must be a value that exists — a real price, a real duration
      #     CONT  for a continuous measure where a number between two rows is meaningful
      #   A CONT median of 47.5 on a table where no order was ever 47.50 is correct and will
      #   still get you asked whether the query is broken.
      #   TEACH THAT DECISION BY SHOWING THE TWO MIDDLE ROWS — ROW_NUMBER() over the ordered
      #   values, then look at the pair in the middle. 10,000 ORDERS IS AN EVEN COUNT, so rows
      #   5,000 and 5,001 are 1,320.86 (order 5923) and 1,320.89 (order 7827): DISC HANDS BACK
      #   THE FIRST OF THEM, CONT AVERAGES THE PAIR TO 1,320.88 (DuckDB, 2026-09-21). The 2
      #   cents between the two functions IS that pair, seen rather than asserted. Repeat it on
      #   a small even-sized group, where the gap is wide enough to read off the screen.
      #   THAT GROUP IS DAIRY PRODUCTS (measured 2026-09-21): ten products, so again an even count,
      #   and the middle pair is 15.74 (Rustic Butter) and 30.06 (Highland Yoghurt) — a gulf rather
      #   than two cents. DISC hands back 15.74, CONT averages the pair to 22.90, AND NO PRODUCT IN
      #   THE CATALOGUE COSTS 22.90. That is the "correct and still gets you asked whether the query
      #   is broken" sentence above, on a list short enough to print whole and check by eye. Ten
      #   prices ascending: 9.38, 11.10, 11.15, 12.73, 15.74, 30.06, 35.47, 43.12, 43.12, 53.04.
      #   MERGED IN FROM A SEPARATE PORTABILITY SECTION ON 2026-09-21: that section said "show
      #   the workaround — ROW_NUMBER and COUNT(*), pick the middle row or average the two",
      #   which is this same beat written a second time eighteen lines further down, carrying
      #   its own Series 2 · 35 prerequisite. One screen now does both.
      #   WATCH THE ROW ARITHMETIC when this is written: picking the middle rows needs INTEGER
      #   division. (n+1)/2 is FLOAT division on DuckDB and silently matches no row — DuckDB
      #   wants //, MySQL wants DIV. Put the expression on screen rather than leaving the
      #   reader to discover it.
      #   MODE() WITHIN GROUP as the third member of the family, in a line.
      #   PER GROUP: the whole thing under GROUP BY — a median per category, which is where it
      #   earns its place in a reporting course.
      #   p95 AND p99 as the same function with a different argument, because that is how the
      #   reader will meet it outside reporting. THIS IS WHERE THE WORKPLACE LINE'S "percentiles
      #   for service levels" GETS ITS WORKED EXAMPLE — it had none before 2026-09-21: days from
      #   OrderDate to ShippedDate. MEASURED (DuckDB, 2026-09-21): median 5 days, p95 7, p99 20,
      #   max 24, against an average of 4.83. Say what that means out loud — half of all orders
      #   ship within 5 days, the promise you can actually make a customer is the p95 one at 7
      #   days, and the p99 of 20 is the tail the average of 4.83 hides completely.
      #   ONE LINE ON NULLS while that query is on screen: 9,532 of the 10,000 orders have a
      #   ShippedDate, so the percentile silently drops 468 unshipped ones. It is p95 OF THE
      #   ORDERS THAT SHIPPED — the number people quote and rarely the one they mean. Series 1 ·
      #   45's three-valued logic, met again inside an aggregate.
      #   NTILE, PERCENT_RANK and CUME_DIST from the window family, with the distinction stated
      #   plainly: NTILE BUCKETS ROWS, a percentile RETURNS A VALUE. People reach for NTILE
      #   expecting the second.
      #   STDDEV, in a line, beside the median: Series 1 · 25 promised "the statistical set" to
      #   Series 2, and spread is the other half of "what is typical".
      #
      # PORTABILITY, one line now that the workaround is on screen above: PostgreSQL, Oracle,
      # SQL Server and Db2 all have PERCENTILE_CONT and PERCENTILE_DISC. MYSQL HAS NEITHER, and
      # neither does SQLite — and the ROW_NUMBER pair the reader just watched IS the median
      # there. NOT deferred to Series 4: a large share of readers are on MySQL, Series 4 is a
      # specialist series, and this now costs a sentence rather than a second lesson.
      #
      # COST, in one paragraph with a forward pointer rather than a detour: a percentile has to
      # ORDER the whole group, so it is one of the aggregates that does not get cheap as data
      # grows. Series 3 · 27 owns approximation and already names Oracle's and SQL Server's
      # APPROX_PERCENTILE functions; point there and stop.
      #
      # KOANS: `predict` on CONT against DISC over an even-numbered group — nobody gets both
      # right first time. `complete` on the per-category median.
      #
      # WHAT GOES WRONG (beat 4): the average presented as "typical". SAY THIS ONE, DO NOT RUN
      # IT, and let the script be plain that it is a thought experiment: imagine one enterprise
      # customer placing a £2,000,000 order tomorrow. The average order value jumps, the median
      # does not move at all, a pricing decision is made on the average, and the number was
      # never wrong — it was the wrong statistic.
      # WHY IT IS SPOKEN AND NOT QUERIED (decided 2026-09-21): the shipped data cannot stage it.
      # The largest real order is worth 45 pence of the average (see THE FRAMING), and inventing
      # a row on screen in a course that measures every figure would cost more than it buys.
      # The real data already made the quieter, truer version of the point two beats earlier;
      # the whale is the extreme that makes the mechanism obvious, not the evidence for it.
      # It is the purest example in the course of a number that is right and still misleads,
      # which is the flip side of the rule this track uses everywhere else.
      # WORKPLACE: typical values (the median, not the average), percentiles for service levels, medians per group.
      # STORY (map 2026-09-17) — NONE. The average vs the median order value stays the main example.
      - n: "58"
        slug: median-and-percentiles
        title: "Median and Percentiles — WITHIN GROUP, and Why AVG Is Not the Answer"
        short: "Median and Percentiles — WITHIN GROUP, not AVG"
        hands_on: ["koan:predict", "koan:complete"]
        status: planned
        data:
          source: northwind_co_s
          tables: ["Order Details", "Products", "Orders.Freight", "Orders.ShippedDate"]
          fit: good
          reason: "Order values and line amounts are right-skewed enough for median, percentiles, per-category statistics and the AVG-versus-typical comparison, and OrderDate-to-ShippedDate gives the service-level percentile. Minimum: 21 orders for an odd median, one even-sized group, a right-skewed amount column whose average sits visibly above its median, and a nullable date for the NULL beat. NOT a high-value outlier: the S seed has none — dropping its largest order moves the average by 45 pence — and the episode's framing was rewritten on 2026-09-21 to teach right skew instead."
      # SERIES 2 PROJECT. The academy-wide audit found this series walking nine core episodes
      # with nothing that applied them — the same defect Python and Java & Groovy had.
      # It closes the series' own promise: a question a person actually asked, answered with
      # the subqueries, multi-table joins, CTEs and window functions this series taught.
      # QUESTION CHOSEN 2026-09-15 — the series story's ending (see the series header): a third of
      # what we sold has no shipping record; did those orders not ship, or did nobody record it?
      # The two earlier candidates are dropped: revenue per customer per quarter answered nothing the
      # series was asking, and "bought in Q1 2024 and not since" is not churn on this data.
      # STEP ONE IS THE GRAIN (added 2026-09-21): the case spans three of them — one row per order,
      # one row per line, one row per invoice or courier confirmation — and every count and every
      # sum in the project is wrong if the grain gets decided by accident. Open by asking "one row
      # per WHAT?" out loud, the way Series 2 · 15 framed it, and write the answer down before the
      # first CTE. It is the single check that catches what the series taught separately: the rows
      # a join quietly drops, the money a fan-out doubles (50), the running total taken over the
      # wrong rows (45).
      # THE QUERIES, IN ORDER (each one re-run against northwind_co_s on 2026-09-22; every figure below
      # matched .docs/plan-academy-figures-northwind-co-s.md column C exactly, so the locked table and the
      # built dataset agree and this block is how to reproduce it, not a second source of truth).
      # 0. STEP ZERO, AND IT IS THE OPENING SHOT: the obvious query returns NOTHING. "ShippedDate" IS NOT
      #    NULL AND NOT EXISTS (an invoice) -> 0 rows. Zero. Because the ship date IS what went missing, the
      #    obvious definition of "shipped" is the one the outage destroyed, and a confident empty result says
      #    "all clear". Open on it. Nothing else in the course makes the case for reading a zero suspiciously.
      # 1. SO "SHIPPED" HAS TO COME FROM SOMEWHERE ELSE -- "OrderStatusHistory", and that is 35 earning its
      #    place: ROW_NUMBER() OVER (PARTITION BY "OrderID" ORDER BY "ChangedAt" DESC, "StatusChangeID" DESC),
      #    rn = 1, exactly 10,000 rows out of 19,897. Note the tie-break out loud: without the second key 263
      #    orders have two rows at the same instant and the count comes back 10,263 (see 35).
      # 2. SHIPPED AND NEVER INVOICED, ALL YEARS (NOT EXISTS, from 25): 188 orders, 275,698.44.
      # 3. NARROW IT TO THE OUTAGE (dates from 10): Speedy Express, ordered 2024-03-04..2024-08-30 -> 177
      #    orders, 256,894.67. THE 11 ORDERS AND 18,803.77 LEFT OVER ARE NOT THE OUTAGE and must be said so;
      #    a project that lets its headline number quietly absorb the residue teaches the wrong habit.
      # 4. WAS IT DELIVERED? (48): the 177 against "CourierConfirmations" -- INTERSECT gives 164 confirmed,
      #    242,383.04; EXCEPT gives 13 never confirmed, 14,511.63. DEDUPLICATE FIRST: the table is 189 rows
      #    over 172 orders (11 orders twice, 3 three times), so UNION ALL and a careless join both inflate
      #    it -- the same ROW_NUMBER dedupe from 35, on the evidence this time. Courier confirmation is SOFT
      #    evidence and Leo says so himself; the ladder in the series header gives him that line.
      # 5. WHAT ONLY THE PROJECT FINDS: orders whose LATEST status is still "Open" although they were placed
      #    before November 2024 -> 43 orders, 59,611.41. These are not the outage and not Speedy Express;
      #    they are a second, smaller thing nobody was looking for, and finding it is the reward for having
      #    built step 1 properly.
      # 6. THE DEADLINE, AND IT IS WHERE THE RECOMMENDATION LIVES: 12 months from the EARLIEST OF THE 13
      #    NEVER-CONFIRMED orders is 2025-03-08. From all 177 it would be 2025-03-05; from all 188,
      #    2021-03-01, which is meaningless. Identical date arithmetic, three different answers, and only the
      #    business question -- you claim against the courier for what the courier never confirmed -- chooses
      #    between them. That is the whole difference between a query and an answer.
      # 7. THE ARITHMETIC CHECK, said on screen: 164 + 13 = 177, and 177 + 11 = 188. Every number in the
      #    recommendation reconciles to the one above it, and a row count before and after every join (15,
      #    50). If the check does not tie, the recommendation is not ready -- that is the habit being taught.
      # WORKPLACE: answer a real question end to end, with the checks, and write the recommendation.
      # STORY (map 2026-09-17) — THE WHOLE CASE: the gap, the courier, the dates, the money, the soft evidence, the
      #   reconciliation, the fix — plus what only the project finds (cancelled orders never updated; the claim
      #   deadline) — and a recommendation, not a verdict, with the wrong answers that looked right on the way.
      - n: "60"
        slug: project-a-real-business-question
        title: "Subqueries + CTEs + Window Functions — Solving a Real Business Case, End to End"
        short: "Subqueries + CTEs + Window Functions — a real case"
        hands_on: ["koan:author", "cloudbeaver"]
        core: true
        tags: ["project"]
        status: planned
        data:
          source: northwind_co_s
          tables: ["Orders", "Order Details", "OrderStatusHistory", "Customers", "Invoices", "CourierConfirmations", "Employees"]
          fit: good
          reason: "The full S2 case needs order/line grain, missing ship dates, invoices, courier evidence, statuses, and dates in one coherent dataset. Re-run end to end on 2026-09-22: every step reproduces the locked column-C figures to the penny (188/275,698.44 shipped-and-never-invoiced, 177/256,894.67 inside the outage, 164/242,383.04 confirmed, 13/14,511.63 never confirmed, 43/59,611.41 still open, deadline 2025-03-08), and \"shipped\" must be read from \"OrderStatusHistory\" because the \"ShippedDate\" reading returns 0 rows. Minimum: 100 orders over 12 months with 2+ lines each, 10 customers, an invoice gap, courier confirmations (including duplicates), and cancelled/open rows."

