    episodes:
      # OPENS THE SERIES ON SERIES 1 · 50's LAST LINE — "queries built out of other queries" — and
      # on that report's next question: WHICH CUSTOMERS SPEND MORE THAN THE AVERAGE CUSTOMER?
      # IT ALSO OWNS THE SERIES SETUP: why Series 2 runs on Northwind Company, how to install it once
