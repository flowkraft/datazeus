      #
      # COVER:
      #   GROUPING SETS   the explicit list — you name each grouping you want, and the engine
      #                   reads the source once. Start here rather than with ROLLUP, because it
      #                   is the general form and the other two are shorthands for it.
      #   ROLLUP(a,b,c)   the hierarchical shorthand: (a,b,c), (a,b), (a), (). Made for natural
      #                   hierarchies — year/quarter/month, country/region/city — where each
      #                   level's subtotal is wanted and the diagonal ones are not.
      #   CUBE(a,b)       every combination, 2^n of them. Say the cost out loud: CUBE over four
      #                   columns is sixteen groupings, and most reports want three of them.
      #
      # THE TRAP, AND IT IS THE REASON THIS IS NOT A SYNTAX TOUR:
      # A SUBTOTAL ROW CARRIES NULL IN THE COLUMN IT IS TOTALLING OVER, and that NULL is
      # indistinguishable from a real NULL in the data. A report over a table where region is
      # sometimes blank will show two rows that look identical and mean completely different
      # things — one is "the rows with no region", the other is "all regions". Nothing warns you.
      # NORTHWIND HAS THE REAL NULL ALREADY (checked 2026-09-14): "Region" is empty for 21 of the
      # 25 customers, so the collision can be shown on shipped data without inventing any.
      #   GROUPING(col)  returns 1 for the superaggregate NULL and 0 otherwise. This is the
