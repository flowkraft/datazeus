      # THE HARD HALF OF SUBQUERIES, split from old 05 on 2026-09-14 and placed after CTEs, so
      # correlation is met with the tool that makes it readable.
      #
      # COVER: EXISTS and NOT EXISTS, a correlated subquery against an uncorrelated one, and why
      # EXISTS can stop at the first match.
      #
      # THE NOT IN TRAP, ON NORTHWIND COMPANY S (checked 2026-09-19). "Which employees manage nobody?" —
      # WHERE "EmployeeID" NOT IN (SELECT "ReportsTo" FROM "Employees") returns NO ROWS AT ALL,
      # because Maya Bauer, the CEO, reports to nobody and her "ReportsTo" is NULL. NOT EXISTS returns
      # the 9 sales reps. It is Series 1 · 45's three-valued logic detonating inside a construct that looks
      # nothing like a NULL comparison. Teach the habit: NOT EXISTS, always. Series 3 · 22 comes
      # back to it as a query plan; this episode owns the correctness.
      #
      # ANY AND ALL, AS ONE RECOGNITION BEAT AFTER THE NOT IN TRAP (decided 2026-09-30) -- "know it, don't
      # write it", not a segment and not a koan. They are the list shape's comparison operators, and two of
      # them are the NOT IN trap in other clothes: `= ANY (...)` is IN; `<> ALL (...)` is NOT IN, with the same
      # NULL failure. ON NORTHWIND COMPANY S (DuckDB, 2026-09-30): "UnitPrice" > ALL (prices of category 1)
      # keeps 14 products -- the same 14 as `> (SELECT MAX(...))` in 00, so the reader meets an old answer in a
      # new spelling. THE PAYOFF IS THE EMPTY LIST: against category 9 (which has no products) `> (SELECT MAX(...))`
      # returns 0 rows, the quiet NULL that 00 shows, while `> ALL (empty)` returns ALL 80 -- "greater than every
      # one of nothing" is vacuously true. Same question, opposite silent answers; that contrast is the reason
      # to teach ALL here. The habit stays MAX/MIN for one value and NOT EXISTS for "none of". Say once that
      # SQLite has neither operator, so a cross-vendor reader should prefer the MAX/NOT EXISTS spellings.
      #
      # A PROMISE MADE IN SERIES 1 · 35: HAVING with no GROUP BY is "genuinely useful inside a
      # subquery". This episode owes the worked example — orders whose lines add up to more than
      # 400 units, EXISTS (… HAVING sum("Quantity") > 400) with no GROUP BY: 6 orders. The brief
