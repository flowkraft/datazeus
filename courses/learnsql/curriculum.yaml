      # NEW 2026-09-07. An audit for performance coverage found something more basic: the words
      # median and percentile appear NOWHERE in any curriculum in this academy — checked by
      # grep across all twenty-eight, not assumed. That is a strange silence for a course whose
      # whole promise is answering business questions, because "what is typical" is one of the
      # questions people ask most and AVG is the wrong answer to it.
      #
      # PLACED AT 58, AFTER BOTH WINDOW-FUNCTION EPISODES, and it has to be: a percentile is
      # defined by ORDERING, the ANSI spelling is literally an ORDER BY inside the aggregate,
      # the neighbouring functions (NTILE, PERCENT_RANK, CUME_DIST) are window functions, and
      # the MySQL workaround below needs ROW_NUMBER from 35. Before the Series 2 project, so
      # the project can ask for a median.
      #
      # THE FRAMING, and it is a business point before it is a syntax point: the average is
      # dragged around by outliers and the median is not. One enterprise order of £2,000,000
      # moves the average order value and does not move the median at all. When somebody asks
      # for "the typical order", they mean the median and they say average, and the difference
      # has changed real decisions.
      # THE SHIPPED DATA MAKES THE POINT WITHOUT AN INVENTED ORDER (checked 2026-09-14): the average
      # order value is 736.12 and the median is 506.17 — the average sits 45% above the typical
      # order. Freight is the calm contrast: average 50.49, median 47.93.
      #
      # COVER:
      #   THE ORDERED-SET AGGREGATES, which look unlike anything else in SQL and should be
      #   presented as their own shape rather than as a function call:
      #     PERCENTILE_CONT(0.5) WITHIN GROUP (ORDER BY amount)
      #   PERCENTILE_CONT INTERPOLATES between the two middle rows; PERCENTILE_DISC RETURNS AN
      #   ACTUAL VALUE FROM THE DATA. That distinction is the episode's one real decision:
      #     DISC  when the answer must be a value that exists — a real price, a real duration
      #     CONT  for a continuous measure where a number between two rows is meaningful
      #   A CONT median of 47.5 on a table where no order was ever 47.50 is correct and will
      #   still get you asked whether the query is broken.
      #   79 ORDERS IS AN ODD COUNT, so over the whole table CONT and DISC agree (47.93) — the
      #   difference has to be shown on an even-sized group.
      #   MODE() WITHIN GROUP as the third member of the family, in a line.
      #   PER GROUP: the whole thing under GROUP BY — a median per category, which is where it
      #   earns its place in a reporting course.
      #   p95 AND p99 as the same function with a different argument, because that is how the
      #   reader will meet it outside reporting.
      #   NTILE, PERCENT_RANK and CUME_DIST from the window family, with the distinction stated
      #   plainly: NTILE BUCKETS ROWS, a percentile RETURNS A VALUE. People reach for NTILE
      #   expecting the second.
      #   STDDEV, in a line, beside the median: Series 1 · 25 promised "the statistical set" to
      #   Series 2, and spread is the other half of "what is typical".
      #
      # PORTABILITY, and here it is sharp enough to belong in the lesson rather than in
      # Series 4: PostgreSQL, Oracle, SQL Server and Db2 all have PERCENTILE_CONT and
      # PERCENTILE_DISC. MYSQL HAS NEITHER, and neither does SQLite. So SHOW THE WORKAROUND —
      # ROW_NUMBER() and COUNT(*) over the group, then pick the middle row, or the two middle
      # rows and average them for an even count. It needs Series 2 · 35, it is genuinely
      # fiddly, and a large share of readers will need it.
      #
      # COST, in one paragraph with a forward pointer rather than a detour: a percentile has to
      # ORDER the whole group, so it is one of the aggregates that does not get cheap as data
      # grows. Series 3 · 27 owns approximation and already names Oracle's and SQL Server's
      # APPROX_PERCENTILE functions; point there and stop.
      #
      # KOANS: `predict` on CONT against DISC over an even-numbered group — nobody gets both
      # right first time. `complete` on the per-category median.
      #
      # WHAT GOES WRONG (beat 4): the average presented as "typical". One enterprise customer's
      # £2M order lifts the average order value by a third, a pricing decision is made on it,
      # and the number was never wrong — it was the wrong statistic. It is the purest example in
      # the course of a number that is right and still misleads, which is the flip side of the
      # rule this track uses everywhere else.
      # WORKPLACE: typical values (the median, not the average), percentiles for service levels, medians per group.
      # STORY (map 2026-09-17) — NONE. The average vs the median order value stays the main example.
      - n: "58"
