      #
      # THE IDEA THE EPISODE EXISTS FOR, and it should be stated in one breath early:
      #     SUM, COUNT, MIN and MAX DECOMPOSE. COUNT(DISTINCT) DOES NOT.
      # A sum of daily sums is the monthly sum. A count of daily counts is the monthly count.
      # The distinct customers in January plus the distinct customers in February IS NOT the
      # distinct customers over both months, because anyone who bought in both has been counted
      # twice. That single fact explains, all at once: why you cannot pre-aggregate it into a
      # summary table, why a warehouse rollup gets it wrong, why it cannot be split across
      # workers or partitions cheaply, and why the query is slow.
      #
      # THEN THE MECHANISM, briefly: to count distinct values the engine must HOLD THEM ALL —
      # a hash set or a sort — so cost and memory scale with the number of DISTINCT values, not
      # with the answer. Past the memory grant it spills to disk and falls off a cliff. Several
      # COUNT(DISTINCT) expressions in one SELECT means several such sets at once, and some
      # engines handle that far worse than one.
      #
      # THE TECHNIQUES, portable first:
      #   ASK WHETHER IT MUST BE EXACT.   This is a business question, not a technical one, and
      #                                   the reader should be taught to ask it out loud.
      #   PRE-AGGREGATE TO A DISTINCT GRAIN.  Keep one row per (day, customer) — or a first-seen
      #                                   date per customer — and count over something far
      #                                   smaller. This is the honest exact answer.
      #   GROUP BY THEN COUNT.            SELECT COUNT(*) FROM (SELECT DISTINCT ...) sometimes
      #                                   plans better than COUNT(DISTINCT) on the same engine.
      #                                   Do not present it as a rule; present it as a thing to
      #                                   measure, with EXPLAIN from 20.
      #   APPROXIMATE IT.                 HyperLogLog: a fixed-size sketch, typically around one
      #                                   or two per cent error, and the size does not grow with
      #                                   the data.
      #
      # AND THE DEEP POINT ABOUT APPROXIMATION, which is what makes this worth an episode rather
      # than a footnote: SKETCHES MERGE. Two HLL sketches combine into the sketch of the union,
      # so an approximate distinct count IS decomposable — you can store one sketch per day and
      # answer any date range from them. Approximation does not merely make the query faster; it
      # gives back the property the exact aggregate lacks, which is the entire reason warehouses
      # use it.
      #
      # WHAT EACH ENGINE OFFERS, named and left there because the engine tracks own the detail:
      # Oracle and SQL Server both ship APPROX_COUNT_DISTINCT; PostgreSQL has no built-in and
      # uses the postgresql-hll extension; MySQL has nothing; ClickHouse's uniq family and
      # DuckDB's approx_count_distinct are why analytical engines answer this instantly.
      #
      # ONE LINE ON WINDOWS: COUNT(DISTINCT ...) OVER (...) is not supported on several engines,
      # which surprises people who reach for it after Series 2 · 35.
      #
      # KOANS: `predict` is the one that teaches the whole episode — given daily distinct counts,
      # predict whether summing them equals the monthly distinct count, then run both.
      # `count:scanned` to show what the exact version actually reads.
      #
      # WHAT GOES WRONG (beat 4): monthly active users computed by summing the daily active
      # users out of a summary table. Every returning customer is counted once per day they
      # visited, so the number is inflated — often by a lot — and it is inflated CONSISTENTLY,
      # which means the trend line still looks sensible and nobody questions it. It is the
      # cleanest example in the course of a number that is wrong and looks right.
      # BUILDS ON: 25 (why an index was never going to fix it), Series 1 · 25 (count(DISTINCT)),
      # Series 2 · 35 (COUNT(DISTINCT) OVER), 2 · 58 (the approximate-percentile pointer).
      - n: "27"
