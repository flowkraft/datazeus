# The ordered episode list for Learn SQL — the SINGLE source of truth for the roadmap.
#
# Anything that has to know "what are the episodes, in what order, and where are we"
# reads THIS file: the course page (/data-academy/learn-sql), the "you are here" roadmap
# card in each Remotion composition, and the lesson/koan folder names.
#
# ── THE ACADEMY-WIDE RULE ABOUT TOOLS ────────────────────────────────────────────────
# Every track teaches a SKILL and demonstrates it in a tool. Never the other way round.
# Learn SQL is not a CloudBeaver course, Python for Data is not a Jupyter course, BI is not a
# DataPallas course — even though DataPallas is what we demonstrate BI in, because it does the
# job and a bundled third-party app should never be reached for when it does.
#   TITLES name the skill, never a product's UI. Industry-standard library names (pandas, dbt,
#     pgvector, Spring) are fine — they travel with the reader. Proprietary UI names do not.
#   PROSE teaches the principle first, then shows it: "here is how you do that in <tool>".
#   EVERY EPISODE must leave the reader something true away from our tools. If an episode is
#     only true inside DataPallas, it is product documentation and belongs in content/docs.
#
# ── POINTING AT ANOTHER COURSE: NAME IT, EVERY TIME ──────────────────────────────────
# `excludes` and `prerequisites` render VERBATIM on the course page, under "Not here, on
# purpose" and "Where this leads". They are the only prose a learner reads that sends them to
# another course, so a reader must never have to work out which course a number belongs to.
#
#   OURS      "In this course, Series 3 · 05 loads a star somebody has already designed"
#   THEIRS    "covered in Data Modeling, Series 3 · 30"
#   NEVER     "covered in Data Modeling, Series 3 — Series 3 · 05 here LOADS a star"
#
# The last one was real, and there were twenty like it. Every one resolved to the correct
# episode and every one was unreadable: two courses' Series 3 in a sentence, with "here" doing
# the disambiguating. It also hid a genuine wrong-pointer bug — Learn SQL's ROLLUP line named
# Data Warehousing and then gave two BARE numbers, which therefore pointed at Learn SQL's own
# GROUP BY and Dates & Times. Both existed, so the resolve check passed green.
# CurriculumSpec now fails the build on a bare "Series N · MM" sitting beside another course's
# name. Two rules, and you need both: one proves the episode exists, this one proves a person
# can follow the sentence to it.
#
# ── CREDITING AN AUTHOR: THE TEST, THE TAG, THE COMMENT ──────────────────────────────
# Some episodes teach a named person's named framework. Those get attributed — in a tag the
# reader sees and a comment the writer reads. Most episodes do not, and should not.
#
# THE TEST, and it is the whole discipline:
#     WOULD A READER BENEFIT FROM BEING HANDED THAT AUTHOR'S BOOK?
#   yes  Kimball's accumulating snapshot, Linstedt's hubs and links, Evans' bounded context,
#        Tufte's lie factor, Cleveland & McGill's perception ranking. Named thing, one source.
#   no   normalization in general, joins, indexing, CDC, "choosing the right chart". Textbook
#        material with no canonical owner — and picking one author for it is worse than
#        picking none, because it is arbitrary AND it dilutes the tags that are real.
#
# TWO SIGNALS, DIFFERENT SHAPES, deliberately:
#   TAG      tags: ["tufte"] — ONE WORD, lowercase. It renders as #tufte on the course page,
#            so it must read well as a badge. Never `tufte:lie-factor`: the payoff is a source
#            landing page ("show me every Kimball episode"), and that only works if the string
#            is identical everywhere. Data Model Patterns chose this convention first.
#   COMMENT  # SOURCE (tufte): <the author's OWN term for what this teaches, plus the book>
#            One line, above the episode. The tag inside the parens is EXACTLY the tag value,
#            so grep "# SOURCE (" lists every attributed episode and the two cannot drift.
#            Authoring guidance, not biography — nobody writes a better episode for knowing
#            where Tufte was born.
#
# WHY THE VOCABULARY MATTERS MORE THAN THE CREDIT. The reason to teach a named framework
# instead of our own opinion is that it IS standard. Use the author's words — grain, bounded
# context, chartjunk, hub — and explain each plainly on first use. Never swap one for a
# plainer invented word, because the invented word exists nowhere else, and a reader who then
# opens the book will not recognise what they were taught.
#
# ── HOW TO CREDIT, AND STAY OUT OF TROUBLE ───────────────────────────────────────────
# Written down once so nobody has to re-reason it, and so nobody over-hedges either. The
# equivalent rules for software live in the Schema Teardowns header; this is the same idea
# applied to books and their authors.
#
# WHAT WE ARE ALLOWED TO DO, and why. A method, a process, a system or a fact is NOT
# copyrightable — only the EXPRESSION of it is. Teaching the accumulating snapshot, the bus
# matrix, hubs and links or the lie factor is teaching an idea, and ideas are free. That is
# the whole legal basis for this academy and it is solid. What is NOT ours is the author's
# particular words, their diagrams, their tables and their photographs.
#
#   DO    name the author and the book, in the prose, every time you use their term
#   DO    a Sources block at the foot of the article: author, title, edition, publisher,
#         year, ISBN. Link somewhere they can buy it
#   DO    quote SHORT passages when you are discussing them — a sentence, attributed inline.
#         That is commentary, and commentary is what makes a lesson worth reading
#   DO    draw every diagram OURSELVES, in our own visual language and colours
#   DO    use OUR datasets. Northwind, the library brief, our generated files — never the
#         author's own worked case study, which is their expression
#
#   DON'T reproduce a diagram, a table, a figure, or their figure numbering
#   DON'T quote at length. If a paragraph is doing the teaching, you have not written a
#         lesson, you have retyped a page
#   DON'T use the book COVER, the publisher's artwork, or a photo of the author. This is the
#         easy one to trip over because it looks natural on a card
#   DON'T follow their chapter order as if it were our syllabus
#   DON'T let a paraphrase stay close enough that a reader could diff it against the original
#
# TRADEMARKS — descriptive use, never branding. Same one-question test the Teardowns track
# uses: WOULD A READER THINK THE AUTHOR WROTE THIS, OR ENDORSED IT? If plainly no, naming
# them to identify their own method is nominative use and it is fine.
#
#   DO    "This is Kimball's accumulating snapshot", "Linstedt's hubs and links"
#   DON'T "The Official Kimball Course", "DataPallas Data Vault Edition", a
#         kimball.datapallas.com subdomain, or their name in OUR product or track name
#   DON'T imply certification, partnership or review by them
#
#   SPECIFICALLY: treat "Data Vault 2.0" as a mark — Dan Linstedt asserts one and runs a
#   certification programme around it, so the episode must read as "here is Linstedt's Data
#   Vault 2.0 method" and never as anything we are licensed or certified to deliver. Check
#   the current position before publishing rather than trusting this line; marks change.
#   "Kimball Group" is likewise a business name, not a generic term.
#
#   THE TAG PAGES have the same constraint. A future /tags/kimball page must read as "our
#   episodes about Kimball's methods" — never as a Kimball resource. Our masthead, our
#   typography, a disclaimer in the footer.
#
# DISCLAIMER — one line, in the article template of every attributed episode. Decided once:
#
#   "<Concept> is <Author>'s, from <Book> (<Publisher>, <Year>, ISBN <n>). This lesson is
#    independent, unaffiliated and not endorsed by the author or publisher. All diagrams and
#    examples here are our own."
#
# AND SAY WHERE THEY ARE NO LONGER RIGHT: an episode that pretends 1996 advice holds
# everywhere is worse than one that never cited anybody. Disagreeing with a named author,
# openly and with reasons, is also the clearest proof this is our writing and not theirs.
#
# course:  the topic slug — matches config/learning.ts AND each lesson's `topic` front-matter.
# track:   the folder + slug token (no hyphen); courses/<track>/ and the koan package.
# series:  ordered; `slug` is the folder name and the lesson's `module` front-matter.
# tagline: the one-line promise, shown under the series title on the roadmap card.
# level:   beginner | intermediate | advanced — a property of the SERIES, not the episode,
#          so it can't drift and never has to be guessed per lesson.
#
# EPISODE FIELDS
#   n       gap-numbered (00, 05, 10, …) so a new episode slots in without renumbering.
#   slug    the lesson folder is <n>-<slug>; the URL is /data-academy/<course>/<slug>.
#           MUST be unique across the whole course — the route drops the series.
#   title   "<SQL topic> — <hook>". The keywords lead, because someone scanning the course
#           TOC is asking "does this cover the stuff I need?" before anything else; the hook
#           follows to say why it matters. The course page renders the two halves as
#           bold + muted, so keep the " — " separator. For a PUBLISHED episode this must
#           match the lesson .mdx front-matter `title` (the MDX wins on the rendered page).
#   short   the compact label for the roadmap card, where the full title won't fit. The
#           topic half is IDENTICAL to `title` — only the hook is compressed — so the card
#           and the course page are scanned by the same keywords. Keep it under ~55 chars,
#           the width the card holds on one line. The Series 1 list is mirrored in the
#           video's TOC slide (the `toc.episodes` array in the Remotion composition):
#           change one and change the other.
#   core    true on the shortest path to being productive at work: Series 1 entire, plus the
#           Series 2 episodes you genuinely can't do the job without. Everything else is
#           worth learning and none of it blocks you from starting. The flag exists because
#           a 34-episode roadmap otherwise makes every learner guess which parts are
#           optional, and the ones who guess wrong quit — see the course page, which renders
#           it as "core", never as a gate and never by marking the rest "extra".
#   status  published — the .mdx exists, is published, and the video is live
#           planned   — on the roadmap, not built yet
#   tags    only labels that are already TRUE of an unwritten episode — "project" today,
#           meaning the episode where a series' whole argument gets applied. (It was
#           "capstone" until 2026-08-24; that is US-academia jargon, it renders as a
#           #badge to learners, and this course does not speak that way anywhere else.)
#
#           THE SLUGS FOLLOWED on 2026-08-24, and the reasoning that had deferred them is
#           worth keeping because it is what made the rename safe. A slug is an IDENTITY, not
#           a label — every derived ID at the foot of this header is built from it — so the
#           cost of churning one is not the URL, it is the mp4, the manifest key, the TTS
#           assets and the `dp-slug:` tag on an uploaded video. That cost is real ONLY for a
#           published episode. All fourteen were `status: planned`, so nothing downstream was
#           bound to them and the rename cost nothing.
#           They are now uniformly `project-*` — including the three that had carried the word
#           as a SUFFIX (`copilot-capstone`, `rag-capstone`, `reliability-capstone`), which is
#           why a plain find-and-replace would have produced `project-production-project`.
#           THE RULE THAT REMAINS: never rename a slug on a PUBLISHED episode for cosmetics.
#           Fix the label; leave the identity alone.
#           Topical tags belong in the lesson's own front-matter once it exists; guessing
#           them here just creates a second source of truth that drifts.
#   seed    bulk — needs the larger dataset (datasets/bulk/), not the 79-row Northwind.
#
# IDs are DERIVED, never repeated here: a lesson's Remotion composition, its mp4, the
# videos.manifest.json key, public/videos/<id>/, the TTS assets under cli-remotion's
# public/assets/rb/<id>/, and the `dp-slug:` tag on the uploaded YouTube video are all
# `<track>-<series-number>-<n>-<slug>` — e.g. learnsql-series1-00-start-here.
# Renaming a slug therefore means renaming all of those together.

course: learn-sql
track: learnsql
title: Learn SQL

# THE ENTRY POINT OF THE WHOLE ACADEMY — no prerequisites, deliberately, and the empty list
# is here rather than absent so that it reads as a decision instead of an oversight.
# Nothing before this: episode 00 assumes a person who has never written a query.
#
# What comes AFTER is Learn Data Modeling, which declares this track in its own
# `prerequisites` block (Series 1 entire, plus INSERT from Series 2 · 40). The two compose in
# that order: you get read access before you get DDL rights, in a career and in this academy.
prerequisites: []

# Scope decisions that a scanner would otherwise read as holes in the course. Rendered at
# the foot of the course page, so "missing" reads as "deliberate, and it lives over there".
excludes:
  - topic: "DDL, keys, constraints & normalization"
    where: "covered in Learn Data Modeling — it's schema design, not writing queries"
  # The reciprocal halves of three subjects this track and Data Modeling BOTH touch. Each
  # pair shares a keyword and is two different questions, which is precisely how a reader
  # concludes we repeated ourselves. Data Modeling's excludes carries the mirror of each.
  - topic: "Whether a column should be nullable at all"
    where: "covered in Data Modeling, Series 1 · 37, which is the design decision. In this course, Series 1 · 45 is what NULL does to a query"
  - topic: "Deciding to store JSON in the first place"
    where: "covered in Data Modeling, Series 2 · 42. In this course, Series 3 queries JSON once that decision has been made"
  - topic: "Choosing indexes while designing the schema"
    where: "covered in Data Modeling, Series 2 · 45. In this course, Series 3 is EXPLAIN and the mechanics, on a query that already exists"
  - topic: "Isolation levels, locking & concurrency"
    where: "covered in Data Ops, Series 2 — Running PostgreSQL in Production. In this course, Series 2 · 40 covers the COMMIT and ROLLBACK basics"
  - topic: "ROLLUP, CUBE, GROUPING SETS & OLAP cubes"
    where: "covered in Data Warehousing, Series 1 · 30 for the subtotal operators, and Data Warehousing, Series 2 · 20 for cubes"

series:
  - slug: series1-fundamentals
    title: SQL Fundamentals
    tagline: SELECT, WHERE, GROUP BY and your first JOIN
    level: beginner
    episodes:
      # The orientation episode: the SQL-thinking loop and one real query, but also the
      # toolchain — Northwind on PostgreSQL, CloudBeaver, DuckDB and the koans.
      - n: "00"
        slug: start-here
        title: "Start Here: The SQL Thinking Loop — Your First Query, CloudBeaver & the Koans"
        short: "Start Here: The SQL Thinking Loop — your first query"
        hands_on: ["koan:complete", "cloudbeaver"]
        core: true
        status: published
      - n: "05"
        slug: select-fetch-your-data
        title: "SELECT & Column Lists — Fetching a Table's Data"
        short: "SELECT & Column Lists — fetching a table's data"
        hands_on: ["koan:complete", "cloudbeaver"]
        core: true
        status: published
      # ADDED 2026-08-26, and it sits BEFORE WHERE on purpose. Episode 05 used to carry a
      # data-types arc — why a price prints as 18.0000, ROUND, information_schema, and the
      # DuckDB-vs-PostgreSQL type names. It was cut: the hook depends on trailing zeros that
      # CloudBeaver (the client this course tells you to open) trims away, and the catalog
      # query needs WHERE and ORDER BY, neither taught at lesson 2.
      #
      # But types are not a footnote to skip — they are the cause of the confusions beginners
      # actually hit, and episode 10 already improvises half of this ("'single quotes' for
      # text, numbers bare") because it has to. Teaching it here arms 10 instead.
      #
      # ORDER BY is still untaught at 07, so the catalog query is shown without it — it only
      # ever made the output tidier, and the lesson says the row order may differ.
      #
      # WHERE IS THE ONE EXCEPTION, decided 2026-08-27 while writing the episode. The brief
      # said to show the catalog query without WHERE too; in practice
      # `SELECT column_name, data_type FROM information_schema.columns` with no filter returns
      # every column of every table, which is not "less tidy", it is unusable. So the filter
      # is shown, and Mnemosyne names it as a line the next lesson explains. It pays for
      # itself twice: `WHERE table_name = 'Products'` is also the best demonstration in the
      # course of the single-vs-double quote rule, which is the other thing this episode
      # has to land before 10.
      #
      # The engine vocabulary (DECIMAL(19,4) vs numeric) stays in Series 4 · 00, and so does
      # the client-rendering trap: psql prints 18.0000, CloudBeaver shows 18. Same value.
      # 07 gives the vocabulary difference ONE line, because a learner running the koans on
      # DuckDB and the lesson on PostgreSQL sees two spellings on day one and needs to know
      # it is not a mistake.
      #
      # INTEGER DIVISION IS NOT TAUGHT HERE and must not be added: DuckDB answers 2.5 to
      # `SELECT 5/2`, PostgreSQL answers 2. Verified on both, 2026-08-27.
      - n: "07"
        slug: data-types
        title: "Data Types — What a Column Can Hold, and Why Results Surprise You"
        short: "Data Types — what a column can hold"
        hands_on: ["koan:predict", "koan:complete"]
        core: true
        status: published
      - n: "10"
        slug: where-filtering
        title: "WHERE, AND/OR/NOT, IN, BETWEEN — Keeping Only the Rows You Need"
        short: "WHERE, AND/OR/NOT, IN, BETWEEN — keep the rows you need"
        hands_on: ["koan:complete", "koan:predict"]
        core: true
        status: published
      # WRITTEN 2026-08-28. The episode earns its place on ONE failure: `LIMIT 5` with no
      # ORDER BY returns five real products at five real prices, raises nothing, and is not
      # a top five. On Northwind it hands you Aniseed Syrup at 10.0000 — the third CHEAPEST
      # product in the catalogue — inside a report headed "most expensive", while Thuringer
      # Rostbratwurst at 123.7900 is absent. A query that errors gets fixed in thirty
      # seconds; this one gets forwarded.
      #
      # THE SAME DEFECT IS TAUGHT THREE TIMES, at three depths, on purpose — it is the spine
      # of the episode rather than three separate warnings:
      #   1. no ORDER BY at all           -> five arbitrary rows
      #   2. an ORDER BY with a live tie  -> Scottish Longbreads and Gorgonzola Telino both
      #      cost 12.5000, so "the five cheapest" has an undecided fifth row and the promo
      #      list can change between runs. Fixed by a second sort key.
      #   3. OFFSET on an unstable sort   -> page two repeats a row from page one.
      #
      # NULL PLACEMENT IS THE OTHER HALF, and it is the one genuine cross-engine gotcha in
      # Series 1: 27 of the 79 orders have never shipped, and `ORDER BY "ShippedDate" DESC
      # LIMIT 5` returns the five most recent SHIPMENTS on DuckDB (nulls last) and five
      # orders that NEVER SHIPPED on PostgreSQL (null sorts high). Both legal, both correct,
      # and the slide exists so a learner meets that before production does. Asserted per
      # engine by OrderByAndTopNSpec; NULLS LAST is then asserted identical on both.
      #
      # "WHO IS YOUR #1 CUSTOMER?" — episode 10 closes on that line, and this episode does
      # NOT answer it, deliberately. Ranking customers by revenue needs SUM and a JOIN, which
      # are episodes 25 and 40. Mnemosyne says so plainly and reframes it into the question
      # ORDER BY actually forces you to answer — "number one BY WHAT column?" — which is the
      # most useful thing a data person can ask when handed a vague request.
      #
      # NOT TAUGHT HERE, and each was considered: ORDER BY <ordinal> and sorting by an
      # unselected column are in the article as "know it, don't write it" and in the deck,
      # but not in the video — they are reading skills, not doing skills. Collation and case
      # sensitivity are out entirely: the behaviour differs by engine AND by install, so no
      # claim would survive the dual-engine gate. Keyset pagination and what OFFSET costs on
      # a large table are Series 3 · 20.
      - n: "15"
        slug: order-by-and-top-n
        title: "ORDER BY, LIMIT & FETCH FIRST — Sorting Rows and Keeping the Top Few"
        short: "ORDER BY, LIMIT & FETCH FIRST — sort and keep the top"
        hands_on: ["koan:complete", "koan:predict"]
        core: true
        status: published
      - n: "20"
        slug: distinct-aliases-expressions
        title: "Aliases, Expressions & DISTINCT — Make Messy Output Look Like a Report"
        short: "Aliases, Expressions & DISTINCT — output like a report"
        hands_on: ["koan:complete", "koan:diagnose"]
        core: true
        status: planned
      - n: "25"
        slug: aggregate-functions
        title: "COUNT, SUM, AVG, MIN, MAX — Turning Many Rows Into One Number"
        short: "COUNT, SUM, AVG, MIN, MAX — many rows, one number"
        hands_on: ["koan:complete", "koan:predict"]
        core: true
        status: planned
      - n: "30"
        slug: group-by
        title: "GROUP BY — One Number per Customer, per Month, per Anything"
        short: "GROUP BY — one number per group"
        hands_on: ["koan:complete", "koan:predict"]
        core: true
        status: planned
      # Closes the aggregation arc inside Series 1 — grouping you can't filter is half a tool.
      - n: "35"
        slug: having-vs-where
        title: "HAVING vs WHERE — Why WHERE Can't Filter Your Totals"
        short: "HAVING vs WHERE — why WHERE can't filter totals"
        hands_on: ["koan:diagnose", "koan:predict"]
        core: true
        status: planned
      - n: "40"
        slug: joins
        title: "JOINs: INNER, LEFT, RIGHT, FULL — Combining Rows From Two Tables"
        short: "JOINs: INNER, LEFT, RIGHT, FULL — rows from two tables"
        hands_on: ["koan:predict", "koan:complete"]
        core: true
        status: planned
      # Sits AFTER the JOINs episode on purpose: the learner has just manufactured NULLs
      # with a LEFT JOIN, so `WHERE col = NULL` returning nothing is demonstrable on data
      # they made themselves rather than an abstract note next to the data types.
      #
      # MUST close the loop back to episode 25, which taught the aggregates twenty episodes
      # earlier and therefore taught them NULL-unaware: COUNT(col) skips NULLs while
      # COUNT(*) doesn't, and AVG divides by the non-NULL count, so it is NOT the SUM over
      # the row count. That gap is a wrong-number-in-a-report bug, not a curiosity.
      # SOURCE (codd): THREE-VALUED LOGIC — true, false, unknown — comes from Codd's relational model.
      - n: "45"
        slug: null-and-three-valued-logic
        title: "NULL & Three-Valued Logic — How Missing Values Change Your Results"
        tags: ["codd"]
        credits:
          - source: codd
            concept: "THREE-VALUED LOGIC — true, false, unknown — comes from Codd's relational model"
        short: "NULL & Three-Valued Logic — how missing values count"
        hands_on: ["koan:predict", "koan:diagnose"]
        core: true
        status: planned
      - n: "50"
        slug: your-first-real-report
        title: "SELECT + JOIN + GROUP BY — Building Your First Real Report"
        short: "SELECT + JOIN + GROUP BY — your first real report"
        hands_on: ["koan:author", "cloudbeaver"]
        core: true
        tags: ["project"]
        status: planned

  - slug: series2-intermediate
    title: Intermediate SQL
    tagline: CTEs, subqueries and window functions on real questions
    level: intermediate
    episodes:
      # Opens the series by POSING the question that 05 and 06 answer: count the rows before
      # the join and after it. When that number moves, every total built on top is already
      # wrong. Without this beat the episode is just "the same JOIN, with more tables".
      - n: "00"
        slug: multi-table-joins
        title: "Multi-Table JOINs — Following the Data Across Three or More Tables"
        short: "Multi-Table JOINs — three or more tables"
        hands_on: ["koan:complete", "koan:predict"]
        core: true
        status: planned
      - n: "05"
        slug: subqueries
        title: "Subqueries & EXISTS — Using One Query's Result Inside Another"
        short: "Subqueries & EXISTS — one query inside another"
        hands_on: ["koan:complete", "koan:choose"]
        core: true
        status: planned
      # The trap JOINs create, paired with them the way NULL is paired with LEFT JOIN in
      # Series 1. It lands HERE rather than beside episode 00 because the fix is a
      # pre-aggregating subquery, and that is episode 05 — teach the bug where the cure is.
      #
      # Frame it as GRAIN ("one row per WHAT?"), not as a join gotcha. Grain is the idea
      # behind correct numbers everywhere; "watch out for duplicate rows" teaches neither.
      #
      # THREE tracks collect on this later, and it is worth naming all three so nobody thinks
      # it is a local trick: Data Modeling Series 1 · 10 teaches grain from the DESIGN side
      # (what should one row be, before the table exists — the mirror of this episode, which
      # is the QUERY side: what did one row become after you joined). Data Warehousing and
      # Analytics Engineering with dbt both build on it again for fact tables and model tests.
      - n: "06"
        slug: join-fan-out
        title: "Join Fan-Out & Grain — When a Join Silently Multiplies Your Rows"
        short: "Join Fan-Out & Grain — when a join multiplies rows"
        hands_on: ["koan:predict", "koan:diagnose"]
        core: true
        status: planned
      # Moved up from Series 3. A CTE is a READABILITY tool, not an advanced feature, and
      # holding it back meant every query in this series got written as a nested subquery
      # the learner would later have to unlearn. From here on, everything uses WITH.
      #
      # The motivation is free at this point: the pre-aggregating subquery from 06 works and
      # is unreadable. "Name it, then use the name" is the whole lesson.
      - n: "08"
        slug: ctes
        title: "CTEs (WITH) — Breaking a Long Query Into Named Steps"
        short: "CTEs (WITH) — a long query, in named steps"
        hands_on: ["koan:equivalent", "koan:complete"]
        core: true
        status: planned
      - n: "10"
        slug: self-joins-and-hierarchies
        title: "Self-JOINs & Hierarchies — Relating Rows to Other Rows in the Same Table"
        short: "Self-JOINs & Hierarchies — rows in the same table"
        hands_on: ["koan:complete"]
        status: planned
      - n: "15"
        slug: case-expressions
        title: "CASE — SQL's If/Then for Labels & Buckets"
        short: "CASE — SQL's if/then for labels & buckets"
        hands_on: ["koan:complete", "koan:predict"]
        core: true
        status: planned
      - n: "20"
        slug: dates-and-times
        title: "Dates & Times — Getting Ranges and Boundaries Right"
        short: "Dates & Times — ranges and boundaries"
        hands_on: ["koan:predict", "koan:diagnose"]
        core: true
        status: planned
      # One episode, not two: pattern matching and the string/number helpers are both
      # "functions for data nobody cleaned", and both are reference material a working
      # person looks up rather than memorises. Ships with a cheat sheet and covers the
      # number side too — ROUND, CAST and the formatting a report actually needs.
      - n: "25"
