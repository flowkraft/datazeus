      #   (Rewritten on Northwind Company S at step C, 2026-09-17.)
      - n: "00"
        slug: subqueries
        title: "Subqueries — Using One Query's Result Inside Another"
        short: "Subqueries — one query's result inside another"
        hands_on: ["koan:predict", "koan:complete"]
        core: true
        status: planned
        data:
          source: northwind_co_s
          tables: ["Products", "Categories", "Customers", "Orders", "Order Details", "Invoices"]
          fit: good
          reason: "The 10,000-order, 80-product, 120-customer seed supports scalar, IN, and FROM subqueries and the ordered-versus-invoiced comparison. Minimum: about 20 products, 12 customers, 40 orders, and 80 order lines with at least one multi-row category and one customer above/below the computed average."
      # THE GENTLEST EPISODE IN THE SERIES, on purpose, straight after the opener: one construct
      # that extends two Series 1 skills — an expression in the select list (1 · 20) and an
      # aggregate over a group (1 · 25, 1 · 30).
      #
      # CASE INSIDE SUM IS THE TRICK WORTH THE EPISODE: one query, several conditional totals —
      # every order and one column per "Status" (Shipped / Cancelled / Open) per sales channel, side
      # by side (Sales rep: 3749 orders, 3669 shipped, 61 cancelled, 19 open). That is how a report
      # with a column per status gets built. The share of it, written SUM(CASE …) / count(*), is 0 for
      # every channel on PostgreSQL; 100.0 * first gives 1.6 … 2.2, and the channel with the most
      # cancellations has the lowest share — a share travels with its count (company 1.8).
      #
      # THE TRAP: a CASE with no ELSE hands back NULL for every row it does not name. Label freight
      # over 50 as 'heavy' and nothing else, and 5617 of the 10000 orders carry no label at all — which
      # Series 1 · 45's rules then drop from every comparison and every count(column). It comes back
      # in the short form: CASE "ShipVia" written with Series 1's three couriers leaves the fourth
      # courier's 511 orders NULL — the reason a JOIN beats CASE when the label is stored.
      # COALESCE is Series 1 · 45's; name it here in one line as the CASE it abbreviates.
      # SETS UP: 50 (the GROUPING() labelling idiom is a CASE) and Series 3 · 00 (the portable pivot).
      # WORKPLACE: label and bucket rows; one column per status with conditional counts and sums; percentages
      #   that do not come back as 0 (integer division); always write the ELSE.
      # STORY (map 2026-09-17) — SEGMENT, written at step C: per courier, 2024 orders marked 'Shipped' with no
      #   "ShippedDate", a share with 100.0 * — Speedy Express 178 of 1768 (10.1), the other three 0 of 630.
      #   One query, one finding: it is one courier. The freight bands and both ELSE traps keep their own examples.
      - n: "05"
        slug: case-expressions
        title: "CASE — SQL's If/Then for Labels & Buckets"
        short: "CASE — SQL's if/then for labels & buckets"
        hands_on: ["koan:complete", "koan:predict"]
        core: true
        status: planned
        data:
          source: northwind_co_s
          tables: ["Orders", "Shippers", "Customers"]
          fit: good
          reason: "Orders contain varied freight, four shippers, statuses, and channels, which make row labels, buckets, conditional counts, percentages, and ELSE/NULL behavior observable. Minimum: 30 orders spanning all three freight bands, three statuses, and two channels; Shippers is needed for the stored-label comparison."
      # MOVED UP FROM 20 ON 2026-09-14. It adds one tool to three Series 1 skills — the half-open
      # range of 1 · 10, EXTRACT from 1 · 30, and the date arithmetic 1 · 45 used on trust — and two
      # later episodes need it: 15 (a monthly report needs a clean month boundary) and 45
      # (month-over-month needs date_trunc).
      #
      # DATE ARITHMETIC IS PART OF THIS EPISODE, not a footnote — the same competitor audit
      # (2026-09-02) found three of sixty episodes spent on it, which is a fair signal that
      # beginners get stuck. On the shipped data "OrderDate" is a TIMESTAMP: timestamp minus
      # timestamp is an INTERVAL, and CAST(… AS DATE) minus CAST(… AS DATE) is a whole number of
      # days. That is what makes "days to ship" go wrong, and it is why Series 1 · 45 cast both
      # sides — this episode owes the explanation that one borrowed. AGE() too, with the caveat
      # that it is PostgreSQL's own (and averaging an INTERVAL: PostgreSQL does, the koans' DuckDB refuses).
      #
      # ON NORTHWIND COMPANY S (step C, 2026-09-17; every figure asserted by DatesAndTimesSpec on both engines):
      # THE EARN — EXTRACT(MONTH) over five years puts 739 orders in "June" (120 + 130 + 144 + 168 + 177)
      # when no real month ever passed 277; date_trunc gives 60 months, 90 to 277.
      # PARTIAL PERIODS — the data runs 2020-01-01 (a Wednesday) to 2024-12-31 (a Tuesday), so every month,
      # quarter and year is whole; the honest partial periods are WEEKS: date_trunc('week') labels the first
      # week 2019-12-30 (5 days) and the last 2024-12-30 (2 days, 20 orders after a week of 60 — a "crash").
      # Ask for min/max and say so on the report — the beat Series 1 · 30 made about June.
      # BETWEEN'S BOUNDARY — November 2024 BETWEEN '11-01' AND '12-01' is 277 and December's BETWEEN starts on
      # '12-01' (236): the 14 shipments of 1 December are in both; half-open November is 263. Ending on the
      # 30th instead is REAL here: "OrderDate"/"ShippedDate" are midnight, but "CreatedAt" has a time of day,
      # so BETWEEN … '11-30' on it drops the 7 orders keyed in on 30 November (271 against 278).
      #
      # THE MISSING PERIODS — A REPORT WITH HOLES IN IT. Series 1 · 30 closed a beat on "a zero is a
      # fact; a missing row is a silence", and nothing has paid it off since. The company has orders on
      # almost every day, so the example is ONE CUSTOMER: Bramble Supermarket (BRAM3) per month in 2024
      # comes back as 4 rows, and a chart drawn from it hides the 8 months with no orders. The fix is a
      # DATE SPINE — every month, generated with generate_series (a calendar table is the same idea,
      # stored) — with the orders LEFT JOINed onto it, the customer's condition in the ON (Series 1 · 40).
      # THE TRAP INSIDE THE FIX: count(*) over that LEFT JOIN reports 14 — six order rows plus one row per
      # empty month — while count(o."OrderID") reports the real 6, with 8 zeros: Series 1 · 25's count(*)
      # against count(column), exactly where it costs the most.
      # PORTABILITY, in one line: generate_series is PostgreSQL's and DuckDB's (DuckDB returns TIMESTAMPs
      # even from DATE arguments); SQL Server and MySQL spell it differently, and a recursive CTE
      # (Series 3 · 10) builds the same spine anywhere. Series 4 owns the spellings.
      # WORKPLACE: group by real months, half-open ranges, partial periods, days between dates, anchoring
      #   "recent" on the data, filling periods that have no rows.
      # STORY (map 2026-09-17) — SEGMENT, written (step C): date_trunc('week') over 2024 with 05's SUM(CASE …)
      #   on 'Shipped' orders with no ship date — 0 a week until the week of 2024-03-04, then 3–12 every week
      #   to the week of 2024-08-26, then 0 (1 once, in October). Every week has orders, so the conditional
      #   count keeps the zeros. One query, one finding: it started and it stopped. The five Junes, BETWEEN's
      #   boundary and the spine stay the lesson.
      - n: "10"
        slug: dates-and-times
        title: "Dates & Times — Getting Ranges and Boundaries Right"
        short: "Dates & Times — ranges and boundaries"
        hands_on: ["koan:predict", "koan:diagnose"]
        core: true
        status: planned
        data:
          source: northwind_co_s
          tables: ["Orders.OrderDate", "Orders.ShippedDate", "Orders.CreatedAt"]
          fit: good
          reason: "Five complete years provide repeated months, partial boundary weeks, a midnight shipping date, a time-bearing CreatedAt, and genuine missing months for a customer spine. Minimum: 24 months of orders across two years, one partial period at each edge, timestamps, and one customer with at least three empty months."
      # MERGED 2026-09-14 FROM OLD 00 (multi-table-joins) AND OLD 06 (join-fan-out) — see the
      # series note above. Series 1 · 50 already owns the three-table chain, counting rows before
      # and after a join, grain and count(DISTINCT). DO NOT RE-TEACH THEM: open on them as known,
      # and teach the two ways a join is WRONG that Series 1 · 50 deliberately left out.
      #
      #   1. A JOIN THAT DROPS ROWS. The Dairy manager's report, "every Dairy product (category 4), and
      #      the units it sold in May 2024": "Products" LEFT JOIN "Order Details", then an INNER JOIN to
      #      "Orders" narrowed to May. The inner join discards every line with no May order, and with it
      #      every product the LEFT JOIN kept — 7 rows back, 3 of the 10 products gone, exactly the three
      #      she asked about. Series 1 · 40's ON-versus-WHERE trap, one table further along. The obvious
      #      repair, LEFT all the way down, brings the 10 products back and sums EVERY line they ever
      #      sold: 109446 units, where May was 1891.
      #      WHY ONE CATEGORY IN ONE MONTH: every product sells over five years, and any whole month of
      #      2024 sells 60 to 69 of the 80 products — a result nobody reads on a card.
      #   2. A JOIN THAT MULTIPLIES THE MONEY. An order-level column summed after joining to order
      #      lines, per customer for May 2024: Nordic Foods' 480.29 becomes 2149.26 (four big orders,
      #      15 lines), and "number one by freight" moves from Alpine Provisions (610.83, thirteen small
      #      orders) to Nordic Foods, fifth over "Orders" alone. Nothing errors. (Over all five years the
      #      fan-out leaves number one where it is, so the report is a month.) Across the company,
      #      sum("Freight") is 527429.46 over "Orders" and 1712919.25 over the joined rows.
      #      THE TEMPTING FIX IS VISIBLY WRONG ON THIS DATA. SUM(DISTINCT "Freight") returns 391726.53,
      #      135702.93 short, because 10000 orders share only 6689 freight values. It sums distinct
      #      VALUES, not distinct ORDERS: two orders at the same freight are counted once. Series 1 · 50
      #      has just taught DISTINCT as the one-word repair, so the episode shows it failing on the
      #      real table (on May alone it is only 140.41 short — the error nobody notices), and a koan
      #      breaks it on three orders written into the query.
      #
      # ONE CURE FOR BOTH: narrow or aggregate BEFORE the join — a subquery in FROM, from 00.
      # "Products" LEFT JOIN (May's lines, summed per product) returns all 10 Dairy products, 7 of them
      # with a May quantity, totalling 1891, and 3 NULL. Freight summed per customer over "Orders" alone,
      # then joined, puts Alpine Provisions back on top, and every sales total is unchanged. The cure
      # writes May's range twice — 20 (CTEs) writes it once.
