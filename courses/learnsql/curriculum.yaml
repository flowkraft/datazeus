    episodes:
      # OPENS THE SERIES ON SERIES 1 · 50's LAST LINE — "queries built out of other queries" — and
      # on that report's next question: WHICH CUSTOMERS SPEND MORE THAN THE AVERAGE CUSTOMER?
      # IT ALSO OWNS THE SERIES SETUP: why Series 2 runs on Northwind Company, how to install it once
      # from the Seed Data tab, and `SET search_path TO northwind_co_s` (05–60 link back to it).
      #
      # THE QUESTION CARRIES A TRAP THAT MAKES THE TOOL NECESSARY, NOT DECORATIVE. avg() over the
      # joined rows of Series 1 · 50's query is the average ORDER LINE, 595.13, so 118 of the 119
      # customers who ever ordered are "above average" (the one below has bought two lines in five
      # years, 465.75 — the proof). The average CUSTOMER needs the per-customer totals first — a
      # subquery in FROM — and it is 126193.54, which 30 customers beat. It is Series 1 · 50's grain
      # arriving through a HAVING, and it is answered with a query inside a query.
      #
      # THE UNCORRELATED HALF ONLY, three shapes by what the brackets hand back:
      #   a VALUE   scalar subquery      products dearer than the average price (30 of 80; avg 24.01)
      #   a LIST    IN (SELECT …)        customers who bought the discontinued Royal Raisins in 2024
      #                                  (8 customers; the join gives 9 rows)
      #   a TABLE   subquery in FROM     the per-customer totals the hook needs
      # EXISTS, NOT EXISTS and correlated subqueries are 25, after CTEs. Do not preview them here.
      # THE QUIET FAILURE IS 00's (added 2026-09-30): after the loud "more than one row" error, the same query
      # with category 9 -- which has no products -- returns 0 rows and NO error, because an empty subquery hands
      # back NULL and nothing is greater than NULL. It reuses the MAX query and ends on "run the inside alone".
      # NOT IN with a NULL in the list, and ANY / ALL, are NOT here: both are 25's (see its brief).
      # BUILDS ON: Series 1 · 25 (aggregates), 1 · 30 (GROUP BY), 1 · 50 (the report and its grain).
      # WORKPLACE: compare each row with a number the data computes (an average, a maximum); filter by a list
      #   another query produces; query a query's result; check what the inside query's rows are first.
      # LADDER (2026-09-21) — she opens, she states the limit (bottom rung). What HE owns is the last line:
      #   he turns his manager's complaint into his own question, and no later episode takes it back off him.
      # STORY (map 2026-09-17) — SEGMENT, the opening: two value subqueries side by side — 2024 ordered sales
      #   3628572.55 vs invoiced sales 3190372.69 (the manager's note: orders up 10%, invoicing down — said, not
      #   computed). Neither total is wrong: demand vs what was billed. Why did invoicing fall while orders grew?
      #   (Rewritten on Northwind Company S at step C, 2026-09-17.)
      - n: "00"
        slug: subqueries
        title: "Subqueries — Using One Query's Result Inside Another"
        short: "Subqueries — one query's result inside another"
        hands_on: ["koan:predict", "koan:complete"]
        core: true
        status: planned
        data:
          source: northwind_co_s
          tables: ["Products", "Categories", "Customers", "Orders", "Order Details", "Invoices"]
          fit: good
          reason: "The 10,000-order, 80-product, 120-customer seed supports scalar, IN, and FROM subqueries and the ordered-versus-invoiced comparison. Minimum: about 20 products, 12 customers, 40 orders, and 80 order lines with at least one multi-row category and one customer above/below the computed average."
      # THE GENTLEST EPISODE IN THE SERIES, on purpose, straight after the opener: one construct
      # that extends two Series 1 skills — an expression in the select list (1 · 20) and an
      # aggregate over a group (1 · 25, 1 · 30).
      #
      # CASE INSIDE SUM IS THE TRICK WORTH THE EPISODE: one query, several conditional totals —
      # every order and one column per "Status" (Shipped / Cancelled / Open) per sales channel, side
      # by side (Sales rep: 3749 orders, 3669 shipped, 61 cancelled, 19 open). That is how a report
