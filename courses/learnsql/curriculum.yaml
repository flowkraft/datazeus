    #   08 → 20 · 10 → 42 · 15 → 05 · 20 → 10 · 25 → 30 · 40 → 48
    #   35, 38, 45, 50, 55, 58 and 60 kept their numbers.
    #   REORDERED 2026-09-15, before any of them was written (slugs unchanged):
