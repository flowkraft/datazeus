      # NEW 2026-09-07, and it closes a promise this file made and never kept: the GROUP BY
      # comment in Series 1 · 30 says GROUPING SETS, ROLLUP and CUBE "are later series", and no
      # later series of THIS course delivered them.
      #
      # CORRECTION, 2026-09-07, recorded because the first version of this comment claimed they
      # appeared nowhere in the academy and that was FALSE — a truncated grep, believed. Data
      # Warehousing, Series 1 · 30 is "ROLLUP, CUBE & GROUPING SETS — Subtotals the Standard
      # Way" and has been all along.
      # THE EPISODE STILL BELONGS HERE, and the seam is clean: THIS course owns the SQL, so a
      # reader learning to write queries meets the syntax here, on Northwind, with UNION ALL
      # fresh from 48. DATA WAREHOUSING owns the same keywords as a WAREHOUSING move — subtotals
      # over a star schema, beside slice, dice, roll-up and drill-down, for a reader who is
      # there to build a warehouse rather than to learn SQL. Neither is redundant, and that
      # course's episode may assume this one.
      #
      # PLACED AT 50, DIRECTLY AFTER UNION (48), and the order is the argument. The reader has
      # just learnt to stack result sets, so they can feel what this replaces: the report with
      # per-category totals, per-category-per-quarter totals and a grand total, written as three
      # queries stitched together with UNION ALL — three passes over the same table to produce
      # one report. THIS IS THE ONE-PASS VERSION, and that is the whole reason the feature
      # exists rather than a syntax curiosity.
      #
      # COVER:
      #   GROUPING SETS   the explicit list — you name each grouping you want, and the engine
      #                   reads the source once. Start here rather than with ROLLUP, because it
      #                   is the general form and the other two are shorthands for it.
      #   ROLLUP(a,b,c)   the hierarchical shorthand: (a,b,c), (a,b), (a), (). Made for natural
      #                   hierarchies — year/quarter/month, country/region/city — where each
      #                   level's subtotal is wanted and the diagonal ones are not.
      #   CUBE(a,b)       every combination, 2^n of them. Say the cost out loud: CUBE over four
      #                   columns is sixteen groupings, and most reports want three of them.
      #
      # THE TRAP, AND IT IS THE REASON THIS IS NOT A SYNTAX TOUR:
      # A SUBTOTAL ROW CARRIES NULL IN THE COLUMN IT IS TOTALLING OVER, and that NULL is
      # indistinguishable from a real NULL in the data. A report over a table where region is
      # sometimes blank will show two rows that look identical and mean completely different
      # things — one is "the rows with no region", the other is "all regions". Nothing warns you.
      # NORTHWIND COMPANY HAS THE REAL NULL ALREADY (checked 2026-09-19): "Region" is filled for the 15
      # customers in the USA, Canada and Brazil and empty for the other 105, so the collision can be shown on shipped data without inventing any.
      #   GROUPING(col)  returns 1 for the superaggregate NULL and 0 otherwise. This is the
      #                  distinguisher, and it exists for exactly this problem.
      #   GROUPING_ID()  packs several of them into one number, for ordering and filtering.
      #   THE LABELLING IDIOM to leave them with — a CASE, from 05:
      #     CASE WHEN GROUPING(category) = 1 THEN 'All categories' ELSE category END
      # It is Series 1 · 45's three-valued logic arriving through a door nobody is watching, and
      # that callback should be explicit.
      #
      # ORDER BY over grouping sets, briefly — a result with subtotals interleaved is unreadable
      # unless you sort it deliberately, usually by GROUPING_ID then by the columns.
      #
      # PORTABILITY, stated here rather than deferred, because a reader on MySQL will otherwise
      # type something that does not parse: PostgreSQL, Oracle, SQL Server and Db2 have all
      # three. MYSQL HAS ONLY `GROUP BY ... WITH ROLLUP` — a suffix rather than a function, no
      # GROUPING SETS and no CUBE — with GROUPING() available from 8.0. Series 4 owns dialect
      # differences and this is a pointer, not a second lesson.
      #
      # KOANS: `equivalent` is the spine — write the UNION ALL version and the GROUPING SETS
      # version and prove they return the same rows. `predict` on where the NULLs land, because
      # nobody gets that right first time.
      #
      # WHAT GOES WRONG (beat 4): the total that is right and the subtotal that is not. Somebody
      # UNIONed the detail and the grand total, then added a category filter to only one half —
      # or read a real NULL region as the "all regions" row and reported the same money twice.
      # THIRD, AND THE MOST COMMON OF THE THREE, ADDED 2026-09-21: THE MEASURE WAS SUMMED AT THE
      # WRONG GRAIN. This episode's tables span two of them — Freight lives on "Orders", the
      # amounts live on "Order Details" — so a ROLLUP over a join of the two multiplies every
      # freight figure by that order's line count. RE-MEASURED 2026-09-22 (the 2026-09-21 figures no
      # longer reproduce -- the 25,233-row join is unchanged, so it is the Freight column that moved
      # in a later build; use these): SUM("Freight") is 693,052.88 at order grain and 2,161,332.75
      # across the 25,233-row line join — 3.12x too big — AND PER COUNTRY THE FACTOR IS NOT EVEN
      # CONSTANT (Germany 3.23, Mexico 3.22, Brazil 3.15, Finland 3.13, Spain 3.04, USA 3.04),
      # because a bigger order carries both more freight and more lines. So every subtotal
      # is wrong by a DIFFERENT amount and they all still add up to the grand total, which is
      # precisely why nobody catches it. It is Series 2 · 15's grain, and this is the first
      # episode since 22 that puts it back in front of the reader — say so.
      # All three look plausible on a slide, which is how they survive.
      # WORKPLACE: subtotals and a grand total in one query; label and sort the subtotal rows. ROLLUP, GROUPING
      #   SETS and GROUPING() are the workplace part; CUBE's 2^n and GROUPING_ID get a line each.
      # STORY (map 2026-09-17) — NONE. The real NULL vs the subtotal NULL on "Customers"."Region" (the dataset plants
      #   some regions).
