      # The only episode that writes data — placed late, once filtering is second nature.
      # COMMIT/ROLLBACK basics live here; isolation levels belong to a future ops track.
      # Renumbered from 40 to 48 on 2026-09-14 and to 55 on 2026-09-15, still after the views: its
      # place is "late", not any particular neighbour. In the case it is the fix, so it follows the
      # evidence (45) and the twist (50). It needs only Series 1 skills.
      #
      # UPSERT MOVED TO ITS OWN EPISODE, 56, ON 2026-09-19: this one carried INSERT in three forms,
      # UPDATE from a list, DELETE, transactions, both ON CONFLICT forms and the story's main example.
      # It keeps the writes, the transaction and the story; 56 takes ON CONFLICT and MERGE. The
      # reasoning for teaching upsert on the core path is in 56's comment.
