    # ── REORDERED 2026-09-14, FOR A FAIR DIFFICULTY RAMP ───────────────────────────────────────
    # The 2026-08-24 order opened on the two hardest episodes of the series back to back — a
    # "Subqueries & EXISTS" episode carrying scalar subqueries, IN, EXISTS, correlated subqueries,
    # the NOT IN / NULL trap and a correlated HAVING, and then a multi-table JOIN episode — and only
    # afterwards reached CASE, dates and strings, each of which adds ONE tool to a Series 1 skill.
    # For the first third of the series the difficulty ran downhill. Three changes fix it:
    #
    #   1. SUBQUERIES ARE SPLIT IN TWO. 00 is the uncorrelated half only: a query in brackets hands
    #      back a value, a list or a table. 25 is EXISTS, NOT EXISTS and correlated subqueries,
    #      placed after CTEs so correlation is met with the tool that makes it readable.
    #   2. OLD 00 (MULTI-TABLE JOINS) AND OLD 06 (JOIN FAN-OUT) ARE ONE EPISODE, 15. Both briefs
    #      predate Series 1 · 50 (built 2026-09-12..14), which already teaches the three-table
    #      chain, counting rows before and after a join, grain and count(DISTINCT). What old 00 had
    #      left was a fourth hop and join order — and for inner joins the order changes nothing in
    #      the result — so it could not stand as an episode. What remains of both is ONE idea: a
    #      join that silently DROPS rows or MULTIPLIES the money, cured in both cases by narrowing
    #      or aggregating BEFORE the join, which is 00's tool.
    #   3. THE ONE-TOOL EPISODES MOVED FORWARD, AND BETWEEN THE HARD ONES. CASE (05) and dates (10)
    #      follow the opener; strings (40) is the breather between the two window-function episodes.
    #   4. WINDOW FUNCTIONS MOVED TO THE MIDDLE (2026-09-15). They are the most-used intermediate skill,
    #      and at 50 and 55 anyone who stopped two-thirds of the way never met them, while the series
    #      ended on three ●●●● episodes back to back. Now self-joins (30) put a row beside another row
    #      the hard way, Window Functions I (35) replaces that, strings (40) is the breather, and Window
    #      Functions II (45) follows. The case's second question runs forward too: the reorder evidence
    #      (45) and the twist (50) come before the fix (55), not after it.
    #
    # THE RAMP — ● easy, ●●●● hard — and the rule behind it: EVERY EPISODE USES ONLY WHAT CAME
    # BEFORE IT. Each episode's comment below names what it builds on.
    #   00 Subqueries ●●          05 CASE ●                 10 Dates & Times ●●
    #   15 JOINs & Grain ●●●      20 CTEs ●●                22 Views ●●
    #   25 EXISTS & correlated ●●● 30 Self-joins ●●         35 Windows I ●●●●
    #   40 Strings & regex ●      45 Windows II ●●●●        48 Set operations ●●
    #   50 Grouping sets ●●●      55 INSERT/UPDATE/DELETE ●●  58 Median ●●●●    60 Project
