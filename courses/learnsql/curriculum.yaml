      # NEW 2026-09-07. The episode a reader can use on the day they read it.
      #
      # COVER, in this order, because each part explains the next:
      #
      #   1. THE LOGICAL PROCESSING ORDER, and it is the spine of the whole episode:
      #        FROM/JOIN -> WHERE -> GROUP BY -> HAVING -> SELECT -> DISTINCT -> ORDER BY -> LIMIT
      #      NOT the order you write it in. Three things the reader has already met stop being
      #      arbitrary the moment they see this: why a SELECT alias cannot be used in WHERE
      #      (Series 1 · 20), why HAVING sees groups and WHERE sees rows (Series 1 · 35), and
      #      why LIMIT cannot rescue an ORDER BY that has to sort everything first.
      #      TEACH THE ORDER AS A COST DIAGRAM, not as trivia: every stage does work on whatever
      #      the stage before it handed over, so the earlier you remove a row, the less every
      #      later stage does.
      #
      #   2. FILTER EARLY. A predicate on a non-aggregated column belongs in WHERE. Put it in
      #      HAVING instead and the engine builds every group and then throws most of them away
      #      — same answer, much more work. Series 1 · 35 taught which one is CORRECT; this is
      #      the first time the course says which one is CHEAP, and the pair is the episode's
      #      cleanest before-and-after.
      #      Same idea across a join: a predicate that can be applied to one table before the
      #      join usually should be, and the reader should be able to say why.
      #
      #   3. SARGABILITY — give them the word, because it is what they will have to search for,
      #      and then reduce it to one rule: DO NOT WRAP THE COLUMN. An index is on the column's
      #      value; hide the value inside a function and the index cannot be used, and nothing
      #      warns you. The rewrites, each shown as a pair with identical results:
      #        WHERE YEAR(order_date) = 1997
