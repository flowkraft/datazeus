      - n: "25"
        slug: aggregate-functions
        title: "Aggregate Functions: COUNT, SUM, AVG, MIN, MAX — Turning Many Rows Into One Number"
        short: "COUNT, SUM, AVG (Aggregate Functions) — one number"
        hands_on: ["koan:complete", "koan:predict"]
        core: true
        data:
          source: northwind_tiny
          tables: ["Orders", "Products"]
          fit: good
          reason: "Classic Northwind, the tiny one DataPallas ships: 25 customers, 79 orders and 193 order lines, so a beginner can check every result by eye. The lesson is published on it, and its gate runs on DuckDB and PostgreSQL."
        status: published
      # WRITTEN 2026-08-30. The episode earns its place on ONE failure, and it is caused by
      # OBEYING A CORRECT ERROR MESSAGE. `SELECT "ShipCountry", "OrderID", count(*) ... GROUP BY
      # "ShipCountry"` is refused (42803, "must appear in the GROUP BY clause"), and the message
      # tells you the fix: add it to the GROUP BY list. So you add "ShipCity", which somebody
      # genuinely wanted to see, and the query runs clean — and the report has changed its
      # answer. Ten rows become twenty-four, every count shrinks, and "our biggest market" moves
      # from Germany (32 orders) to Mexico (8), because all eight of Mexico's orders go to one
      # city while Germany's thirty-two are spread over eleven. No error. Every number real.
      #
      # THE RULE THAT PREVENTS IT: the GROUP BY list IS the grain of the report. A column there
      # does not add detail to a row, it SPLITS the row. Only group by a column you want the
      # report broken up by.
      #
      # THE SECOND SILENT FAULT sets up 35: WHERE runs BEFORE the grouping, so `WHERE "Freight"
