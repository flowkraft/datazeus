# Flashcards for Learn SQL · Series 1 · 50 — SELECT + JOIN + GROUP BY, your first real report
#
# OUR OWN minimal authoring format (NOT CrowdAnki); tools/build-anki.py turns it into a
# .apkg with genanki. The .apkg is a BUILD ARTIFACT — gitignored, built in CI. Only this
# YAML is source.
#
# deck:  Anki deck name ("::" = sub-deck; keeps everything under DataZeus).
# guid:  STABLE per-deck id so rebuilds UPDATE the same deck instead of giving the learner a
#        second copy of every card. Set once, from the slug, and never changed.
# cards: a list of either { basic: {front, back} } or { cloze: "… {{c1::…}} …" }.
# tags:  applied to every card in the file.
#
# ── WHAT ANKI IS FOR, AND WHAT IT IS NOT FOR ────────────────────────────────────────
# Anki is reviewed on a phone, weeks later, with no database open, no CloudBeaver, and the
# lesson long forgotten. So every card here is SELF-CONTAINED: it carries its own premise.
# NOT ONE of them asks the learner to run a query, to remember a result from an earlier
# card, or to know Northwind's schema. Where a card needs a fact — how many rows a join
# returned, how many order lines a customer's orders hold — the FRONT states it, and the
# card tests the REASONING, not the recall of data. The koans are where you type SQL
# against real rows; this deck is where the rules have to hold without them.
#
# NUMBERS FROM THE DATASET APPEAR ONLY AS A STATED PREMISE, and only two pairs of them:
# 79 rows becoming 193 after the join to the order lines, and 5 orders holding 11 order
# lines. Both are asserted in
# tests/src/verify/groovy/datazeus/learnsql/series1/_50/YourFirstRealReportSpec.groovy.
# No card asks for a figure from the dataset, and the tables are named generically
# (customers, orders, order lines), never with Northwind's quoted names.
#
# THIS DECK IS ALMOST ENTIRELY REASONING, and that is right for a project episode. There is
# no new syntax to drill — every keyword had its own lesson and its own deck. What survives
# away from a database is the JUDGEMENT: what one row represents, what a join did to it,
# which number to distrust, what a check proves and what it does not, and what to send.
#
# FILE ORDER IS THE CURRICULUM. Anki introduces new cards in file order, so a learner meets
# the ideas in the same order as the lesson and the video: the question before the query,
# what each join does to the row count, the count that breaks while the money does not, the
# two checks and what they prove, average order value, checking before the LIMIT, sending
# the report, and last the query itself. One idea per card, with a short answer.
#
# WHAT THIS DECK OWNS, AND WHAT IT LEAVES ALONE:
#   - Lesson 40's deck owns the rule that a join returns one row per MATCH. THIS deck
#     applies it to both joins of a three-table report and owns the CONSEQUENCE one step
#     later: the grain has changed, so a count that meant orders now counts order lines.
#     Do not re-teach 40's row arithmetic here.
#   - Lesson 30's deck owns "the GROUP BY list IS the grain of the report" — the grain of the
#     ANSWER. This deck's grain cards are about the grain of the SOURCE, which is the half a
#     join changes under you.
#   - Lesson 25's deck owns count(*) against count(column) and where DISTINCT goes inside
#     the brackets. The count cards here are about why a join makes that difference matter.
#   - Lesson 20 owns ROUND and where its brackets go. The production card uses it and does
#     not teach it.
#   - Lesson 15 owns ORDER BY and LIMIT. The LIMIT cards here are about which version of the
#     query you check, and what the cut leaves out.
#   - Series 2 owns fan-out that corrupts the MONEY. Everything here is confined to the case
#     count(DISTINCT ...) repairs.

deck: "DataZeus::Learn SQL::Series 1::50 Your First Real Report"
guid: "datazeus-learn-sql-series1-50-your-first-real-report"
tags: ["datazeus", "learn-sql", "series-1", "sql"]

cards:
  # ── 1. THE QUESTION BEFORE THE QUERY ──
  - basic:
      front: "Before writing a report query, you ask \"what does one row represent?\" about two different things. What are the two?"
      back: "<b>The result:</b> if one row of the report is one customer, you GROUP BY customer.<br><b>The source:</b> the rows you add up often represent something more detailed, such as one order line."

  - basic:
      front: "A report shows each customer's total sales. The customers table holds names, the orders table records which customer placed each order, and the order lines table holds each product bought, with its price and quantity. What does one row of the data you add up represent?"
      back: "Each row is one order line: one product bought on one order. The money is only on the order lines, because an order records who placed it, not what was in it."

  # ── 2. WHAT EACH JOIN DOES TO THE ROW COUNT ──
  - basic:
      front: "A query starts FROM customers and joins orders, matching each order to the customer who placed it. Why does it return one row per order, not one row per customer?"
      back: "A join returns one row for every match, and each order matches exactly one customer. So the orders set the row count. Write that count down: after the next join, you compare against it."

  - basic:
      front: "Customers joined to orders gave 79 rows, one per order. You add a join to the order lines, and the row count becomes 193. Is that a bug?"
      back: "No. An order can hold several products, and each one is its own row in the order lines. The join returns one row per match, so one row is now one order line, not one order."

  - cloze: "When a join changes the row count, the {{c1::grain}} changed with it: one row of the result now represents something different."

  # ── 3. THE COUNT THAT BREAKS, AND THE MONEY THAT DOES NOT ──
  - basic:
      front: "A query joins customers to orders to order lines, groups by customer, and shows <code>count(o.order_id) AS orders</code>. One customer placed 5 orders, holding 11 order lines between them. What does their orders column show?"
      back: "It shows 11, with no error and no warning. After the join to the order lines, each row is one order line, so that customer has 11 rows, and count counts the order id on every one of them."

  - cloze: "Naming a column does not change what count counts. <code>count(o.order_id)</code> counts the values in that column, repeats included; to count each order once, write <code>count({{c1::DISTINCT}} o.order_id)</code>."

  - basic:
      front: "A report joins customers, orders and order lines, so each row is one order line. Its order count comes out too high, but its SUM of the money on each line is correct. Why is the SUM correct?"
      back: "The money is recorded on the order line, and each line is exactly one row, so every line is added once. The count came out too high because an order's id repeats on every one of its lines."

  # ── 4. THE TWO CHECKS, AND WHAT THEY PROVE ──
  - basic:
      front: "A join can change how many rows you have and what they add up to. Which two checks show you what it changed, before you send the report?"
      back: "<b>1.</b> Count the rows before and after each join. If the count moves, the grain moved.<br><b>2.</b> Get the total a second way, and see whether the two totals agree."

  - basic:
      front: "A report's sales total comes from joining customers, orders and order lines. What makes a second way of getting that total a useful check?"
      back: "It shares no join with the first, for example summing the order lines table on its own, so it cannot repeat a mistake the joins made. If both totals agree, the joins added rows but left the money alone."

  # An outside number is NOT a "second way": the lesson keeps that phrase for two SQL routes.
  # The two routes check the PLUMBING; a number from outside checks the MEANING.
  - basic:
      front: "Your row counts are what you expected, and your total comes out the same by two SQL routes. Why does that still not prove the total means what you were asked for?"
      back: "The two routes prove the plumbing: the joins did not duplicate or lose money. But both use your own definition of the total, so if it is wrong, both agree on the same wrong number. To check the meaning, compare with a number from outside: last quarter's figure, an invoice, or finance's total."

  # ── 5. AVERAGE ORDER VALUE ──
  - basic:
      front: "Two customers have similar total sales. What can their average order value show that the totals cannot?"
      back: "It shows how each one buys. Average order value is total sales divided by the number of different orders, so it separates a customer with fewer, bigger orders from one with more, smaller orders."

  - basic:
      front: "A customer's total sales are correct, but a report says they placed 11 orders when they placed 5. What does that do to their average order value?"
      back: "It shows less than half the real value, because the same total is divided by 11 instead of 5. Nothing on the page looks wrong, and averages are what people make decisions from."

  # ── 6. CHECK EVERYTHING, SEND THE TOP TEN ──
  - cloze: "A top-ten report ends with <code>LIMIT 10</code>. Run your row counts and your second-route total on the same query {{c1::without}} the LIMIT."

  - basic:
      front: "Your report lists the top ten customers by total sales. The eleventh customer placed more orders than most of the ten on the list. Is the report wrong?"
      back: "No. The list is ranked by total sales, and that customer spent less. Say in the title what it is ranked by, such as \"Top 10 by total sales\", and know who is in row 11 before somebody asks."

  # ── 7. SENDING THE REPORT ──
  - basic:
      front: "Your manager does not write SQL and works in Excel, so you do not send her your query. A reporting tool turns it into an Excel file for her. Why does a neat file not mean its numbers are right?"
      back: "The tool formats the numbers; your query calculates them. A wrongly calculated number looks just as neat as a right one, and nothing after the query fixes it."

  - basic:
      front: "An AI assistant can write your report query for you. Why do you still need to know SQL?"
      back: "It can make the same silent mistake, such as counting order lines as orders, with no warning. Knowing SQL lets you read the query it wrote and run your checks before anybody uses the numbers."

  # ── 8. PRODUCTION — hardest, and last. The schema it needs is ON THE CARD. ──
  # The lesson's final query ends ORDER BY ... DESC LIMIT 10; its checks run on the same
  # query without the LIMIT, which is why the back says so.
  - basic:
      front: "Write the query. <code>customers</code> has <code>customer_id</code> and <code>company_name</code>; <code>orders</code> has <code>order_id</code> and <code>customer_id</code>; <code>order_lines</code> has <code>order_id</code>, <code>unit_price</code>, <code>quantity</code> and <code>discount</code> (the fraction taken off the price). List the top ten customers by total sales, biggest first, showing each one's name, number of orders, and total sales rounded to 2 decimal places."
      back: "<code>SELECT c.company_name,<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;count(DISTINCT o.order_id) AS orders,<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;ROUND(SUM(ol.unit_price * ol.quantity<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;* (1 - ol.discount)), 2) AS total_sales<br>FROM customers c<br>JOIN orders o<br>&nbsp;&nbsp;ON o.customer_id = c.customer_id<br>JOIN order_lines ol<br>&nbsp;&nbsp;ON ol.order_id = o.order_id<br>GROUP BY c.company_name<br>ORDER BY total_sales DESC LIMIT 10;</code><br><br>The count needs DISTINCT, because each row is an order line. Run your checks on this query without the LIMIT."
