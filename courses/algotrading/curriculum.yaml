  # SERIES 3 IS WHERE IT STOPS BEING A SIMULATION. Every problem here is a distributed-systems
  # problem with money attached, and the discipline is the same one an ERP uses on its ledger:
  # an external system holds the truth, and you reconcile against it.
  - slug: series3-execution
    title: Execution — Where It Becomes Real
    tagline: orders, fills, reconciliation, and a switch a human can throw
    level: intermediate
    episodes:
      # COVER: the order as a state machine, which is Build Your Own: ERP & CRM, Series 2 · 10's
      # document discipline in a place where the states change without you.
      # THE STATES: created, sent, acknowledged, partially filled, filled, cancelled, rejected,
      # expired — and the transitions that are legal. THE DIFFERENCE FROM AN ERP DOCUMENT, and it
      # is the whole difficulty: THE VENUE CHANGES THE STATE, NOT YOU. Your record is a belief
      # about somebody else's system.
      # THE ORDER TYPES A READER ACTUALLY NEEDS, and no more: market, limit, and stop — with the
      # honest account of what each costs. A market order guarantees the fill and not the price;
      # a limit order guarantees the price and not the fill, and an unfilled limit is a position
      # you do not have and think you do.
      # TIME IN FORCE, and the one that surprises people: an order that survives the session and
      # fills tomorrow morning into a market that gapped.
      # THE SCHEMA: orders, and FILLS AS SEPARATE ROWS — because one order becomes many fills at
      # different prices, and the average price you got is derived from them. An order table with
      # a single price column is a table you will rewrite.
      # THE POSITION IS DERIVED FROM FILLS, exactly as on-hand is derived from stock movements
      # and a balance from journal lines. The academy's third instance of the same rule, and it
      # is worth naming out loud.
      - n: "00"
        slug: the-order-lifecycle
        title: "The Order State Machine — Where the Venue Changes the State, Not You"
        hands_on: ["koan:complete", "koan:predict"]
        core: true
        status: planned
      # THE MOST IMPORTANT ENGINEERING EPISODE IN THE COURSE, and it is a distributed-systems
      # episode that happens to be about trading.
      # THE SCENARIO, WHICH WILL HAPPEN TO EVERY READER: you send an order. The connection times
      # out. YOU DO NOT KNOW WHETHER IT WAS PLACED. Retry and you may have two positions; do not
      # retry and you may have none. There is no local answer to this question.
      #   THE FIX: A CLIENT-GENERATED ORDER ID ON EVERY REQUEST, so a retry is recognised as the
      #   same order rather than a new one, and so you can ASK the broker what happened to it.
      #   IDEMPOTENCY IS THE ENTIRE ANSWER and it must be designed in from the first request, not
      #   added after the first incident.
      #   AND THE PROTOCOL RULE: WRITE THE ORDER TO YOUR OWN STORE BEFORE YOU SEND IT. An order
      #   that exists at the broker and not in your database is an unrecoverable position.
      # THE TWO CHANNELS THAT DISAGREE: a REST endpoint for placing and querying, a stream for
      # fills — arriving out of order, duplicated, or not at all while you were reconnecting.
      # TREAT THE STREAM AS A HINT AND THE QUERY AS THE TRUTH, and reconcile on every reconnect.
      # RATE LIMITS, backoff, and the fact that being throttled during a fast market is a
      # scenario to design for rather than a surprise.
      # ⚠ AND THE SANDBOX WARNING: broker test environments fill perfectly, instantly, at the
      # price you asked. They are for testing your CODE PATHS and they teach you nothing about
      # execution. Series 3 · 15 is where that gap gets measured.
      - n: "05"
        slug: the-broker-api
        title: "The Request That Timed Out — Client Order IDs and Writing It Down First"
        hands_on: ["koan:diagnose", "koan:complete"]
        core: true
        status: planned
      # COVER: reconciliation, which is this course's answer to the ERP's trial balance, and
      # which is non-negotiable.
      # THE RULE: YOUR POSITION IS WHAT THE BROKER SAYS IT IS. Your database holds a belief. When
      # they differ, the broker is right about the position and your system is wrong about
      # something — and the interesting question is what.
      # THE DAILY JOB, run before the market opens, every day, with no exceptions:
      #   positions, per instrument, yours against theirs;
      #   cash balance, yours against theirs;
      #   open orders, yours against theirs — the one people forget, and the one that leaves a
      #   stale order sitting at the venue waiting to fill into a position you did not want.
      # WHAT DIFFERENCES MEAN, because each has a different cause: a missed fill message; a
      # partial fill you recorded as complete; a corporate action applied to your holding
      # overnight (Series 1 · 10, arriving in the live system); a fee, an interest charge or a
      # dividend you never modelled; or an order placed by a human in the broker's own app, which
      # happens and is nobody's bug.
      # THE PROCEDURE WHEN THEY DISAGREE, decided in advance and written down: STOP TRADING
      # FIRST, then investigate. Never let an automated system trade its way out of a state it
      # does not understand.
      # AND THE HABIT WORTH THE WHOLE EPISODE: RECONCILE BEFORE YOU TRADE, NOT AFTER. A break
      # found at 09:00 is a question; the same break found at 16:00 is a loss.
      - n: "10"
        slug: reconciliation
        title: "Reconcile Before You Trade — the Broker Is Right and You Are Wrong"
        hands_on: ["koan:reconcile", "koan:diagnose"]
        core: true
        status: planned
      # COVER: the gap between a backtest, paper trading and real money, and the graduated path
      # across it.
      # WHY PAPER RESULTS STILL FLATTER, specifically: paper fills at the quoted price, gets a
      # fill for any size, is never rejected, never queues behind other orders, and never moves
      # the market. It validates YOUR PLUMBING and it does not validate your execution
      # assumptions.
      # WHAT PAPER TRADING IS ACTUALLY FOR, which is a great deal: does the daily cycle run
      # unattended; does reconciliation stay clean for a month; do the alerts fire; what happens
      # when the data feed is late; does anything break at a month boundary or a holiday. Those
      # are the failures that end real systems, and they are all findable without money.
      # THE PATH, WITH A GATE AT EACH STEP AND THE GATE WRITTEN DOWN BEFOREHAND:
      #   BACKTEST → PAPER, for long enough to cross a month end and a holiday
      #   → REAL MONEY AT A SIZE THAT DOES NOT MATTER, which is the only step that tests
      #     execution honestly and is where slippage becomes a measured number rather than an
      #     assumed one
      #   → SIZE UP SLOWLY, only against evidence.
      # AND THE MEASUREMENT THAT CLOSES THE LOOP AND IS THE POINT OF THE EPISODE: RUN THE
      # BACKTEST OVER THE SAME PERIOD YOU JUST TRADED AND COMPARE, trade by trade. The difference
      # between simulated and actual fills IS your true slippage, and feeding it back into
      # Series 2 · 10's cost model is what makes every future backtest honest.
      - n: "15"
        slug: paper-to-live
        title: "Paper, Then Small — and Feeding Real Slippage Back Into the Backtest"
        hands_on: ["koan:reconcile", "koan:capture"]
        core: true
        status: planned
      # COVER: risk limits as code that is independent of the strategy, and the switch.
      # THE PRINCIPLE: THE STRATEGY IS NOT TRUSTED. Limits live OUTSIDE it, in a layer every
      # order passes through, so that a bug in the strategy cannot disable its own brakes.
      # THE LIMITS WORTH HAVING, all of them boring and all of them earned by somebody:
      #   maximum position per instrument, and gross across the portfolio
      #   maximum order size, and a sanity check against typical volume — the fat-finger catch
      #   maximum orders per minute, which is what stops a loop from becoming an incident
      #   maximum loss per day, after which the system flattens or stops
      #   a hard cap on total capital deployed.
      # FAIL CLOSED, WHICH IS THE SENTENCE OF THE EPISODE: IF THE DATA IS STALE, DO NOT TRADE. If
      # reconciliation did not pass this morning, do not trade. If the calendar says the market
      # should be open and no ticks have arrived for ten minutes, do not trade. THE DEFAULT
      # BEHAVIOUR OF AN UNCERTAIN SYSTEM IS INACTION — and this is the exact inverse of most
      # software, where the default is to carry on.
      # THE KILL SWITCH, and it must be all of these: reachable from a phone, effective within
      # seconds, requiring no code deployment, and it must also CANCEL RESTING ORDERS rather than
      # merely stopping new ones. TEST IT ON A SCHEDULE. An untested kill switch is a comforting
      # belief.
      # AND THE HUMAN PART, said plainly: decide the daily loss limit when you are calm, because
      # you will not be calm on the day it triggers.
      - n: "20"
        slug: risk-limits-and-the-kill-switch
        title: "Fail Closed — Limits Outside the Strategy, and a Switch That Cancels Everything"
        hands_on: ["koan:complete", "koan:predict"]
        core: true
        status: planned
      # COVER: the daily cycle as an operational schedule, which is Data Ops applied to a system
      # with a deadline that does not move.
      # THE TIMELINE, WRITTEN DOWN AS A RUNBOOK: overnight data load; the gap report; morning
      # reconciliation; signal generation; order submission at the intended time; intraday
      # monitoring; end-of-day capture of fills, positions and cash; and the journal entry that
      # records what the system believed and did.
      # THE QUESTION THAT MAKES IT REAL: WHAT HAPPENS IF THE LOAD FAILS AT 09:29? The answer must
      # be decided in advance and encoded — and it is Series 3 · 20's rule: do not trade today.
      # NOT "trade on yesterday's data", which is the tempting option and is how a stale signal
      # becomes a position.
      # DEPENDENCIES AND ORDERING: this is a small DAG with a hard deadline, and the seam is
      # exact — ETL & Data Pipelines owns dependency modelling, Data Ops, Series 3 · 00 owns
      # choosing the scheduler. THE ONLY THING SPECIFIC TO THIS DOMAIN is that a late job must
      # SKIP rather than CATCH UP, because a trading signal has an expiry and a retry at 11:00 of
      # a 09:30 decision is a new and unvalidated strategy.
      # AND WHERE IT RUNS: a machine that is up when the market is, with a clock you trust, and
      # the honest note that a laptop that sleeps is not that machine.
      - n: "25"
        slug: the-daily-cycle
        title: "What Runs When — and Why a Late Job Must Skip Rather Than Catch Up"
        hands_on: ["koan:complete", "koan:diagnose"]
        status: planned
      # THE ARTEFACT: the whole live path, running unattended, against paper money.
      # BUILD: the strategy from Series 2's project, wired to a broker's paper environment, with
      # client order IDs, orders written down before sending, fills captured from both channels,
      # positions derived from fills, the risk layer in front, and the kill switch.
      # RUN IT UNATTENDED FOR A PERIOD THAT CROSSES A MONTH END AND A HOLIDAY. That duration is
      # the requirement, because the bugs this catches are calendar bugs.
      # THEN THE HAND-IN, which is evidence rather than a result:
      #   the reconciliation log, every day, and an explanation of every break;
      #   a deliberately triggered kill switch, with resting orders confirmed cancelled;
      #   a deliberately staled data feed, with the system confirmed to have refused to trade;
      #   and the slippage comparison from Series 3 · 15 — simulated fills against paper fills,
      #   with the difference quantified and fed back into the cost model.
      - n: "30"
        slug: project-paper-trade-it
        title: "Project — Run It Unattended, Break It on Purpose, and Explain Every Difference"
        hands_on: ["koan:reconcile", "koan:author"]
        status: planned

  # SERIES 4 IS ABOUT THE THING NOBODY BUILDS UNTIL IT IS TOO LATE: knowing what the system is
  # doing, being able to reproduce what it did, and having decided in advance how it ends.
  - slug: series4-living-with-it
    title: Living With It
    tagline: monitoring, reproducibility, and deciding in advance how it ends
    level: intermediate
    episodes:
      # COVER: monitoring for a system that spends money while it is broken, which changes what
      # is worth alerting on.
      # THE ALERTS THAT EARN THEIR PLACE, and each one is a specific failure somebody has had:
      #   DATA STALENESS — no ticks during a session the calendar says is open. The most valuable
      #   alert in the system, because Series 3 · 20's fail-closed rule depends on noticing.
      #   AN UNEXPECTED POSITION — anything the system did not intend to hold, which is the
      #   reconciliation break from Series 3 · 10 arriving as a page instead of a discovery.
      #   ORDER REJECTIONS, especially a run of them, which usually means an assumption about the
      #   venue has stopped being true.
      #   DRAWDOWN THRESHOLDS, as information rather than as an instruction — the decision was
      #   made in Series 3 · 20 and the alert only tells you it fired.
      #   A JOB THAT DID NOT RUN. The absence of an event is the hardest thing to alert on and the
      #   one that hurts most: a heartbeat, and an alert on its silence.
      # THE PRINCIPLE, WHICH IS THIS ACADEMY'S AND APPLIES WITH FORCE HERE: SILENCE IS NOT
      # SUCCESS. A system that has not alerted in three months is a system whose alerting you
      # should test today. Data Ops, Series 3 · 15 owns paging a human; what is specific here is
      # that the failure mode with the highest cost is the QUIET one — a system that keeps
      # trading on data that stopped updating.
      # AND THE DASHBOARD THAT IS ACTUALLY USEFUL: intended position against actual, cash,
      # today's orders and their states, data freshness per feed, and the time of the last
      # successful reconciliation. Five things. Not an equity curve — an equity curve is for
      # review, and watching it is how people interfere with their own system.
      - n: "00"
        slug: monitoring
        title: "Alert on the Silence — Stale Data, a Position You Did Not Intend, a Job That Never Ran"
        hands_on: ["koan:diagnose", "koan:complete"]
        core: true
        status: planned
      # COVER: reproducibility, and the specific way research rots.
      # THE PROBLEM: a result from four months ago that you cannot reproduce is not a result, and
      # the usual cause is a notebook run out of order against data that has since been restated
      # (Series 1 · 25) with a parameter nobody wrote down.
      # WHAT HAS TO BE PINNED TOGETHER for a result to survive: the code version, the DATA
      # VERSION — which is why the corrections log from Series 1 · 25 exists — the parameters,
      # the universe as of the run, the cost assumptions, and the random seed.
      # THE PRACTICE THAT ACTUALLY WORKS FOR ONE PERSON, and it is deliberately modest: every
      # research run writes a directory with its inputs, its config, its outputs and a summary —
      # and the RESEARCH LOG records what you were testing, WHAT YOU EXPECTED BEFORE RUNNING IT,
      # and what you concluded. The middle one is the discipline: writing the prediction down
      # first is what stops a result being reinterpreted into a success afterwards.
      # AND THE CONNECTION BACK TO Series 2 · 25 THAT MAKES THIS MORE THAN HYGIENE: THE LOG IS
      # HOW YOU COUNT YOUR TRIALS. You cannot adjust for the number of things you tried if you
      # did not keep a record of trying them, and memory reliably undercounts.
      # SEAM: notebooks against pipelines is Python for Data's argument; what is specific here is
      # that the data underneath is mutable and that the count of experiments is itself a result.
      - n: "05"
        slug: reproducible-research
        title: "The Research Log — Write Down What You Expect, and Count Every Trial"
        hands_on: ["koan:capture", "koan:complete"]
        core: true
        status: planned
      # COVER: decay, which is the outcome the reader should expect rather than fear.
      # THE FACT: strategies stop working. An edge that is real gets crowded out, the market
      # structure changes, the fee schedule changes, or it was never there and you are only now
      # collecting enough evidence to see that.
      # THE HARD PART, AND IT IS STATISTICAL RATHER THAN EMOTIONAL: A LOSING RUN IS EXPECTED. If
      # your backtest showed drawdowns of a given depth, you will experience them, and the
      # question "is this normal variation or is it broken?" cannot be answered from the losses
      # alone — the sample is far too small. Say that clearly, because it is the point at which
      # most people either abandon something that was fine or persist with something that is not.
      #   WHAT HELPS: THE EXIT RULE DECIDED IN ADVANCE, in the same document as the strategy, and
      #   written when you had nothing at stake. Drawdown beyond the backtested maximum; a live
      #   result inconsistent with the simulated one over enough trades; the structural reason
      #   for the edge no longer being true — that last one is the best signal and it requires
      #   having written the reason down in the first place, per Series 2 · 25.
      #   WHAT DOES NOT HELP: re-fitting parameters after a bad month, which is Series 2 · 25's
      #   overfitting arriving with real money and a deadline.
      # AND THE PROFESSIONAL SKILL THIS EPISODE IS REALLY ABOUT: TURNING YOUR OWN THING OFF.
      # Being able to do that, on a rule you wrote when you were calm, is the difference between
      # running a system and being run by one.
      - n: "10"
        slug: when-it-stops-working
