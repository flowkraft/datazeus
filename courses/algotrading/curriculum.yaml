# The ordered episode list for Build Your Own: Algotrading System. Field docs live in
# courses/learnsql/curriculum.yaml. `short` is omitted until an episode has a video.
#
# The job this track teaches: build the four systems that sit under any automated trading
# operation — a market-data store you can trust, a backtester that cannot cheat, an execution
# layer that survives a broker disagreeing with it, and the monitoring that tells you when to
# stop — and, above all, learn to tell whether a result is real.
#
# ============================================================================
# ⚠ THE HONESTY REQUIREMENT — READ THIS BEFORE WRITING ANY EPISODE
# ============================================================================
# THIS COURSE DOES NOT TEACH ANYONE TO MAKE MONEY, AND EVERY PIECE OF COPY WE WRITE ABOUT IT
# MUST SAY SO PLAINLY. It teaches the ENGINEERING. Not one episode may imply that following it
# produces a profitable strategy, and no example strategy in this track may be presented as one
# a reader should trade.
#
# THE THREE SENTENCES THAT MUST SURVIVE INTO THE STUDENT-FACING TEXT, in Series 1 · 00 and in
# the course description:
#   1. WE TEACH THE SYSTEM, NOT A STRATEGY. The strategies used here are well known, simple, and
#      chosen because they are easy to reason about — never because they work.
#   2. MOST BACKTESTED EDGES ARE NOISE, and Series 2 · 25 is the episode that shows you why and
#      hands you the tools to catch your own. That skill is the most valuable thing here.
#   3. TRADING RISKS REAL MONEY. Nothing in this track is financial advice, none of it is a
#      recommendation, and the reader is responsible for their own decisions and for the rules
#      of their own jurisdiction.
# AN EPISODE THAT WOULD READ WELL IN A TRADING-COURSE ADVERTISEMENT IS AN EPISODE THAT HAS GONE
# WRONG. If a draft contains a return figure, an equity curve presented approvingly, or the word
# "profitable" outside a warning, delete it and start again.
#
# AND THE POSITIVE VERSION, because this is not a disclaimer track — it is a genuinely excellent
# engineering course: A READER WHO FINISHES CAN LOOK AT ANY BACKTEST, THEIR OWN OR SOMEBODY
# ELSE'S, AND SAY WHAT IS WRONG WITH IT. That is a rare and portable skill, it is worth more than
# any strategy, and it is the promise this track actually makes.
#
# ============================================================================
# WHY THIS BELONGS IN A DATA ACADEMY AT ALL
# ============================================================================
# BECAUSE IT IS THE MOST DEMANDING DATA SYSTEM A SINGLE PERSON CAN BUILD ALONE, and every
# discipline this academy teaches shows up in it with a price attached:
#   POINT-IN-TIME CORRECTNESS   effective dating, except that getting it wrong does not produce
#                               a wrong report — it produces a strategy that looks brilliant and
#                               loses money.
#   IDEMPOTENT INGESTION        the pipeline discipline, against a vendor who restates yesterday.
#   A SIMULATION THAT MUST NOT SEE THE FUTURE   a constraint with no equivalent anywhere else in
#                               the academy, and the one that makes this course worth building.
#   RECONCILIATION              against an external system that holds actual money, every
#                               morning, exactly as an ERP reconciles a ledger.
#   MONITORING WHERE SILENCE COSTS   Data Ops teaches alerting on a pipeline. Here the pipeline
#                               spends money while it is broken.
# A READER WHO NEVER TRADES A PENNY STILL FINISHES THIS TRACK A BETTER DATA ENGINEER, and that
# is a legitimate reason to take it. Say so.
#
# ============================================================================
# THE FOUR SUBSYSTEMS, WHICH ARE THE FOUR SERIES
# ============================================================================
#   1. DATA        the store, and everything that makes historical prices lie to you.
#   2. RESEARCH    the backtester, and every way it cheats without being asked to.
#   3. EXECUTION   orders, fills, reconciliation, and the kill switch.
#   4. OPERATIONS  monitoring, reproducibility, and deciding to turn your own thing off.
# THEY ARE IN THIS ORDER BECAUSE EACH ONE IS WORTHLESS WITHOUT THE ONE BEFORE IT. A backtest on
# unadjusted prices is fiction; an execution layer for a strategy you have not validated is an
# expensive way to be wrong quickly.
#
# ============================================================================
# THIS TRACK HAS NO OFFICIAL MANUAL EITHER — WHAT TO RESEARCH FROM
# ============================================================================
#   THE BROKER AND EXCHANGE DOCS   for Series 3. These are real, specific and versioned, and
#                                  order semantics differ between venues. Name which broker's
#                                  API an example is written against and state the date.
#   THE ACADEMIC LITERATURE ON BACKTEST OVERFITTING   for Series 2 · 25, and it is credited in
#                                  that episode's `credits` block rather than paraphrased
#                                  anonymously. This is the one place in the track where a named
#                                  person's named contribution is being taught.
#   THE EXCHANGE CALENDARS AND CORPORATE-ACTION RULES   for Series 1. These are facts, not
#                                  opinions, and they are checkable.
# ⚠ EVERYTHING ELSE IN THIS SUBJECT IS FULL OF CONFIDENT PEOPLE WITH NOTHING TO SHOW. Prefer a
# claim you can demonstrate in code over a claim you read on a forum, and where the honest answer
# is "nobody knows", write that.
#
# ============================================================================
# THE SHAPE OF AN EPISODE — four beats, every time
# ============================================================================
#   1. THE FAILURE   the specific way this gets somebody. "The split made it look like a 50%
#                    loss." "The order timed out but had been placed." Always concrete.
#   2. THE MECHANISM why it happens, at the level of the data or the protocol.
#   3. THE BUILD     the code or the schema that makes it impossible rather than unlikely. A
#                    convention a tired person must remember is not a fix.
#   4. THE CHECK     the assertion, the reconciliation or the report that proves it is still
#                    true next month.
#
# ============================================================================
# THE RULES THIS DOMAIN ENFORCES, COLLECTED SO NO EPISODE FORGETS ONE
# ============================================================================
#   A BAR IS NOT A PRICE. It is a lossy summary of a window. Series 1 · 05.
#   ADJUSTED PRICES ARE A DERIVED VIEW, NEVER THE STORED TRUTH. Series 1 · 10.
#   THE UNIVERSE IS A THING WITH A DATE. Series 1 · 15.
#   COSTS BEFORE RETURNS. Model the fees first, or you will fall in love with a number that does
#   not exist. Series 2 · 10.
#   A SIGNAL USES ONLY WHAT WAS KNOWN AT THAT INSTANT — enforced structurally. Series 2 · 05.
#   YOUR POSITION IS WHAT THE BROKER SAYS IT IS. Series 3 · 10.
#   IF THE DATA IS STALE, DO NOT TRADE. Fail closed. Series 3 · 20.
# ANY EPISODE THAT APPEARS TO BREAK ONE OF THESE IS DELIBERATELY SHOWING THE NAIVE VERSION
# BEFORE FIXING IT, AND MUST SAY SO IN THE SAME BREATH.

course: learn-build-algotrading
track: algotrading
title: "Build Your Own: Algotrading System"

prerequisites:
  - course: learn-etl-pipelines
    needs: "Series 1"
    why: >-
      The market-data layer in Series 1 of this course is an ETL pipeline with unusually
      unforgiving requirements — idempotent loads, gap detection and a vendor who restates
      yesterday's data — and this track applies those ideas rather than teaching them.
  - course: learn-python
    needs: "Series 1"
    why: >-
      Every build in this track is code, and the ecosystem a reader will meet — dataframes,
      numerical libraries, notebooks — is Python's. The engineering transfers to any language;
      the examples do not.

excludes:
  - topic: "What to trade, which strategies work, and any claim about returns"
    where: "not covered, deliberately and permanently. In this course, Series 2 · 25 teaches you to judge a strategy's evidence, which is the opposite service and the only honest one"
  - topic: "Financial, investment or tax advice"
    where: "not covered. In this course, Series 4 · 15 says plainly that the rules differ by jurisdiction and that record-keeping and compliance are the reader's own responsibility"
  - topic: "Machine learning models, feature engineering and training loops"
    where: "covered in AI & Data. In this course, the modelling step is deliberately a black box with a signal coming out of it, because every failure this track teaches happens on either side of that box and not inside it"
  - topic: "Time-series storage engines in depth"
    where: "covered in the engine tracks — ClickHouse and DuckDB have their own courses. In this course, Series 1 · 20 chooses between them for this workload and explains the criteria, then stops"
  - topic: "Running the jobs, alerting and on-call"
    where: "covered in Data Ops, Series 3. In this course, Series 3 · 25 and Series 4 · 00 cover only what is specific to a system that spends money while it is broken"
  - topic: "Low-latency and high-frequency engineering — colocation, kernel bypass, microseconds"
    where: "not covered. That is a hardware and networking discipline for funded teams, and a course that gestured at it would teach nobody anything. This track builds systems that hold positions for minutes or longer, and says so"
  - topic: "Order book microstructure and market making"
    where: "not covered as a subject. In this course, Series 1 · 05 explains bid, ask and spread because a reader cannot model costs without them, and goes no further"

series:
  # SERIES 1 IS THE LONGEST AND THE LEAST GLAMOROUS, AND IT IS FIRST BECAUSE EVERY EXCITING
  # RESULT IN THIS FIELD THAT TURNS OUT TO BE WRONG WAS WRONG HERE. A reader who wants to skip
  # to the backtester is exactly the reader this series is for.
  - slug: series1-market-data
    title: Market Data Is the Whole Problem
    tagline: everything that makes historical prices quietly lie to you
    level: intermediate
    episodes:
      # THE HONEST OPENER, and the most important episode in the course to get right.
      # COVER: what you are building — the four subsystems from the header, drawn as one diagram
      # a reader can keep. Then the scope: positions held for minutes to months, not
      # microseconds, and why that decision changes everything downstream.
      # AND THEN THE THREE SENTENCES FROM THIS FILE'S HEADER, SAID TO THE READER'S FACE:
      #   we teach the system, not a strategy;
      #   most backtested edges are noise, and you will learn to catch your own;
      #   this risks real money, it is not advice, and the jurisdiction is yours.
      # DO NOT SOFTEN THESE and do not bury them at the bottom. A reader who leaves after this
      # episode because they wanted a money machine has been served correctly.
      # THEN THE POSITIVE PROMISE, which is real: you will be able to look at any backtest and
      # say what is wrong with it, and the engineering — point-in-time data, a simulation that
      # cannot cheat, reconciliation against an external system — is the same engineering that
      # makes someone good at data work generally.
      # AND THE HONEST NOTE ON THE ALTERNATIVE, once, without sarcasm: for most people an index
      # fund is the better financial decision, and building this is a decision about what you
      # want to learn. Saying that at the start is what makes the rest of the course credible.
      - n: "00"
        slug: what-you-are-building
        title: "Four Subsystems — and What This Course Will Not Give You"
        hands_on: ["koan:choose", "eyes"]
        core: true
        status: planned
        tags: ["foundational"]
      # COVER: what a "price" actually is, because the word hides four different numbers and
      # every cost model depends on knowing which one you have.
      #   BID, ASK, SPREAD, LAST. You buy at the ask and sell at the bid. A backtest that fills
      #   at "the price" has already given itself half the spread, on every trade, for free —
      #   and Series 2 · 10 is where that becomes an actual number.
      #   A BAR IS A LOSSY SUMMARY: open, high, low, close and volume over a window. The high
      #   and the low happened at unknown times, in unknown order, so ANY RULE THAT TOUCHES BOTH
      #   IN ONE BAR IS UNTESTABLE — the classic being a stop and a target both hit in the same
      #   bar, where the bar cannot tell you which came first. Name this now; it kills more
      #   backtests than any other single thing.
      #   SESSIONS AND CALENDARS: opens, closes, half days, holidays, and auctions. A calendar is
      #   data with a source, not an assumption.
      #   TIME: store UTC, and store the EXCHANGE'S local date as well, because "which trading
      #   day is this" is a question UTC alone cannot answer and daylight saving moves the
      #   session in UTC twice a year.
      - n: "05"
        slug: ticks-bars-and-what-a-price-is
        title: "Bid and Ask — the Bar That Cannot Tell You What Happened First"
        hands_on: ["koan:predict", "koan:diagnose"]
        core: true
        status: planned
      # THE EPISODE THAT SAVES A BACKTEST, and it is worth putting early because it is
      # spectacular: an unhandled 2-for-1 split looks exactly like a 50% overnight loss, and a
      # strategy that buys drops will "discover" a wonderful edge that is entirely an artefact.
      # COVER: splits, reverse splits, dividends, spin-offs, symbol changes and mergers, and
      # what each does to a naive price series.
      #   THE ADJUSTMENT: back-adjusting the history so returns are continuous, and the choice
      #   between price-only and total-return adjustment — which for a dividend-paying universe
      #   changes long-horizon results substantially.
      #   THE DESIGN RULE, AND IT IS THE POINT: STORE UNADJUSTED PRICES AND THE CORPORATE-ACTION
      #   EVENTS SEPARATELY, AND DERIVE THE ADJUSTED SERIES. Adjusted prices are a VIEW. If you
      #   store them as your truth, then every new dividend silently rewrites your entire
      #   history, your saved research no longer reproduces, and you can never explain a number
      #   you produced last month. This is the same "keep the events, derive the state" argument
      #   as a ledger, and the parallel is worth naming.
      #   SYMBOL CHANGES AND REUSE, which is the nastiest one: tickers get reassigned to
      #   completely different companies. THE INTERNAL IDENTIFIER IS NOT THE TICKER. Ever.
      - n: "10"
        slug: corporate-actions
        title: "Splits and Dividends — the 50% Loss That Never Happened"
        hands_on: ["koan:diagnose", "koan:complete"]
        core: true
        status: planned
      # COVER: the two biases that flatter a backtest most, and both are properties of the DATA
      # rather than of the strategy — which is why no amount of careful strategy code fixes them.
      #   SURVIVORSHIP BIAS: your data vendor has the companies that still exist. The ones that
      #   went to zero are missing. Every strategy tested on that universe is being tested on a
      #   population selected for having survived, and the effect is large rather than academic.
      #   LOOK-AHEAD IN THE UNIVERSE: testing "the index constituents" using TODAY'S membership
      #   list means you were buying the companies that were about to be ADDED to the index —
      #   which is a strategy with perfect foresight and it will look magnificent.
      #   THE FIX, AND IT IS A SCHEMA: THE UNIVERSE IS A THING WITH A DATE. Membership rows with
      #   valid-from and valid-to, delisted instruments kept forever with their final price and
      #   the reason, and every query for "the universe" taking an as-of date. This is Data Model
      #   Patterns' effective dating, arriving in a place where getting it wrong costs money
      #   rather than embarrassment.
      #   AND THE SAME PROBLEM IN FUNDAMENTAL DATA: reported figures are RESTATED afterwards.
      #   You must know what was known ON THE DAY, not what is known now — which means storing
      #   the publication timestamp beside every value and never taking the vendor's current
      #   table at face value.
      # THE CHECK: pick a date three years ago and reconstruct the universe as it was. If your
      # schema cannot answer that query, nothing built on it can be trusted.
      - n: "15"
        slug: survivorship-and-point-in-time
        title: "The Universe Has a Date — Survivorship, Restatements and Buying the Future"
        hands_on: ["koan:predict", "koan:reconcile"]
        core: true
        status: planned
      # COVER: the storage decision, made on this workload's actual access pattern rather than
      # on benchmarks from somebody else's.
      # WHAT THE ACCESS PATTERN IS, and it decides everything: WRITE ONCE IN BATCHES, READ
      # ENORMOUS COLUMNAR SLICES — one column, thousands of symbols, ten years — over and over
      # during research. That is an analytical workload, not a transactional one, and it is why
      # the instinct to reach for a row-store is wrong here.
      # THE REAL OPTIONS, WITH THE HONEST CRITERION FOR EACH:
      #   PARQUET FILES, PARTITIONED   by symbol or by date — and the partition choice is the
      #                                whole decision, because it is what makes a query either a
      #                                file read or a full scan. Free, portable, no server.
      #   DUCKDB OVER THOSE FILES      SQL on top of the same files, nothing to operate. For a
      #                                one-person system this is usually the right answer and
      #                                the course should say so plainly.
      #   CLICKHOUSE                   when the data outgrows one machine or many people query
      #                                it at once.
      #   POSTGRES, WITH OR WITHOUT A TIME-SERIES EXTENSION   the right answer when the same
      #                                database also holds your orders and positions and you
      #                                value having one system over having a fast one.
      # THE PARTITIONING AND FILE-SIZE TRAP, worth a worked example: a file per symbol per day
      # is a directory of two million tiny files and every query pays the open cost. Partition
      # coarser than feels natural.
      # SEAM: this episode chooses; the engine tracks teach the engines.
      - n: "20"
        slug: storing-market-data
        title: "Parquet, DuckDB or ClickHouse — Choosing on the Access Pattern You Actually Have"
        hands_on: ["koan:choose", "koan:predict"]
        status: planned
      # COVER: the ingestion pipeline, which is where the data discipline becomes daily practice.
      #   IDEMPOTENT LOADS: re-running yesterday must produce the same result, not duplicate
      #   rows. The natural key is instrument plus timestamp plus source, and the load is an
      #   upsert against it.
      #   GAP DETECTION AGAINST THE CALENDAR: a missing day is invisible unless you check against
      #   the exchange calendar from Series 1 · 05. THE REPORT THAT MUST EXIST: expected bars
      #   against received bars, per instrument, per day, every morning. This is the single
      #   highest-value habit in the whole data series.
      #   VENDORS RESTATE. Yesterday's close changes. So the load must be able to CORRECT rather
      #   than only append, and — because it corrects — you want to know it happened. Log
      #   corrections; a silent restatement is a result you can no longer reproduce.
      #   SANITY CHECKS AT LOAD TIME: a price that moved 400% in a bar, a zero volume on a
      #   trading day, an ask below a bid, a timestamp in the future. Quarantine rather than
      #   reject, and look at the quarantine — bad data that is silently dropped is bad data you
      #   will rediscover in a backtest.
      #   TWO SOURCES WHERE IT MATTERS, and reconcile them. Disagreement is information.
      # SEAM: ETL & Data Pipelines owns the technique; Data Ops owns making it run. This episode
      # owns only what is specific to a source that restates and a consumer that cannot tolerate
      # a silent hole.
      - n: "25"
        slug: the-ingestion-pipeline
        title: "Loading It — Idempotent, Gap-Checked, and Loud About Corrections"
        hands_on: ["koan:reconcile", "koan:complete"]
        core: true
        status: planned
      # THE ARTEFACT: a data layer somebody could build research on, with its own evidence.
      # BUILD: ingest several years for a few hundred instruments, unadjusted, with corporate
      # actions stored separately and adjusted series derived; an exchange calendar; a universe
      # table with membership dates including at least one delisting.
      # THEN PROVE IT, and these are the deliverables rather than the code:
      #   THE GAP REPORT, clean, against the calendar.
      #   THE AS-OF UNIVERSE QUERY for a date three years back, including the company that no
      #   longer exists.
      #   THE ADJUSTMENT DEMONSTRATION: the raw series across a split, and the derived one, side
      #   by side, with the 50% cliff visible in one and absent in the other.
      #   AND THE REPRODUCIBILITY CHECK: re-run the whole load and show the outputs are
      #   identical.
      - n: "30"
        slug: project-a-data-layer
        title: "Project — a Gap Report, an As-Of Universe, and a Split That Does Not Lie"
        hands_on: ["koan:reconcile", "koan:author"]
        status: planned

  # SERIES 2 IS THE INTELLECTUAL CORE OF THE TRACK. A backtester is easy to write and almost
  # impossible to write honestly, and the difference between those two is the entire content of
  # this series.
  - slug: series2-the-backtester
    title: The Backtester, and Why Most Are Wrong
    tagline: a simulation that cannot see the future, and a result you can defend
    level: intermediate
    episodes:
      # COVER: the two architectures, and the choice a reader has to make before writing a line.
      #   VECTORISED: the whole history as arrays, signals computed in one pass. Seconds to run,
      #   wonderful for exploration — and it CANNOT naturally express anything path-dependent:
      #   a stop that depends on where you got in, a position size that depends on current
      #   equity, an order that did not fill. It also makes look-ahead almost effortless, which
      #   is the real objection.
      #   EVENT-DRIVEN: a loop over time, one bar or tick at a time, with a strategy that can
      #   only see what has arrived. Slower, more code — and it is THE SAME SHAPE AS THE LIVE
      #   SYSTEM, which is the argument that decides it.
      # THE RECOMMENDATION AND THE REASON: vectorised for the first look, event-driven for
      # anything you would put money behind, AND THE SAME STRATEGY CODE RUNNING IN BOTH THE
      # BACKTEST AND LIVE. If those are two implementations, they will diverge, and the
      # divergence will be discovered with real orders.
      # THE ARCHITECTURE TO BUILD: a clock, an event feed, a strategy that receives events, a
      # portfolio, and a simulated broker — with the strategy having NO ACCESS to anything but
      # what the feed has delivered. Series 2 · 05 is why that boundary is an object and not a
      # promise.
      - n: "00"
        slug: vectorised-or-event-driven
        title: "Two Backtester Designs — and Why the Slow One Is the One You Trade"
        hands_on: ["koan:choose", "koan:complete"]
        core: true
        status: planned
      # THE MOST IMPORTANT ENGINEERING EPISODE IN THE SERIES.
      # COVER: every way the future leaks into a backtest, each one concrete, each one shown as
      # code that looks completely reasonable:
      #   DECIDING AT THE CLOSE ON THE CLOSE. You cannot know the closing price until the close
      #   has happened. Signal on today's close, fill on tomorrow's open — and if a strategy dies
      #   from that one change, it never existed.
      #   COMPUTING AN INDICATOR OVER THE WHOLE SERIES AND THEN SLICING IT. Normalising by the
      #   full-period mean, a z-score against statistics that include the future, a "fill
      #   forward" that fills backward.
      #   RESTATED FUNDAMENTALS AND LATE-ARRIVING DATA — Series 1 · 15's problem, arriving inside
      #   the strategy.
      #   THE UNIVERSE FILTER APPLIED WITH HINDSIGHT — "liquid names", chosen using volume the
      #   test has not reached yet.
      # AND THEN THE FIX, WHICH IS STRUCTURAL AND NOT DISCIPLINARY: MAKE IT IMPOSSIBLE. The
      # strategy receives an object that only exposes data up to the current timestamp. It cannot
      # index the future because the future is not in the thing it holds. A rule you have to
      # remember at midnight is not a rule.
      # THE SMELL TEST TO LEAVE THEM WITH, and it is worth more than any checklist: A RESULT THAT
      # IS TOO GOOD IS A BUG UNTIL PROVEN OTHERWISE, and the first place to look is always the
      # timestamp.
      - n: "05"
        slug: look-ahead-bias
        title: "Look-Ahead — Four Ways the Future Gets In, and the Object That Prevents It"
        hands_on: ["koan:diagnose", "koan:complete"]
        core: true
        status: planned
      # COVER: costs, and the ordering rule that makes this episode land: MODEL THE COSTS BEFORE
      # YOU LOOK AT THE RETURNS. Otherwise you have already decided the strategy is good and you
      # will negotiate with the fee model.
      # WHAT TO MODEL, from most to least certain:
      #   COMMISSION AND FEES        known, published, easy, and usually the smallest component.
      #   THE SPREAD                 you buy at the ask and sell at the bid. This is Series 1 · 05
      #                              becoming a number, it applies to every trade, and it is the
      #                              cost most amateur backtests omit entirely.
      #   SLIPPAGE                   the difference between the price you decided on and the price
      #                              you got. Model it as a function of spread and of your size
      #                              against typical volume, and be pessimistic.
      #   MARKET IMPACT              your own order moving the price. Ignorable at small size,
      #                              which is a real reason a small account has an advantage —
      #                              say so, and say where it stops being true.
      #   BORROW AND FINANCING       for short positions and anything held on margin.
      # THE ARITHMETIC THAT ENDS MOST STRATEGIES, and it should be done on screen: cost per round
      # trip multiplied by turnover. A strategy trading daily needs to clear costs daily, and a
      # small edge multiplied by high turnover is a reliable way to pay a broker.
      # THE RULE: A STRATEGY THAT ONLY WORKS AT ZERO COST DOES NOT WORK. Run every result at
      # double your cost estimate and see what survives; if the conclusion changes, you did not
      # have a conclusion.
      - n: "10"
        slug: costs-and-slippage
        title: "Costs First — Spread, Slippage, and the Turnover Arithmetic That Ends Strategies"
        hands_on: ["koan:predict", "koan:reconcile"]
        core: true
        status: planned
      # COVER: the step between a signal and an order, which beginners treat as trivial and which
      # determines most of the outcome.
      #   THE SAME SIGNAL AT TWO SIZES IS TWO DIFFERENT STRATEGIES, and this is the sentence the
      #   episode exists for. Sizing decides the drawdown, and drawdown decides whether a human
      #   is still running the system in month eight.
      #   THE METHODS, PLAINLY: fixed cash, fixed fraction of equity, volatility-targeted (size
      #   inversely to recent volatility, so each position contributes comparable risk), and
      #   risk-per-trade against a stop distance.
      #   THE PORTFOLIO, WHICH IS WHERE SINGLE-INSTRUMENT THINKING BREAKS: twenty positions in
      #   one sector is one position. Correlation, gross and net exposure, and per-position and
      #   total caps.
      #   REBALANCING AND ITS COST — the drift band, and the fact that rebalancing more often
      #   buys precision and pays Series 2 · 10's costs for it.
      # ⚠ AND THE ONE PLACE TO BE CAREFUL: leverage and formulas that promise optimal growth are
      # correct given assumptions that never hold and are catastrophically sensitive to the
      # estimates you feed them. Name the idea, show the sensitivity, and DO NOT PRESENT ANY
      # SIZING RULE AS A RECOMMENDATION.
      - n: "15"
        slug: position-sizing
        title: "From Signal to Quantity — Why the Same Signal at Two Sizes Is Two Strategies"
        hands_on: ["koan:choose", "koan:predict"]
        core: true
        status: planned
      # COVER: measurement, which is where a reader learns to be unimpressed.
      #   THE NUMBERS AND WHAT EACH ACTUALLY SAYS: CAGR, volatility, Sharpe, maximum drawdown,
      #   TIME UNDER WATER (how long until a new high — the number that predicts whether a human
      #   keeps going, and almost nobody quotes it), turnover, hit rate, and the average win
      #   against the average loss.
      #   HOW EACH ONE LIES: Sharpe assumes a distribution that returns do not have and is
      #   flattered by anything that sells insurance — a strategy that makes a little constantly
      #   and loses enormously rarely has a beautiful Sharpe until the day it does not. A hit
      #   rate says nothing without the size of the losses. CAGR over a period chosen after the
      #   fact says nothing at all.
      #   THE BENCHMARK QUESTION, ASKED PROPERLY: against buying and holding the same universe,
      #   at the same risk, over the same period, after the same costs. Most strategies stop
      #   being interesting at this line and the course must draw it.
      #   READING AN EQUITY CURVE HONESTLY: where the returns came from. If three days out of two
      #   thousand produced everything, you do not have a strategy, you have three days.
      # THE HABIT: NEVER REPORT ONE NUMBER. A result is a set — return, drawdown, turnover, cost
      # sensitivity and the period — and any one of them alone is marketing.
      - n: "20"
        slug: measuring-a-strategy
        title: "The Metrics, and How Each One Lies — Including Time Under Water"
        hands_on: ["koan:diagnose", "koan:capture"]
        core: true
        status: planned
      # THE EPISODE THIS ENTIRE COURSE IS BUILT AROUND. If a reader takes one thing away, this is
      # it, and it is the skill that transfers to every other part of data work.
      # THE PROBLEM, STATED SO IT CANNOT BE MISUNDERSTOOD: try enough strategies on one dataset
      # and one of them will look excellent BY CHANCE. This is not a warning about carelessness,
      # it is arithmetic — it happens to careful people, and it happens in proportion to how hard
      # they worked. The more parameters you tried, the more certain it is.
      #   THE SUBTLE FORM THAT CATCHES EVERYBODY: you did not run a thousand backtests, you ran
      #   forty and looked at the results and adjusted. YOU ARE THE SEARCH ALGORITHM. Every
      #   decision you made after seeing a result spent some of your out-of-sample data.
      # WHAT ACTUALLY HELPS, in decreasing order of usefulness:
      #   A REASON THE EDGE SHOULD EXIST, stated BEFORE testing — a structural argument about who
      #   is on the other side and why they accept the loss. A strategy with no story is a
      #   pattern in noise until proven otherwise.
      #   FEWER PARAMETERS, and a result that is FLAT across nearby parameter values. A peak that
      #   collapses when a window moves from 20 to 22 is a peak in noise.
      #   WALK-FORWARD, honestly done: fit on a window, test on the next, roll — and count every
      #   variant you ever tried, including the ones you abandoned.
      #   HELD-OUT DATA YOU TOUCH ONCE. Once. Looking twice makes it training data.
      #   ADJUSTING FOR THE NUMBER OF TRIALS — the deflated-Sharpe idea, which is the formal
      #   version of "you tried a hundred things, so a Sharpe of 1 means less than it looks".
      # THE CONCLUSION THE EPISODE MUST REACH AND NOT SOFTEN: MOST BACKTESTED EDGES ARE NOISE,
      # including yours, and the correct default posture towards a good-looking result is
      # suspicion. A reader who leaves with that instinct has received the value of this course
      # whether or not they ever trade.
      - n: "25"
        slug: overfitting
        title: "You Are the Search Algorithm — Why Most Backtested Edges Are Noise"
