        hands_on: ["koan:predict", "koan:choose"]
        core: true
        status: planned
      # COVER: the obligations, briefly, accurately, and without pretending to be an authority.
      # WHAT IS UNIVERSALLY TRUE AND WORTH SAYING:
      #   YOU ARE RESPONSIBLE FOR WHAT YOUR CODE DOES. "The bot did it" is not a defence to your
      #   broker, your tax authority or anybody else.
      #   RECORDS MATTER. Every trade, with its timestamp, price, fees and rationale. The system
      #   already produces this if Series 4 · 05 was built; the point is to keep it and to be
      #   able to export it.
      #   THE BROKER'S TERMS ARE A REAL CONSTRAINT: automated access, rate limits, market-data
