  - slug: series2-columnar-engines-and-cubes
    title: Columnar Engines & Cubes
    tagline: make queries fast with columnar engines and cubes
    level: intermediate
    episodes:
      # SOURCE (stonebraker): The C-Store argument for column-oriented storage, which DuckDB and ClickHouse both descend from.
      - n: "00"
        slug: columnar-storage
        title: "Columnar Storage — Why Analytics Loves Columns"
        tags: ["stonebraker"]
        credits:
          - source: stonebraker
            concept: "The C-Store argument for column-oriented storage, which DuckDB and ClickHouse both descend from"
        hands_on: ["koan:count:scanned"]
        core: true
        data:
          source: northwind_co_m
          tables: ["Orders", "Order Details"]
          fit: MISSING
          reason: "NOT AVAILABLE: academy-northwind-co-install.groovy currently implements only Company S, not northwind_co_m. Once M exists with 500,000 orders and about 1.25 million lines, it will provide enough row groups to compare column projection and scan work. Minimum: about 100,000 orders with repeated low-cardinality status/channel values."
        status: planned
      # ADDED 2026-09-07, and it is the one gap in this academy's lineage table that was a
      # CONTENT gap rather than an attribution one. TEN COURSES mention Parquet — Java & Groovy,
      # Python for Data, DuckDB, Spark, Trino, Polars, Iceberg, this one — and Python for Data
      # 1 · 15 is even called "why Parquet usually wins". NOT ONE OF THEM EXPLAINS WHY IT WINS:
      # checked by grep, zero hits anywhere for row group, column chunk, dictionary encoding or
      # footer.
      #
      # AND IT IS LOAD-BEARING FOR FOUR OTHER COURSES. Trino's pushdown, DuckDB's speed,
      # Iceberg's data skipping and Spark's partition pruning are all THE SAME MECHANISM seen
      # from four sides, and none of them can explain it because none of them owns the file
      # format. This episode is where it belongs — beside 00, which credits C-Store for the
      # column-store idea; this is the file that idea produced.
      #
      # COVER, outside in:
      #   THE LAYOUT        file -> ROW GROUPS -> column chunks -> pages. And the fact that
      #                     decides everything: THE FOOTER HOLDS THE METADATA AND IS READ FIRST,
      #                     so a reader knows what is in the file before reading any of it.
      #   MIN/MAX STATISTICS  per row group and per page. This is why predicate pushdown works
      #                     at all — a whole row group can be discarded without decompressing a
      #                     byte. Learn SQL, Series 3 · 18 taught filtering early; this is what
      #                     the file does with your filter.
      #   ENCODINGS         dictionary, run-length, bit-packing, delta — and the distinction
      #                     nobody draws: ENCODING IS NOT COMPRESSION. A low-cardinality column
      #                     becomes tiny because it is dictionary-encoded, and snappy or zstd is
      #                     then applied on top. ClickHouse's LowCardinality is the same idea in
      #                     a different product.
      #   NESTED DATA       repetition and definition levels, from the Dremel paper — how a
      #                     COLUMN-ORIENTED file stores a record containing arrays and structs
      #                     without losing its shape. Most readers have never wondered how that
      #                     is possible, and the answer is genuinely elegant.
      #
      # THE CONSEQUENCE THAT MAKES IT ACTIONABLE, and it is the whole payoff: SORT BEFORE YOU
      # WRITE. Min/max statistics only skip when values are clustered — write the same rows in
      # random order and every row group's range covers everything, so nothing is skipped and
      # the file is no faster than a CSV with better compression. Series 2 · 15 owns sort keys
      # as a warehouse decision; this is why they exist at the file level.
      # ROW GROUP SIZE as the second dial: too small and per-group overhead dominates, too large
      # and there is nothing granular left to skip.
      #
      # WHAT GOES WRONG: a team writes Parquet, measures no improvement, and concludes the
      # format is overrated. The data was written unsorted, every row group holds the full range
      # of every column, and not one of them could be skipped.
      - n: "02"
        slug: inside-a-parquet-file
        title: "Inside a Parquet File — Row Groups, Encodings and Why Skipping Works"
        tags: ["melnik-dremel"]
        credits:
          - source: melnik-dremel
            concept: "Repetition and definition levels — the columnar encoding for nested data that Parquet took directly from Dremel"
        hands_on: ["koan:count:scanned", "koan:predict"]
        core: true
        data:
          source: northwind_co_files
          tables: ["order_lines/*.parquet (sorted and unsorted)", "web_orders.parquet"]
          fit: MISSING
          reason: "D4's Parquet export of D1-M order lines (~1.25M rows) in a sorted and an unsorted copy with a fixed row-group size, so min/max statistics skip row groups in one copy and none in the other. For the nested-data beat, add a web_orders.parquet with items as LIST<STRUCT<sku, qty, unit_price, discount>> parsed from WebOrders.Payload (built at S), so repetition and definition levels are shown on the company's own records."
        status: planned
      - n: "05"
        slug: duckdb
        title: "DuckDB — An Analytical Warehouse That Runs Inside Your Process"
        hands_on: ["koan:complete", "duckdb"]
        core: true
        data:
          source: northwind_co_s
          tables: ["Orders", "Order Details", "Products", "Customers"]
          fit: good
          reason: "datasets/northwind-co/northwind_co.duckdb is the install script's own DuckDB output, so the in-process story is literal: open one file from Python or the CLI and query 10,000 orders with no server. Querying Parquet in place belongs to S2 · 02 and S3 · 20."
        status: planned
      - n: "10"
        slug: clickhouse-mergetree
        title: "ClickHouse & MergeTree — Columnar Storage on a Server, at Scale"
        hands_on: ["koan:complete", "clickhouse"]
        core: true
        data:
          source: northwind_co_m
          tables: ["Orders", "Order Details"]
          fit: MISSING
          reason: "NOT AVAILABLE: academy-northwind-co-install.groovy currently implements only Company S, and no Company M source is available for the ClickHouse load. Once M exists, its 500,000 orders inserted in batches will make MergeTree parts, merges, and ORDER BY behavior visible. Minimum: 100,000 orders in multiple batches."
        status: planned
      - n: "15"
        slug: partitioning-and-sort-keys
        title: "Partitioning, Sort Keys & Data Skipping — Read Less, Answer Sooner"
        hands_on: ["koan:count:scanned", "koan:diagnose"]
        core: true
        data:
          source: northwind_co_dw_m
          tables: ["fact_order_line", "dim_date"]
          fit: MISSING
          reason: "NOT AVAILABLE: D5-M is not currently generated. Its planned approximately 1.25 million lines over 60 months would make month partitioning, date sort keys, and data skipping measurable. Minimum: 100,000 lines over 24 months plus one deliberately mispartitioned comparison table."
        status: planned
      # THE SKILL: name the business's metrics ONCE, in one reviewed place, instead of
      # re-deriving them in every query. That is what a semantic layer is, and it is the same
      # idea wherever you meet it.
      # DEMONSTRATED IN DataPallas's Cube DSL, whose five parts ARE the syllabus of this
      # episode: dimensions (what you slice by, named the way the business talks), measures
      # (what you aggregate), joins (so nobody retypes the foreign keys), segments (reusable
      # named filters — "last 30 days"), hierarchies (country -> region -> city, the drill path).
      # See content/docs/semantic-layer/dsl-reference.mdx before writing this.
      # ADDED 2026-09-07. An audit for object-storage coverage found this phrase mentioned ONCE
      # in the whole academy — in Distributed SQL — while Snowflake is named in four courses and
      # Databricks in one, always in passing. The architecture underneath all of them, and under
      # the lakehouse at Series 3 · 20, had no episode anywhere.
      #
      # IT IS NOT A COURSE, AND THAT WAS CONSIDERED. It is deep rather than wide: nobody chooses
      # this architecture, they inherit it by choosing a product. So the reader's need is to READ
      # A VENDOR'S PAGE AND KNOW WHICH PROPERTIES FOLLOW — which is one episode, here, where the
      # reader has just met two engines that do the opposite.
      #
      # PLACED AT 17 BECAUSE THE SERIES HAS ALREADY BUILT THE LADDER, and this is its third rung:
      #   05  DUCKDB           storage and compute in ONE PROCESS, on one disk.
      #   10  CLICKHOUSE       compute owns its LOCAL DISKS. Adding capacity means moving data.
      #   17  SEPARATED        the bytes live in object storage; compute is stateless and reads
      #                        them over a network.
      # Stating it as a progression is what makes it land — each rung gives something up.
      #
      # WHAT SEPARATION BUYS, and each is a consequence rather than a feature:
      #   SCALE INDEPENDENTLY   a big query gets a big cluster for ten minutes and gives it back.
      #   COMPUTE TO ZERO       a dataset nobody queried this month costs storage only, which
      #                         changes the economics of keeping history at all.
      #   ONE COPY, MANY ENGINES  the lakehouse claim from Series 3 · 20 — Trino, Spark and
      #                         DuckDB reading the same files, with no copy per tool.
      #   NO REBALANCING        replace or resize compute without moving a byte, which is the
      #                         operational cost ClickHouse at 10 still has.
      #
      # WHAT IT COSTS, AND THIS HALF IS WHY THE EPISODE EXISTS:
      #   EVERY READ CROSSES A NETWORK   there is a latency floor per request. These systems are
      #                         throughput machines and are genuinely poor at point lookups —
      #                         which is why nobody serves an application from one.
      #   SO CACHING BECOMES THE PERFORMANCE STORY   a local SSD cache on the compute node, and
      #                         a COLD cluster is slow in a way a warm one is not. THIS IS THE
      #                         "the first query is always slow" phenomenon everybody notices
      #                         and nobody explains, and naming it is worth the episode alone.
      #   REQUESTS ARE BILLED   object storage charges per request, so a table stored as two
      #                         hundred thousand small files costs money as well as time. Data
      #                         Ops, Series 1 · 47 owns that cost model; this is where it lands
      #                         on a query.
      #   METADATA BECOMES A BOTTLENECK   listing a bucket is expensive and slow, which is
      #                         precisely why a table format keeps manifests. Apache Iceberg &
      #                         Table Formats, Series 1 · 00 is that argument, and a reader who
      #                         meets this episode first will understand why that one exists.
      #
      # NAME WHO WORKS THIS WAY and stop: Snowflake, BigQuery, Databricks, ClickHouse Cloud,
      # MotherDuck, Neon for PostgreSQL, and any lakehouse assembled from a table format and an
      # engine. Examples of a shape, never products taught here.
      #
      # ── SAY THIS OUT LOUD IN THE LESSON: THERE ARE TWO SNOWFLAKES ─────────────
      # THE ONE IN THE LINE ABOVE IS SNOWFLAKE INC., a company, selling a managed cloud data
      # warehouse as SaaS — you cannot self-host it, and it runs on somebody else's cloud. It is
      # named here because it is the commercial proof of the architecture this episode teaches:
      # three separated layers, with "virtual warehouses" as independently sized compute that
      # several teams can point at the same data without contending.
      #
      # THE PAPER, NAMED PRECISELY — because "the primary source" on its own says nothing, and
      # an earlier draft of this comment said exactly that: Dageville et al., "The Snowflake
      # Elastic Data Warehouse", SIGMOD 2016.
      # IT IS THE PRIMARY SOURCE FOR ONE THING: how Snowflake's own engineers describe their
      # architecture — the three layers, the micro-partitions, the elasticity claim. Useful
      # because it is specific and technical where the marketing is not.
      # IT IS NOT A SOURCE FOR SEPARATION OF STORAGE AND COMPUTE AS AN IDEA. That is older than
      # the company, and Google's Dremel paper describes another system doing it around 2010.
      # Read it as an argument by interested parties, the same caution Series 3 · 20 carries for
      # the lakehouse paper. VERIFY AUTHORS, TITLE AND VENUE before citing it in a lesson.
      #
      # AND IT IS DELIBERATELY NOT A `credits` ENTRY. Series 3 · 20 credits a paper because it
      # teaches THAT PAPER'S NAMED ARCHITECTURE. This episode teaches the architecture generally
      # and names five products as examples, so hanging a credit on one vendor's paper would
      # imply they invented the idea. A reading pointer in a comment, not a badge on the episode.
      #
      # THE OTHER ONE IS A SCHEMA SHAPE, and it has nothing whatever to do with the company —
      # a star whose dimensions have been normalised into sub-dimensions. Decades old, nobody's
      # product. Data Modeling, Series 3 · 32 is "Snowflake vs Star — Normalizing Dimensions,
      # and What It Costs You".
      #
      # IT IS PURE COINCIDENCE, AND THIS FILE CAUSES THE COLLISION ITSELF: two of this course's
      # own excludes say "star vs snowflake", and this episode says "Snowflake, BigQuery,
      # Databricks" — same word, same curriculum, two unrelated meanings, and until 2026-09-07
      # nothing anywhere told the reader. One sentence here settles it, and this is the right
      # episode for it because this is where the VENDOR sense appears.
      # PRECEDENT: Analytics Engineering with dbt handles its own name collision deliberately in
      # its header, for the same reason — a reader who has to guess which one you meant has
      # already stopped learning.
      #
      # SEAMS: Data Ops, Series 1 · 47 is the bucket and its bill. Distributed SQL, Series 3 · 10
      # owns serverless billing as a purchasing decision. Series 3 · 30 below owns cost, tiering
      # and TTL. This episode owns the architecture that makes all three make sense.
      #
      # THE FAILURE TO BUILD THE LESSON AROUND: a team migrates to a separated engine, the demo
      # is fast, and in production the first query of every morning takes forty seconds. Nobody
      # can reproduce it after ten o'clock, three people tune the SQL, and the answer is a cold
      # cache on a cluster that scaled to zero overnight.
      - n: "17"
        slug: storage-and-compute-separated
        title: "Storage and Compute, Separated — Reads Cross a Network, Compute Can Sleep"
        hands_on: ["koan:choose", "koan:predict"]
