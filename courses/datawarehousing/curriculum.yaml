# The ordered episode list for Data Warehousing. Field docs live in courses/learnsql/curriculum.yaml.
# `short` is omitted until an episode has a video.
#
# The job this track teaches: build the place the questions get answered fast. Series 1 is
# why a warehouse exists and how you query one, Series 2 is the columnar engines and cubes
# that make it quick, Series 3 is scale, cost and the modern lakehouse.

course: learn-data-warehousing
track: datawarehousing
title: Data Warehousing

excludes:
  - topic: "Designing the dimensional model — grain, SCD type, star vs snowflake"
    where: "covered in Data Modeling; here you build and query the model"
  - topic: "The pipelines that load it"
    where: "covered in ETL & Data Pipelines and Analytics Engineering (dbt)"
  - topic: "Dashboards, metric definitions and delivery to business users"
    where: "covered in BI & Data Visualization"

