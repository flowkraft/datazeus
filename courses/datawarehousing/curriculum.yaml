          fit: good
          reason: "Both halves exist and verify on DuckDB 2026-09-20 (academy-verify): northwind_co_s is the operational source (Orders, Order Details, Invoices) and northwind_co_dw_s the star built from it. The difference to reconcile is real rather than staged: the 2024-12-31 02:00 load cutoff leaves 9,988 of the source's 10,000 orders and 25,190 of its 25,233 lines in the star, and _load_audit records the cutoff that explains it. For the status beat, D2's change log carries order 10185 — Open, Cancelled, Open, Shipped. Test orders are deliberately not in D1 (see academy-northwind-co-install), so the lesson should not reach for that difference."
        status: planned
      - n: "25"
        slug: slice-dice-rollup-drilldown
        title: "Slice, Dice, Roll-Up & Drill-Down — The Four Analytical Moves"
        credits:
          - source: kimball
            concept: "SLICE, DICE, DRILL DOWN and DRILL UP — the analytical moves a star exists to make cheap"
        tags: ["kimball"]
        hands_on: ["koan:complete"]
        core: true
        data:
          source: northwind_co_dw_s
          tables: ["fact_order_line", "dim_date", "dim_customer", "dim_product"]
          fit: good
          reason: "academy-northwind-co-dw-install builds D5-S from Company S: the drill paths are dim_date's year > quarter > month > day over 60 months (2020–2024), dim_customer's country > city (21 countries, 46 cities, Region NULL where the country has none) and category > product (8 categories). Installed and verified on DuckDB 2026-09-20 (academy-verify, all 12 tables)."
        status: planned
      # SEAM ADDED 2026-09-07, when Learn SQL gained its own GROUPING SETS episode at its
      # Series 2 · 50 (38 until the 2026-09-15 reorder). The two are not redundant and the split is by READER:
      #   LEARN SQL     owns the SYNTAX — the three keywords, the GROUPING() function and the
      #                 subtotal NULL, on Northwind, for someone learning to write queries.
      #   HERE          owns the WAREHOUSING MOVE — subtotals over a star schema, next to
      #                 slice, dice, roll-up and drill-down at 25, for someone building one.
      # This episode may now ASSUME the syntax and spend its time on the star instead.
      - n: "30"
        slug: rollup-cube-grouping-sets
        title: "ROLLUP, CUBE & GROUPING SETS — Subtotals the Standard Way"
        hands_on: ["koan:predict", "koan:complete"]
        core: true
        data:
          source: northwind_co_dw_s
          tables: ["fact_order_line", "dim_date", "dim_customer", "dim_product"]
          fit: good
          reason: "academy-northwind-co-dw-install builds D5-S from Company S: dim_customer leaves Region NULL where the country has none (106 of 121 current customers), a real NULL beside ROLLUP's subtotal NULL, across 21 countries and 8 categories. Installed and verified on DuckDB 2026-09-20 (academy-verify, all 12 tables)."
        status: planned
      # SOURCE (kimball): AGGREGATE FACT TABLES and SHRUNKEN DIMENSIONS — his terms for summary tables done correctly.
      - n: "35"
        slug: pre-aggregation
        title: "Pre-Aggregation — Summary Tables and Materialized Views"
        credits:
          - source: kimball
            concept: "AGGREGATE FACT TABLES and SHRUNKEN DIMENSIONS — his terms for summary tables done correctly"
        tags: ["kimball"]
        hands_on: ["koan:equivalent", "koan:count:scanned"]
        core: true
        data:
          source: northwind_co_dw_s
          tables: ["fact_order_line", "fact_sales_target", "dim_date", "dim_product"]
          fit: good
          reason: "academy-northwind-co-dw-install builds D5-S from Company S: 25,190 lines over 60 months and category-month targets in fact_sales_target, across 8 categories, so the learner-built aggregate fact and shrunken dimensions can be checked against the detail. Installed and verified on DuckDB 2026-09-20 (academy-verify, all 12 tables)."
        status: planned
      # SOURCE (kimball): THE DATE DIMENSION doing real work — the attributes he argues for (fiscal periods, holiday flags, day-of-week names).
      - n: "40"
