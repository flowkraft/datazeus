  - slug: series2-columnar-engines-and-cubes
    title: Columnar Engines & Cubes
    tagline: make queries fast with columnar engines and cubes
    level: intermediate
    episodes:
      # SOURCE (stonebraker): The C-Store argument for column-oriented storage, which DuckDB and ClickHouse both descend from.
      - n: "00"
        slug: columnar-storage
        title: "Columnar Storage — Why Analytics Loves Columns"
        tags: ["stonebraker"]
        credits:
          - source: stonebraker
            concept: "The C-Store argument for column-oriented storage, which DuckDB and ClickHouse both descend from"
        hands_on: ["koan:count:scanned"]
        core: true
        data:
          source: northwind_co_s
          tables: ["Orders", "Order Details"]
          fit: partial
          reason: "Company S: 10,000 orders and 25,233 lines, with low-cardinality values that compress well (3 statuses, 4 channels). Column projection shows here, at any size. Row-group skipping does not: on DuckDB 2026-09-26, Orders and Order Details are 1 row group each at S (1 and 3 at M), against 9 and 22 at L. So the episode's second beat points at S2 · 02's Parquet pair at L, where skipping has row groups to skip."
        status: planned
      # ADDED 2026-09-07, and it is the one gap in this academy's lineage table that was a
      # CONTENT gap rather than an attribution one. TEN COURSES mention Parquet — Java & Groovy,
      # Python for Data, DuckDB, Spark, Trino, Polars, Iceberg, this one — and Python for Data
      # 1 · 15 is even called "why Parquet usually wins". NOT ONE OF THEM EXPLAINS WHY IT WINS:
      # checked by grep, zero hits anywhere for row group, column chunk, dictionary encoding or
      # footer.
      #
      # AND IT IS LOAD-BEARING FOR FOUR OTHER COURSES. Trino's pushdown, DuckDB's speed,
      # Iceberg's data skipping and Spark's partition pruning are all THE SAME MECHANISM seen
      # from four sides, and none of them can explain it because none of them owns the file
      # format. This episode is where it belongs — beside 00, which credits C-Store for the
      # column-store idea; this is the file that idea produced.
      #
      # COVER, outside in:
      #   THE LAYOUT        file -> ROW GROUPS -> column chunks -> pages. And the fact that
      #                     decides everything: THE FOOTER HOLDS THE METADATA AND IS READ FIRST,
      #                     so a reader knows what is in the file before reading any of it.
      #   MIN/MAX STATISTICS  per row group and per page. This is why predicate pushdown works
      #                     at all — a whole row group can be discarded without decompressing a
      #                     byte. Learn SQL, Series 3 · 18 taught filtering early; this is what
      #                     the file does with your filter.
      #   ENCODINGS         dictionary, run-length, bit-packing, delta — and the distinction
      #                     nobody draws: ENCODING IS NOT COMPRESSION. A low-cardinality column
      #                     becomes tiny because it is dictionary-encoded, and snappy or zstd is
      #                     then applied on top. ClickHouse's LowCardinality is the same idea in
      #                     a different product.
      #   NESTED DATA       repetition and definition levels, from the Dremel paper — how a
      #                     COLUMN-ORIENTED file stores a record containing arrays and structs
      #                     without losing its shape. Most readers have never wondered how that
      #                     is possible, and the answer is genuinely elegant.
      #
      # THE CONSEQUENCE THAT MAKES IT ACTIONABLE, and it is the whole payoff: SORT BEFORE YOU
      # WRITE. Min/max statistics only skip when values are clustered — write the same rows in
      # random order and every row group's range covers everything, so nothing is skipped and
      # the file is no faster than a CSV with better compression. Series 2 · 15 owns sort keys
      # as a warehouse decision; this is why they exist at the file level.
      # ROW GROUP SIZE as the second dial: too small and per-group overhead dominates, too large
      # and there is nothing granular left to skip.
      #
      # WHAT GOES WRONG: a team writes Parquet, measures no improvement, and concludes the
      # format is overrated. The data was written unsorted, every row group holds the full range
      # of every column, and not one of them could be skipped.
      - n: "02"
        slug: inside-a-parquet-file
        title: "Inside a Parquet File — Row Groups, Encodings and Why Skipping Works"
        tags: ["melnik-dremel"]
        credits:
          - source: melnik-dremel
            concept: "Repetition and definition levels — the columnar encoding for nested data that Parquet took directly from Dremel"
        hands_on: ["koan:count:scanned", "koan:predict"]
        core: true
        data:
          # If your laptop has trouble at L size, try our M export instead (northwind_co_files_m): it has 10x less data but is still larger than S.
          source: northwind_co_files_l
          tables: ["order_lines/*.parquet (sorted and unsorted)", "web_orders.parquet"]
          fit: partial
          reason: "academy-files-export writes the pair this needs and records the evidence: order_lines_sorted.parquet and order_lines_unsorted.parquet, the same rows in row groups of 10,240 with zstd, and manifest.json carries the counts under 'pruning'. The episode runs on the L export: a filter on 2024-06 reads 2 of 25 row groups sorted against 25 of 25 unsorted at M, and only 1 of 3 against 3 of 3 at S (DuckDB 2026-09-26), too few groups to show skipping. At L the 2,510,619 lines make about 245 row groups (arithmetic). web_orders.parquet supplies the nested beat, ship_to as STRUCT and items as LIST<STRUCT>, parsed from WebOrders.Payload. Partial because the export has run at S and M (250,834 lines at M in 88 seconds) but never at L."
        status: planned
      - n: "05"
        slug: duckdb
        title: "DuckDB — An Analytical Warehouse That Runs Inside Your Process"
        hands_on: ["koan:complete", "duckdb"]
        core: true
        data:
          source: northwind_co_s
          tables: ["Orders", "Order Details", "Products", "Customers"]
          fit: good
          reason: "datasets/northwind-co/northwind_co.duckdb is the install script's own DuckDB output, so the in-process story is literal: open one file from Python or the CLI and query 10,000 orders with no server. Querying Parquet in place belongs to S2 · 02 and S3 · 20."
        status: planned
      - n: "10"
        slug: clickhouse-mergetree
        title: "ClickHouse & MergeTree — Columnar Storage on a Server, at Scale"
        hands_on: ["koan:complete", "clickhouse"]
        core: true
        data:
          # If your laptop has trouble at L size, try our M variant instead (northwind_co_m): it has 10x less data but is still larger than S.
          source: northwind_co_l
          tables: ["Orders", "Order Details"]
          fit: MISSING
