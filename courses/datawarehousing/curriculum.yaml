      # HAD NO COVER COMMENT AT ALL until 2026-09-07, which an audit caught while asking a
      # different question: the word appears in five curricula and the ARCHITECTURE is explained
      # in none of them. A writer opening this episode had the title and nothing else.
      #
      # TEACH IT AS FOUR BOXES, because that is what makes it an architecture rather than a
      # slogan — and because each box is now its own course in this academy:
      #   STORAGE        object storage. Data Ops, Series 1 · 47.
      #   TABLE FORMAT   what turns a folder of Parquet into a table with ACID, schema evolution
      #                  and time travel. Apache Iceberg & Table Formats owns it, and its
      #                  Series 1 · 00 is "A Folder Is Not a Table".
      #   CATALOG        who holds the pointer to the current version. Iceberg, Series 2 · 00.
      #   ENGINE         whatever answers the SQL — Trino, Spark, DuckDB, ClickHouse.
      # THE CLAIM THE ARCHITECTURE MAKES: each box is swappable and none of them owns your data,
      # so you get warehouse behaviour without copying the data into a warehouse. THAT is the
      # thing to teach; the file formats are the demonstration.
      #
      # WHERE THE WORD CAME FROM, and it belongs in the lesson rather than a footnote:
      # DATABRICKS COINED IT in 2020 and argued it in a CIDR 2021 paper. That is why it is worth
      # crediting rather than dismissing — there is a stated architecture and a claim you can
      # disagree with.
      # AND WHAT IS OLDER THAN THE NAME, said in the same breath so nobody thinks 2020 invented
      # any of it: "data lake" is James Dixon's, around 2010; Hive gave SQL over HDFS the same
      # year; columnar files are older still. THE GENUINELY NEW PART WAS THE TABLE FORMAT, and it
      # arrived from three directions at once — Delta Lake from Databricks, Iceberg from Netflix,
      # Hudi from Uber. Two of those three are not Databricks, which is precisely what keeps this
      # an architecture instead of a product.
      #
      # AND THE COUNTER-ARGUMENT, which this episode owes the reader because the paper's authors
      # are also the vendor: for KNOWN questions on data you have already loaded, a warehouse or
      # ClickHouse still wins on latency and on operational simplicity — it owns its storage and
      # can lay it out. Series 2 · 17 is why. The lakehouse wins when the data is large, shared
      # between engines, or must not be copied.
      #
      # THE ANCESTOR WORTH ONE SENTENCE: this is Hadoop's four boxes redrawn — HDFS became object
      # storage, MapReduce became Spark and Trino, the Hive metastore became a catalog. Same
      # architecture, each piece now swappable and owned by somebody else.
      - n: "20"
        slug: lakehouse
        title: "Lakehouse — Parquet, Iceberg and DuckDB Straight on Files"
        tags: ["armbrust-lakehouse"]
        credits:
          - source: armbrust-lakehouse
            concept: "The LAKEHOUSE as a named architecture — warehouse behaviour over open files on object storage, with no copy into a warehouse"
        hands_on: ["koan:complete", "duckdb"]
        status: planned
      # ADDED 2026-09-07. An audit found federation present ONLY as engine mechanics — DuckDB's
      # ATTACH and its scanners, ClickHouse's table functions, PostgreSQL's foreign data
      # wrappers — each taught correctly in its own delta track, and nowhere taught as a
      # DECISION. So a reader knows three ways to do it and has never been asked whether to.
      # PLACED AFTER 20, because the lakehouse episode is the same shape of answer one step
      # earlier: query it where it lies instead of copying it.
      #
      # THE QUESTION: this warehouse needs a table that lives in another database. Copy it on a
      # schedule, or query it across the wire?
      #
      # WHAT ACTUALLY DECIDES IT, and none of it is syntax:
      #   WHERE DOES THE WORK HAPPEN   the whole episode in one question. If the remote side can
      #                                apply your filter and your aggregate, a small answer
      #                                comes back. If it cannot, THE ENGINE DRAGS THE WHOLE
      #                                TABLE ACROSS THE NETWORK AND JOINS IT LOCALLY, and the
      #                                query that ran in a second against 100,000 rows takes
      #                                twenty minutes against fifty million. PUSHDOWN is the
      #                                word. Check it; never assume it.
      #   STATISTICS                   the local planner usually knows nothing about the remote
      #                                table's size or distribution, so it guesses — and a join
      #                                order chosen from a guess is where federated queries go
      #                                wrong in ways the plan does not explain.
      #   THE BLAST RADIUS             a federated query puts analytical load on somebody else's
      #                                OLTP database, at a time you chose. The first person to
      #                                find out is on call for that system.
      #   FRESHNESS AGAINST STABILITY  the honest argument FOR it: no copy means no staleness
      #                                and no pipeline to maintain. Say that fairly.
      #
      # THE RULE TO LEAVE THEM WITH: FEDERATE WHAT IS SMALL, OCCASIONAL OR REFERENCE. COPY WHAT
      # IS LARGE, HOT, OR JOINED IN EVERY QUERY. A currency table, a lookup somebody maintains
      # in another system, a one-off reconciliation — federate. A fact table — never.
      #
      # SEAMS: ETL & Data Pipelines owns the copying, and 3 - 20 above owns reading files in
      # place. The engine tracks own the syntax and should be pointed at rather than repeated.
      - n: "22"
        slug: querying-across-databases
        title: "Querying Across Databases — Federation, and Where the Join Actually Runs"
        hands_on: ["koan:choose", "koan:diagnose"]
        status: planned
