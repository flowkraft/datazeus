        hands_on: ["koan:author", "duckdb"]
        core: true
        tags: ["project"]
        data:
          source: [northwind_co_s, northwind_co_dw_s]
          tables: ["Orders", "Order Details", "Customers", "Products", "Invoices", "fact_order_line"]
          fit: partial
          reason: "The source for the learner's own star is built and complete, so the build-load-query part works today. What is missing is the series' planted incident (the six reconciliation causes, see S1 · 22: test orders and a status history with reinstated orders) and D5-S as the answer key the koans compare the learner's star to."
