        tags: ["kimball"]
        hands_on: ["koan:complete"]
        core: true
        data:
          source: northwind_co_dw_s
          tables: ["dim_date", "fact_order_line", "Orders.OrderDate", "Orders.ShippedDate"]
          fit: partial
          reason: "D5-S's dim_date covers 2020–2025 with ISO weeks, a fiscal year starting in July, 51 UK bank holidays and a working-day flag, and fact_order carries order, required and shipped roles, with 0 'Not applicable' (268 unshipped orders) and -1 'Unknown' (188 ship dates lost in the courier outage). Partial because the source ignores the calendar: 3,024 of the 9,532 shipments fall on a weekend or a UK holiday, so working-day questions (days to ship, holiday dips) show no real effect. Needs ship dates that respect working days in Company S, which would move S's figures."
        status: planned
      # PROJECT, tagged 2026-08-24. Was "Your First Warehouse — Build It, Load It, Query It": already the series project in
