      # ADDED 2026-09-07. An audit found federation present ONLY as engine mechanics — DuckDB's
      # ATTACH and its scanners, ClickHouse's table functions, PostgreSQL's foreign data
      # wrappers — each taught correctly in its own delta track, and nowhere taught as a
      # DECISION. So a reader knows three ways to do it and has never been asked whether to.
      # PLACED AFTER 20, because the lakehouse episode is the same shape of answer one step
      # earlier: query it where it lies instead of copying it.
      #
      # THE QUESTION: this warehouse needs a table that lives in another database. Copy it on a
      # schedule, or query it across the wire?
      #
      # WHAT ACTUALLY DECIDES IT, and none of it is syntax:
      #   WHERE DOES THE WORK HAPPEN   the whole episode in one question. If the remote side can
      #                                apply your filter and your aggregate, a small answer
      #                                comes back. If it cannot, THE ENGINE DRAGS THE WHOLE
      #                                TABLE ACROSS THE NETWORK AND JOINS IT LOCALLY, and the
      #                                query that ran in a second against 100,000 rows takes
      #                                twenty minutes against fifty million. PUSHDOWN is the
      #                                word. Check it; never assume it.
      #   STATISTICS                   the local planner usually knows nothing about the remote
      #                                table's size or distribution, so it guesses — and a join
      #                                order chosen from a guess is where federated queries go
      #                                wrong in ways the plan does not explain.
      #   THE BLAST RADIUS             a federated query puts analytical load on somebody else's
      #                                OLTP database, at a time you chose. The first person to
      #                                find out is on call for that system.
      #   FRESHNESS AGAINST STABILITY  the honest argument FOR it: no copy means no staleness
      #                                and no pipeline to maintain. Say that fairly.
      #
      # THE RULE TO LEAVE THEM WITH: FEDERATE WHAT IS SMALL, OCCASIONAL OR REFERENCE. COPY WHAT
      # IS LARGE, HOT, OR JOINED IN EVERY QUERY. A currency table, a lookup somebody maintains
      # in another system, a one-off reconciliation — federate. A fact table — never.
      #
      # SEAMS: ETL & Data Pipelines owns the copying, and 3 - 20 above owns reading files in
      # place. The engine tracks own the syntax and should be pointed at rather than repeated.
