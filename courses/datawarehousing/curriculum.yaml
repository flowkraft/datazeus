# The ordered episode list for Data Warehousing. Field docs live in courses/learnsql/curriculum.yaml.
# `short` is omitted until an episode has a video.
#
# The job this track teaches: build the place the questions get answered fast. Series 1 is
# why a warehouse exists and how you query one, Series 2 is the columnar engines and cubes
# that make it quick, Series 3 is scale, cost and the modern lakehouse.
#
# ╔════════════════════════════════════════════════════════════════════════════════════╗
# ║  CUBES: THE CONCEPT IS GENERAL, THE DEMO IS DATAPALLAS.                             ║
# ╚════════════════════════════════════════════════════════════════════════════════════╝
# Series 2 · 20-30 is the semantic layer, and it is a general idea: name the business's
# metrics once, in a reviewed place, so a report, a dashboard and an AI question all resolve
# to the same number. Cube.dev, the dbt semantic layer and DataPallas all do it, and all three
# resolve a cube to SQL.
#
# WE DEMONSTRATE IN DATAPALLAS'S OWN CUBE DSL, because it does the job and reaching for a
# third-party tool to teach a feature we ship would be daft. Read these first:
#   content/docs/semantic-layer/index.mdx           what a cube is here, and when NOT to use one
#   content/docs/semantic-layer/dsl-reference.mdx   dimensions, measures, joins, segments,
#                                                   hierarchies — the five parts, with examples
#   content/docs/semantic-layer/quickstart.mdx      a working cube on Northwind in five minutes
# Sample cubes ship with the product (Customer Management, HR, Inventory, Sales Analysis,
# Sales Warehouse), so Series 2 · 25 reads real ones before Series 2 · 30 queries them.
#
# MDX WAS IN A TITLE HERE AND IS GONE. It is Microsoft SSAS / Mondrian's query language,
# nothing in this academy uses it, and teaching it would have taught a legacy vendor dialect
# as though it were "how you query a cube". The general skill is: pick dimensions and measures
# instead of writing the join and the GROUP BY, then READ THE GENERATED SQL — because that is
# the only way to know the layer did not double-count. DataPallas's Show SQL button is where
# the reader sees it; the habit transfers to any semantic layer they meet later.

course: learn-data-warehousing
track: datawarehousing
title: Data Warehousing

# DATASET IMPLEMENTATION NOTE (updated 2026-09-19): every Northwind Company dataset this course reads has
# its script under datasets/scripts/ in this repo:
#   academy-northwind-co-install.groovy     D1, Company S, M and L (northwind_co_s, _m, _l)
#   academy-northwind-co-dw-install.groovy  D5, the star built from Company at the same scale (northwind_co_dw_s, _m, _l)
#   academy-northwind-co-changes.groovy     D2, the next 90 days as a change log
#   academy-crm-export-install.groovy       D3, the CRM export
#   academy-files-export.groovy             D4, the files
# All of them take PostgreSQL, DuckDB and ClickHouse. So far they have run on DuckDB only (S, M and L
# measured 2026-09-19); PostgreSQL M/L and every ClickHouse install have not run yet — which is why the
# ClickHouse episodes here are not `good` however well the dataset behaves on DuckDB. What the three `fit`
# values mean is defined once, in CurriculumSpec. The legacy fact_sales star is not D5.

# Assumes Learn SQL, and assumes Data Modeling's dimensional series for anyone who wants to
# DESIGN rather than query — which is why that one is listed as helpful, not required. This
# track reads and builds a model; that one decides what the model should be.
prerequisites:
  - course: learn-sql
    needs: "Series 2"
    why: >-
      Everything here is a GROUP BY over a join, then the same query made to read less data.
      Series 2 is where multi-table joins and CTEs stop being an obstacle.

excludes:
  - topic: "Designing the dimensional model — grain, SCD type, star vs snowflake"
    where: "covered in Data Modeling; here you build and query the model"
  - topic: "The pipelines that load it"
    where: "covered in ETL & Data Pipelines and Analytics Engineering with dbt"
  - topic: "Dashboards, metric definitions and delivery to business users"
    where: "covered in BI & Data Visualization"

  - topic: "Writing the analytical queries themselves — window functions, CTEs, tuning"
    where: "covered in Learn SQL — here the query is given and the question is how much data it had to read"
  - topic: "Running the server — backups, replication, upgrades, on-call"
    where: "covered in Data Ops"

  # The reciprocal of BI's line about cubes. BI already said it; this side did not, and one
  # subject named in only one direction is how a reader concludes we repeated ourselves.
  - topic: "Reading a cube from a dashboard, and the charts built on it"
    where: "covered in BI & Data Visualization, which consumes a cube. In this course, Series 2 designs and builds one"
  # Four tracks touch the star schema and each does a different thing to it. Said here because
  # Data Warehousing is where a reader is most likely to meet the third or fourth one.
  - topic: "Deciding the star's grain, its SCD type and star vs snowflake"
    where: "covered in Data Modeling, Series 3. In this course, Series 1 · 20 loads a design somebody has already made and Series 1 · 10 queries it"

series:
  - slug: series1-warehousing-fundamentals
    title: Warehousing Fundamentals
    tagline: build a warehouse, load it, and prove it matches the source
    level: beginner
    episodes:
      # SOURCE (kimball): The premise of the Toolkit: the reporting schema is a second, differently-shaped copy.
      - n: "00"
        slug: oltp-vs-olap
        title: "OLTP vs OLAP — Two Workloads That Need Different Table Designs"
        credits:
          - source: kimball
            concept: "The premise of the Toolkit: the reporting schema is a second, differently-shaped copy"
        tags: ["kimball"]
        hands_on: ["koan:choose"]
        core: true
        data:
          source: northwind_co_s
          tables: ["Orders", "Order Details", "Customers", "Products", "Categories"]
          fit: good
          reason: "The OLTP half is real and big enough to feel: one order is a point lookup on Orders by OrderID, while 'revenue by category by month, five years' joins Orders, Order Details, Products and Categories and scans all 25,233 lines. The differently-shaped copy it argues for is the star of S1 · 10 (northwind_co_dw_s); this episode only needs the source shape."
        status: planned
      # ALSO NAME KIMBALL vs INMON HERE, in a paragraph. It is vocabulary a reader will be
      # asked about in an interview and will otherwise meet as an argument with no context.
      # This academy does not take a side.
      #   INMON    top-down. One normalised, integrated enterprise warehouse first, then
      #            dimensional marts spun off it. Slower to first value, stronger on
      #            enterprise consistency.
      #   KIMBALL  bottom-up. A dimensional mart per business process, kept joinable by
      #            sharing CONFORMED dimensions (Data Modeling, Series 3 - 45). Faster to
      #            first value, and the bus matrix is what stops it fragmenting.
      #   TODAY    most teams run something closer to Kimball on a lakehouse, and dbt's
      #            staging/marts split is the same shape. Say both names, then move on.
      # AND SAY WHERE THE THIRD WORD CAME FROM, in one line, because this is the episode
      # that defines all three: DATA LAKE was James Dixon's, around 2010. LAKEHOUSE is
      # Databricks', from 2020, argued in a CIDR 2021 paper. Series 3 · 20 is the
      # architecture; here the reader only needs to know the words are not the same age and
      # that one of them has an author.
      # THE HONEST LINE: whichever one they inherited, the reader's job is identical — find
      # the grain, find the conformed dimensions, check the numbers reconcile.
      # SOURCE (kimball): KIMBALL vs INMON — name both, take no side. See the beat above.
      # SOURCE (inmon): Bill Inmon, "Building the Data Warehouse" — the top-down, normalised, enterprise-first position. Paired with Kimball here; take no side.
      - n: "05"
        slug: what-a-warehouse-is
        title: "Warehouse, Lake & Lakehouse — What Each One Actually Is"
        credits:
          - source: kimball
            concept: "KIMBALL vs INMON — name both, take no side"
          - source: inmon
            concept: "Bill Inmon, 'Building the Data Warehouse' — the top-down, normalised, enterprise-first position"
        tags: ["kimball", "inmon"]
        hands_on: ["koan:choose"]
        core: true
        data:
          source: northwind_co_s
          tables: ["Orders", "Order Details", "WebOrders.Payload"]
          fit: good
          reason: "The three words map onto rows that exist: WebOrders.Payload is lake-shaped data (raw JSON, read with a schema at query time, planted defects included) and Orders/Order Details are the modelled, typed tables a warehouse holds. Files for the lakehouse are one COPY ... TO away; the real file exports (northwind_co_files) are S3 · 20's."
        status: planned
      # SOURCE (kimball): THE STAR SCHEMA from the query side — designed in Data Modeling, Series 3 - 10; read here.
      - n: "10"
        slug: star-schema-for-analytics
        title: "The Star Schema from the Query Side — Why Analysts Like It"
        credits:
          - source: kimball
            concept: "THE STAR SCHEMA from the query side — designed in Data Modeling, Series 3 - 10; read here"
        tags: ["kimball"]
        hands_on: ["koan:complete", "cloudbeaver"]
        core: true
        data:
          source: northwind_co_dw_s
          tables: ["fact_order_line", "dim_customer", "dim_product", "dim_date", "dim_employee", "dim_shipper"]
          fit: good
          reason: "academy-northwind-co-dw-install builds D5-S from Company S: fact_order_line (25,190 lines of the 9,988 orders loaded by the 2024-12-31 02:00 cutoff) with dim_customer, dim_product, dim_date, dim_employee and dim_shipper, so every star join the lesson shows runs on it. Installed and verified on DuckDB 2026-09-20: academy-verify matches all 12 tables against their install. DuckDBDataWarehouseCreator's disconnected fact_sales star is still not a substitute."
        status: planned
      # SOURCE (kimball): FACTS, DIMENSIONS and GRAIN — his vocabulary, applied to a warehouse somebody else built.
      - n: "15"
        slug: facts-dimensions-grain-in-practice
        title: "Facts, Dimensions & Grain in Practice — Reading Someone Else's Warehouse"
        credits:
          - source: kimball
            concept: "FACTS, DIMENSIONS and GRAIN — his vocabulary, applied to a warehouse somebody else built"
        tags: ["kimball"]
        hands_on: ["koan:diagnose"]
        core: true
        data:
          source: northwind_co_dw_s
          tables: ["fact_order_line", "fact_order", "fact_inventory_monthly", "fact_sales_target", "dim_date", "dim_product"]
          fit: good
          reason: "academy-northwind-co-dw-install builds D5-S from Company S: four grains side by side: fact_order_line (25,190 lines), fact_order (9,988 orders, Freight once per order), fact_inventory_monthly (4,800 product month-ends, stock semi-additive) and fact_sales_target (488 category-month rows, with no order behind them). Installed and verified on DuckDB 2026-09-20 (academy-verify, all 12 tables)."
        status: planned
      # SOURCE (kimball): The load his method implies: dimensions first, surrogate keys assigned, then facts.
      - n: "20"
        slug: loading-the-warehouse
        title: "Loading the Warehouse — From Northwind OLTP to fact_sales"
        credits:
          - source: kimball
            concept: "The load his method implies: dimensions first, surrogate keys assigned, then facts"
        tags: ["kimball"]
        hands_on: ["koan:author", "koan:rerun"]
        core: true
        data:
          source: northwind_co_s
          tables: ["Customers", "Products", "Categories", "Employees", "Shippers", "Orders", "Order Details"]
          fit: good
          reason: "Everything the load reads exists: natural keys to map to surrogate keys (CustomerID, ProductID, EmployeeID, ShipVia), a line price already fixed as of the order date in Order Details.UnitPrice, and 10,000 orders so a re-run that duplicates rows is visible in the count. The expected star is D5-S (not built), but the koans can check the learner's load against counts taken straight from these tables."
        status: planned
      # SOURCE (kimball): SLICE, DICE, DRILL DOWN and DRILL UP — the analytical moves a star exists to make cheap.
      # ADDED 2026-08-24. THE most repeated conversation anyone who owns a warehouse has, and it
      # was only implicit in the Series 3 project. "Finance says revenue is 1.2M, the dashboard
      # says 1.18M, which is right?" — and until you can answer that, nobody trusts the warehouse.
      # THE SKILL: reconcile a warehouse figure back to the operational system, and know the
      # SIX reasons they legitimately differ before you go looking for a bug:
      #   1. TIMING       the load ran at 02:00; the app has moved since. Always compare
      #                   as-of the same instant, never "now" against "now".
      #   2. GRAIN        the app counts orders, the fact counts order LINES. Series 1 - 15.
      #   3. FILTERS      the warehouse excludes cancelled/test/internal rows and the app does
      #                   not, or the other way round. Usually the real answer.
      #   4. LATE ARRIVALS rows that landed after the cut-off (ETL & Data Pipelines, Series 2 - 20).
      #   5. TYPE AND ROUNDING  money summed as float, or rounded per-row instead of at the end.
      #   6. AN ACTUAL BUG  which is the LAST thing to suspect, not the first.
      # THE DELIVERABLE is a reconciliation QUERY you keep and re-run, not a one-off
      # investigation — that is what turns this from firefighting into a control.
      # KOAN: `equivalent` on the two totals, then `diagnose` on a discrepancy planted as one
      # of the six causes above. Placed at 22, right after Series 1 - 20 loads the warehouse:
      # the first thing you do after loading is prove it is right.
      - n: "22"
