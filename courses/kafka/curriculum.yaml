# The ordered episode list for Apache Kafka. Field docs live in courses/learnsql/curriculum.yaml.
# `short` is omitted until an episode has a video.
#
# The job this track teaches: use Kafka correctly as a data person — get data in and out
# without losing or duplicating a record, and understand the guarantees you actually have,
# which are weaker and more interesting than most teams assume.
#
# ============================================================================
# THE FIRST THING TO SAY: KAFKA IS A LOG, NOT A QUEUE
# ============================================================================
# Almost every misuse of Kafka comes from thinking of it as a message queue. A queue hands a
# message to one consumer and forgets it. A LOG is an ordered, durable, REPLAYABLE sequence
# that many independent consumers read at their own positions, and nothing is removed when it
# is read.
#
# Everything else in this course follows from that: offsets, consumer groups, retention,
# compaction, and the ability to reprocess last month by moving a pointer.
#
# ============================================================================
# IN THIS COURSE, TRY TO FOLLOW THE STRUCTURE OF THE OFFICIAL KAFKA DOCUMENTATION
# ============================================================================
# kafka.apache.org/documentation is organised as Getting Started, APIs, Configuration, Design,
# Implementation, Operations, Security, Connect, Streams. Follow it — and note that the DESIGN
# section is unusually good and is essentially the syllabus for Series 1 and 2.
#   Getting Started + Design ......... Series 1
#   APIs (Producer, Consumer) ........ Series 2
#   Connect .......................... Series 3 · 00
#   Streams .......................... Series 3 · 05
#   Operations, Security ............. Data Ops, not this course
#
# ── WHEN YOU WRITE THE LESSONS, REMEMBER THIS ───────────────────────────────
# THE COVERAGE, THE TOPICS AND THE ORDER OF EACH INDIVIDUAL LESSON — not only this file's
# series order — SHOULD FOLLOW THE OFFICIAL APACHE KAFKA DOCUMENTATION. Before writing an
# episode, open the docs' own section for that topic, use it as the COVERAGE CHECKLIST, and use
# its VOCABULARY FOR THE NOUNS (topic, partition, offset, consumer group, ISR, log compaction).
# Anything left out should be left out because an academy rule says so — ETL owns CDC and dead
# letters as concepts, Data Ops owns running the brokers — and never because it was missed.
#
# EVERY _todo BRIEF IN THIS COURSE MUST REPEAT THIS, with the docs section named. A brief is
# what a writer actually opens; a rule that lives only in this header is a rule that gets
# forgotten at the exact moment it matters.
#
# ============================================================================
# THE SEAM WITH ETL & DATA PIPELINES
# ============================================================================
#   ETL   owns the CONCEPTS, taught engine-free and on purpose — CDC (3 · 15), late and
#         out-of-order data (2 · 20), dead letters (2 · 25), and streaming versus batch
#         (3 · 20, which defines event time and watermarks).
#   HERE  is the transport underneath them. Do not re-teach event time; use it.

course: learn-kafka
track: kafka
title: Apache Kafka

prerequisites:
  - course: learn-etl-pipelines
    needs: "Series 1, and Series 3 · 20"
    why: >-
      ETL & Data Pipelines teaches what a load must guarantee and, at Series 3 · 20, what
      bounded and unbounded data actually mean. This track is the transport that carries the
      unbounded case, and it assumes you already know why that is a different problem.

excludes:
  - topic: "Event time, watermarks and windowing as concepts"
    where: "covered in ETL & Data Pipelines, Series 3 · 20, and applied in Apache Flink"
  - topic: "Running the cluster — broker sizing, KRaft or ZooKeeper operations, rebalancing, security"
    where: "covered in Data Ops for the operational discipline. Here you learn what a PRODUCER AND CONSUMER AUTHOR must know"
  - topic: "Choosing Kafka over a database or a queue"
    where: "covered in ETL & Data Pipelines, Series 3 · 20, which makes the reader decide before reaching for any of this"

series:
  - slug: series1-the-log
    title: The Log
    tagline: topics, partitions, offsets — and why nothing is deleted when you read it
    level: intermediate
    episodes:
      # COVER: the log model against the queue model, and every consequence — replay, multiple
      # independent consumers, and retention by time or size rather than by acknowledgement.
      # Brokers, topics, and the CLI tools you will actually type.
      # THE REFRAME: if you find yourself asking "how do I delete a message after processing",
      # you are still thinking in queues.
      - n: "00"
        slug: log-not-queue
        title: "A Log, Not a Queue — Why Reading a Record Does Not Remove It"
        hands_on: ["koan:predict", "koan:choose"]
        core: true
        status: planned
      # THE MOST CONSEQUENTIAL DESIGN DECISION A USER MAKES.
      # COVER: partitions as the unit of parallelism AND of ordering. ORDER IS GUARANTEED ONLY
      # WITHIN A PARTITION, so the key you choose decides what is ordered relative to what.
      # Keying by customer id keeps one customer's events in order; keying randomly does not.
      # Partition count as a decision that is hard to change later.
      # THE FAILURE: an update processed before the insert it depends on, because they were
      # keyed differently. No error, wrong final state.
      - n: "05"
        slug: partitions-and-keys
        title: "Partitions and Keys — Ordering Is Only Guaranteed Within a Partition"
        hands_on: ["koan:predict", "koan:diagnose"]
        core: true
        status: planned
      # COVER: offsets as the consumer's position, consumer groups as the parallelism and
      # failover mechanism, and the rule that one partition goes to one consumer in a group —
      # so more consumers than partitions means idle consumers. Rebalancing and what it
      # interrupts. Committing offsets, and the difference between auto-commit and manual.
      - n: "10"
        slug: consumer-groups
        title: "Offsets and Consumer Groups — Why a Fifth Consumer Sat Idle"
        hands_on: ["koan:predict", "koan:diagnose"]
        core: true
        status: planned
      # COVER: retention by time and size, and LOG COMPACTION as the other mode — keep the
      # latest value per key forever, which turns a topic into a table. Why compaction is how
      # CDC topics and stateful stores work, and what a tombstone is.
      # THE IDEA A DATA PERSON NEEDS: a compacted topic IS a changelog of a table.
      - n: "15"
        slug: retention-and-compaction
        title: "Retention and Log Compaction — Turning a Topic Into a Table"
        hands_on: ["koan:predict", "koan:choose"]
        core: true
        status: planned
      # COVER: serialisation, and why it is a data-team problem rather than a detail. JSON
      # against Avro against Protobuf, the Schema Registry, and schema evolution rules —
      # backward, forward and full compatibility, and which one your consumers need.
      # THE FAILURE: a producer adds a required field, and every old consumer stops.
      - n: "20"
        slug: schemas
        title: "Serialisation and Schema Evolution — The Field That Broke Every Consumer"
        hands_on: ["koan:predict", "koan:diagnose"]
        core: true
        status: planned
      - n: "25"
        slug: project-design-topics
        title: "Project — Design the Topics and Keys for a Real Event Stream"
        hands_on: ["koan:author", "koan:choose"]
        core: true
        tags: ["project"]
        status: planned

  - slug: series2-guarantees
    title: Guarantees
    tagline: what you actually get, and what it costs
    level: advanced
    episodes:
      # COVER: the producer — acks=0/1/all, retries, and what each combination actually
      # promises. min.insync.replicas as the setting that makes acks=all mean something.
      # Batching and linger.ms, and the throughput/latency trade.
      # THE TRAP: acks=all with min.insync.replicas=1 looks safe and is not.
      - n: "00"
        slug: producer-guarantees
        title: "acks and min.insync.replicas — The Pair That Decides Whether You Lose Data"
        hands_on: ["koan:predict", "koan:choose"]
        core: true
        status: planned
      # COVER: at-most-once, at-least-once and exactly-once, and what each means in practice.
      # Commit before or after processing, and how that single choice picks your semantics.
      # THE HONEST ACCOUNT OF EXACTLY-ONCE: idempotent producers and transactions give it
      # WITHIN Kafka, but the moment you write to an external system you are back to
      # at-least-once plus idempotent writes — which is what ETL Series 1 · 30 already taught.
      # Most teams that believe they have exactly-once have at-least-once and a unique key.
      - n: "05"
        slug: delivery-semantics
        title: "At-Least-Once, Exactly-Once, and What Happens at the Edge of Kafka"
        hands_on: ["koan:predict", "koan:diagnose"]
        core: true
        status: planned
      # COVER: replication, leaders and followers, the in-sync replica set, and unclean leader
      # election as the setting that trades durability for availability. What a broker failure
      # looks like from a producer and a consumer.
      # SEAM: operating this is Data Ops. Understanding what it promises is here.
      - n: "10"
        slug: replication
        title: "Replication and ISR — What a Broker Failure Does to Your Data"
        hands_on: ["koan:predict", "koan:choose"]
        status: planned
      # COVER: consumer lag as THE metric, how to read it, and what causes it — a slow
      # consumer, a rebalance storm, an unbalanced key, or a poison record. max.poll.interval
      # and the rebalance it triggers when processing takes too long, which is the classic
      # "my consumer keeps restarting" cause.
      # THE POISON RECORD and dead-letter topics, pointing at ETL Series 2 · 25.
      - n: "15"
        slug: lag-and-poison-records
        title: "Consumer Lag and Poison Records — Why the Consumer Keeps Restarting"
        hands_on: ["koan:diagnose", "koan:capture"]
        core: true
        status: planned
      - n: "20"
        slug: project-reliable-consumer
        title: "Project — A Consumer That Does Not Lose or Duplicate a Row"
        hands_on: ["koan:author", "koan:diagnose"]
        core: true
        tags: ["project"]
        status: planned

  - slug: series3-kafka-for-data-teams
    title: Kafka for Data Teams
    tagline: Connect, Streams, and the database at the other end
    level: advanced
    episodes:
      # COVER: Kafka Connect as the answer to "I need to get a database into Kafka and out
      # again without writing a consumer" — source and sink connectors, converters, SMTs, and
      # the distributed worker model. Debezium as the CDC source, and what a Debezium message
      # actually contains (before, after, op).
      # SEAM: ETL Series 3 · 15 owns CDC as a strategy; this is the machinery.
      # THIS IS THE MOST USEFUL EPISODE IN THE COURSE FOR A DATA PERSON — most of them will
      # never write a producer, and will absolutely configure a connector.
      - n: "00"
        slug: connect-and-debezium
        title: "Kafka Connect and Debezium — Getting a Database In and Out Without Writing Code"
        hands_on: ["koan:complete", "koan:diagnose"]
        core: true
        status: planned
      # COVER: Kafka Streams as a Java library, not a cluster — KStream against KTable, and the
      # duality that makes a compacted topic a table. Stateful operations and the state store.
      # ksqlDB in one paragraph.
      # SEAM: Flink owns event time and windowing in depth. Here it is the Kafka-native option
      # and when to prefer it, which is mostly "when you are already a JVM shop and the job is
      # small".
      - n: "05"
        slug: kafka-streams
        title: "Kafka Streams — KStream, KTable, and Processing Without Another Cluster"
        hands_on: ["koan:predict", "koan:choose"]
        status: planned
      # COVER: the shape almost every real data platform ends up with — CDC out of the OLTP
      # database, into Kafka, into a warehouse or lake, with the analytical store as the
      # consumer. Sink connectors into ClickHouse, S3 or a warehouse; the ClickHouse Kafka
      # engine as an alternative; and the reconciliation habit — the row count in the source
      # must equal the row count in the sink, checked.
      - n: "10"
        slug: kafka-to-warehouse
        title: "Kafka to the Warehouse — The Shape Most Data Platforms Actually Have"
        hands_on: ["koan:complete", "koan:diagnose"]
        core: true
        status: planned
      # THE EPISODE THAT KEEPS THE TRACK HONEST.
      # COVER: what Kafka is bad at, said plainly — it is not a database (no queries, no
      # indexes, no random access by anything but offset), not a job queue with per-message
      # retries and priorities, and not free to operate. The cases where a table with a
      # timestamp column, or a scheduled batch, or a real job queue is the right answer.
      # AND THE SIZE QUESTION: most teams running Kafka have volumes a single Postgres table
      # would handle. Say so.
      - n: "15"
        slug: what-kafka-is-bad-at
        title: "What Kafka Is Bad At — and the Table With a Timestamp That Would Have Done"
        hands_on: ["koan:choose", "koan:diagnose"]
        core: true
        status: planned
      - n: "20"
        slug: project-cdc-pipeline
        title: "Project — CDC From a Database to an Analytical Store, Reconciled"
        hands_on: ["koan:author", "koan:diagnose"]
        core: true
        tags: ["project"]
        status: planned
