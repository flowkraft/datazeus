  - slug: series2-filesystems-and-zfs
    title: Filesystems, and ZFS
    tagline: what a filesystem owes a database, and the one that can prove it
    level: advanced
    episodes:
      # COVER: what a filesystem actually does — allocate blocks, name them, and survive a
      # crash — and the two mechanisms that decide the last one: JOURNALLING and COPY-ON-WRITE.
      # ext4 and XFS as the sensible defaults, with the honest note that for most data workloads
      # either is fine and XFS tends to be preferred for large files and parallel writes.
      # WHAT A DATABASE ACTUALLY WANTS, which is a shorter list than people expect: that fsync
      # means the bytes are durable, that a partial write cannot corrupt a page, and that the
      # filesystem does not reorder what it promised not to. Everything else is preference.
      - n: "00"
        slug: what-a-filesystem-owes-you
        title: "Journalling, Copy-on-Write and fsync — What a Database Needs From a Filesystem"
        hands_on: ["koan:predict", "koan:capture"]
        core: true
        status: planned
      # COVER: ZFS's model, in its own vocabulary because the docs use it and nothing else does:
      # POOL, VDEV, DATASET and ZVOL. The structural fact that surprises everybody: REDUNDANCY
      # LIVES IN THE VDEV, and a pool is only as redundant as its weakest vdev — so adding a
      # single disk to a mirrored pool quietly destroys the guarantee.
      # MIRRORS AGAINST RAIDZ, with the trade stated: mirrors resilver fast and cost half the
      # capacity, RAIDZ stores more and rebuilds slowly. Series 1 · 20 is why that matters.
      # ADDED after a review asked whether a reader would finish knowing WHAT ZFS IS AND WHY.
      # 00 is filesystems in general and 05 dives straight into vdevs — the mechanism arrived
      # before the motivation, which is the wrong order for somebody deciding.
      # THE FIVE ANSWERS, and this episode owes four of them:
      #   WHAT IT IS      a filesystem and a volume manager IN ONE — which now means something
      #                   concrete, because Series 1 just built the layered version by hand.
      #                   ZFS COLLAPSES 17, 18 AND 19 INTO ONE THING: mdadm's redundancy, LVM's
      #                   pooling and growing, and the filesystem, all owned by one component
      #                   that can therefore see across all three. That is the unusual part, and
      #                   1 · 17's closing sentence — an array that knows the copies disagree and
      #                   cannot know which is right — is the problem this design solves.
      #   WHY IT EXISTS   because a filesystem that does not own the redundancy cannot repair
      #                   what it detects. 10 is the proof; this is the claim.
      #   WHEN IT EARNS ITS PLACE   a machine with several disks you control; data you cannot
      #                   silently corrupt; snapshots you want to be free; a database or
      #                   warehouse where a pre-load snapshot costs nothing and saves a night.
      #                   FOR A WAREHOUSE SPECIFICALLY, say it plainly: snapshot before the
      #                   nightly load, roll back in seconds if it goes wrong, and compression
      #                   usually makes the scans FASTER because fewer bytes leave the disk.
      #   WHEN IT DOES NOT   one virtual disk on a rented VM — use ext4 and read 20's gate.
      # ON DEBIAN, CONCRETELY: the packages are in contrib, the module is built by DKMS against
      # your running kernel, and that build is where people get stuck. Give the exact apt lines
      # and what a successful `modprobe zfs` looks like. One line on RHEL-family and stop.
      - n: "02"
        slug: what-zfs-is
        title: "ZFS — What It Is, Why It Exists, and When It Earns Its Place"
        hands_on: ["koan:choose", "koan:process:tool"]
        core: true
        status: planned
      - n: "05"
        slug: pools-and-vdevs
        title: "Pools, vdevs and Datasets — Why Redundancy Lives in the vdev"
        hands_on: ["koan:predict", "koan:complete"]
        core: true
        status: planned
      # THE EPISODE THAT JUSTIFIES ZFS EXISTING, and the reason to teach it rather than any
      # other filesystem.
      # COVER: every block is checksummed, and because the filesystem also holds the redundancy
      # it can DETECT corruption and REPAIR it from another copy. SILENT CORRUPTION — bit rot, a
      # cable, a controller lying — is otherwise invisible: the disk returns bytes, they are the
      # wrong bytes, and nothing tells you. A traditional filesystem on RAID cannot even tell
      # which copy is right.
      # SCRUB as the scheduled proof, and the practice: scrub regularly and read the output.
      # THE HONEST FRAMING: this is the one property that would make a data team choose ZFS on
      # purpose, and it is worth more to a data team than to almost anyone else — because a
      # wrong number that looks right is exactly what this academy exists to prevent.
      # ADDED after a review asked whether a reader could choose EXACTLY the redundancy they
      # need — no more, no less. 05 teaches what a vdev is and states the mirrors-against-RAIDZ
      # trade in two lines. That is not enough to lay out a pool you will live with for years,
      # and the layout is the decision with the least room to change your mind.
      #
      # COVER, as a decision procedure rather than a table:
      #   THE LEVELS, IN ZFS's OWN NAMES   stripe (no redundancy), mirror, RAIDZ1, RAIDZ2,
      #                     RAIDZ3, and STRIPED MIRRORS — several mirror vdevs in one pool,
      #                     which is RAID 10's shape and the usual answer under a database.
      #   HOW MANY DISKS PER VDEV   a vdev is the failure and rebuild unit, so a twelve-disk
      #                     RAIDZ2 rebuilds by reading eleven disks and a pool of six mirrors
      #                     rebuilds by reading one. FEWER, WIDER VDEVS BUY CAPACITY; MORE,
      #                     NARROWER VDEVS BUY IOPS AND FAST RESILVER. Series 1 · 20's rebuild
      #                     window is why the second usually wins for a warehouse that must stay
      #                     up.
      #   THE RULE OF THUMB WORTH GIVING: mirrors or striped mirrors for anything a database
      #                     writes to; RAIDZ2 for bulk and archival; RAIDZ1 almost never at
      #                     modern disk sizes, for exactly the reason 1 · 15 gives about single
      #                     parity; RAIDZ3 when a rebuild takes days and you are honest about it.
      #
      # THE THREE DECISIONS YOU CANNOT TAKE BACK, and they are the point of the episode:
      #   ASHIFT   the sector size, set at pool creation and PERMANENT. Get it wrong on 4K-sector
      #            disks and every write is amplified for the life of the pool, with no symptom
      #            except that it is slower than it should be forever. Set it deliberately;
      #            do not let it be autodetected from a disk that lies about its geometry.
      #   VDEV TYPE   you cannot convert a RAIDZ2 into mirrors. Rebuilding the pool and restoring
      #            is the migration path.
      #   ADDING A SINGLE DISK   a bare disk added to a redundant pool becomes a vdev with no
      #            redundancy, and the pool now dies with it. ZFS will warn; people use -f.
      # ⚠ RAIDZ EXPANSION LANDED IN RECENT OpenZFS AND CHANGES PART OF THIS. Check the version in
      # front of you before writing that a vdev cannot grow, and state what your Debian's
      # packaged version actually supports rather than what the project supports.
      #
      # HOT SPARES and autoreplace, briefly, and the honest note that a spare shortens the window
      # in Series 1 · 20 rather than removing it.
      - n: "07"
        slug: choosing-your-layout
        title: "Mirrors, RAIDZ or Striped Mirrors — Exactly the Redundancy You Need"
        hands_on: ["koan:choose", "koan:predict"]
        core: true
        status: planned
      - n: "10"
        slug: checksums-and-scrub
        title: "Checksums and Scrub — the Filesystem That Can Tell You the Data Is Wrong"
        hands_on: ["koan:diagnose", "koan:process:tool"]
        core: true
        status: planned
      # COVER: copy-on-write and what it buys — SNAPSHOTS THAT COST ALMOST NOTHING because
      # nothing is copied until it changes, clones for a writable copy, and send/receive for
      # replication to another machine.
      # WHY A DATA TEAM CARES: a snapshot before a migration, a clone as a test database with
      # production-shaped data, and incremental send as an offsite copy. Data Ops, Series 1 · 42
      # said a copy on the same disk is not a backup, and send/receive is how that copy leaves.
      # AND THE WARNING THAT COMES WITH COPY-ON-WRITE: snapshots hold space, so a pool can fill
      # because of what you deleted. That is Series 1 · 25's cliff arriving from an unexpected
      # direction.
      # ADDED to close a proven gap: a review tested this course against what deploying and
      # RUNNING each thing requires, and `zpool replace` appeared nowhere. 10 teaches that ZFS
      # detects and repairs corruption, 1 · 20 teaches rebuilds as a concept — and nothing told
      # the reader the command for the single most likely event in a pool's life.
      # COVER, as a runbook: notice it (zpool status, and what DEGRADED reads like), identify the
      # disk by a stable name rather than by /dev/sdb which moves, physically swap it, then
      # `zpool replace`, then watch the resilver. WITH THE OUTPUT SHOWN AT EACH STEP.
      # THE DETAIL THAT SAVES A POOL: use /dev/disk/by-id, not /dev/sdX. Kernel device names are
      # not stable across reboots, and replacing the wrong disk in a degraded pool is how a
      # single failure becomes a data-loss event.
      # HOT SPARES and autoreplace in a paragraph. QUOTAS AND RESERVATIONS here too — also
      # absent before this review — because "one dataset ate the pool" is the other thing that
      # actually happens, and Series 1 · 25's cliff is where it ends.
      - n: "12"
        slug: replacing-a-failed-disk
        title: "zpool replace — the Command for the Thing That Will Actually Happen"
        hands_on: ["koan:process:tool", "koan:diagnose"]
        core: true
        status: planned
      - n: "15"
        slug: snapshots-and-send
        title: "Snapshots, Clones and send/receive — Copies That Cost Nothing Until They Change"
        hands_on: ["koan:process:tool", "koan:predict"]
        core: true
        status: planned
      # COVER: the settings that actually change behaviour, and the two that a database cares
      # about most.
      #   RECORDSIZE   match it to the workload — a large default is right for big sequential
      #                files and wrong for a database writing 8 or 16 KB pages, where it causes
      #                read-modify-write amplification.
      #   COMPRESSION  on by default in modern ZFS, and usually a WIN even for speed, because
      #                fewer bytes leave the disk. Say that plainly; it surprises people.
      #   ARC and L2ARC   the cache, and why ZFS appearing to use all your memory is correct.
      #   SYNC and the SLOG, and the dangerous advice found on forums — sync=disabled makes
      #                benchmarks beautiful and breaks the one promise a database depends on.
      # THE RULE: change one setting, measure, and know which workload you measured.
      - n: "20"
        slug: tuning-zfs
        title: "recordsize, Compression and the ARC — the Settings That Matter, and One That Lies"
        hands_on: ["koan:choose", "koan:diagnose"]
        status: planned
      # ALSO OWNS THE GATE, added in the same review that found every other series in this
      # academy has one and this did not. WHEN NOT ZFS:
      #   it wants RAM, and on a small box the ARC competes with the database you are running;
      #   A POOL CANNOT BE SHRUNK, and vdevs largely cannot be removed — a layout mistake is
      #     permanent in a way ext4 never is;
      #   the licence keeps it out of the mainline kernel, so it is a module your distribution
      #     may or may not make easy, and a kernel upgrade can break it;
      #   and if you have hardware RAID underneath, ZFS cannot see the disks and its whole
      #     self-healing argument evaporates — which is the commonest way people get none of
      #     the benefit and all of the complexity.
      # SAY IT PLAINLY: on a rented VM with one virtual disk, ext4 or XFS is the right answer and
      # this series is background reading.
      # ADDED as its own episode 2026-09-07. It had been a paragraph inside Series 1 · 19, beside
      # ext4 and XFS, which was the wrong neighbour: btrfs is a COPY-ON-WRITE filesystem, so the
      # comparison a reader needs is with ZFS. And it is placed immediately before 22 on purpose,
      # because "use btrfs instead" is one of the real answers to "do you need ZFS?" and that
      # episode cannot weigh an option this course never taught.
      #
      # COVER:
      #   THE ONE ADVANTAGE THAT DECIDES MOST DEBIAN CASES: IT IS IN THE MAINLINE KERNEL. No
      #                   DKMS, no module rebuilt against every kernel upgrade, no licence
      #                   question — `apt install btrfs-progs` and the filesystem is already
      #                   there. Series 2 · 02 named the DKMS build as where Debian readers get
      #                   stuck; this is the option that does not have that problem at all.
      #   SUBVOLUMES      not quite ZFS datasets — cheaper, and mountable as directories, which
      #                   is why distributions use them for root and /home layouts.
      #   SNAPSHOTS       near-instant, and WRITABLE by default, which is the opposite of ZFS's
      #                   default and surprises people moving between them.
      #   CHECKSUMS AND SCRUB   the same argument as 2 · 10 — it detects corruption, and with
      #                   redundancy it repairs it. This is the reason to consider it at all.
      #   COMPRESSION     zstd as a mount option, per-file, and the same "fewer bytes leave the
      #                   disk" argument that makes it a performance win rather than a cost.
      #   send/receive    exists, and does the job 2 · 15 uses ZFS's for.
      #
      # THE CAUTION, STATED CAREFULLY BECAUSE IT IS THE MOST-QUOTED AND LEAST-CHECKED FACT ABOUT
      # THIS FILESYSTEM: single, mirror and striped-mirror profiles are what people run in
      # production. THE PARITY PROFILES have carried a long-standing warning about the write hole
      # from Series 1 · 15. That situation has been improving slowly for years, so DO NOT repeat
      # a decade-old blog post — check the project's own status page for the version in Debian
      # you are writing about, state the version, and if the answer is still "not recommended",
      # say so plainly and move on.
      #
      # AND THE TRAP THAT MATTERS MOST TO THIS ACADEMY'S READER, which is genuinely data-specific
      # and is why this episode earns its place: COPY-ON-WRITE FRAGMENTS FILES THAT ARE WRITTEN
      # IN PLACE — a database's data directory, a VM image. The performance falls away over
      # weeks, not immediately, so it looks like the database degrading.
      # THE FIX IS `chattr +C` OR nodatacow — AND IT DISABLES CHECKSUMS FOR THOSE FILES. So the
      # standard advice for putting Postgres on btrfs turns off the exact guarantee that was the
      # reason to choose btrfs. Say that out loud. It is the cleanest example in the course of a
      # mitigation that quietly removes the benefit, and a reader who understands it will ask the
      # same question of every other tuning flag they are handed.
      #
      # WHEN TO CHOOSE IT: a Debian box where you want copy-on-write snapshots and checksums
      # without a kernel module, mirrors are enough redundancy, and the workload is files rather
      # than a database writing in place. That is a real and common shape.
      - n: "21"
        slug: btrfs
        title: "btrfs — Copy-on-Write in the Kernel, and the Flag That Turns Off Checksums"
        hands_on: ["koan:process:tool", "koan:choose"]
        status: planned
      # ADDED after a review asked whether each series ENDS on "do you actually need this".
      # It did not. ZFS's gate was a paragraph inside 20, a tuning episode — which is the wrong
      # place twice over: buried, and read before the reader knows what the thing costs.
      # NINE OTHER COURSES IN THIS ACADEMY END THIS WAY, before the project, so the project can
      # be judged against it — Neo4j, Trino, Kubernetes, Distributed SQL, Spark. This series now
      # matches them.
      #
      # WHY AT THE END AND NOT ONLY AT THE START: at 02 "ZFS has real overhead" is an assertion a
      # reader cannot weigh. Here they have created a pool, chosen a layout they cannot change,
      # replaced a disk, and watched a resilver. NOW the cost is a thing they have felt, and the
      # decision is theirs to make honestly.
      #
      # THE INSTINCT TO TEACH, and state it as the rule: USE THE MINIMUM THAT GETS YOU WHAT YOU
      # ACTUALLY NEED. Walk the ladder DOWNWARDS, and make the reader say which rung they are on:
      #   INTEGRITY YOU CAN PROVE   ZFS is genuinely close to alone here. If silent corruption
      #                             matters — and for a warehouse it should — this is the reason,
      #                             and it is the only one that cannot be bought elsewhere.
      #   CHEAP SNAPSHOTS           LVM has them and they are worse — Series 1 · 18 showed why —
      #                             and BTRFS HAS THEM PROPERLY, in the mainline kernel with no
      #                             DKMS, which 21 just taught. If snapshots and checksums are
      #                             the requirement and mirrors are enough redundancy, btrfs is a
      #                             serious answer and this episode must treat it as one rather
      #                             than as a footnote. A rented volume may also snapshot at the
      #                             hypervisor, in which case you already have them.
      #   REDUNDANCY                mdadm with ext4 or XFS does this, ships in every kernel, and
      #                             needs no DKMS. It cannot self-heal, which is the trade.
      #   COMPRESSION               and here is the point a data reader must not miss: YOUR
      #                             WAREHOUSE ALREADY COMPRESSES AND ALREADY CHECKSUMS. Parquet
      #                             and ClickHouse both do. So ZFS's compression is not the
      #                             argument for a warehouse box — its snapshots and its pool
      #                             management are.
      #   NOTHING BUT A FILESYSTEM  ext4. Stop. This is the right answer more often than this
      #                             series' existence implies, and saying so is what makes the
      #                             rest of it trustworthy.
      #
      # THE COSTS THE READER NOW KNOWS, listed back to them: a DKMS module rebuilt against every
      # kernel upgrade on Debian; RAM the ARC will take; a pool that cannot shrink; and the
      # layout decisions from 07 that are permanent.
      # THE HONEST RECOMMENDATION SHAPE: disks you own, data you cannot silently corrupt, and
      # snapshots you want to be free — ZFS. Anything less than all three — probably not.
      - n: "22"
        slug: do-you-need-zfs
        title: "Do You Need ZFS — and the Simpler Things That Would Have Worked"
        hands_on: ["koan:choose", "koan:capture"]
        core: true
        status: planned
