# The ordered episode list for Storage for Data. Field docs live in
# courses/learnsql/curriculum.yaml. `short` is omitted until an episode has a video.
#
# The job this track teaches: understand the layer every other course assumes — what the bytes
# actually sit on, what it survives, what it costs, and how to run it yourself when the data
# cannot leave the building.
#
# ============================================================================
# WHY THIS TRACK EXISTS
# ============================================================================
# STORAGE IS ASSUMED BY EIGHT COURSES AND OWNED BY NONE. Data Ops rents a bucket and watches a
# disk fill; Data Warehousing lays out columns; Kubernetes asks a cluster for a volume; every
# engine track has its own storage engine. Not one of them can explain what a block device is,
# what erasure coding survives, why the first write after a disk dies is slow, or what to do
# when the data legally may not leave the building.
#
# THE READER THIS IS FOR: the data person who has been handed disks. Not a storage engineer —
# this track never becomes a SAN administration manual — but somebody who has to size, choose,
# and answer for the thing the database sits on.
#
# ============================================================================
# THE ONE MISUNDERSTANDING THIS TRACK EXISTS TO PREVENT
# ============================================================================
# REPLICATION IS NOT A BACKUP. Three copies protect you against a disk dying. They protect you
# against nothing else: a deletion is replicated faithfully, in milliseconds, to all three.
# Every durability episode here returns to that sentence, because it is the single most
# expensive misunderstanding in this subject and Data Ops, Series 1 · 42 can only state it —
# this track is where the mechanism explains it.
#
# ============================================================================
# THE SCOPE, DECIDED BEFORE A LINE WAS WRITTEN
# ============================================================================
# Storage is scattered across four other tracks and a new course could eat all of them. It does
# not, and the split is stated here so it stays honest:
#   HERE                  the PHYSICAL LAYER — the three interfaces, the numbers, disks,
#                         filesystems, durability and erasure coding, capacity and tiering,
#                         object storage as a protocol, self-hosting it, and encryption at rest.
#   DATA OPS              the OPERATOR'S USE of it — df and du, backups as a scheduled job, and
#                         the bucket you rent from somebody. That track stays "the machine, the
#                         database and the job".
#   DATA WAREHOUSING      ANALYTICAL LAYOUT — columnar storage, Parquet internals, compression
#                         for analytics, and storage separated from compute.
#   THE ENGINE TRACKS     each engine's own storage engine — MergeTree, InnoDB, SSTables, heap
#                         and TOAST.
# WHEN AN EPISODE HERE STARTS EXPLAINING WHAT A DATA PERSON DOES WITH A BUCKET, it has crossed
# into Data Ops. When it starts explaining how to lay out Parquet, it has crossed into Data
# Warehousing. Both are one sentence away at all times.
#
# ============================================================================
# THERE IS NO SINGLE OFFICIAL DOCUMENTATION FOR THIS SUBJECT
# ============================================================================
# Series 1 is vendor-neutral and has no manual — it is physics, arithmetic and trade-offs.
# Series 2 to 4 each have one:
#   ZFS      the OpenZFS documentation, and its own vocabulary — pool, vdev, dataset, zvol,
#            recordsize, ARC, RAIDZ, scrub, resilver.
#   S3       the S3 API reference for the semantics, since it is the de facto specification
#            every implementation is measured against — and MinIO's own documentation for
#            the second half: erasure sets, drive layout and expansion.
#   CEPH     the Ceph documentation — RADOS, CRUSH, placement groups, RGW, RBD, CephFS.
#
# ── WHEN YOU WRITE THE LESSONS, REMEMBER THIS ───────────────────────────────
# FOLLOW THAT PROJECT'S OWN DOCUMENTATION for the series it owns, use its VOCABULARY FOR THE
# NOUNS, and say which version a claim was checked against. Anything left out should be left
# out because the scope above says so, and never because it was missed.
#
# ── BUT FOLLOW IT FOR COVERAGE AND VOCABULARY, NOT FOR SHAPE ────────────────
# THE DOCS ARE A REFERENCE. THIS IS A COURSE. They are written to be complete and to be looked
# things up in; we are written to take somebody from nothing to a working system they can
# defend on Monday. Two different jobs, and copying a reference's running order produces a
# reference nobody finishes.
#
# SO THE RULE IS: THE DOCUMENTATION SETS WHAT MUST BE COVERED AND WHAT THINGS ARE CALLED. THE
# ORDER IS OURS, AND IT FOLLOWS THE ORDER OF A REAL JOB.
#   WHAT WE TAKE      every topic the manual treats as essential, so nothing is missed; and its
#                     exact nouns, so a reader who finishes can live in those docs afterwards.
#   WHAT WE REORDER   the sequence. A manual can open with an architecture chapter because
#                     nobody reads it front to back. A course opens with WHY YOU WOULD, then
#                     gets something running, then explains what just happened.
#   WHAT WE LEAVE     the exhaustive option lists, the configuration reference, and the
#                     features that exist for somebody else's deployment. Name them, point at
#                     the page, move on. A reader who needs the eightieth tunable can read the
#                     manual; they cannot read the manual to learn why they are here.
#
# THE TEST FOR ANY EPISODE: IS THIS SOMETHING SOMEBODY DOES ON A REAL PROJECT? If it is in the
# docs and nobody does it in the first year, it is a pointer and not an episode. If somebody
# does it constantly and the docs bury it on page forty — replacing a failed disk, finding out
# which client lacks a capability, reading a health warning at 3 a.m. — IT IS AN EPISODE, and
# its prominence here should be nothing like its prominence there.
#
# EVERY SERIES ENDS IN A PROJECT FOR THE SAME REASON: a manual has no projects because a manual
# is not trying to make anybody competent.
#
# EVERY _todo BRIEF IN THIS COURSE MUST REPEAT THIS, with the docs section named.
#
# ⚠ NUMBERS AGE FASTER HERE THAN ANYWHERE ELSE IN THE ACADEMY. Drive capacities, prices per
# terabyte, IOPS figures and rebuild times all move. Teach the SHAPE of the arithmetic and the
# ORDERS OF MAGNITUDE, and date every concrete figure so a reader knows when it was true.
#
# ============================================================================
# THE PLATFORM IS DEBIAN, AND THE LESSONS SAY SO
# ============================================================================
# Added after a review asked a question this file could not answer: will a reader finish able to
# DO this? Not without a platform. "Install ZFS" is not a command, and a course that stays
# distribution-neutral produces prose about concepts and no working pool.
#
# DEBIAN STABLE IS THE REFERENCE PLATFORM, named in the lesson, with the version stated. Every
# command must be the one a reader types on Debian — the real package names, the real paths, the
# real units. For ZFS that means saying out loud that the packages live in contrib and that the
# module is built by DKMS, because that is where a Debian reader actually gets stuck.
#
# ONE LINE PER EPISODE ON WHAT CHANGES ELSEWHERE, and no more: the RHEL-family package name, or
# "the concepts transfer, the package manager does not". A second distribution taught in parallel
# doubles the length and halves the confidence.
#
# ============================================================================
# EVERY OPERATIONAL EPISODE CARRIES A RUNBOOK, NOT A DESCRIPTION
# ============================================================================
# THE ACCEPTANCE TEST FOR THIS COURSE, and it is stricter than the academy's usual one: A READER
# FINISHES AN EPISODE AND CAN DO THE THING ON THEIR OWN MACHINE. Not recognise it, not discuss
# it — do it.
#
# So every episode in Series 2, 3 and 4 that installs, configures or operates something must
# contain THE ACTUAL COMMAND SEQUENCE, in order, copy-pasteable, run by the author on Debian
# before it ships — with the expected output shown, so a reader knows whether it worked.
# A paragraph explaining what zpool does is not a lesson. `zpool create tank mirror sda sdb`,
# followed by what `zpool status` then prints, is.
#
# ============================================================================
# AND THE KOAN IS THE RUNBOOK, SO "IT WAS RUN ON DEBIAN" IS A TEST AND NOT A PROMISE
# ============================================================================
# The paragraph above is a rule nothing enforces. CurriculumSpec checks titles, pointers and
# credits; it cannot check that a command works, and a runbook nobody re-runs rots into a
# runbook that does not.
#
# SO THE KOAN FOR AN OPERATIONAL EPISODE IS THE RUNBOOK ITSELF, EXECUTED. Same commands, same
# order, in a Debian container, asserting the state each step produced. If the lesson's
# sequence stops working — a package renamed, a flag deprecated, a default changed — CI says so
# before a reader does.
#
# THIS IS NOT A SECOND FRAMEWORK, and it must not become one. JvmKoanBase already says it:
# there is ONE mechanism, the koan, and what varies is WHAT YOU ASSERT ON — a value, a counter,
# captured output, or a process's exit code and output. A storage koan is the fourth of those,
# pointed at a shell instead of a jar. Nothing new is being invented; a Runner is being reused.
#
# WHAT A STORAGE KOAN ASSERTS — the STATE the commands produced, never how long they took:
#   `zpool status` says ONLINE after create; DEGRADED after a device is corrupted; ONLINE again
#   after `zpool replace` resilvers. `mc ls` finds the object that `mc cp` put there. An
#   unauthorised client gets AccessDenied, and the authorised one does not. `ceph -s` reaches
#   HEALTH_OK on a bootstrapped single node.
# THE ACADEMY'S EXISTING RULE APPLIES WITH FORCE HERE: NEVER ASSERT WALL-CLOCK TIME. This is
# the track most tempted to, because storage is where people reach for stopwatches. Every
# performance lesson has a countable proxy instead — fio reports IOPS, and 1 · 07's koan asserts
# that the direct=1 run and the cached run differ by an order of magnitude, which is the actual
# lesson and is deterministic in a way a duration never is.
#
# ── THREE TIERS, AND SAY WHICH ONE AN EPISODE IS IN ─────────────────────────
# Being honest about what can be tested is the point; a green suite that skips the hard half
# would be worse than no suite.
#   TIER 1  RUNS ANYWHERE, IN CI, IN A CONTAINER. MinIO, the whole S3 protocol series, rclone
#           and mc, fio against a loopback file. No kernel dependency, seconds to run. Most of
#           Series 3 and 1 · 07 belong here and there is no excuse for anything less.
#   TIER 2  NEEDS A CAPABLE RUNNER. ZFS koans work on loopback files — `truncate` four sparse
#           files, `zpool create` a mirror over them, corrupt one with `dd`, watch it heal —
#           but they need THE ZFS MODULE ON THE HOST and a privileged container. That is a real
#           prerequisite and the koan file must say so in its header and skip cleanly, with a
#           message naming what is missing, rather than failing and looking broken.
#   TIER 3  CANNOT HONESTLY BE TESTED, so mark the episode `eyes` and say why in the brief.
#           Multi-node behaviour, rebuild storms under load, two-network topology, hardware
#           sizing: a three-container Ceph proves the commands parse and proves nothing about
#           the thing the episode is teaching. JvmKoanBase already reserves `eyes` for exactly
#           this and calls a bolted-on test theatre. It is right.
#
# THE RULE THAT KEEPS IT HONEST: AN EPISODE IS TIER 3 BECAUSE THE SUBJECT CANNOT BE TESTED, NEVER
# BECAUSE THE TEST WOULD BE INCONVENIENT. `zpool replace` is Tier 2 and must have a koan. "Why
# Ceph is network-bound" is Tier 3 and must not pretend to.
#
# AND EVERY TECHNOLOGY GETS THE SAME FIVE ANSWERS, because that is what a reader is actually
# asking: WHAT IT IS · WHY IT EXISTS · WHEN IT EARNS ITS PLACE AND WHEN IT DOES NOT · THE
# COMMANDS · WHAT GOES WRONG. Series 2 · 02, Series 3 · 20 and Series 4 · 00 are where the first
# three are answered for ZFS, self-hosted S3 and Ceph respectively.
#
# TEACH AGAINST WHAT A LEARNER CAN RUN: loopback files and containers go a very long way here —
# a ZFS pool on files, a MinIO with four directories, a single-node Ceph. Say clearly where a
# claim needs real hardware or a real cluster, because a rebuild storm cannot be felt on a
# laptop and pretending otherwise teaches the wrong instinct.

course: learn-storage
track: storage
title: Storage for Data

prerequisites:
  - course: learn-data-ops
    needs: "Series 1"
    why: >-
      You need the terminal, and you need to have already met the two episodes this track goes
      underneath — the machine with a disk that fills, and the bucket you rented from somebody
      else. This course is what both of those are standing on.

excludes:
  - topic: "Renting object storage, its bill, and using it in a job"
    where: "covered in Data Ops, Series 1 · 47, which is the bucket a data person rents and pays for. In this course, Series 3 is the protocol itself and running one yourself"
  - topic: "Backups as a scheduled job, rotation and proving a restore"
    where: "covered in Data Ops, Series 1 · 42. In this course, Series 1 · 20 explains what replication does and does not survive, which is the mechanism under that episode's rule"
  - topic: "Columnar layout, Parquet internals and compression for analytics"
    where: "covered in Data Warehousing, Series 2. This track ends at the bytes; how you arrange rows inside a file to be skipped is that course's subject"
  - topic: "Each engine's own storage engine"
    where: "covered in the engine tracks — ClickHouse for MergeTree, MySQL & MariaDB for InnoDB, Apache Cassandra for SSTables, PostgreSQL for the heap and TOAST"
  - topic: "Asking a Kubernetes cluster for a volume"
    where: "covered in Kubernetes for Data Workloads, Series 2 · 05. In this course, Series 4 · 55 covers only how Ceph ends up being what answers that request"
  - topic: "Provisioning storage with infrastructure as code"
    where: "covered in Terraform & Pulumi, Series 2 · 05"
  - topic: "Enterprise SAN arrays, fibre channel and vendor appliances"
    where: "not covered. This track is storage a data team can obtain, run and reason about, and a six-figure appliance with a support contract is somebody else's job"

series:
  # SERIES 1 GREW ON 2026-09-07, after a review asked whether this course covers the mainstream
  # Linux filesystems, LVM and NFS. It did not — ext4 was six passing mentions, LVM two, NFS one,
  # and partition tables none — while Series 2 spent ten episodes on ZFS.
  # THE ABSURDITY THAT MADE IT OBVIOUS: this course's own gate at 3 · 22 tells a reader "ext4,
  # stop" — sending them to a thing the course never taught.
  # SO THE LAYERS GO HERE, where they belong: partitions, mdadm, LVM, the filesystems, and NFS.
  # AND IT MAKES SERIES 2 STRONGER RATHER THAN LONGER. The standard Linux stack is LAYERED —
  # disk, partition, RAID, volume manager, filesystem, mount — and each layer is blind to the
  # others, which is exactly why an mdadm array cannot tell you WHICH copy is right. ZFS's
  # radical move is collapsing all of them into one thing that owns everything. A reader who has
  # built the layered stack understands that argument in a sentence; one who has not takes it on
  # faith.
  - slug: series1-what-storage-is
    title: What Storage Is, and the Linux Stack On Top
    tagline: three interfaces, four numbers, and the layers between a disk and a directory
    level: intermediate
    episodes:
      # COVER: the taxonomy, because everything else in the course hangs off it and almost
      # nobody is taught it explicitly.
      #   BLOCK   a disk. Fixed-size blocks, no idea what is in them, one writer. What a
      #           database wants, because it manages its own layout.
      #   FILE    a filesystem. Names, directories, permissions, several readers and writers,
      #           partial writes and appends.
      #   OBJECT  a key and a blob over HTTP. NO PARTIAL WRITES, NO APPEND, NO SEEK — you
      #           replace a whole object — which is the constraint that produced table formats,
      #           and Data Ops, Series 1 · 47 already states it as a rule. Here it gets its
      #           reason.
      # THE TEST TO LEAVE THEM WITH: can a process modify byte 4,000,000 in place? Block yes,
      # file yes, object no. That single question sorts most storage arguments.
      - n: "00"
        slug: block-file-object
        title: "Block, File and Object — Three Interfaces, and the Question That Sorts Them"
        hands_on: ["koan:choose", "koan:predict"]
        core: true
        status: planned
      # COVER: the numbers, taught as FOUR SEPARATE THINGS people collapse into "fast".
      #   IOPS         operations per second. What a database doing random reads lives on.
      #   THROUGHPUT   bytes per second. What a scan or a backup lives on.
      #   LATENCY      how long one operation takes, and why an average hides everything —
      #                p99 is the number a user experiences.
      #   QUEUE DEPTH  how many requests are in flight, and why a benchmark at depth 64 says
      #                nothing about a single-threaded job.
      # THE POINT: a device can be excellent at one and poor at another, and a vendor will quote
      # whichever flatters it. A reader who asks "at what queue depth, and what block size?" has
      # learnt the episode.
      # DATA NUANCE: an analytical scan wants throughput, an OLTP index lookup wants IOPS and
      # low latency, and a nightly load wants both at different minutes.
      - n: "05"
        slug: the-four-numbers
        title: "IOPS, Throughput, Latency and Queue Depth — Four Numbers, Not One"
        hands_on: ["koan:choose", "koan:diagnose"]
        core: true
        status: planned
      # COVER: what you can actually buy, with the ORDERS OF MAGNITUDE rather than this year's
      # prices — NVMe, SATA SSD, spinning disk, and network-attached storage — and the fact
      # that the gap between them is not a percentage but a factor of hundreds on random reads.
      # NETWORK STORAGE AS THE ONE PEOPLE MISJUDGE: it looks like a disk and behaves like a
      # network, so latency is a round trip and throughput is a shared link. Data Ops,
      # Series 1 · 46 already told a reader to check disk TYPE and not only size; this is why.
      # ⚠ DATE EVERY CONCRETE FIGURE. Capacities and prices move; the ratios move far more
      # slowly, so teach the ratios.
      # ADDED after a review asked whether a reader could actually DO any of this: 05 teaches
      # four numbers and the series never once measured them. A table of definitions is not a
      # skill, and "is this disk fast?" is the question those four numbers exist to answer.
      # COVER: fio, and the job file as the unit of work. The four dimensions from 05 become
      # four jobs — random read at 4k, sequential read at 1M, and the same two writing — because
      # THE PATTERN YOU MEASURE MUST BE THE PATTERN YOU RUN. A vendor's headline figure is a
      # sequential number quoted at a queue depth nobody's database uses.
      # THE TWO TRAPS, and both produce beautiful wrong answers:
      #   THE PAGE CACHE   without direct=1 you are benchmarking RAM. The number is glorious and
      #                    means nothing.
      #   THE FIRST THIRTY SECONDS   consumer SSDs have a fast write buffer that exhausts. Run
      #                    long enough to fall off it, or you have measured the cache and not the
      #                    disk.
      # THEN THE HABIT: measure the claim. Take the figure the provider quoted in Data Ops,
      # Series 1 · 46 and check it — this is the episode that turns that shopping decision into
      # evidence.
      - n: "07"
        slug: measuring-it
        title: "fio — Measuring the Four Numbers Instead of Reading Them"
        hands_on: ["koan:process:tool", "koan:diagnose"]
        core: true
        status: planned
      - n: "10"
        slug: disks
        title: "NVMe, SSD, Spinning Disk and Network Storage — Ratios That Outlive the Prices"
        hands_on: ["koan:choose", "koan:capture"]
        core: true
        status: planned
      # ADDED. Before any layer owns a disk, a reader has to be able to look at one.
      # COVER: what /dev actually contains, lsblk as the command you will type most, and GPT
      # partition tables with parted or sgdisk. Whole-disk against partitioned, and when each is
      # right — ZFS and mdadm usually want whole disks; a boot device does not.
      # THE HABIT THAT PREVENTS A DISASTER, and 2 · 12 depends on it: /dev/sdX IS NOT STABLE
      # ACROSS REBOOTS. Use /dev/disk/by-id. Every command in this course that names a device
      # will name it that way, and the reason is that the disk you destroy is the one you did
      # not mean to.
      # blkid and lsblk -f to see what is already on a disk before you take it.
      - n: "12"
        slug: partitions-and-block-devices
        title: "lsblk, GPT and by-id — Looking at a Disk Before Anything Owns It"
        hands_on: ["koan:process:tool", "koan:capture"]
        core: true
        status: planned
      # THE CENTRAL EPISODE OF SERIES 1, and the one that carries the track's thesis.
      # COVER: three different mechanisms people call "redundancy", and what each survives.
      #   RAID              mirroring or parity across disks in one machine — and it is a FAMILY,
      #                     which a review found this episode had reduced to one line. Teach the
      #                     levels, because "we use RAID" tells you nothing:
      #                       RAID 0   striping, NO redundancy. Any disk dies, everything dies.
      #                                It is a performance and capacity choice, not a safety one.
      #                       RAID 1   a mirror. Survives one of two. Simple, fast to rebuild,
      #                                costs half your capacity.
      #                       RAID 5   single parity across N disks. Survives ONE. Cheap in
      #                                capacity, and see the arithmetic below.
      #                       RAID 6   double parity. Survives TWO, which is the whole point.
      #                       RAID 10  striped mirrors. Survives a disk in each mirror, rebuilds
      #                                by copying ONE disk rather than reading all of them, and
      #                                is what databases usually want.
      #                     AND THE ARITHMETIC THAT RETIRED RAID 5, which is the most useful
      #                     paragraph in the episode: a rebuild must read every remaining disk in
      #                     full. Disks have an UNRECOVERABLE READ ERROR rate, so the chance of
      #                     hitting one DURING the rebuild grows with disk size — and on a
      #                     single-parity array a second error during rebuild is data loss. That
      #                     is why RAID 6 or mirrors are the default advice at modern capacities,
      #                     and why "RAID 5 is fine, we have backups" misunderstands both words.
      #                     THE WRITE HOLE, named here because it is ZFS's best argument and
      #                     Series 2 collects on it: a traditional parity array interrupted
      #                     mid-write can leave data and parity disagreeing, and it cannot tell
      #                     which is right. ZFS does not have this problem, and Series 2 · 10
      #                     explains why.
      #   REPLICATION       whole copies on other machines. Survives a machine, a rack, a site.
      #   ERASURE CODING    data split into k data and m parity shards, any k of which rebuild
      #                     the object. Survives m failures at a fraction of replication's
      #                     space — 1.5x rather than 3x is typical — and costs CPU and network
      #                     on every read that has to reconstruct.
      # THE ARITHMETIC ON SCREEN, because it is the whole decision: 3x replication against
      # k=4,m=2 erasure coding, for the same failure tolerance, at very different capacity.
      # AND THE SENTENCE THE COURSE IS BUILT ON: NONE OF THIS IS A BACKUP. All three replicate a
      # DELETE faithfully and immediately. Data Ops, Series 1 · 42 owns backups; this episode
      # exists so the reader stops confusing the two, which is the commonest and most expensive
      # error in the subject.
      - n: "15"
        slug: durability
        title: "RAID, Replication and Erasure Coding — What Each One Survives, and What None Does"
        hands_on: ["koan:predict", "koan:choose"]
        core: true
        status: planned
      # COVER: what happens after a failure, which nobody plans for and everybody meets.
      # REBUILD is not free: the surviving copies must be read in full to reconstruct the lost
      # one, so the cluster is doing a large amount of extra I/O precisely while it is already
      # degraded. On large disks this takes HOURS TO DAYS.
      # THE REBUILD STORM: that traffic competes with your queries, so the symptom is "everything
      # got slow on Tuesday" with no query to blame. And the risk nobody prices — A SECOND
      # FAILURE DURING THE REBUILD, whose probability is not negligible because the rebuild is
      # itself stressing every remaining disk.
      # WHAT FOLLOWS: bigger disks mean longer rebuilds, which is an argument for more, smaller
      # failure domains rather than fewer, larger ones.
      # ADDED. 15 teaches the RAID levels as concepts; this is them as commands, on Debian, on
      # loopback files a reader can create in a minute.
      # COVER: mdadm --create for a mirror and for RAID 6, /proc/mdstat as the thing you watch,
      # mdadm --detail, and assembly across reboots via mdadm.conf and the initramfs. Failing a
      # disk deliberately with --fail, removing it, adding a replacement, and watching the
      # rebuild — which is 20's subject, felt.
      # WHY IT MATTERS EVEN IF THEY CHOOSE ZFS: mdadm is IN EVERY KERNEL, needs no module, and is
      # what a rented VM or an inherited box will already be running. The reader will meet one
      # whether or not they would have chosen it.
      # AND THE LIMIT THAT SETS UP SERIES 2: an mdadm array knows the two copies DISAGREE and
      # cannot know which is right, because the layer that stores the data is not the layer that
      # understands it. That single sentence is ZFS's entire argument, and it lands here.
      - n: "17"
        slug: mdadm
        title: "mdadm — the RAID Levels as Commands, and the Question It Cannot Answer"
        hands_on: ["koan:process:tool", "koan:diagnose"]
        core: true
        status: planned
      # ADDED, and of the four things this review found missing this is the one that matters
      # most: LVM is on nearly every Linux box a data person will ever touch.
      # COVER: the three nouns, in order, because the vocabulary is most of the difficulty —
      # PHYSICAL VOLUME (a disk or partition given to LVM), VOLUME GROUP (a pool of them), and
      # LOGICAL VOLUME (the thing you format and mount). pvcreate, vgcreate, lvcreate.
      # WHAT IT BUYS, and it is why it is everywhere: GROWING A FILESYSTEM WITHOUT DOWNTIME.
      # lvextend then resize2fs or xfs_growfs, online, while the database is running — which is
      # the single most useful storage operation in a data person's life and is impossible on a
      # bare partition. Add a disk to the group and the volume grows onto it.
      # LVM SNAPSHOTS, and the honest comparison Series 3 · 22 later relies on: they are
      # copy-on-WRITE INTO A RESERVED AREA, so they cost performance while they exist and they
      # BREAK IF THAT AREA FILLS. Fine for the twenty minutes of a backup; not what ZFS means by
      # the word. Say the difference here, so the ZFS episode does not have to argue it.
      # THIN PROVISIONING in one paragraph, with the warning: overcommitting a thin pool and then
      # filling it is Series 1 · 25's cliff with a shorter fuse.
      - n: "18"
        slug: lvm
        title: "LVM — PVs, VGs and LVs, and Growing a Filesystem While It Is Mounted"
        hands_on: ["koan:process:tool", "koan:complete"]
        core: true
        status: planned
      # ADDED. The filesystem most readers will actually use had six passing mentions and no
      # episode, in a course whose own gate recommends it.
      # COVER: ext4 and XFS as the two real answers on Debian, and the honest guidance — either
      # is fine for most data work; XFS tends to be preferred for very large files and heavily
      # parallel writes; ext4 SHRINKS and XFS DOES NOT, which is the difference that will one day
      # matter to somebody.
      # THEN THE OPERATIONS, as a runbook: mkfs, mount, and /etc/fstab with UUID rather than a
      # device name — the same stability argument as 12. The mount options a database cares
      # about, noatime chief among them, and why the defaults are usually right.
      # CHECKING AND REPAIR: fsck, when it runs, and why an unclean shutdown is survivable on a
      # journalling filesystem. df against du when they disagree, which Data Ops, Series 1 · 07
      # already taught a reader to notice and this explains.
      # BTRFS IS NAMED HERE AND TAUGHT AT Series 2 · 21, because it belongs beside ZFS rather
      # than beside ext4: it is the other COPY-ON-WRITE filesystem, and the comparison a reader
      # needs is with ZFS, not with a journalling one. One sentence here so nobody thinks it was
      # forgotten, and no more.
      - n: "19"
        slug: ext4-and-xfs
        title: "ext4, XFS and fstab — Formatting, Mounting, and the One That Cannot Shrink"
        hands_on: ["koan:process:tool", "koan:choose"]
        core: true
        status: planned
      - n: "20"
