        status: planned
      # ADDED in the same review, and this one corrects a decision I recorded earlier in this
      # file. The gate was moved to 00 so nobody would invest fourteen episodes wrongly — that
      # reasoning still holds and 00 keeps its short version. But a gate at 00 is the only one
      # this series had, and it asks the WRONG QUESTION: at 00 the reader cannot weigh a cost
