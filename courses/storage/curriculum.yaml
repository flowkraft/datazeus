      #   AT 00   should you even read this? — so nobody wastes fourteen episodes.
      #   HERE    now that you have bootstrapped one, issued a keyring, watched a backfill and
      #           read a HEALTH_WARN — what is the MINIMUM that gets you what you actually need?
      #
      # WALK THE LADDER DOWNWARDS, and make the reader name their rung:
      #   ONLY AN S3 ENDPOINT       Series 3. Smaller in every dimension — one binary, one
