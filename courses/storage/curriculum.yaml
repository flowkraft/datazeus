  - slug: series4-ceph
    title: Ceph
    tagline: one cluster, three interfaces, and the algorithm underneath
    level: advanced
    episodes:
      # COVER: what Ceph is and why it is unlike the previous series. ONE CLUSTER, THREE
      # INTERFACES — object through RGW, which is S3-compatible; block through RBD, which is
      # what a VM or a container gets; and a POSIX filesystem through CephFS — all on RADOS
      # underneath.
      # THAT IS THE REASON TO CHOOSE IT: Series 1 · 00's three interfaces, from one pool of
      # disks, instead of three separate systems. MinIO gives you one of the three and is far
      # simpler; that is the trade.
      # THE DAEMONS, named so logs are readable: OSD per disk, MON for the map, MGR, MDS for
      # CephFS. Keep it to what a reader needs to interpret a health message.
      # AND THE GATE GOES HERE, moved from the operations episode in a review: a reader should
      # meet it BEFORE investing thirteen episodes, not after.
      # CEPH NEEDS SOMEBODY WHO OPERATES IT. It is powerful, it is genuinely complex, and a
      # cluster nobody owns is a data-loss event on a schedule. If all you need is an S3
      # endpoint, Series 3 is smaller in every dimension and is usually the right answer. Choose
      # Ceph when you need two or three of the interfaces from one pool of disks, or when you are
      # already committed to it.
      # KEEP THIS SHORT — it is the "should you even read this?" gate, and its job is to stop
      # somebody spending fourteen episodes on the wrong answer. THE REAL DECISION IS AT 58,
      # after the reader has bootstrapped one and can weigh a cost they have actually met.
      - n: "00"
        slug: one-cluster-three-interfaces
        title: "One Cluster, Three Interfaces — RGW, RBD and CephFS on One Pool of Disks"
        hands_on: ["koan:choose", "koan:capture"]
        core: true
        status: planned
      # THE TECHNICAL CONTRIBUTION, and the episode worth teaching even to somebody who will
      # never run Ceph.
      # COVER: CRUSH. Placement is COMPUTED by the client from a map, deterministically, rather
      # than looked up in a central index. So there is no metadata server to ask, no lookup
      # table to grow, and no single component that every read must pass through.
      # WHY IT MATTERS: it is the same problem NoSQL Concepts, Series 3 · 00 poses — where does
      # this data live? — answered by arithmetic instead of by a directory, and the contrast is
      # worth drawing explicitly.
      # PLACEMENT GROUPS as the layer between objects and disks, and the honest note that their
      # count used to be a notorious tuning decision and is now largely automatic — say which
      # version that changed in.
      - n: "05"
        slug: crush
        title: "CRUSH — Computing Where the Data Lives Instead of Looking It Up"
        hands_on: ["koan:predict", "koan:capture"]
        core: true
        status: planned
      # COVER: pools, replication against erasure coding chosen per pool, and CRUSH rules that
      # express a failure domain — replicas on different hosts, racks or rooms.
      # THIS IS SERIES 1 · 15 MADE CONFIGURABLE, and it is where a reader sees that "survive a
      # rack" is a line of configuration rather than a hope.
      # THE PRACTICAL CHOICE: erasure coding for bulk and archival pools, replication for
      # anything latency-sensitive such as RBD volumes under a database.
      #
      # AND THE TWO SETTINGS THAT DECIDE WHETHER YOU LOSE DATA, which a review found nothing
      # named:
      #   SIZE AND MIN_SIZE   size is how many copies exist; MIN_SIZE IS HOW MANY MUST BE
      #                       PRESENT FOR THE POOL TO ACCEPT WRITES. size=3, min_size=2 is the
      #                       default for a reason: it keeps serving with one copy missing and
      #                       STOPS when only one remains, because writing to a single surviving
      #                       copy is how you lose data quietly.
      #   size=2, min_size=1  the configuration people reach for to save disk, and the one that
      #                       loses data. One copy left, still accepting writes, and no way to
      #                       tell which version is right when the other returns. Say this
      #                       plainly and say it once — it is the Ceph equivalent of RAID 5 on
      #                       large disks.
      # AND THE SURPRISE THAT READS LIKE AN OUTAGE: when a pool drops below min_size, Ceph
      # BLOCKS WRITES ON PURPOSE. It looks like the cluster has failed. It is the cluster
      # refusing to lose your data, and a reader who does not know that will "fix" it by
      # lowering min_size at exactly the wrong moment.
      # ERASURE-CODED POOLS have the same shape: k data and m coding chunks, and a min_size that
      # follows from them. Work one example through with real numbers.
      # ADDED. Nothing in the first draft told a reader what to buy or how to wire it, and Ceph
      # is one of the most network-sensitive systems a data team will ever run.
      # COVER:
      #   THE UNITS         one OSD per disk, and what each one wants in RAM and CPU. Multiply
      #                     before buying, because the answer surprises people.
      #   TWO NETWORKS      a PUBLIC network for clients and a CLUSTER network for replication
      #                     and recovery. Series 1 · 20's rebuild storm is why: recovery traffic
      #                     will saturate a shared link at exactly the moment clients still need
      #                     it. Separating them is the single most consequential physical
      #                     decision here.
      #   LATENCY OVER THROUGHPUT for RBD under a database — a write is not acknowledged until
      #                     the replicas have it, so every hop is in the write path.
      #   THE HONEST MINIMUM  three nodes for redundancy that means anything, and failure
      #                     domains that map onto hosts or racks you actually have.
      # ⚠ ORDERS OF MAGNITUDE, NOT THIS YEAR'S NUMBERS, and date anything concrete.
      - n: "10"
        slug: sizing-and-network
        title: "Sizing and Two Networks — Why Ceph Is Network-Bound Before It Is Disk-Bound"
        hands_on: ["koan:choose", "koan:predict"]
        core: true
        status: planned
      # ADDED. The first draft explained Ceph and never installed one.
      # COVER: cephadm as the supported path — bootstrap the first monitor, add hosts, let the
      # orchestrator place daemons, add OSDs from available devices. The fact that everything
      # runs in containers, which is why Data Ops, Series 1 · 37 is a prerequisite in practice.
      # WHAT A HEALTHY NEW CLUSTER LOOKS LIKE, so the reader has a baseline to compare against
      # when 50 goes wrong.
      # TEACH AGAINST WHAT THEY CAN RUN: a few VMs or containers with spare block devices is
      # enough to bootstrap and see it work. SAY CLEARLY that performance, recovery behaviour and
      # the network split cannot be judged there.
      - n: "15"
        slug: cephadm
        title: "cephadm — Bootstrapping a Cluster, and What Healthy Looks Like"
        hands_on: ["koan:process:tool", "koan:capture"]
        core: true
        status: planned
      # ADDED to close the gap that most embarrassed this course when it was tested: THREE
      # EPISODES STOOD UP THREE INTERFACES AND NONE OF THEM CREATED THE CREDENTIAL A CLIENT
      # NEEDS TO REACH ANY OF THEM. cephx appeared nowhere in the file.
      # COVER, as a runbook, and it belongs here — after the cluster exists at 15, before
      # anything uses it at 25, 30 and 35:
      #   WHAT CEPHX IS      mutual authentication between clients and the cluster, on by
      #                      default, and not optional in any deployment worth running.
      #   USERS AND CAPS     a client is an identity with CAPABILITIES — read on the monitors,
      #                      read/write on a named pool. Least privilege, the same discipline as
      #                      Series 3 · 27 and Data Ops, Series 1 · 35, expressed in Ceph's own
      #                      grammar.
      #   THE KEYRING        create the user, export the keyring, put it on the client machine,
      #                      and the exact command each of the next three episodes will assume.
      #   WHAT FAILURE LOOKS LIKE   a permission denied that names neither the user nor the
      #                      capability that was missing. Knowing where to look is the episode.
      - n: "18"
        slug: cephx-and-clients
        title: "cephx, Users and Keyrings — the Credential Every Client Needs First"
        hands_on: ["koan:process:tool", "koan:diagnose"]
        core: true
        status: planned
      - n: "20"
        slug: pools-and-failure-domains
        title: "Pools and Failure Domains — Saying 'Survive a Rack' in Configuration"
        hands_on: ["koan:choose", "koan:complete"]
        core: true
        status: planned
      # COVER: running one, honestly. Reading `ceph status` and what HEALTH_WARN actually means,
      # since a Ceph cluster is frequently not HEALTH_OK and that is not always an emergency.
      # Recovery and backfill after a disk or host loss, which is Series 1 · 20's rebuild storm
      # with names attached and throttles you can set.
      # THE GATE IS AT 00 NOW, stated before the reader invests thirteen episodes rather than
      # after. This episode keeps the operations and hands the health warnings to 50.
      # ADDED — the payoff episode, and the one that closes the loop with Series 3.
      # COVER: radosgw as the S3-compatible endpoint on top of the same cluster. Users and access
      # keys, and the one moment worth staging deliberately: POINT THE SAME rclone CONFIG FROM
      # SERIES 3 AT IT AND WATCH IT WORK UNCHANGED. That is "S3 is a protocol, not a product"
      # proven twice, and it is the most persuasive thirty seconds in the course.
      # Realms, zonegroups and zones named only as far as a single-site deployment needs.
      # WHEN RGW RATHER THAN MinIO: you already run Ceph, or you need object storage beside block
      # and file from one pool. Otherwise Series 3.
      - n: "25"
        slug: rgw
        title: "RGW — the S3 Endpoint, and the Same Client Pointed at It"
        hands_on: ["koan:process:tool", "koan:complete"]
        core: true
        status: planned
      # ADDED. RBD is how most databases and VMs actually consume Ceph.
      # COVER: images as thin-provisioned block devices, snapshots and clones, and mapping one on
      # a host. What a database on RBD actually experiences — every write waits for replicas, so
      # the network from 10 is in the write path and this is where that decision is felt.
      # THE COMPARISON WORTH MAKING: Kubernetes for Data Workloads, Series 2 · 15 argues a data
      # job usually wants object storage rather than a volume. This is the volume, and the reader
      # should be able to say when it is nonetheless right — a database that needs a filesystem,
      # or a VM.
      - n: "30"
        slug: rbd
        title: "RBD — Block Devices, and What a Database on Them Feels"
        hands_on: ["koan:process:tool", "koan:predict"]
        status: planned
      # ADDED. The third interface, and the one with the most operational surface per unit of use.
      # COVER: the MDS and the separate metadata pool, mounting it, and what POSIX semantics buy
      # you — several machines writing to one namespace, with locking.
      # WHEN IT IS RIGHT: a legacy application that needs a filesystem, shared scratch space, home
      # directories. WHEN IT IS NOT: as a substitute for object storage in a data pipeline, where
      # you are paying for POSIX guarantees nothing in the pipeline uses.
      # THE OPERATIONAL NOTE: metadata-heavy workloads stress the MDS, and "many small files" is
      # the shape that hurts — the same shape Trino, Series 2 · 05 warns about, one layer down.
      - n: "35"
        slug: cephfs
        title: "CephFS — a Shared Filesystem, and When You Are Paying for POSIX You Do Not Use"
        hands_on: ["koan:choose", "koan:complete"]
        status: planned
      - n: "40"
        slug: operating-it
        title: "ceph status, Recovery and Backfill — and Whether Anyone Will Own This"
        hands_on: ["koan:diagnose", "koan:process:tool"]
        core: true
        status: planned
      # COVER: how a data team most often actually meets Ceph — as the thing answering a
      # PersistentVolumeClaim, deployed by Rook, providing RBD volumes and an S3 endpoint to a
      # cluster. Kubernetes for Data Workloads, Series 2 · 05 asks the cluster for storage; this
      # is one of the commonest answers, and naming it closes a loop that course leaves open.
      # AND THE RECOMMENDATION THAT SURVIVES THE COURSE: for a data workload, object storage
      # beats a block volume more often than people expect — which is that track's Series 2 · 15
      # arriving from the storage side with the same conclusion.
      # ADDED. An upgrade on a system holding all of your data, done wrong, is the incident this
      # episode exists to prevent.
      # COVER: the orchestrator-driven staggered upgrade, and THE ORDER, which is not negotiable
      # — monitors, then managers, then OSDs, then MDS, then RGW. The maintenance flags such as
      # noout that stop the cluster helpfully rebalancing away from a host you took down for four
      # minutes, and the discipline of setting them and REMEMBERING TO CLEAR THEM.
      # Version support windows, and reading the release notes for the version you are leaving as
      # well as the one you are entering.
      # THE PRACTICE: upgrade a test cluster first. On this system that advice is not a platitude.
      - n: "45"
        slug: upgrades
        title: "Upgrades — the Order That Is Not Negotiable, and the Flag You Must Clear"
        hands_on: ["koan:process:tool", "koan:predict"]
        status: planned
      # ADDED — the episode a reader will return to, and the one that makes the difference
      # between owning a cluster and being owned by one.
      # COVER the health warnings you will actually meet, each with what it means and the command
      # that narrows it:
      #   PG DEGRADED / UNDERSIZED   copies missing. Usually recovery in progress; sometimes not.
      #   NEARFULL / FULL OSD        Series 1 · 25's cliff, and Ceph stops accepting writes rather
      #                              than filling — which reads as an outage and is a safety
      #                              feature. Rebalance or add capacity; there is no third option.
      #   SLOW OPS                   almost always a disk dying or the network, and this is where
      #                              10's two-network decision is either vindicated or regretted.
      #   CLOCK SKEW                 monitors need agreeing clocks. Unglamorous, common, and it
      #                              takes down consensus.
      #   OSD DOWN / OUT             the difference between the two, and why the timing between
      #                              them decides whether a five-minute reboot triggers a rebuild.
      # ALSO OWNS REPLACING A DEAD OSD, added in the same review: 15 adds OSDs from available
      # devices and nothing replaced a failed one, which is the operation you will actually
      # perform. As a runbook: identify it, `ceph osd out`, wait for the data to move, stop the
      # daemon, `ceph osd purge`, swap the disk, and let the orchestrator take it back in — with
      # the output at each step, and the reason to wait between them.
      # THE HABIT: `ceph -s` first, `ceph health detail` second, and HEALTH_WARN is not always an
      # emergency — knowing which warnings are normal is most of the skill.
      - n: "50"
