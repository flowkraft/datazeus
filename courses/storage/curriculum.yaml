  # ONE SERIES, NOT TWO. It was drafted as "Object Storage, Explained" followed by
  # "Self-Hosting S3", and that split was wrong: the protocol and running it yourself are the
  # same subject, and separating them put the payoff — the same client, unchanged, against your
  # own disks — two series away from the mechanism that makes it true. Read as one arc: what the
  # API promises (00 to 15), then why and how you would provide it yourself (20 to 35).
  - slug: series3-object-storage
    title: Object Storage — the Protocol, and Running It Yourself
    tagline: what the API promises, and the same thing on your own disks
    level: intermediate
    episodes:
      # COVER: the API as a data model rather than as a product. A flat KEY SPACE with no
      # directories; PUT, GET, DELETE, LIST; and metadata attached to the object.
      # LISTING IS A PREFIX SCAN, and it is the operation people misjudge — it is not a
      # directory read, it is paginated, it costs per request, and it gets slower as the bucket
      # grows. Data Ops, Series 1 · 47 states this; here the reader sees why it follows from a
      # flat key space.
      # SEAM STATED UP FRONT: that course owns renting one and paying for it. This series owns
      # what the protocol actually guarantees.
      - n: "00"
        slug: the-api
        title: "A Flat Key Space — Why Listing Is a Scan and There Are No Directories"
        hands_on: ["koan:predict", "koan:process:tool"]
        core: true
        status: planned
      # COVER: the operations that make it usable for real data, each with the reason it exists.
      #   MULTIPART UPLOAD   because a single PUT of a hundred gigabytes over a flaky link is a
      #                      bad idea. Parts, retries, completion — and the ABANDONED UPLOAD
      #                      that is invisible in a listing and billed monthly.
      #   RANGE GET          reading bytes 4,000 to 8,000 of an object without downloading it,
      #                      which is EXACTLY what lets DuckDB and Trino read one column of a
      #                      Parquet file over the network. That single operation is why the
      #                      lakehouse is possible at all — say so.
      #   PRESIGNED URLS     handing someone time-limited access without giving them a key.
      #   CONDITIONAL WRITES the newer primitive that makes safe coordination possible.
      - n: "05"
        slug: multipart-and-range
        title: "Multipart, Range GET and Presigned URLs — the Operations That Make It Usable"
        hands_on: ["koan:complete", "koan:predict"]
        core: true
        status: planned
      # COVER: what the store promises. Read-after-write for new objects, and what overwrite and
      # delete actually guarantee — with the historical note that this is one of the areas where
      # old advice is now wrong, because guarantees strengthened over the years and blog posts
      # did not.
      # VERSIONING as the mechanism that turns an overwrite into a new version, and DELETE
      # MARKERS as the reason a deleted object still costs money.
      # OBJECT LOCK and write-once retention as the ransomware answer, and the one property that
      # makes it real: IT MUST BE UNBREAKABLE BY THE ACCOUNT THAT WRITES THE DATA, or it is
      # decoration.
      # ⚠ CHECK CURRENT CONSISTENCY GUARANTEES against the implementation being described. This
      # is the paragraph most likely to be out of date.
      - n: "10"
        slug: consistency-and-versioning
        title: "Consistency, Versioning and Object Lock — What the Store Actually Promises"
        hands_on: ["koan:predict", "koan:choose"]
        core: true
        status: planned
      # COVER: the two automatic behaviours a bucket can have. LIFECYCLE RULES — transition to a
      # colder class after N days, expire after M — which is Series 1 · 25's tiering expressed as
      # configuration. And STORAGE CLASSES, with the restore time attached to each, because a
      # class whose retrieval takes hours is a decision about an incident, not about a bill.
      # THE FAILURE TO NAME: a lifecycle rule that expired the backups nobody realised were
      # governed by it. Quiet, dated, and discovered on the worst day.
      - n: "15"
        slug: lifecycle-and-classes
        title: "Lifecycle Rules and Storage Classes — Tiering as Configuration, and Its Trap"
        hands_on: ["koan:choose", "koan:diagnose"]
        status: planned
      # ── THE SERIES TURNS HERE ────────────────────────────────────────────────
      # Everything above is what the API promises. Everything below is why you would provide it
      # yourself, and what that costs. The turn is deliberate and the reader should feel it.

      # THE EPISODE THE SECOND HALF EXISTS FOR, and the question no other track in the academy
      # answers: WHAT IF THE DATA CANNOT LEAVE THE BUILDING?
      # COVER the four reasons, because they are different decisions: legal residency or
      # sovereignty; a contract or a regulator; an air-gapped network; and plain economics at
      # volume, where egress on petabytes stops being a line item and becomes the budget.
      # THEN THE COST MODEL, INVERTED, which is the genuinely useful part: renting is opex, per
      # gigabyte and per request, with egress. Owning is capex plus power, space, replacement
      # disks and YOUR TIME — and no egress at all. Work the break-even out loud rather than
      # asserting one, because it moves with volume, read pattern and how much your time costs.
      # AND THE HONEST GATE: for most teams, most of the time, renting wins. Self-host when the
      # data may not leave, when the volume makes egress prohibitive, or when you already run
      # the hardware and the people.
      - n: "20"
        slug: when-it-cannot-leave
