  - slug: series3-analytics-engineering-at-scale
    title: Analytics Engineering at Scale
    tagline: move the project to ClickHouse, and work on it as a team
    level: advanced
    # RENUMBERED WHOLE, 2026-08-24, and the reason is the first episode. The old series opened
    # with `packages` and got to a columnar engine at 30, which meant two thirds of "at scale"
    # ran on the same laptop-sized engine as Series 1. Backwards: at work the engine move is
    # what STARTS this phase, not what decorates the end of it. So the move is now 00, the five
    # episodes that follow are the adapter's real behaviour, and the team material — packages,
    # metrics, exposures, review, CI, mesh — runs on top of a warehouse that justifies it.
    #
    # The old numbers all shifted. Every reference into this series was re-read by eye, which
    # CurriculumSpec's own comment says is the only way: there were two, both pointing at the
    # semantic layer at the old 3 · 10, and both now say 3 · 30 — the exclude in this file and
    # the one in BI & Data Visualization.
    episodes:
      # THE ENGINE MOVE, and the premise of the series. Absorbs the old 3 · 30
      # "dbt on Columnar Engines", which was itself a merge of two earlier episodes — it is now
      # first rather than seventh, which is the only change that matters.
      # THE HEADLINE IS THAT MOST MODELS DO NOT CHANGE. Say that first and prove it, because a
      # reader who believes an engine move means rewriting everything will never propose one.
      # Then the ones that DO, which is the next five episodes.
      # `equivalent` across the two engines is the assertion: the whole claim is that the same
      # project produces the same numbers. `count:scanned` is the reason anybody bothered.
      - n: "00"
        slug: moving-to-a-columnar-engine
        title: "Moving to a Columnar Engine — The Same dbt Project, Pointed at ClickHouse"
        hands_on: ["koan:equivalent", "koan:count:scanned", "duckdb", "clickhouse"]
        core: true
        data:
          source: northwind_co_raw_m
          tables: ["Orders", "Order Details", "Orders._loaded_at"]
          fit: MISSING
          reason: "koan:equivalent (same project, same numbers on DuckDB and ClickHouse) could prove itself at S, but count:scanned is the reason anyone moves, and it needs volume: M's ~1.25M order lines against a columnar read of two columns. Needed: D1-M (500,000 orders, 6,000 customers, the same planted facts scaled) and D6-M landed in ClickHouse, which means ClickHouse support in the install/raw scripts (today they refuse any vendor except POSTGRES and DUCKDB). Data Warehousing S2/S3 needs the same ClickHouse path."
        status: planned
      # ADDED 2026-08-24. The first thing that breaks after the move, and it breaks quietly.
      # `view` on ClickHouse is not the cheap pointer it is on DuckDB or Postgres, and a
      # staging layer built entirely of views — which is exactly what Series 1 · 30 taught, and
      # correctly for that engine — turns into re-reading the raw data on every single query.
      #   TABLE, and which MergeTree engine the adapter puts underneath it.
      #   VIEW, and why the reader's Series 1 habit is now the expensive choice.
      #   MATERIALIZED VIEW, which on ClickHouse is an INSERT TRIGGER and not a cached SELECT.
      #     This is the single biggest impedance mismatch in the adapter and the place readers
      #     lose days. The engine side is Data Warehousing, Series 3 · 05; what is new here is
      #     that dbt's model of "a materialization" and ClickHouse's do not line up.
      - n: "05"
        slug: clickhouse-materializations
        title: "Materializations on ClickHouse — MergeTree Tables and the View That Is Not Free"
        hands_on: ["koan:choose", "koan:count:scanned", "clickhouse"]
        data:
          source: northwind_co_raw_m
          tables: ["Order Details", "Orders"]
          fit: MISSING
          reason: "A staging view over raw Order Details re-read on every query is the expensive habit, and count:scanned only persuades at M (~1.25M lines, read again for each downstream query). A materialized view as an INSERT trigger needs rows inserted after it is created, which one D2 day at M supplies. Needs D1-M, D6-M in ClickHouse, and D2 at M (planned ≈ 215,000 events)."
        status: planned
      # ADDED 2026-08-24, absorbing the old 3 · 05 "Incremental Strategies — merge,
      # insert_overwrite, append", which listed three strategies in the abstract. On a real
      # columnar engine the list collapses to a decision, which is a better episode.
      # THE FACT THE WHOLE EPISODE TURNS ON: ClickHouse has no UPDATE worth the name. So dbt's
      # default `merge` strategy — the one Series 2 · 15 taught and the reader now trusts —
      # cannot work the way they think it does.
      #   INSERT_OVERWRITE BY PARTITION is the answer, and it is genuinely elegant: replace a
      #     whole partition atomically instead of updating rows inside it. It also forces the
      #     reader to have chosen a partition key deliberately, which is the real lesson.
      #   APPEND, and when duplicates are acceptable because something downstream dedupes.
      #   `rerun` is the assertion — run it twice, the totals must not double. That is the bug
      #     this episode exists to prevent and it is invisible on the first run.
      - n: "10"
        slug: incremental-without-update
        title: "Incremental Without UPDATE — Replacing a Partition Instead of Editing Rows"
        hands_on: ["koan:rerun", "koan:choose", "clickhouse"]
        core: true
        data:
          source: [northwind_co_raw_m, northwind_co_changes]
          tables: ["Orders.OrderDate", "Orders.CreatedAt", "Orders.UpdatedAt", "Order Details"]
          fit: MISSING
          reason: "insert_overwrite by month partition needs late rows landing in an already-built month, and updates to orders in it: D2 at M (late and doubled orders, ship dates filled), applied between two runs so koan:rerun can show totals not doubling. Plant a few late orders dated in the previous month on a month boundary, so choosing the partition key on CreatedAt instead of OrderDate gives a wrong answer. Needs D1-M, D6-M in ClickHouse and D2 at M."
        status: planned
      # ADDED 2026-08-24. Series 2 · 20 taught snapshots as the way to keep history, and on
      # this engine that tool is largely gone — snapshots need the same UPDATE the episode
      # above just established does not exist.
      # WHAT REPLACES IT: ReplacingMergeTree, plus the thing everyone gets wrong — the
      # replacement happens WHEN THE ENGINE FEELS LIKE IT, at an unspecified future merge. Your
      # query sees duplicates until then.
      #   FINAL forces it and costs real time; a GROUP BY with argMax is the cheaper habit.
      #   `predict` is the right rung precisely because the honest answer to "how many rows
      #   does this return" is "it depends when you ask" — which is the lesson.
      # SCD Type 2 as a MODELLING idea stays where it lives: Data Modeling, Series 3 · 35.
      # This is only what happens to that idea on an engine that cannot update a row.
      - n: "15"
        slug: history-without-snapshots
        title: "History Without Snapshots — ReplacingMergeTree, FINAL and What Deduplication Costs"
        hands_on: ["koan:predict", "koan:count:scanned", "clickhouse"]
        data:
          source: [northwind_co_raw_m, northwind_co_changes]
          tables: ["Orders.OrderID", "Orders.UpdatedAt", "Orders.Status", "CustomerChanges"]
          fit: MISSING
          reason: "ReplacingMergeTree needs several versions of the same key inserted over time, so the table shows duplicates until a merge: D2's order updates (Open to Shipped, a ship date filled, a cancellation) as new rows with a later UpdatedAt, and customer changes as new versions. koan:predict turns on 'it depends when you ask', and at M there are enough parts that a merge has not happened yet. Needs D1-M, D6-M in ClickHouse and D2 at M."
        status: planned
      # ADDED 2026-08-24, and it is the episode that keeps the reader employed. Series 2 · 00
      # taught `unique` and `not_null` and taught them as free. On a billion-row table `unique`
      # is a full scan and a sort, and a reader who carries their Series 2 habits over will
      # ship a test suite that costs more to run than the models it tests.
      #   WHAT TO DO INSTEAD: assert on a WINDOW rather than the table (yesterday's partition,
      #     not all history), sample deliberately and say so, and move the expensive checks off
      #     the every-run path.
      #   NOT_NULL stays cheap. Say which ones are still free — this must not read as "testing
      #     is too expensive on ClickHouse", which is the wrong lesson and the one a reader
      #     will take if the episode only lists costs.
      #   `count:scanned` is the assertion, and it is the same rung Data Warehousing uses for
      #     the same reason: it is the only honest way to grade "cheaper" without a stopwatch.
      - n: "20"
        slug: testing-a-big-table
        title: "Testing a Big Table — Why unique Stops Being Free, and What to Assert Instead"
        hands_on: ["koan:choose", "koan:count:scanned", "clickhouse"]
        data:
          source: northwind_co_raw_m
          tables: ["Order Details", "Orders.OrderID", "Orders.OrderDate", "Order Details._batch_id"]
          fit: MISSING
          reason: "unique over all of history against unique over yesterday's partition is a count:scanned comparison that only matters at volume: M's ~1.25M order lines and 500,000 orders. The 'yesterday' window needs daily load partitions (D6's _batch_id/_loaded_at, filled day by day from D2 at M). Plant one duplicate inside the recent window and one old duplicate outside it, so the windowed test's blind spot is visible and the trade-off is honest."
        status: planned
