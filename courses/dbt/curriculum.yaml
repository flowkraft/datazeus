      # ADDED 2026-08-24, the second half of the academy's version-control hole. Series 1 · 47
      # puts the project in a repo; this is the part that involves another person, and it is
      # the act that most defines the job — an analytics engineer approves changes to numbers
      # other people are paid to trust.
      # AT 42, deliberately between testing strategy and CI/CD: you have to know what a good
      # change looks like BY HAND before automating the check, or the pipeline is a ritual.
      # WHAT A dbt PR DIFF ACTUALLY NEEDS, and none of it is obvious:
      #   READ THE COMPILED SQL, not just the model file. A three-line change to a macro can
      #     rewrite forty models, and the model diff shows you three lines.
      #   THE QUESTION THAT OUTRANKS ALL OTHERS: does this change a NUMBER? A refactor that
      #     must not (Series 2 · 42) and a fix that must are the same size on screen and could
      #     not be more different, and only the author knows which this is — so the rule is
      #     that they have to say, in the description.
      #   WHO ELSE BREAKS: the DAG downstream, and the exposures at Series 3 · 35.
      #   WHAT IS NOT WORTH A COMMENT: formatting, which sqlfluff already settled at
      #     Series 2 · 40. Reviewers who argue about commas stop being read.
      # `diagnose` on a planted PR that silently changes a total is the assertion, and it is a
      # fair one — that is exactly the review this episode exists to make possible.
      - n: "42"
