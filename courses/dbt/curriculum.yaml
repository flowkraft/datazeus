# The ordered episode list for Analytics Engineering with dbt. Field docs live in
# courses/learnsql/curriculum.yaml. `short` is omitted until an episode has a video.
#
# The job this track teaches: turn a folder of ad-hoc SELECTs into a version-controlled,
# tested, documented transformation project the whole team can change without fear.
# Built as a real Northwind project — raw → staging → marts — on the DataPallas warehouse.
#
# THE ENGINE, decided 2026-08-24 — and the decision this track had simply never made. Series 1 ·
# 15 teaches profiles.yml, and profiles.yml IS the adapter choice, so not one episode of this
# track could actually be written until somebody answered this.
#   SERIES 1 AND 2 — DuckDB, via dbt-duckdb. No server, no container, no credentials: the file
#     is the database, a koan runs in milliseconds, and a learner's first contact with dbt is
#     dbt rather than devops. The engine itself is somebody else's episode — Data Warehousing,
#     Series 2 · 05.
#   SERIES 3 — ClickHouse, via dbt-clickhouse, and the switch is the FIRST episode of the series
#     instead of a footnote late in it. "At scale" is the reason anyone moves to a columnar
#     engine at all, so the move is the premise the rest of the series stands on: everything
#     after Series 3 · 00 runs there.
#   NOT PostgreSQL, and this one is worth the sentence because it is the obvious answer: it is
#     the first-party adapter and Northwind already ships on it. But every koan would then need
#     a running container for a lesson that is not about the server. It stays the third target
#     in Series 2 · 45, where multiple warehouses is the actual subject.
#
# THE CLICKHOUSE BOUNDARY, because two tracks now touch it and neither may teach the other's
# half. Data Warehousing owns the ENGINE — MergeTree, partitions, sort keys, compression,
# projections. This track owns the ADAPTER: what dbt-clickhouse can and cannot express. Those
# are different subjects, and the second one lives nowhere else in the academy.
#
# ── WHAT dbt ACTUALLY IS, because every author of these episodes needs the same answer ──
# It is NOT a language and NOT a scripting tool. It is a COMPILER and a SCHEDULER for SQL
# that you write. Series 1 · 00 has to land this in its first paragraph or nothing after it
# makes sense.
#   WHAT THE READER WRITES   .sql files, each holding exactly ONE SELECT — no CREATE, no
#                            INSERT, no DDL; .yml for tests, docs, sources and config; and
#                            .csv for seeds. That is the whole surface.
#   THE ONE NON-SQL THING    Jinja, inside those .sql files — {{ ref(...) }}, {% if %},
#                            {% macro %}. It is string templating, NOT Python, and it is
#                            fully rendered to plain SQL before anything reaches a database.
#   WHAT dbt DOES            renders the Jinja, reads every ref() to build the dependency
#                            graph, sorts it, wraps each SELECT in CREATE TABLE AS or
#                            CREATE VIEW AS — that is all a "materialization" is — and sends
#                            those statements to the warehouse in order.
#   THE SENTENCE THAT MATTERS MOST: NOT ONE ROW OF DATA PASSES THROUGH dbt. It is not pandas
#                            and it is not Spark. The warehouse does 100% of the work. dbt
#                            only decides which SQL runs, and when.
#   PYTHON MODELS exist since 1.3 (a .py returning a DataFrame) but only on BigQuery,
#   Databricks, Snowflake and dbt-duckdb. A side door. Do not teach it as the main path, and
#   do not let a reader arriving from Python for Data confuse it for one.
#
# ── WHICH dbt VERSION, decided 2026-08-24: dbt Core v1.12, and the .12 is the whole point ─
# There are now two dbt engines. The choice is forced by Series 3 — but the VERSION within
# that choice is what makes the eventual switch nearly free, so pin it, do not say "v1.x".
#   dbt Core v2 / FUSION   a Rust binary: no Python, no virtualenv, much faster parsing, and
#                          a strict language spec that catches a typo'd `desciptin` instead
#                          of ignoring it. A genuinely better tool. But DuckDB is BETA and
#                          CLI-only, and CLICKHOUSE IS NOT SUPPORTED AT ALL — in v2 the
#                          adapters live in a Rust monorepo speaking ADBC, so the Python
#                          dbt-clickhouse cannot be plugged in, and third-party adapters are
#                          explicitly "not on the near-term roadmap". Series 3 is 13 of our
#                          37 episodes. We cannot ship a third of the track unrunnable.
#   dbt Core v1.12         the LAST v1, and dbt Labs built it as the on-ramp to v2: it
#                          already ENFORCES the behaviour changes that v2 removes, and it
#                          ships the Fusion parser behind `--use-v2-parser`. So anything
#                          taught on it is v2-correct by construction, and the course project
#                          can be proven to parse under the Rust engine before a word ships.
#
# WHY THE VERSION CHOICE COSTS SO LITTLE: v1 and v2 support the SAME dbt language. Of the
# fifteen documented breaking changes, almost all are hygiene a new course would never teach
# — removed deprecations, YAML anchors needing an `anchors:` key, duplicate docs blocks,
# algebraic operations inside a macro's return. The one that touches us we already got right:
# the `-m` / `--models` flag is an ERROR in v2, and the Series 1 · 10 beat teaches `--select`.
# Two others are worth an author knowing: `config.get()` no longer reads `meta` (use
# `config.meta_get()`), and unit tests all run BEFORE the DAG rather than in lineage order,
# which is a Series 3 · 40 detail.
#
# WHEN CLICKHOUSE FUSION SHIPS — parts are merged and end-to-end tests pass, so this may be
# months not years — the migration is `dbt-autofix` plus a rewrite of the install section of
# Series 1 · 15. Not a rewrite of the course. That is the entire reason for pinning .12
# rather than an older v1.
#
# ── IS dbt FREE ENOUGH TO BASE 37 EPISODES ON? Checked 2026-08-24, answer YES ──────────
# Asked because it is the right question to ask before writing a course, and because the
# answer was genuinely in doubt for twelve months. Every claim below was verified against
# dbt Labs' own licensing FAQ and the adapters' repositories on that date. RE-CHECK IT
# before the first episode ships — this is a moving story, not a settled one.
#   dbt Core          APACHE 2.0. Free, including commercially, with no restriction. This is
#                     what the whole track runs on.
#   dbt-duckdb        Apache-2, in the duckdb org.        Series 1 and 2.
#   dbt-clickhouse    open source, maintained by ClickHouse Inc.   Series 3.
#   DuckDB            MIT.        ClickHouse    Apache 2.0.
#   So: 36 of our 37 episodes run on Apache-2.0 software and cost nothing. The 37th is
#   Series 3 · 50, which already tells the reader it needs a paid tier and why.
#
# THE SCARE, worth writing down because somebody will hear a version of it and ask:
#   MAY 2025   dbt Labs shipped the new Fusion engine under ELv2 — source-available, and NOT
#              an OSI-approved open source licence. The community read it as dbt going the
#              way of Elasticsearch, and said so loudly.
#   JUNE 2026  RESOLVED. The ELv2 code was moved out of the dbt-fusion repo and into
#              dbt-core UNDER APACHE 2.0. dbt Core v2.0 is Fusion-powered and open source.
#              Fivetran and dbt Labs completed their merger the same day.
#   TODAY      "dbt Fusion" is a proprietary binary layered on that open core — free to
#              download, with `dbt login` gating premium features. We do not need it.
#
# THE RISK THAT IS ACTUALLY LEFT, and it is not a licensing one: that dbt Core receives
# maintenance while the paid platform receives the innovation, until running Core in
# production quietly stops being practical. Nobody can prove or disprove that today. It is
# the thing to watch, it plays out over years rather than months, and it is a reason to
# re-check this block — not a reason to avoid the tool. dbt is in 61% of data engineering
# job postings and is used by around 90,000 teams weekly; there is no second candidate.

course: learn-dbt
track: dbt
title: Analytics Engineering with dbt

# DATASET DEPENDENCY NOTE (2026-09-17): dbt starts after extraction and loading.
#   D1 northwind_co_s       real S-scale source for Series 1-2 and small CI/test runs
#   D2 northwind_co_changes replayable daily/event feed for freshness, incremental models, snapshots, and bad-load tests
#   D3 crm_export           optional second source for conformance examples when the project consumes CRM data
#   D5 northwind_co_dw_*    optional warehouse target for cross-course reconciliation, not dbt's raw starting point
#   D6 northwind_co_raw_*   learner-produced all-text landed copy, the actual dbt source contract
#
# D6 is intentionally NOT a prebuilt dataset: ETL produces it from D1/D3/D4, and dbt then proves that its
# staging models cast/clean it back to the Company truth. The curriculum correctly keeps D6-dependent
# episodes partial/MISSING until the ETL project, D2 feed, manifests, and verifiers exist.
# D1 currently exists only at S. D1-M/L, D6-M, and the ClickHouse path are planned requirements for Series 3,
# so their volume-dependent lessons remain MISSING. The existing Java fact_sales star is not a dbt source or
# D5 answer key.
#
# Supporting comment-only dataset drafts:
# C:\Projects\reportburster\asbl\src\main\external-resources\db-template\db\scripts\academy-northwind-co-changes.groovy
# C:\Projects\reportburster\asbl\src\main\external-resources\db-template\db\scripts\academy-northwind-co-dw-install.groovy
# C:\Projects\reportburster\asbl\src\main\external-resources\db-template\db\scripts\academy-files-export.groovy
# There is deliberately no raw-install script: D6 is the learner's ETL output. Provide a D6 verifier/contract
# instead, and only upgrade fit after the learner output can be checked by row counts and checksums.

# Two real prerequisites, and dbt is the one track in the academy where a second one is honest:
# dbt is SQL plus a project structure, and it starts AFTER the raw data has landed. Someone who
# has never loaded a table has nothing for dbt to build on.
prerequisites:
  - course: learn-sql
    needs: "Series 2"
    why: >-
      A dbt model IS a SELECT. CTEs especially — the staging/marts split is CTEs promoted to
      files, and Series 2 · 20 is where you learn to read one.
  - course: learn-etl-pipelines
    needs: "Series 1"
    why: >-
      dbt does the T and neither the E nor the L. Series 1 there is what puts raw Northwind in
      front of it; without that this track has nothing to transform.

excludes:
  - topic: "Extract and Load — dbt does neither"
    where: "covered in ETL & Data Pipelines; dbt starts once the raw data has landed"
  - topic: "The warehouse engine itself — MergeTree internals, partitions, sort keys, storage, tuning"
    where: "covered in Data Warehousing, Series 2 · 10 for MergeTree and Data Warehousing, Series 2 · 15 for partitions and sort keys. In this course, Series 3 runs dbt ON that engine — what the adapter can and cannot express, which is a different subject"
  - topic: "Dimensional design decisions — grain, SCD type, star vs snowflake"
    where: "covered in Data Modeling; here you implement the model you already chose"

  - topic: "Writing the SQL inside a model"
    where: "covered in Learn SQL — a dbt model is a SELECT, and this track is the project around it"
  # The near-collision worth naming: dbt 3 · 10 and BI 2 · 40 are both called the semantic layer.
  - topic: "Agreeing with the business what a metric MEANS, and governing it"
    where: "covered in BI & Data Visualization, Series 2 · 40, which is where the business agrees what a metric means. In this course, Series 3 · 30 expresses that agreed definition as code"
  - topic: "Dashboards themselves"
    where: "covered in BI & Data Visualization — exposures here only record that a dashboard depends on a model"

series:
  - slug: series1-dbt-fundamentals
    title: dbt Fundamentals
    tagline: turn SQL files into a project dbt builds in the right order
    level: beginner
    episodes:
      - n: "00"
        slug: what-dbt-is
        title: "What dbt Is and Is Not — The T in ELT, as a Real Project"
        hands_on: ["koan:choose"]
        core: true
        data:
          source: northwind_co_s
          tables: ["Orders", "Order Details", "Customers", "Products"]
          fit: good
          reason: "The T in ELT needs landed tables to point at, and Northwind Company S is already landed in DuckDB (datasets/northwind-co/northwind_co.duckdb), the engine this series uses. The choose koan only needs to show which tables dbt reads and that it writes none of their rows. The planned raw copy (D6) is not needed for a concept episode."
        status: planned
      - n: "05"
        slug: your-first-model
        title: "Your First Model — A SELECT That Becomes a View (stg_orders)"
        hands_on: ["koan:author", "dbt"]
        core: true
        data:
          source: northwind_co_s
          tables: ["Orders"]
          fit: good
          reason: "stg_orders is one SELECT over Orders that renames and selects columns (OrderID, CustomerID, OrderDate, ShippedDate, Status, Channel), materialised as a view. It runs today with the source pointed at schema northwind_co_s. The koan should build into a throwaway copy of the committed DuckDB file, never into the file itself."
        status: planned
      # ALSO OWNS NODE SELECTION, added as a beat 2026-08-24. After `dbt run` it is the most
      # typed thing in the tool, and it appeared in no episode and no brief anywhere in the
      # track — the words "State Comparison" in the Series 3 CI/CD title were the only trace.
      #   THE FOUR THAT COVER almost everything: `--select my_model`, `--select my_model+`
      #   (it and everything downstream), `--select +my_model` (it and everything UP), and
      #   `--exclude`. Plus `tag:` once tags exist.
      #   WHY IT BELONGS HERE and not in an episode of its own: the everyday loop IS running a
      #   SUBSET. Nobody builds the whole project while working on one model, and a reader who
      #   finishes this episode without knowing that will rebuild everything for a week.
      #   `state:modified+` is deliberately NOT here — it needs a stored manifest to compare
      #   against, which is Series 3 · 45 in this course.
      - n: "10"
        slug: run-build-compile
        title: "dbt run, build & compile — The Everyday Loop"
        hands_on: ["koan:process:tool", "dbt"]
        core: true
        data:
          source: northwind_co_s
          tables: ["Orders", "Order Details", "Customers", "Products"]
          fit: good
          reason: "Three or four models over these tables are enough for run, build, compile and --select my_model+ / +my_model to give visibly different node sets. compile shows the rendered SQL naming northwind_co_s tables; nothing here needs volume or history."
        status: planned
      - n: "15"
        slug: project-anatomy
        title: "Project Anatomy — profiles.yml, dbt_project.yml and the models Folder"
        hands_on: ["koan:complete", "dbt"]
        core: true
        data:
          source: northwind_co_s
          tables: ["Orders", "Customers"]
          fit: good
          reason: "profiles.yml points dbt-duckdb at a copy of northwind_co.duckdb and dbt_project.yml sets the source schema northwind_co_s. The file is named after the dataset, not the schema, on purpose (catalog/schema ambiguity), which is a real profiles.yml gotcha worth one line."
        status: planned
      - n: "20"
        slug: ref-and-source
        title: "ref() & source() — How dbt Works Out What to Build First"
        hands_on: ["koan:predict", "koan:diagnose"]
        core: true
        data:
          source: northwind_co_s
          tables: ["Orders", "Order Details", "Customers", "Products", "Categories"]
          fit: good
          reason: "sources.yml declares these tables; stg_ models use source(), marts use ref(), and the predict/diagnose koans read the DAG order off them (Order Details before and after Products, Categories). It runs on the built schema today. When D6 exists, only the source schema name changes to northwind_co_raw_s."
        status: planned
      - n: "25"
        slug: materializations
        title: "Materializations — view, table, ephemeral, and When Each Wins"
        hands_on: ["koan:choose", "koan:count:scanned"]
        core: true
        data:
          source: northwind_co_s
          tables: ["Order Details", "Orders", "Products"]
          fit: good
          reason: "count:scanned grades view against table: a view over Order Details re-reads all of its lines on every query, and a table reads them once. Scale S is enough because the proxy is a count, not a stopwatch. An ephemeral int_ model joining Products shows up inlined in the compiled SQL."
        status: planned
      - n: "30"
        slug: the-staging-layer
        title: "The Staging Layer — Clean Raw Northwind Once, Reuse It Everywhere"
        hands_on: ["koan:complete"]
        core: true
        data:
          source: northwind_co_s
          tables: ["Customers.Phone", "Customers.City", "Customers.ContactName", "Orders", "WebOrders.Payload"]
          fit: partial
          reason: "Real cleaning exists today: phone numbers in five formats, cities with a trailing space or in capitals, contact names in lower case, and WebOrders.Payload JSON with a missing key, a quantity sent as text and a decimal comma. What is missing is the landed shape staging exists for: typed columns mean there is nothing to cast. Build D6 northwind_co_raw_s (the same rows as D1, every column as text, plus _loaded_at, _source_file and _batch_id on every row), so stg_ does the casts, renames and trims and a checksum proves the result equals D1. ETL S1's project produces the same copy."
        status: planned
      - n: "35"
        slug: marts
        title: "Marts — Build dim_customer and fct_sales on Top of Staging"
        hands_on: ["koan:author"]
        core: true
        data:
          source: northwind_co_s
          tables: ["Customers", "Customers.Segment", "Orders", "Order Details", "Products.UnitCost", "Orders.Status"]
          fit: good
          reason: "dim_customer comes from Customers (Segment, Country, messy fields cleaned in staging). fct_sales is at order-line grain from Order Details joined to Orders, with margin from Products.UnitCost. Orders.Status (Cancelled, and the planted cancelled-but-still-Open orders) makes the mart's filter a real decision rather than a formality."
        status: planned
      - n: "40"
        slug: seeds
        title: "Seeds — Version-Controlled CSV Reference Data"
        hands_on: ["koan:complete"]
        data:
          source: northwind_co_s
          tables: ["Customers.Country", "Suppliers.Country", "Orders.OrderDate"]
          fit: good
          reason: "The dbt project's own country_regions.csv (21 rows) maps exactly the 21 countries the generator uses, and every country has at least one customer, so the join to Customers.Country is complete. fiscal_calendar.csv (72 rows, 2020-2025 by month) covers every Orders.OrderDate plus the January 2025 SalesTargets month. The seed CSVs are authored with the lesson, not part of the dataset."
        status: planned
      - n: "45"
        slug: docs-and-lineage
        title: "Generated Docs & Lineage — The Northwind DAG, Drawn For You"
        hands_on: ["eyes", "dbt"]
        data:
          source: northwind_co_s
          tables: ["Orders", "Order Details", "Customers", "Products", "Categories", "Employees", "Shippers", "Invoices"]
          fit: good
          reason: "The generated DAG needs enough sources and models to be worth drawing: these eight source tables through stg_, dim_ and fct_ give a real graph, and column descriptions can carry meanings from the data (ShippedDate NULL means 'not recorded', not 'not shipped'). It works on the built schema today."
        status: planned

      # ADDED 2026-08-24, when git, branches, diffs and pull requests appeared in ZERO episodes
      # across the whole academy — checked by grep, not assumed — and this track's promise of a
      # version-controlled project could not be kept without it.
      # SUPERSEDED IN PART 2026-09-03: Data Ops now teaches git itself, at its Series 1 · 43.
      # THIS EPISODE STAYS AND NARROWS. It is about what belongs in a DBT PROJECT, which is a
      # different question from how to use the tool, and it may now assume the reader can
      # commit and diff rather than teaching it here.
      # This track's own header promises to turn a folder of ad-hoc SELECTs into a
      # VERSION-CONTROLLED, tested, documented project. Tested had a whole series, documented
      # had two episodes, and version-controlled had nothing at all.
      # SERIES 1, not later, because every episode after this one assumes the project is in a
      # repo — and at 47 rather than earlier so it does not interrupt 05 → 10 → 15 → 20, which
      # is the run that gets a first model working. Get it working, then make it safe.
      # WHAT THE EPISODE OWES:
      #   WHAT GOES IN      models, tests, seeds, dbt_project.yml, packages.yml.
      #   WHAT NEVER DOES   profiles.yml, because it holds credentials. This is the episode
      #                     that explains why dbt keeps that file OUTSIDE the project by
      #                     default, which until now looked like an odd piece of trivia in
      #                     Series 1 · 15.
      #   .gitignore        target/, dbt_packages/, logs/ — all three are build output, and a
      #                     diff full of compiled SQL is how a repo becomes unreviewable.
      #   THE DIFF          a model's diff IS a SQL diff, and that is the whole argument for
      #                     this tool over a folder of saved queries: you can SEE what changed,
      #                     and so can the person who has to approve it.
      # NOT A GIT TUTORIAL. Branch, commit, diff, merge, and stop. The reader came for dbt, and
      # reviewing somebody else's change is its own episode later — Series 3 · 42 here.
      - n: "47"
        slug: the-project-in-git
        title: "The Project in Git — What Belongs in the Repo, and What Must Never"
        hands_on: ["koan:process:tool", "terminal"]
        core: true
        data:
          source: none
          fit: good
          reason: "What belongs in the repo (models, tests, seeds, dbt_project.yml, packages.yml), what never does (profiles.yml, target/, dbt_packages/, logs/), and a model diff. The diff is of SQL text, so no rows are needed. It is the same project as the rest of the series, on northwind_co_s."
        status: planned
      # SERIES 1 PROJECT, added 2026-08-24. The series had none: the core path
      # walked ten episodes with nothing built at the end of them.
      # sources -> staging -> marts, with the DAG dbt draws for you as the proof. Not a new subject;
      # the first ten episodes assembled once.
      - n: "50"
        slug: project-raw-to-mart
        title: "Project — Raw Northwind to a Mart You Can Query"
        hands_on: ["koan:author", "koan:process:tool"]
        core: true
        tags: ["project"]
        data:
          source: northwind_co_s
          tables: ["Orders", "Order Details", "Customers", "Products", "Categories", "Invoices"]
          fit: partial
          reason: "Sources to staging to marts to a queryable mart runs end to end on northwind_co_s today, and the mart can be checked against Invoices.Amount for shipped orders. What it lacks is 'raw': sources are already typed, so staging casts nothing. With D6 northwind_co_raw_s (all-text columns plus _loaded_at, _source_file and _batch_id), the project really starts from landed data, and the koan can assert that the staging output's checksums equal D1's."
        status: planned
  - slug: series2-trustworthy-dbt
    title: Trustworthy dbt
    tagline: tests that catch a bad load, and a structure that survives
    level: intermediate
    episodes:
      - n: "00"
        slug: built-in-tests
        title: "Built-in Tests — not_null, unique, relationships, accepted_values"
        hands_on: ["koan:process:tool", "koan:complete"]
        core: true
        data:
          source: northwind_co_s
          tables: ["Orders.OrderID", "Orders.Status", "Orders.Channel", "Orders.ShippedDate", "CourierConfirmations.OrderID", "Order Details.ProductID"]
          fit: partial
          reason: "Two tests fail for real today. unique on CourierConfirmations.OrderID catches the one confirmation sent twice (and the noise confirmations), and not_null on Orders.ShippedDate with where Status = 'Shipped' catches the outage and data-entry lapses. relationships (Order Details.ProductID, Orders.CustomerID) and accepted_values (Status, Channel) can only pass, because D1's keys and codes are clean. Add them in D2's day-45 bad load (planned: an order for a customer that does not exist) plus one Status value outside the set (e.g. 'shipped ' typed by hand, on one or two change-feed rows), so every built-in test has something real to catch. ETL S2's quality gates can use the same rows."
        status: planned
      - n: "05"
        slug: custom-tests
        title: "Singular & Custom Tests — Assert the Business Rule, Not Just the Column"
        hands_on: ["koan:author"]
        core: true
        data:
          source: northwind_co_s
          tables: ["Orders.Status", "Orders.ShippedDate", "Orders.OrderDate", "Invoices", "Order Details"]
          fit: good
          reason: "The cross-course worked example, 'shipped orders must have a ship date within 30 days', fails on the planted rows: Speedy Express outage orders with Status 'Shipped' and no ShippedDate, plus ~0.2% lapses. The ~2% genuinely late shipments (15-24 days) pass, which is the noise that proves the rule is not trivially true. A second singular test, Invoices.Amount against the sum of the order lines, is a good rounding beat: the generator rounds each line to cents before summing, so a test on unrounded lines can be off by a cent (measure before quoting)."
        status: planned
      - n: "10"
        slug: sources-and-freshness
        title: "Sources & Freshness — Declare Raw Tables and Catch a Stale Feed"
        hands_on: ["koan:diagnose"]
        core: true
        data:
          source: [northwind_co_raw_s, northwind_co_changes]
          tables: ["Orders._loaded_at", "Orders", "WebOrders", "CourierConfirmations"]
          fit: MISSING
          reason: "Declaring sources runs on northwind_co_s today, but freshness cannot be taught on it: every timestamp stops at 2024-12-31, so every source is equally about two years stale and no feed can be told apart as the stale one. It needs D6's _loaded_at on every raw row, and D2 applied day by day, with the apply script stamping _loaded_at relative to the moment the learner applies a day (kept out of the checksum) so freshness reads true on any date. Plant that one feed (WebOrders) stops arriving after a given day while Orders keeps loading, with noise from normal overnight gaps. ETL S2 (a feed that stopped) and Data Warehousing S3 can reuse it."
        status: planned
      - n: "15"
        slug: incremental-models
        title: "Incremental Models — Build Only the New Orders"
        hands_on: ["koan:rerun"]
        core: true
        data:
          source: northwind_co_s
          tables: ["Orders.CreatedAt", "Orders.UpdatedAt", "Orders.OrderDate", "Order Details"]
          fit: partial
          reason: "Building only the new orders can be simulated today with a var cutoff over Orders. The ~1.5% of orders keyed in 1-10 days late (CreatedAt after OrderDate) show why a watermark on OrderDate silently misses rows, and koan:rerun can prove that totals do not double. What D1 cannot show is an already-built row changing, because each order has only its final UpdatedAt. The merge/unique_key beat needs D2 northwind_co_changes (planned: ~12 updates a day with ship dates filled and statuses changed, 3% of orders arriving 1-5 days late, 0.5% sent twice) applied between runs."
        status: planned
      - n: "20"
        slug: snapshots
        title: "Snapshots — SCD Type 2 History Without Writing the Merge"
        hands_on: ["koan:rerun", "koan:predict"]
        core: true
        data:
          source: northwind_co_s
          tables: ["Customers", "CustomerChanges", "Products.UnitPrice", "PriceChanges"]
          fit: partial
