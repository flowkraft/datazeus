# The promise gate's whitelist. Read by tests/src/verify/.../support/PromisesSpec.groovy.
#
# PromisesSpec flags sentences that point beyond their own lesson: another series ("Series 3"),
# another course ("Data Ops"), a link to either, or a hand-over ("next lesson", "a lesson of its
# own"). A flagged sentence fails the build until you either reword it or list it here.
# The rules are in CONTRIBUTING.md, "Promises between lessons".
#
# Each entry names the file (from courses/), the rule it answers, and a quote: any stretch of the
# sentence, whitespace-insensitive. An entry that matches nothing any more fails too, so remove
# it when the sentence changes or goes.
#
#   not_a_promise  Read it, it promises nothing. `why:` is required.
#   kept           A hand-over inside the series, and the later lesson that keeps it:
#                  `kept_by: "1 · 45"` and `about:` (a word that lesson must contain). The gate
#                  checks both, and that the keeper is live whenever the promising lesson is.
#   covered        Names what ANOTHER series or course teaches: "query speed is covered in
#                  Series 3". Safe only when that series certainly covers it, so the gate checks
#                  its plan: `series: 3` (plus `course:` for another course) and `about:`, words
#                  that series' part of curriculum.yaml must contain.
#   unreviewed     Reviewed 2026-09-19 and judged NOT safe: each is specific across series or
#                  courses (a named episode, a plot, or something the learner built elsewhere).
#                  Passes for now so the build stays green. Fix each by rewording the sentence,
#                  then delete the entry. Nothing new goes here.
#
# What is safe across series and courses: naming a subject that series certainly covers (and
# `covered:` proves it), and looking back at a lesson that is published and frozen.
# What is not: an episode, a plot or a figure another series must
# deliver, or anything the learner must have built elsewhere.
#
# When the gate fails, it writes ready-to-paste entries to
# tests/target/promises-uncovered-<course>-<cross|forward>.yaml.

# The courses the gate reads. Add one when its lessons start being written.
tracks: [learnsql, datamodeling, datawarehousing, etlpipelines, dbt]

